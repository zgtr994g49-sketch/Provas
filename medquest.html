II com algodão ortopédico e encaminhamento para cirurgia vascular emergencial para avaliar revascularização, com avaliação posterior de correção cirúrgica ou endovascular do aneurisma de aorta."}, {"n": 95, "meta": "(2025.2) ROT.2-B-12T: Q.22", "stem": "Um paciente masculino de 68 anos chega ao pronto-socorro com queixa de dor intensa no membro inferior direito há 6 horas. Ele relata histórico de claudicação intermitente progressiva nos últimos meses. Ao exame físico, o membro direito apresenta palidez, ausência de pulso distal e cianose no pé. O membro contralateral apresenta pulsos palpáveis. Foi realizado um Doppler vascular de membros inferiores, que revelou ausência de fluxo arterial no segmento femoropoplíteo direito. Qual é o diagnóstico mais provável e a próxima conduta indicada?", "opts": {"A": "Obstrução arterial aguda; iniciar anticoagulação com heparina e preparar para embolectomia.", "B": "Aneurisma de aorta abdominal; realizar angiotomografia e avaliar necessidade de reparo endovascular.", "C": "Doença arterial obstrutiva periférica (DAOP) crônica; iniciar tratamento com anticoagulação.", "D": "Obstrução arterial aguda; aguardar evolução clínica com medidas conservadoras."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Obstrução arterial aguda; iniciar anticoagulação com heparina e preparar para embolectomia."}, {"n": 96, "meta": "(2025.1) ROT.1-B-14T: Q.9", "stem": "Paciente, sexo masculino, 58 anos de idade inicia quadro de dor lombar súbita de forte intensidade. É hipertenso e nos últimos meses vem apresentando dificuldade de controlar. No pronto atendimento de urgência evolui com piora da dor e massa pulsátil. A equipe de plantão suspeita de aneurisma de aorta abdominal roto e solicita uma tomografia computadorizada de abdome. Com base nesse cenário, qual o achado tomográfico característico para confirmar a suspeita diagnóstica?", "opts": {"A": "Presença de calcificação na parede do aneurisma.", "B": "Imagem de dupla luz dentro do trombo do aneurisma em um determinado corte.", "C": "Diâmetro do aneurisma acima de 50% do valor da aorta imediatamente proximal à área suspeita.", "D": "Borramento da gordura que separa o aneurisma do músculo psoas do lado da rotura."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Borramento da gordura que separa o aneurisma do músculo psoas do lado da rotura."}, {"n": 97, "meta": "(2025.1) ROT.1-B-14T: Q.29", "stem": "Um paciente de 72 anos, tabagista, hipertenso e diabético sem controle, comparece à emergência hospitalar, referindo dor súbita e intensa, no membro inferior esquerdo, há 1 dia. Ao exame físico apresenta palidez cutânea, ausência de pulsos distais e déficit motor no referido membro. Qual é a conduta inicial, mais adequada, para o manejo do paciente?", "opts": {"A": "Solicitar angiotomografia e aguardar o resultado antes de iniciar qualquer intervenção.", "B": "Encaminhar diretamente para amputação primária devido à ausência de pulsos e déficit motor.", "C": "Iniciar anticoagulação com heparina e avaliar a necessidade de trombólise ou revascularização.", "D": "Administrar analgésicos e prescrever antiagregantes plaquetários como terapia exclusiva."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Iniciar anticoagulação com heparina e avaliar a necessidade de trombólise ou revascularização."}, {"n": 98, "meta": "(2025.1) ROT.2-B-14T: Q.6", "stem": "Um paciente do sexo masculino, 60 anos, com histórico de hipertensão arterial e diabetes tipo 2, procura atendimento por queixas de dor intermitente nas pernas ao caminhar, aliviada com o repouso. Relata que a dor tem piorado nos últimos meses, limitando suas atividades diárias. No exame físico, observa-se diminuição dos pulsos femoral e poplíteo bilateralmente, além de palidez e cianose nas extremidades inferiores. A principal hipótese diagnóstica é doença arterial periférica (DAP). Qual é o exame mais apropriado para avaliar inicialmente o fluxo sanguíneo arterial nos membros inferiores desse paciente?", "opts": {"A": "Doppler arterial com medida do índice tornozelo-braquial (ITB) para avaliação não invasiva do grau de obstrução.", "B": "Angiografia por ressonância magnética com contraste para mapeamento preciso da árvore arterial.", "C": "Angiotomografia computadorizada com contraste para investigação detalhada de estenoses arteriais.", "D": "Cintilografia de perfusão com radionuclídeos para mensurar o suprimento sanguíneo nas extremidades."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Doppler arterial com medida do índice tornozelo-braquial (ITB) para avaliação não invasiva do grau de obstrução."}, {"n": 99, "meta": "(2025.1) ROT.2-B-14T: Q.14", "stem": "Um paciente de 76 anos de idade, diabético, tabagista e hipertenso, sem uso de qualquer medicamento, com história de claudicação intermitente no membro inferior direito para 200 metros há 4 anos. Evoluiu com piora da dor há 36 horas. No exame físico, apresentava hipotermia e palidez do membro inferior direito, presença de pulsos femorais e ausência de pulsos poplíteos e distais bilateralmente. Sem déficit sensitivo ou motor. ECG com ritmo sinusal. Em relação ao caso apresentado, é correto afirmar:", "opts": {"A": "esse paciente deveria ter sido submetido a cirurgia há 4 anos, no início do quadro de claudicação.", "B": "iniciar tratamento ambulatorial com Rivaroxabana 15mg 12/12 horas por 21 dias.", "C": "deve ser encaminhado para embolectomia de urgência sem a necessidade de arteriografia prévia.", "D": "o paciente deve ser submetido a arteriografia e, a depender do resultado, revascularização do membro acometido."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) o paciente deve ser submetido a arteriografia e, a depender do resultado, revascularização do membro acometido."}, {"n": 100, "meta": "(2025.1) ROT.2-B-14T: Q.26", "stem": "Paciente do sexo feminino com 63 anos de idade, hipertensa e tabagista, procura o serviço de emergência com dor intensa e contínua em mesogástrio há 12h. No exame físico, apresenta pulso de 98 bpm, PA de 140x80 mmHg. Apresenta fáscies de dor, massa pulsátil e dolorosa em mesogástrio. Pulsos femorais palpáveis bilateralmente. Realizou angio TC que evidenciou aneurisma de aorta abdominal infrarrenal com 8 cm de diâmetro e descartou outras patologias abdominais. Considerando o quadro do paciente, qual alternativa contempla a conduta a ser realizada?", "opts": {"A": "Encaminhar a paciente para o ambulatório de cirurgia geral e solicitar marcadores tumorais.", "B": "Programar a correção cirúrgica endovascular ou convencional em caráter de urgência.", "C": "Submeter a paciente a arteriografia eletiva para decidir sobre o tratamento adequado.", "D": "Prescrever analgesia e, havendo melhora da dor, encaminhar para acompanhamento ambulatorial."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Programar a correção cirúrgica endovascular ou convencional em caráter de urgência."}, {"n": 101, "meta": "(2025.1) ROT.3-B-14T: Q.21", "stem": "Paciente de 68 anos, sexo masculino, tabagista, com histórico de hipertensão arterial e diabetes mellitus tipo 2, apresenta queixa de dor do tipo cãibra em panturrilha direita ao deambular dois quarteirões da sua casa até a padaria, melhorando após breve repouso. Durante a investigação diagnóstica, é identificado, por meio de EcoDoppler, um aneurisma de aorta abdominal infrarrenal com 5,0 cm de diâmetro. Considerando a necessidade de aplicar um plano terapêutico para esse paciente, qual das seguintes condutas é a mais adequada no manejo imediato?", "opts": {"A": "Iniciar terapia antitrombótica com rivaroxabana e agendar angioplastia para a claudicação intermitente em caráter eletivo sem muita urgência.", "B": "Indicar repouso relativo, evitar caminhadas longas e aguardar avaliação cirúrgica, pois a claudicação pode indicar risco iminente de ruptura do aneurisma.", "C": "Programar correção endovascular do aneurisma de aorta abdominal com urgência, não havendo tempo para preparo pré-operatório.", "D": "Orientar a cessação do tabagismo, controle rigoroso da pressão arterial e do diabetes, e acompanhamento regular com ultrassonografia para monitorar o aneurisma."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Orientar a cessação do tabagismo, controle rigoroso da pressão arterial e do diabetes, e acompanhamento regular com ultrassonografia para monitorar o aneurisma."}, {"n": 102, "meta": "(2025.1) ROT.3-B-14T: Q.30", "stem": "Um homem de 68 anos, hipertenso, tabagista e com histórico de claudicação intermitente, é atendido no pronto-socorro com dor súbita intensa em membro inferior direito, associada a frialdade, palidez e ausência de pulsos distais. Ao exame físico, apresenta extremidade fria, sensibilidade diminuída e mobilidade limitada. Considerando o quadro clínico, o histórico do paciente e os princípios da abordagem vascular em urgência, qual das condutas abaixo representa corretamente o plano terapêutico inicial e as estratégias para prevenção de complicações?", "opts": {"A": "Solicitar radiografia de membros inferiores e iniciar antibioticoterapia profilática, pois o quadro sugere erisipela com obstrução linfática associada.", "B": "Iniciar anticoagulação com heparina, realizar avaliação clínica urgente da viabilidade do membro e, se necessário, encaminhar para embolectomia ou revascularização cirúrgica.", "C": "Prescrever vasodilatadores orais e repouso com pernas elevadas para facilitar a circulação colateral, adiando condutas invasivas por pelo menos uma semana.", "D": "Administrar analgésicos e observar em ambiente ambulatorial por 48 horas, considerando que a claudicação intermitente é característica da DAOP e tende à autolimitação."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Iniciar anticoagulação com heparina, realizar avaliação clínica urgente da viabilidade do membro e, se necessário, encaminhar para embolectomia ou revascularização cirúrgica."}, {"n": 103, "meta": "(2026.1) ROT.1-B: Q.9", "stem": "Homem, 74 anos, hipertenso, dislipidêmico e ex-tabagista (50 maços-ano), em seguimento ambulatorial, apresenta aneurisma de aorta abdominal infrarrenal identificado à ultrassonografia, com diâmetro máximo de 5,7 cm, colo proximal de 20 mm, angulação <60° e artérias ilíacas comuns sem aneurismas. Encontra- se assintomático, com taxa de filtração glomerular (TFG) de 58 mL/min/1,73 m², fração de ejeção de 50%, ITB 0,95 bilateral e tratamento clínico otimizado. Reside em área urbana com acesso a centro endovascular. Usa AAS 81 mg/dia, rosuvastatina 20 mg/dia, enalapril 20 mg/dia e mantém PA 128/74 mmHg. Considerando o quadro clínico e as recomendações científicas atuais, qual é a conduta terapêutica mais apropriada para esse paciente?", "opts": {"A": "Suspender AAS e iniciar dose máxima de Varfarina, para reduzir risco de trombose mural do aneurisma, reavaliando em 3 meses.", "B": "Indicar reparo aberto imediato com clampeamento suprarrenal para prevenir rotura, independentemente da anatomia e comorbidades.", "C": "Manter acompanhamento semestral com ultrassom, pois está assintomático e com bom controle clínico das comorbidades.", "D": "Indicar reparo endovascular (EVAR) eletivo; mantendo terapia médica otimizada e acompanhamento regular pós-implante."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Indicar reparo endovascular (EVAR) eletivo; mantendo terapia médica otimizada e acompanhamento regular pós-implante."}, {"n": 104, "meta": "(2026.1) ROT.1-B: Q.29", "stem": "Homem de 72 anos, hipertenso, dislipidêmico e ex-tabagista (40 maços-ano), em acompanhamento por doença arterial obstrutiva periférica (DAOP), apresenta claudicação de panturrilhas aos 150 metros, com índice tornozelo- braquial de 0,65 à direita e 0,68 à esquerda. Faz uso regular de ácido acetilsalicílico, estatina de alta potência e participa de programa de caminhada supervisionada. Procura o pronto atendimento devido à dor súbita e intensa no membro inferior direito, há aproximadamente três horas, associada a parestesia e sensação de frio. Informa diagnóstico prévio de aneurisma de aorta abdominal infrarrenal de 5,5 cm, identificado há seis meses, até então assintomático. No exame físico, observa-se palidez, frialdade, dor à palpação, ausência de pulsos poplíteo e distais, dificuldade para movimentação ativa do tornozelo e sensibilidade diminuída no dorso do pé. Sinais vitais estáveis. Considerando o caso acima, qual é a conduta imediata e o plano de cuidados continuados mais apropriados para reduzir o risco de complicações vasculares e perda do membro nesse paciente?", "opts": {"A": "Observação por 24-48 h, analgesia simples, aumentar intensidade do exercício e seguimento anual do aneurisma com ultrassom.", "B": "Anticoagulação sistêmica com heparina, analgesia, avaliação vascular urgente para revascularização e reparo eletivo do aneurisma por equipe especializada.", "C": "Aquecimento do membro, elevação, massagem, iniciar clopidogrel e suspender AAS; adiar qualquer decisão sobre o aneurisma por não ser sintomático.", "D": "Trombolítico sistêmico imediato, seguido de repouso absoluto por 7 dias e observação do aneurisma até 6,0 cm, sem intervenção."}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Anticoagulação sistêmica com heparina, analgesia, avaliação vascular urgente para revascularização e reparo eletivo do aneurisma por equipe especializada."}, {"n": 105, "meta": "(2026.1) ROT.1-B: Q.30", "stem": "Um homem de 67 anos, tabagista, hipertenso e diabético, apresenta dor intensa em membro inferior direito há 8 horas, de início súbito, associada a palidez, frialdade e ausência de pulso distal. O Doppler arterial evidencia ausência de fluxo na artéria femoral superficial direita, sem fluxo distal detectável. Durante investigação complementar, ultrassonografia abdominal identifica dilatação fusiforme da aorta abdominal infrarrenal medindo 5,8 cm de diâmetro, com trombo mural e sem sinais de extravasamento. Com base na interpretação dos exames, assinale a alternativa correta:", "opts": {"A": "O resultado do Doppler arterial demonstra neuropatia isquêmica diabética avançada; o aneurisma de aorta abdominal somente é definido quando o diâmetro ultrapassa 7,0 cm.", "B": "O Doppler indica obstrução arterial aguda por interrupção súbita do fluxo; a aorta abdominal com diâmetro ≥ 3,0 cm define aneurisma, com maior risco de ruptura quando acima de 5,5 cm.", "C": "O fluxo ausente ao Doppler caracteriza trombose venosa profunda; a dilatação fusiforme da aorta abdominal representa variação anatômica sem critério para aneurisma.", "D": "O Doppler sugere doença arterial obstrutiva periférica crônica com formação de circulação colateral; a dilatação da aorta abdominal é compatível com ectasia fisiológica relacionada à idade. INSUFICIÊNCIA VENOSA CRÔNICA; TROMBOSE INSUFICIÊNCIA VENOSA CRÔNICA; TROMBOSE INSUFICIÊNCIA VENOSA CRÔNICA; TROMBOSE VENOSA PROFUNDA - TVP VENOSA PROFUNDA - TVP VENOSA PROFUNDA - TVP"}, "topic": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) O Doppler indica obstrução arterial aguda por interrupção súbita do fluxo; a aorta abdominal com diâmetro ≥ 3,0 cm define aneurisma, com maior risco de ruptura quando acima de 5,5 cm."}, {"n": 106, "meta": "(2024.2) ROT.1-B-14T: Q.5", "stem": "Uma paciente de 68 anos, com histórico de insuficiência venosa crônica, é admitida no pronto-socorro com dor intensa, edema e calor na perna esquerda, que iniciou subitamente há 24 horas. A ultrassonografia Doppler confirma o diagnóstico de trombose venosa profunda (TVP) na veia femoral. Considerando a coexistência de insuficiência venosa crônica, qual é a abordagem terapêutica mais adequada para o manejo desta paciente, tanto para a TVP quanto para a insuficiência venosa crônica?", "opts": {"A": "Iniciar anticoagulação com heparina de baixo peso molecular, seguida de anticoagulação oral por 3 meses; recomendar uso de meias de compressão graduada para controle da insuficiência venosa crônica após estabilização da TVP.", "B": "Prescrever apenas anticoagulação oral com varfarina por 6 meses; recomendar repouso absoluto com elevação da perna afetada.", "C": "Realizar trombólise imediata e iniciar anticoagulação profilática; contraindicar o uso de meias de compressão devido ao risco de síndrome pós-trombótica.", "D": "Iniciar anticoagulação com heparina de baixo peso molecular e manter anticoagulação por tempo indeterminado; recomendar cirurgia venosa para correção da insuficiência venosa crônica após resolução da TVP."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Iniciar anticoagulação com heparina de baixo peso molecular, seguida de anticoagulação oral por 3 meses; recomendar uso de meias de compressão graduada para controle da insuficiência venosa crônica após estabilização da TVP."}, {"n": 107, "meta": "(2024.2) ROT.1-B-14T: Q.14", "stem": "Um paciente de 65 anos se apresenta na emergência com queixa de dor na perna esquerda, que piora ao longo do dia, acompanhada de edema que se agrava ao final do dia. Ele também relata sensação de peso na perna e episódios de câimbras noturnas. Durante o exame físico, observa-se edema unilateral na perna esquerda, com sinais de hiperemia e aumento da circunferência da panturrilha. A palpação profunda da panturrilha provoca dor, e a pele sobre a área afetada apresenta coloração acastanhada e endurecimento. Com base no quadro clínico apresentado, qual é a conduta mais apropriada para o manejo inicial deste paciente?", "opts": {"A": "Solicitar ultrassonografia doppler venosa do membro inferior para confirmar a presença de trombose venosa profunda e iniciar anticoagulação terapêutica caso a TVP seja confirmada.", "B": "Iniciar imediatamente o uso de meias de compressão elástica e prescrever anti-inflamatórios não esteroides (AINEs) para controle da dor.", "C": "Prescrever repouso com elevação do membro e compressas frias, observando a evolução dos sintomas antes de realizar exames complementares.", "D": "Encaminhar o paciente para flebografia de urgência para confirmar o diagnóstico de TVP e avaliar a necessidade de intervenção cirúrgica."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Solicitar ultrassonografia doppler venosa do membro inferior para confirmar a presença de trombose venosa profunda e iniciar anticoagulação terapêutica caso a TVP seja confirmada."}, {"n": 108, "meta": "(2025.2) ROT.2-B-12T: Q.11", "stem": "Mulher, 55 anos, queixa de edema em panturrilha direita e dor contínua com início há 2 dias. Relata cirurgia prévia há 12 dias de abdominoplastia e que permaneceu em \"repouso absoluto\" devido à dor na cirurgia e receio de rompimento dos pontos. Ao exame: panturrilha direita edemaciada, cerca de 4 cm maior em comparação à esquerda, dor após dorsiflexão passiva do pé direito, menor mobilidade e dolorosa à palpação. Diante da história clínica e do exame físico deste paciente, o melhor exame a ser solicitado para confirmação diagnóstica e o possível resultado deste exame seriam:", "opts": {"A": "Angiografia. Se houver uma obstrução da veia poplítea, não haverá compressibilidade da luz arterial.", "B": "Tomografia computadorizada sem contraste de membros inferiores. Se houver uma obstrução da veia poplítea, haverá um aumento da amplitude de pulso na veia femoral comum.", "C": "Ultrassonografia com Doppler de membros inferiores. Se houver uma obstrução da veia poplítea, haverá uma diminuição do fluxo em segmento venoso proximal (veia femoral comum).", "D": "Venografia. Se houver uma obstrução da artéria femoral, haverá compressibilidade da luz arterial."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Ultrassonografia com Doppler de membros inferiores. Se houver uma obstrução da veia poplítea, haverá uma diminuição do fluxo em segmento venoso proximal (veia femoral comum)."}, {"n": 109, "meta": "(2025.2) ROT.2-B-12T: Q.12", "stem": "Paciente masculino, 68 anos, diabético e hipertenso, refere que nos últimos dias vem apresentando dor progressiva na perna direita, no momento com dificuldade para mobilização do membro e edema local. Ao exame, você percebe leve cianose do membro referido, alteração de temperatura, sinal de Bancroft e de Holmans. Diante do quadro, assinale a alternativa que contenha a melhor opção terapêutica.", "opts": {"A": "A trombose venosa profunda é um fator de risco para edema agudo de pulmão, mas, para iniciar a anticoagulação sistêmica, é necessária a comprovação diagnóstica, devido ao risco de sangramento.", "B": "O tratamento pode ser iniciado com varfarina, pois tem efeito imediato e não depende de alguns fatores, como variações no suprimento de vitamina K na alimentação.", "C": "A administração de heparina pode ser por via endovenosa ou subcutânea. Na endovenosa, a dose de ataque é de 2500 a 5000 UI, seguida de dose de manutenção entre 1000 e 2000 UI/h.", "D": "Dentre as contraindicações absolutas para uso de anticoagulantes em pacientes, temos: retinopatia diabética, plaquetopenia grave (plaquetas <100.000) e sangramento digestivo recente."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) A administração de heparina pode ser por via endovenosa ou subcutânea. Na endovenosa, a dose de ataque é de 2500 a 5000 UI, seguida de dose de manutenção entre 1000 e 2000 UI/h."}, {"n": 110, "meta": "(2025.2) ROT.2-B-12T: Q.16", "stem": "Paciente do sexo masculino, 72 anos, apresenta edema unilateral progressivo no membro inferior esquerdo há 5 dias, associado à dor moderada e sensação de peso. Ao exame físico, observam-se cianose discreta no membro acometido, empastamento da panturrilha e sinal de Homans positivo. O paciente está estável e relata história prévia de insuficiência venosa crônica. Refere imobilização recente devido a uma cirurgia de quadril realizada há duas semanas. Os exames laboratoriais evidenciam elevação discreta do D-dímero. A ultrassonografia com Doppler venoso revelou trombose na veia poplítea esquerda. Qual a estratégia terapêutica inicial mais adequada para este paciente?", "opts": {"A": "Início de anticoagulação com rivaroxabana em dose plena sem necessidade de internação hospitalar.", "B": "Realização de trombólise venosa sistêmica devido ao risco de progressão para embolia pulmonar.", "C": "Prescrição de heparina não fracionada por 15 dias seguida de transição para heparina de baixo peso molecular (HBPM) com monitoramento do tempo de protrombina.", "D": "Elevação do membro acometido associado com uso exclusivo de meia elástica compressiva e compressas mornas."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Início de anticoagulação com rivaroxabana em dose plena sem necessidade de internação hospitalar."}, {"n": 111, "meta": "(2025.1) ROT.1-B-14T: Q.1", "stem": "Um homem de 60 anos se apresenta na emergência com um inchaço doloroso em seu membro inferior esquerdo, que começou há 2 dias. Ele tem uma história de insuficiência venosa crônica. O exame físico revelou edema, rubor e calor localizado na perna esquerda, sem sinais de úlceras ou sinais de gangrena. Sem febre. Com base nos sintomas e história clínica do paciente, qual seria a hipótese diagnóstica mais provável?", "opts": {"A": "Insuficiência arterial periférica.", "B": "Trombose Venosa Profunda.", "C": "Erisipela.", "D": "Linfedema."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Trombose Venosa Profunda."}, {"n": 112, "meta": "(2025.1) ROT.1-B-14T: Q.25", "stem": "Uma paciente de 45 anos de idade, sedentária e com histórico de gestação múltipla, procura atendimento médico queixando-se de dor, sensação de peso e edema nas pernas, especialmente no final do dia. Ela relata que esses sintomas pioram após longos períodos em pé e melhoram com elevação dos membros inferiores. No exame físico, observa-se edema bilateral nos membros inferiores, maior em membro inferior esquerdo e sinais de hiperpigmentação cutânea nos tornozelos. Considerando o quadro clínico acima, qual conduta mais apropriada para esta paciente?", "opts": {"A": "Iniciar tratamento empírico com compressão elástica e observar a evolução dos sintomas, sem a necessidade de investigação adicional.", "B": "Realizar um exame clínico detalhado, seguido de um ultrassom doppler dos membros inferiores para confirmar a presença de varizes e avaliar a circulação venosa, além de excluir TVP.", "C": "Solicitar exames laboratoriais para avaliar a função renal e iniciar o tratamento com anticoagulantes, considerando a possibilidade de TVP.", "D": "Indicar imediatamente cirurgia para remoção das varizes, sem necessidade de outros exames, uma vez que a paciente apresenta sintomas típicos de insuficiência venosa crônica."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Realizar um exame clínico detalhado, seguido de um ultrassom doppler dos membros inferiores para confirmar a presença de varizes e avaliar a circulação venosa, além de excluir TVP."}, {"n": 113, "meta": "(2025.1) ROT.1-B-14T: Q.26", "stem": "Um paciente do sexo masculino, 70 anos, chega ao pronto-socorro apresentando uma úlcera na perna direita, com 5 cm de diâmetro, bordas irregulares e fundo exsudativo seroso e inodoro. O paciente relata dor moderada na área da úlcera, além de histórico de insuficiência venosa crônica e edema nos membros inferiores. Durante o exame físico, observa-se pele hiperpigmentada ao redor da úlcera e sinais de dermatite. Com base nesse quadro clínico, qual é a conduta inicial mais apropriada para o manejo desta úlcera?", "opts": {"A": "Aplicação de curativos oclusivos e repouso absoluto da perna.", "B": "Ressecção cirúrgica da úlcera e uso de suturas.", "C": "Uso de curativos compressivos e medidas de cuidados com a pele.", "D": "Prescrição de antibióticos orais e elevação da perna em repouso."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Uso de curativos compressivos e medidas de cuidados com a pele."}, {"n": 114, "meta": "(2025.1) ROT.2-B-14T: Q.28", "stem": "Um homem de 65 anos, hipertenso e tabagista, procura o pronto-socorro com queixa de dor e edema unilateral na perna direita há 3 dias. Relata que esteve em um voo internacional de longa duração uma semana antes do início dos sintomas. Ao exame físico, a perna direita apresenta aumento de volume, calor e dor à palpação da panturrilha, além de sinal de Homans positivo, levando à suspeita de TVP. Diante do quadro clínico, qual exame de imagem é o mais adequado para confirmar o diagnóstico?", "opts": {"A": "Angiotomografia de membros inferiores com contraste.", "B": "Arteriografia de membros inferiores.", "C": "Venografia por ressonância magnética de membros inferiores.", "D": "Ultrassonografia Doppler venosa dos membros inferiores."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Ultrassonografia Doppler venosa dos membros inferiores."}, {"n": 115, "meta": "(2025.1) ROT.3-B-14T: Q.5", "stem": "Paciente idoso, cardiopata com prótese metálica valvar, de 80 anos, obeso, no 8º dia de pós-operatório de fratura de fêmur, apresenta queixa de edema, dor à dorsiflexão do pé e empastamento da panturrilha esquerda. Embasado nesse quadro, qual das condutas a seguir está correta em relação ao manejo inicial e seguimento desse paciente?", "opts": {"A": "A terapia anticoagulante deve ser monitorada pelo INR, que deve permanecer abaixo de 1, durante toda a fase de tratamento com heparina não fracionada.", "B": "A duração máxima recomendada da anticoagulação para TVP associada a fator de risco transitório, como cirurgia, é de três meses.", "C": "O tratamento com heparina não fracionada deve ser ajustado para manter o TTPa entre 60 e 80 segundos, com transição para anticoagulante oral (varfarina) visando INR entre 2,0 e 3,0.", "D": "Em pacientes idosos e obesos, é preferível evitar o uso de HBPM, iniciando-se diretamente a anticoagulação oral com varfarina."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) O tratamento com heparina não fracionada deve ser ajustado para manter o TTPa entre 60 e 80 segundos, com transição para anticoagulante oral (varfarina) visando INR entre 2,0 e 3,0."}, {"n": 116, "meta": "(2025.1) ROT.3-B-14T: Q.15", "stem": "Paciente do sexo feminino, 64 anos, hipertensa e obesa (IMC = 34 kg/m²), apresenta dor, sensação de peso e edema em membro inferior esquerdo, que surgiram de forma súbita há 3 dias. Refere ainda coloração arroxeada da panturrilha e piora do edema ao final do dia. No exame físico, observa-se edema unilateral até o joelho, empastamento muscular, sinal de Homans positivo e discreta hipertermia local. Ela relata histórico de veias varicosas diagnosticadas há 10 anos, sem tratamento cirúrgico. Não faz uso de anticoagulantes. Com base no caso apresentado, qual entre as opções abaixo é a melhor estratégia terapêutica inicial para a paciente?", "opts": {"A": "Iniciar heparina de baixo peso molecular (HBPM) em dose terapêutica e prescrever meias de compressão elástica para manejo da insuficiência venosa crônica.", "B": "Indicar trombólise venosa por cateter e contraindicar o uso de compressão elástica devido ao risco de síndrome pós-trombótica.", "C": "Iniciar anticoagulação oral direta com rivaroxabana e recomendar elevação do membro afetado, com compressão elástica após estabilização clínica.", "D": "Prescrever varfarina oral de início imediato e suspender o uso de meias de compressão até a resolução completa do quadro."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Iniciar anticoagulação oral direta com rivaroxabana e recomendar elevação do membro afetado, com compressão elástica após estabilização clínica."}, {"n": 117, "meta": "(2026.1) ROT.1-B: Q.12", "stem": "Homem de 67 anos, hipertenso e ex-tabagista, com história de trombose venosa profunda proximal em membro inferior direito, há 10 meses, após cirurgia ortopédica. Refere anticoagulação com apixabana por 6 meses, suspensa há 4 meses. Evoluiu com edema vespertino, dor em peso e sensação de tensão na panturrilha direita, com piora ao final do dia e após caminhadas prolongadas. Realizou ultrassom duplex venoso recente, evidenciando ausência de trombose aguda, refluxo significativo em veia safena magna direita e sequelas pós-trombóticas na veia femoral com espessamento parietal e recanalização com fluxo lento. Ausência de sinais ecográficos de celulite profunda ou abscesso. No exame: hiperpigmentação ocre e eczema varicoso em região maleolar medial, além de úlcera superficial com bordas irregulares, leito granular, exsudato seroso moderado e dor leve à palpação. Discreto aumento de temperatura local, sem sinais sistêmicos de infecção. Pulsos, pedioso e tibial posterior, palpáveis. Considerando o caso clínico acima, qual a melhor conduta para o manejo da complicação apresentada?", "opts": {"A": "Anticoagulação plena por tempo indeterminado, para acelerar a cicatrização da úlcera venosa pós-trombótica, e analgésicos para tratar a dor.", "B": "Antibioticoterapia sistêmica empírica, por 14 dias, encaminhar para desbridamento cirúrgico amplo imediato da úlcera e analgesia.", "C": "Terapia compressiva com bandagem multicamadas ou meia, curativo úmido para úlcera venosa, cuidados com a pele, deambulação e exercícios de panturrilha.", "D": "Curativo seco diário e repouso absoluto com elevação do membro; evitar compressão para não piorar o fluxo venoso pós-trombótico."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Terapia compressiva com bandagem multicamadas ou meia, curativo úmido para úlcera venosa, cuidados com a pele, deambulação e exercícios de panturrilha."}, {"n": 118, "meta": "(2026.1) ROT.1-B: Q.18", "stem": "Uma mulher de 62 anos chega à emergência com dor e edema em membro inferior esquerdo (MIE) há 24 horas, piora à deambulação, sem trauma. Relata \"varizes antigas\" e sensação de peso em membros inferiores há anos. Ao exame: • MIE com aumento de circunferência, empastamento de panturrilha, dor à palpação do trajeto venoso profundo • Pele com hiperpigmentação ocre perimaleolar bilateral e telangiectasias/varizes • Sinais vitais estáveis Foram solicitados exames complementares: • Ultrassom Doppler venoso (MIE): veia femoral comum e poplítea com material hipoecoico intraluminal, ausência de compressibilidade, fluxo reduzido/ausente ao Doppler color, com diminuição da fascicidade respiratória. • Angiografia por contraste (estudo arterial de MMII, solicitado por engano): artérias pervias, sem estenoses significativas, sem oclusões. Com base na análise e comparação dos métodos diagnósticos para trombose venosa profunda (TVP), é correto o que se afirma em:", "opts": {"A": "a investigação diagnóstica deve ser complementada por angiotomografia de membros inferiores, pois o Doppler apresenta limitações na detecção de tromboses proximais.", "B": "as alterações cutâneas crônicas indicam doença venosa de longa data, devendo-se considerar trombose residual crônica como hipótese antes de confirmar evento agudo.", "C": "os achados do ultrassom são compatíveis com TVP aguda, e a angiografia arterial normal não exclui comprometimento do sistema venoso profundo.", "D": "os achados ultrassonográficos sugerem insuficiência venosa crônica, e a angiografia arterial normal reforça a ausência de obstrução vascular significativa no membro acometido."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) os achados do ultrassom são compatíveis com TVP aguda, e a angiografia arterial normal não exclui comprometimento do sistema venoso profundo."}, {"n": 119, "meta": "(2026.1) ROT.1-B: Q.19", "stem": "Homem, 58 anos, obeso (IMC 32 kg/m²) e tabagista, refere dor e sensação de peso em ambos os membros inferiores ao final do dia, com piora ao ortostatismo prolongado e alívio com elevação dos membros. Relata ainda edema maleolar vespertino e prurido cutâneo. No exame físico, observam-se telangiectasias e varizes visíveis na face medial das pernas, hiperpigmentação ocre e áreas de lipodermatoesclerose no terço distal da perna direita, além de edema depressível bilateral (+/4+). Os pulsos pediosos são palpáveis, não há febre e o paciente nega dor súbita. Entretanto, refere que há 3 dias, após viagem aérea de aproximadamente 8 horas, apresentou dor em panturrilha esquerda associada a discreta tumefação, com sensibilidade à palpação, sem dispneia ou dor torácica. O sinal de Homans é negativo. Considerando os achados clínicos atuais, qual é a conduta diagnóstica mais apropriada neste momento?", "opts": {"A": "Solicitar dímero-D, pois resultado negativo exclui trombose venosa profunda e confirma insuficiência venosa crônica.", "B": "Iniciar empiricamente anticoagulação plena e postergar exames de imagem devido à dor em panturrilha pós-viagem.", "C": "Solicitar ultrassonografia Doppler venosa de membros inferiores para avaliar insuficiência venosa crônica e afastar trombose venosa profunda.", "D": "Tratar como celulite e solicitar hemograma e proteína C reativa, pois hiperpigmentação e edema sugerem processo infeccioso cutâneo."}, "topic": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Solicitar ultrassonografia Doppler venosa de membros inferiores para avaliar insuficiência venosa crônica e afastar trombose venosa profunda."}, {"n": 120, "meta": "(2024.2) ROT.1-B-14T: Q.1", "stem": "Um paciente de 60 anos, com história de insuficiência cardíaca controlada, está programado para uma cirurgia de artroplastia total de joelho sob anestesia regional. Os exames laboratoriais pré-operatórios revelam ureia de 50 mg/dL, creatinina sérica de 2,0 mg/dL, e um INR de 1,2. O paciente também apresenta uma albumina sérica de 3,0 g/dL. Considerando a condição clínica do paciente, para o bloqueio do nervo ciático, o anestesiologista deve escolher o anestésico local mais adequado e ajustar a dose para evitar toxicidade. Qual é a conduta mais adequada em relação à escolha e à dose do anestésico local para este paciente?", "opts": {"A": "Escolher 20 mL de levobupivacaína (0,5%), pois é um anestésico menos cardiotóxico e não requer ajuste em pacientes com função renal comprometida.", "B": "Administrar 15 mL de ropivacaína (0,75%), ajustando o volume para evitar toxicidade devido à função renal comprometida e baixa albumina sérica.", "C": "Utilizar 20 mL de bupivacaína (0,5%), pois é um anestésico eficaz e seguro em pacientes com insuficiência cardíaca e função renal alterada.", "D": "Optar por 15 mL de lidocaína (2%) sem vasoconstritor, levando em consideração a função renal e os níveis de albumina, para minimizar o risco de toxicidade."}, "topic": "Noções de anestesia periférica", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Administrar 15 mL de ropivacaína (0,75%), ajustando o volume para evitar toxicidade devido à função renal comprometida e baixa albumina sérica."}, {"n": 121, "meta": "(2024.2) ROT.1-B-14T: Q.27", "stem": "Um paciente de 45 anos foi submetido a uma cirurgia para reparo de uma fratura distal do úmero direito. Durante o procedimento, foi realizado um bloqueio do plexo braquial via abordagem supraclavicular para anestesia do membro superior. No pós-operatório, o paciente começou a relatar fraqueza ao estender o punho e os dedos, além de dificuldade em realizar a extensão do cotovelo. Ao exame físico, observou-se que o paciente apresenta queda do punho (mão caída) e perda de sensibilidade na face posterior do antebraço e da mão. Com base nos sintomas descritos, qual nervo foi provavelmente lesionado durante o bloqueio anestésico?", "opts": {"A": "Nervo mediano.", "B": "Nervo radial.", "C": "Nervo ulnar.", "D": "Nervo musculocutâneo."}, "topic": "Noções de anestesia periférica", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário const STORAGE="medquest_cc_tema_a_b_v1";
let appState=loadAll(), activeExamId=null, tick=null, questionOpenedAt=null;

function blankExam(examId){return {examId,status:"not_started",answers:{},marked:{},current:1,lastAnswered:0,accumulatedMs:0,sessionStart:null,sessionSelection:[],sessionAnswered:[],sessions:[],history:[],startedAt:null,finalizedAt:null}}
function loadAll(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&x.version===2)return x}catch(e){};let exams={};DATA.exams.forEach(e=>exams[e.id]=blankExam(e.id));return {version:2,exams}}
function saveAll(){localStorage.setItem(STORAGE,JSON.stringify(appState))}
function examData(id=activeExamId){return DATA.exams.find(e=>e.id===id)}
function state(id=activeExamId){if(!appState.exams[id])appState.exams[id]=blankExam(id);return appState.exams[id]}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function fmt(ms){ms=Math.max(0,ms||0);const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function pct(a,b){return b?Math.round(a/b*1000)/10:0}
function answeredCount(id=activeExamId){return Object.keys(state(id).answers).length}
function correctedKey(q){return q.medical||q.official}
function correctCount(kind="official",id=activeExamId){const e=examData(id),s=state(id);return Object.entries(s.answers).filter(([n,a])=>{const q=e.questions[Number(n)-1];return a.selected===(kind==="medical"?correctedKey(q):q.official)}).length}
function accumulated(s=state()){return s.accumulatedMs+(s.sessionStart?Date.now()-s.sessionStart:0)}
function firstUnanswered(id){const e=examData(id),s=state(id);return e.questions.find(q=>!s.answers[q.n])?.n||e.questions.length}
function nextSuggested(id){const e=examData(id),s=state(id);for(let n=Math.max(1,(s.lastAnswered||0)+1);n<=e.questions.length;n++)if(!s.answers[n])return n;return firstUnanswered(id)}
function range(a,b){return Array.from({length:b-a+1},(_,i)=>a+i)}
function clamp(n,max){return Math.max(1,Math.min(max,Number(n)||1))}
function stopTick(commit=true){clearInterval(tick);tick=null;const s=activeExamId?state():null;if(s&&commit&&s.sessionStart){s.accumulatedMs+=Date.now()-s.sessionStart;s.sessionStart=null;saveAll()}}
function startTick(){clearInterval(tick);tick=setInterval(updateTimers,1000);updateTimers()}
function updateTimers(){if(!activeExamId)return;const s=state();const a=document.getElementById("sessionTimer"),b=document.getElementById("totalTimer");if(a)a.textContent=fmt(s.sessionStart?Date.now()-s.sessionStart:0);if(b)b.textContent=fmt(accumulated(s))}
function statusBadge(s){return s.status==="finalized"?'<span class="badge green">Concluída</span>':s.status==="in_progress"?'<span class="badge amber">Em andamento</span>':'<span class="badge">Não iniciada</span>'}

function examCard(e){
 const s=state(e.id),a=answeredCount(e.id),c=correctCount("official",e.id),m=correctCount("medical",e.id),next=nextSuggested(e.id),issues=e.questions.filter(q=>q.issue).length;
 return `<div class="card exam">
  <div class="row" style="justify-content:space-between">${statusBadge(s)}<span class="badge">${e.questions.length} questões</span></div>
  <h2 style="margin:14px 0 3px">${esc(e.title)}</h2><p class="muted">${esc(e.subtitle)} · 12 temas oficiais</p>
  <div class="progress"><div style="width:${pct(a,e.questions.length)}%"></div></div>
  <div class="grid g3" style="margin-top:12px">
   <div class="stat"><span class="small muted">Respondidas</span><b>${a}/${e.questions.length}</b></div>
   <div class="stat"><span class="small muted">Acerto</span><b>${pct(c,a)}%</b></div>
   <div class="stat"><span class="small muted">Tempo</span><b style="font-size:17px">${fmt(accumulated(s))}</b></div>
  </div>
  <p class="small muted">${a?`Última respondida: ${s.lastAnswered} · próxima sugerida: ${next}`:"Ainda não iniciada."}${issues?` · ${issues} alerta(s) auditado(s)`:``}</p>
  <div class="row"><button class="btn primary" onclick="openStart('${e.id}')">${s.status==="in_progress"?"Continuar / escolher bloco":"Abrir prova"}</button>${a?`<button class="btn" onclick="showExamReport('${e.id}')">Ver desempenho</button>`:""}</div>
 </div>`;
}

 if(s.status==="finalized"){if(confirm("Esta tentativa foi finalizada. Deseja iniciar uma nova tentativa?")){s.history.push({finalizedAt:s.finalizedAt,answers:s.answers,accumulatedMs:s.accumulatedMs,sessions:s.sessions});appState.exams[id]=blankExam(id);s=state();saveAll()}else return}
 document.getElementById("modalTitle").textContent=e.title;
 document.getElementById("startQ").max=e.questions.length;document.getElementById("endQ").max=e.questions.length;
 document.getElementById("startQ").value=1;document.getElementById("endQ").value=Math.min(10,e.questions.length);
 let has=answeredCount()>0;document.getElementById("continueChoice").style.display=has?"flex":"none";
 document.getElementById("continueText").textContent=has?`Retomar pela questão ${nextSuggested(id)}. Progresso atual: ${answeredCount()}/${e.questions.length}.`:"";
 document.getElementById("startModal").classList.add("open");
}
function closeModal(){document.getElementById("startModal").classList.remove("open")}
function startMode(){
 let e=examData(),s=state(),max=e.questions.length,mode=document.querySelector('input[name="mode"]:checked').value;
 let st=clamp(document.getElementById("startQ").value,max),en=clamp(document.getElementById("endQ").value,max),arr=[];
 if(mode==="begin"){st=1;en=max;arr=range(st,en)}
 if(mode==="continue"){st=nextSuggested(activeExamId);arr=range(st,max)}
 if(mode==="specific")arr=range(st,max);
 if(mode==="range"){if(en<st)[st,en]=[en,st];arr=range(st,en)}
 if(mode==="amount"){let amount=Math.max(1,Number(document.getElementById("endQ").value)||10);en=Math.min(max,st+amount-1);arr=range(st,en)}
 s.status="in_progress";s.startedAt=s.startedAt||new Date().toISOString();s.sessionSelection=arr;s.sessionAnswered=[];s.current=arr[0];s.sessionStart=Date.now();saveAll();closeModal();renderQuestion();startTick();
}

function renderQuestion(){
 const e=examData(),s=state(),q=e.questions[s.current-1],a=s.answers[q.n],sel=s.sessionSelection;
 questionOpenedAt=Date.now();
 document.getElementById("app").innerHTML=`
 <div class="examhead">
  <div><span class="badge">${esc(e.group==="A"?"Cirurgia A":"Cirurgia B")}</span><h2 style="margin:8px 0 3px">${esc(e.title)}</h2><div class="small muted">${esc(q.topic)}</div></div>
  <div style="text-align:right"><div class="timer">Sessão: <span id="sessionTimer">00:00</span></div><div class="timer small muted">Total: <span id="totalTimer">00:00</span></div></div>
 </div>
 <div class="progress"><div style="width:${pct(q.n,e.questions.length)}%"></div></div>
 <div class="grid g4" style="margin-top:12px">
  <div class="stat"><span class="small muted">Questão</span><b>${q.n}/${e.questions.length}</b></div>
  <div class="stat"><span class="small muted">Respondidas</span><b>${answeredCount()}</b></div>
  <div class="stat"><span class="small muted">Acertos oficiais</span><b>${correctCount("official")}</b></div>
  <div class="stat"><span class="small muted">Taxa atual</span><b>${pct(correctCount("official"),answeredCount())}%</b></div>
 </div>
 <div class="card" style="margin-top:15px">
  <div class="row" style="justify-content:space-between"><span class="small muted">${esc(q.meta)}</span><button class="btn amber" onclick="toggleMark(${q.n})">${s.marked[q.n]?"★ Marcada":"☆ Marcar para revisar"}</button></div>
  <h3 style="margin-top:16px;line-height:1.52">${esc(q.stem)}</h3>
  <div class="options">${Object.entries(q.opts).map(([k,v])=>optionHTML(q,a,k,v)).join("")}</div>
  ${a?answerHTML(q,a):""}
 </div>
 <div class="row" style="justify-content:space-between;margin-top:16px">
  <button class="btn" onclick="prevQ()">← Anterior</button>
  <div class="row"><button class="btn" onclick="pause()">⏸ Pausar e salvar</button><button class="btn" onclick="endSession()">📊 Encerrar sessão</button><button class="btn red" onclick="finalize()">✅ Finalizar definitivamente</button></div>
  <button class="btn primary" onclick="nextQ()">Próxima →</button>
 </div>
 <div class="qnav">${e.questions.map(dotHTML).join("")}</div>`;
 updateTimers();
}
function optionHTML(q,a,k,v){
 let cls="option";if(a){if(k===correctedKey(q))cls+=" correct";else if(k===a.selected)cls+=" wrong"}
 return `<button class="${cls}" ${a?"disabled":""} onclick="answer(${q.n},'${k}')"><b>${k})</b> ${esc(v)}</button>`;
}
function answer(n,k){
 const e=examData(),s=state();if(s.answers[n])return;let q=e.questions[n-1];
 s.answers[n]={selected:k,timeMs:Math.max(1000,Date.now()-questionOpenedAt),at:new Date().toISOString()};if(!s.sessionAnswered.includes(n))s.sessionAnswered.push(n);s.lastAnswered=n;saveAll();renderQuestion();
}
function answerHTML(q,a){
 const med=correctedKey(q),ok=a.selected===med,diff=med!==q.official;
 return `<div class="answer">
  <h3 style="color:${ok?"var(--green)":"var(--red)"}">${ok?"✓ Resposta médica correta":"✗ Resposta médica incorreta"}</h3>
  <p><b>Sua resposta:</b> ${a.selected} &nbsp; • &nbsp; <b>Gabarito do PDF:</b> ${q.official}${diff?` &nbsp; • &nbsp; <b>Resposta médica corrigida:</b> ${med}`:""}</p>
  <p>${esc(q.comment)}</p>
  ${q.issue?`<div class="issue"><b>⚠ ${esc(q.issue.title)}</b><p>${esc(q.issue.text)}</p><p class="small"><b>Confiança:</b> ${esc(q.issue.confidence)}<br><b>Base para conferência:</b> ${esc(q.issue.source)}</p></div>`:""}
 </div>`;
}
function dotHTML(q){
 let s=state(),a=s.answers[q.n],cls="qdot";if(a)cls+=a.selected===correctedKey(q)?" ok":" err";if(s.marked[q.n])cls+=" marked";if(q.issue)cls+=" warn";if(q.n===s.current)cls+=" current";
 return `<button class="${cls}" title="Questão ${q.n}" onclick="jump(${q.n})">${q.n}</button>`;
}
function toggleMark(n){let s=state();s.marked[n]=!s.marked[n];saveAll();renderQuestion()}
function jump(n){let s=state();s.current=n;saveAll();renderQuestion()}
function prevQ(){let s=state(),i=s.sessionSelection.indexOf(s.current);s.current=i>0?s.sessionSelection[i-1]:Math.max(1,s.current-1);saveAll();renderQuestion()}
function nextQ(){
 let s=state(),i=s.sessionSelection.indexOf(s.current);
 if(i>=0&&i<s.sessionSelection.length-1)s.current=s.sessionSelection[i+1];
 else{let u=s.sessionSelection.filter(n=>!s.answers[n]);if(u.length)s.current=u[0];else{return endSession(true)}}
 saveAll();renderQuestion();
}
function pause(){stopTick(true);state().status="in_progress";saveAll();showLibrary()}
function sessionStats(nums){
 const e=examData(),s=state(),ans=nums.filter(n=>s.answers[n]),off=ans.filter(n=>s.answers[n].selected===e.questions[n-1].official).length,med=ans.filter(n=>s.answers[n].selected===correctedKey(e.questions[n-1])).length,time=ans.reduce((z,n)=>z+(s.answers[n].timeMs||0),0);
 return {ans,off,med,time};
}
function endSession(auto=false){
 stopTick(true);let s=state(),nums=[...s.sessionAnswered],st=sessionStats(nums),rec={at:new Date().toISOString(),selection:[...s.sessionSelection],answered:nums,official:st.off,medical:st.med,timeMs:st.time};
 s.sessions.push(rec);s.sessionAnswered=[];s.status="in_progress";saveAll();renderReport("partial",rec,auto);
}
function finalize(){
 if(!confirm("Finalizar esta tentativa definitivamente? Questões não respondidas NÃO serão contadas como erro."))return;
 stopTick(true);let s=state();s.status="finalized";s.finalizedAt=new Date().toISOString();saveAll();renderReport("final",null,false);
}
function topicsStats(nums){
 const e=examData(),s=state(),map={};DATA.official_topics[e.group].forEach(t=>map[t.name]={q:0,c:0,e:0});
 nums.forEach(n=>{let q=e.questions[n-1],a=s.answers[n];if(!a)return;let v=map[q.topic]||(map[q.topic]={q:0,c:0,e:0});v.q++;if(a.selected===correctedKey(q))v.c++;else v.e++});
 return map;
}
function renderReport(type,rec,auto=false,sort="original"){
 const e=examData(),s=state(),nums=type==="partial"?(rec?.answered||[]):e.questions.filter(q=>s.answers[q.n]).map(q=>q.n),st=sessionStats(nums),n=st.ans.length,non=type==="final"?e.questions.length-n:0,map=topicsStats(nums);
 let rows=Object.entries(map).map(([t,v])=>({t,...v,p:pct(v.c,v.q)}));
 if(sort==="more")rows.sort((a,b)=>b.q-a.q);if(sort==="less")rows.sort((a,b)=>a.q-b.q);if(sort==="best")rows.sort((a,b)=>b.p-a.p);if(sort==="worst")rows.sort((a,b)=>a.p-b.p);
 let issues=nums.filter(x=>e.questions[x-1].issue),totalTime=type==="partial"?st.time:s.accumulatedMs;
 document.getElementById("app").innerHTML=`
 <h1>${type==="partial"?"Relatório parcial da sessão":"Resultado da tentativa"}</h1>
 ${auto?'<div class="notice">Você concluiu o bloco selecionado. A tentativa principal permanece aberta.</div>':""}
 <div class="grid g4" style="margin-top:14px">
  <div class="stat"><span class="small muted">Respondidas</span><b>${n}${type==="final"?"/"+e.questions.length:""}</b></div>
  <div class="stat"><span class="small muted">Gabarito oficial</span><b>${pct(st.off,n)}%</b></div>
  <div class="stat"><span class="small muted">Médico corrigido</span><b>${pct(st.med,n)}%</b></div>
  <div class="stat"><span class="small muted">Não respondidas</span><b>${non}</b></div>
 </div>
 <div class="grid g3" style="margin-top:14px">
  <div class="stat"><span class="small muted">Tempo</span><b style="font-size:18px">${fmt(totalTime)}</b></div>
  <div class="stat"><span class="small muted">Média por questão</span><b style="font-size:18px">${fmt(n?st.time/n:0)}</b></div>
  <div class="stat"><span class="small muted">Alertas auditados respondidos</span><b>${issues.length}</b></div>
 </div>
 <div class="card" style="margin-top:15px">
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">Desempenho por tema</h2><div class="row">
   <button class="btn" onclick="rerenderReport('${type}','original')">Ordem oficial</button><button class="btn" onclick="rerenderReport('${type}','more')">Mais cobrado</button><button class="btn" onclick="rerenderReport('${type}','best')">Melhor</button><button class="btn" onclick="rerenderReport('${type}','worst')">Pior</button>
  </div></div>
  <div class="tablewrap"><table><thead><tr><th>Tema oficial</th><th>Questões</th><th>Acertos</th><th>Erros</th><th>Aproveitamento</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td>${esc(r.t)}</td><td>${r.q}</td><td>${r.c}</td><td>${r.e}</td><td>${r.q?r.p+"%":"—"}</td></tr>`).join("")}</tbody></table></div>
 </div>
 <div class="card" style="margin-top:15px"><h2>Questões com alerta médico auditado</h2>
 ${issues.length?issues.map(n=>{let q=e.questions[n-1];return `<div class="issue"><b>Questão ${n} — ${esc(q.issue.title)}</b><p class="small">Gabarito: ${q.official} · resposta médica usada: ${correctedKey(q)} · confiança: ${esc(q.issue.confidence)}</p><p>${esc(q.issue.text)}</p></div>`}).join(""):'<p class="muted">Nenhuma questão sinalizada foi respondida neste conjunto.</p>'}
 </div>
 <div class="row" style="margin-top:15px">
  ${type==="partial"?'<button class="btn primary" onclick="openStart(activeExamId)">Iniciar outro bloco / continuar</button>':'<button class="btn primary" onclick="showLibrary()">Biblioteca</button>'}
  <button class="btn" onclick="reviewWrong()">Revisar erradas</button><button class="btn" onclick="reviewMarked()">Revisar marcadas</button><button class="btn amber" onclick="reviewIssues()">Possíveis recursos</button><button class="btn" onclick="reviewUnanswered()">Não respondidas</button>
 </div>`;
 window.__lastReport={type,rec};
}
function rerenderReport(type,sort){let x=window.__lastReport||{};renderReport(type,x.rec||null,false,sort)}
function showExamReport(id){activeExamId=id;renderReport("final",null,false)}
function startReview(arr){if(!arr.length)return alert("Nenhuma questão neste filtro.");let s=state();s.sessionSelection=arr;s.sessionAnswered=[];s.current=arr[0];s.sessionStart=Date.now();s.status="in_progress";saveAll();renderQuestion();startTick()}
function reviewWrong(){let e=examData(),s=state();startReview(e.questions.filter(q=>s.answers[q.n]&&s.answers[q.n].selected!==correctedKey(q)).map(q=>q.n))}
function reviewMarked(){let e=examData(),s=state();startReview(e.questions.filter(q=>s.marked[q.n]).map(q=>q.n))}
function reviewIssues(){let e=examData();startReview(e.questions.filter(q=>q.issue).map(q=>q.n))}
function reviewUnanswered(){let e=examData(),s=state();startReview(e.questions.filter(q=>!s.answers[q.n]).map(q=>q.n))}
function exportAll(){
 stopTick(true);const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),appState},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="medquest-progresso-completo.json";a.click();URL.revokeObjectURL(a.href)
}
function importAll(ev){
 const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==2||!x.appState)throw 0;appState=x.appState;Object.values(appState.exams).forEach(s=>s.sessionStart=null);saveAll();alert("Progresso importado com sucesso.");showLibrary()}catch(e){alert("Arquivo de progresso inválido.")}};r.readAsText(f);ev.target.value="";
}
showLibrary();
</script>
</body>
</html>
