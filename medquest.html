xpectante, sem necessidade de intervenção, já que o quadro é assintomático e de longa evolução.", "B": "Iniciar tratamento clínico com anti-inflamatórios e analgésicos, com reavaliação ambulatorial programada em uma semana.", "C": "Solicitar tomografia de abdome e pelve para melhor avaliação da anatomia da hérnia antes de qualquer decisão terapêutica.", "D": "Encaminhar o paciente para correção cirúrgica eletiva, com orientações sobre sinais de complicação que exijam retorno imediato."}, "topic": "Hérnias de Parede Abdominal", "official": "D", "medical": "D", "comment": "O paciente apresenta uma hérnia inguinal redutível e sem sinais de complicação, o que configura uma indicação de correção cirúrgica eletiva. A tomografia é desnecessária na maioria dos casos de hérnia clinicamente evidente e redutível. O tratamento clínico isolado (analgésicos/anti-inflamatórios) não resolve a causa anatômica e não substitui a correção cirúrgica. A conduta expectante pode ser considerada em casos muito específicos (idade avançada, comorbidades), mas não é a mais indicada neste perfil."}, {"n": 32, "meta": "(2025.1) ROT.2-B-14T: Q.24", "stem": "Um homem de 58 anos, com histórico de hérnia inguinal há 3 anos, procura o pronto-socorro com dor intensa e progressiva na região inguinal direita há 8 horas, associada a náuseas e ausência de evacuação desde o dia anterior. No exame físico, observa-se abaulamento inguinal doloroso, irreduzível e sem sinais de pele hiperemiada. Qual é a conduta mais apropriada para esse paciente?", "opts": {"A": "Administrar analgésicos e solicitar ultrassonografia de urgência para avaliar a viabilidade do conteúdo herniário antes de qualquer decisão cirúrgica.", "B": "Realizar a tentativa de redução manual da hérnia, utilizando técnicas apropriadas; caso a redução seja bem-sucedida, indicar a programação de uma cirurgia eletiva.", "C": "Encaminhar o paciente para cirurgia de urgência, pois o quadro sugere encarceramento herniário com risco de estrangulamento.", "D": "Solicitar tomografia computadorizada para diferenciar entre hérnia encarcerada e estrangulada, adiando a cirurgia até confirmação radiológica."}, "topic": "Hérnias de Parede Abdominal", "official": "C", "medical": "C", "comment": "Embora a ultrassonografia possa auxiliar no diagnóstico, a abordagem clínica e cirúrgica não deve ser atrasada em casos suspeitos de encarceramento, pois a demora pode resultar em isquemia do conteúdo herniário. A redução manual pode ser tentada apenas em casos sem sinais de sofrimento isquêmico. Neste paciente, a ausência de evacuação e a dor progressiva sugerem encarceramento avançado, e a tentativa de redução forçada pode piorar a lesão intestinal. A hérnia inguinal encarcerada é uma emergência cirúrgica devido ao alto risco de progressão para estrangulamento e necrose intestinal. O paciente deve ser encaminhado imediatamente para cirurgia sem atrasos. A tomografia pode ser útil, mas a necessidade de intervenção cirúrgica é baseada principalmente na avaliação clínica. Atrasar a cirurgia para aguardar exames de imagem pode aumentar o risco de complicações graves."}, {"n": 33, "meta": "(2025.1) ROT.3-B-14T: Q.17", "stem": "Uma mulher de 55 anos, previamente saudável, procura atendimento médico com queixa de dor no quadril direito e massa progressiva na região inguinal, que aumenta ao ficar em pé e diminui ao deitar-se. No exame físico, observa-se uma protuberância abaixo do ligamento inguinal, dolorosa à palpação, com redução difícil, porém possível. Não há sinais de encarceramento, estrangulamento ou obstrução intestinal. Qual das condutas abaixo representa a abordagem inicial mais apropriada, considerando o risco associado a esse tipo de hérnia?", "opts": {"A": "Solicitar ressonância magnética da pelve para avaliar melhor a extensão da lesão e confirmar a hipótese de hérnia inguinal antes de indicar cirurgia.", "B": "Orientar perda ponderal e o uso de faixa para contenção da hérnia, postergando a cirurgia até redução de peso e melhora dos sintomas.", "C": "Indicar correção cirúrgica programada, considerando o risco elevado de encarceramento e a localização anatômica desfavorável da hérnia femoral.", "D": "Realizar redução manual em ambiente ambulatorial e manter a paciente em observação clínica, com retorno se houver sinais de agravamento."}, "topic": "Hérnias de Parede Abdominal", "official": "C", "medical": "C", "comment": "A) \"Solicitar ressonância magnética da pelve para avaliar melhor a extensão da lesão e confirmar a hipótese de hérnia inguinal antes de indicar cirurgia.\" INCORRETA. O exame físico já é suficiente para diagnóstico: massa abaixo do ligamento inguinal, dolorosa, no triângulo femoral. Além disso, trata-se de hérnia femoral, não inguinal. A ressonância magnética raramente é necessária para o diagnóstico de hérnias. O tratamento não depende de maior avaliação de extensão, mas sim do risco elevado de complicação. B) \"Orientar perda ponderal e o uso de faixa para contenção da hérnia, postergando a cirurgia até redução de peso e melhora dos sintomas.\" INCORRETA. A hérnia femoral não deve ser tratada de forma conservadora devido ao risco elevado de complicações. Perda de peso e uso de faixa são medidas que podem ser sugeridas em alguns casos de hérnias inguinais assintomáticas, mas são inadequadas e insuficientes aqui. A conduta correta é a correção cirúrgica. O consenso internacional e as principais diretrizes orientam que toda hérnia femoral deve ser reparada cirurgicamente assim que diagnosticada, mesmo na ausência de sintomas. A perda ponderal pode reduzir o risco cirúrgico em outros contextos, mas não altera a necessidade de reparação da hérnia femoral. O uso de faixa pode mascarar sintomas, sem prevenir complicações, podendo até atrasar o diagnóstico de um estrangulamento iminente. C) \"Indicar correção cirúrgica programada, considerando o risco elevado de encarceramento e a localização anatômica desfavorável da hérnia femoral.\" CORRETA. A hérnia femoral apresenta um risco elevado de encarceramento e estrangulamento, mesmo quando ainda reduzível. O tratamento padrão é a correção cirúrgica programada. Não há necessidade de cirurgia em caráter de urgência na ausência de sinais de complicação, mas também não se recomenda conduta expectante. D) \"Realizar redução manual em ambiente ambulatorial e manter a paciente em observação clínica, com retorno se houver sinais de agravamento.\" INCORRETA. Embora a hérnia seja reduzível, o risco de encarceramento é elevado. A estratégia de \"reduzir e observar\" não é segura para hérnias femorais. O tratamento recomendado é a correção cirúrgica programada, independentemente da ausência de sinais agudos."}, {"n": 34, "meta": "(2025.1) ROT.3-B-14T: Q.24", "stem": "Um paciente de 63 anos, obeso, com antecedentes de DPOC e tabagismo, procura o pronto-socorro com dor intensa e progressiva em região inguinal direita, associada a náuseas, distensão abdominal e ausência de eliminação de flatos e fezes nas últimas 24 horas. Ao exame físico, apresenta massa endurecida, irredutível, dolorosa à palpação e sem sinais de peritonite. Com base nesse quadro, qual é a conduta terapêutica mais adequada diante da complicação apresentada?", "opts": {"A": "Solicitar tomografia abdominal para confirmação diagnóstica e indicar tratamento conservador com observação por 48 horas antes de qualquer intervenção.", "B": "Iniciar antibioticoterapia empírica, dieta zero e analgesia, aguardando melhora clínica para posterior indicação cirúrgica eletiva.", "C": "Realizar tentativa de redução manual com sedação e analgesia, seguida de alta hospitalar com agendamento ambulatorial de hernioplastia.", "D": "Indicar cirurgia de urgência para herniorrafia, com exploração do saco herniário e possível ressecção intestinal, mesmo na ausência de sinais sistêmicos graves."}, "topic": "Hérnias de Parede Abdominal", "official": "D", "medical": "D", "comment": "A) \"Solicitar tomografia abdominal para confirmação diagnóstica e indicar tratamento conservador com observação por 48 horas antes de qualquer intervenção.\" INCORRETA. A tomografia pode auxiliar na avaliação, mas não deve postergar a cirurgia em um quadro típico de encarceramento com obstrução. A observação clínica é contraindicada nesse contexto. B) \"Iniciar antibioticoterapia empírica, dieta zero e analgesia, aguardando melhora clínica para posterior indicação cirúrgica eletiva.\" INCORRETA. Em casos de hérnia encarcerada com obstrução intestinal, o tratamento não é conservador, pois há risco iminente de estrangulamento e necrose intestinal, mesmo na ausência de peritonite. C) \"Realizar tentativa de redução manual com sedação e analgesia, seguida de alta hospitalar com agendamento ambulatorial de hernioplastia.\" INCORRETA. A manobra de tax (redução manual) está contraindicada em pacientes com quadro obstrutivo e dor progressiva, pois pode mascarar uma alça já isquêmica e levar à perfuração intra-abdominal. D) \"Indicar cirurgia de urgência para herniorrafia, com exploração do saco herniário e possível ressecção intestinal, mesmo na ausência de sinais sistêmicos graves.\" CORRETA. O quadro é sugestivo de hérnia encarcerada com obstrução intestinal, que exige abordagem cirúrgica de urgência. A exploração do conteúdo herniado permite avaliar a viabilidade das alças e realizar ressecção se necessário, evitando complicações como necrose, perfuração e sepse."}, {"n": 35, "meta": "(2026.1) ROT.1-A: Q.8", "stem": "Homem de 54 anos é avaliado em ambulatório de cirurgia geral por abaulamento em região inguinal direita, redutível, com aumento aos esforços. Durante a avaliação cirúrgica, o defeito herniário é classificado como Nyhus tipo II, com base nos achados anatômicos observados durante o exame clínico e a correlação com a anatomia do canal inguinal. A partir da classificação de Nyhus informada no texto-base, assinale a alternativa que corretamente descreve o tipo de hérnia inguinal e o mecanismo anatômico de sua formação.", "opts": {"A": "Hérnia inguinal direta em decorrência do enfraquecimento da fáscia transversalis localizada na região do triângulo de Hesselbach.", "B": "Hérnia inguinal indireta resultante da persistência do conduto peritonovaginal, com anel inguinal profundo de dimensões normais.", "C": "Hérnia inguinal indireta complexa, associada à fraqueza da parede posterior do canal inguinal e extensão escrotal volumosa.", "D": "Hérnia inguinal indireta associada à dilatação do anel inguinal profundo, sem comprometimento da parede posterior do canal inguinal."}, "topic": "Hérnias de Parede Abdominal", "official": "D", "medical": "D", "comment": "B) \"Hérnia inguinal indireta resultante da persistência do conduto peritonovaginal, com anel inguinal profundo de dimensões normais.\" INCORRETA. Essa descrição corresponde à hérnia inguinal indireta Nyhus tipo I, em que o anel inguinal profundo mantém dimensões normais. D) \"Hérnia inguinal indireta associada à dilatação do anel inguinal profundo, sem comprometimento da parede posterior do canal inguinal.\" CORRETA. A alternativa está correta porque a hérnia inguinal indireta Nyhus tipo II é caracterizada pela dilatação do anel inguinal profundo, com parede posterior do canal inguinal preservada. Trata-se de uma condição adquirida, que se diferencia do tipo I pela alteração do anel e das formas mais avançadas pelo não comprometimento posterior. A) \"Hérnia inguinal direta em decorrência do enfraquecimento da fáscia transversalis localizada na região do triângulo de Hesselbach.\" INCORRETA. A hérnia inguinal direta é classificada como Nyhus IIIA, ocorrendo por defeito da parede posterior, medialmente aos vasos epigástricos inferiores. C) \"Hérnia inguinal indireta complexa, associada à fraqueza da parede posterior do canal inguinal e extensão escrotal volumosa.\" INCORRETA. Hérnias indiretas associadas a defeito da parede posterior e/ou extensão escrotal volumosa correspondem às formas Nyhus IIIB, não compatíveis com o tipo II informado."}, {"n": 36, "meta": "(2026.1) ROT.1-A: Q.9", "stem": "Um pequeno comerciante do interior, aposentado, de 89 anos, é encaminhado ao ambulatório com diagnóstico de hérnia inguinal. A hérnia só o incomoda quando anda de charrete, não dói e não produz outras limitações. Ele possui um histórico médico que inclui insuficiência aórtica grave, diabetes mellitus controlado com insulina, obesidade grau II, hipertensão sistólica, carga tabágica de 25 anos/maço e ecocardiograma com fração de ejeção de 30%. Ao exame, apresenta uma hérnia inguinal direita pequena que só pode ser percebida com a manobra de Valsalva em posição ortostática, sem sinais de complicação. A equipe médica vai considerar a melhor abordagem terapêutica. Qual das seguintes opções representa a conduta mais adequada para este paciente?", "opts": {"A": "Realizar cirurgia por acesso minimamente invasivo.", "B": "Realizar cirurgia eletiva convencional para correção da hérnia inguinal.", "C": "Interromper esforços desnecessários e manter consultas regulares com observação.", "D": "Recomendar repouso absoluto e evitar qualquer atividade física."}, "topic": "Hérnias de Parede Abdominal", "official": "C", "medical": "C", "comment": "B) \"Realizar cirurgia eletiva convencional para correção da hérnia inguinal.\" INCORRETA. Embora a cirurgia seja a única forma de reparar a hérnia, a sua indicação eletiva (neste caso) não é a conduta mais recomendada. Pacientes idosos com múltiplas comorbidades, incluindo uma grave, têm risco cirúrgico elevado e isso pode levar a complicações significativas. O benefício sobre o risco não é claramente evidente. A) \"Realizar cirurgia por acesso minimamente invasivo.\" INCORRETA. Embora a cirurgia minimamente invasiva possa ser realizada em pacientes de risco com benefícios claros de redução da dor pós-operatória e recuperação mais rápida, isso não significa que deva ser realizada em paciente com tantos fatores de risco cardiovasculares. Aqui também a análise do risco-benefício não é favorável devido a todos os problemas associados, mas principalmente à valvulopatia grave e à fração de ejeção baixa. C) \"Interromper esforços desnecessários e manter consultas regulares com observação.\" CORRETA. A observação vigilante (\"watchful waiting\") com consultas regulares com um especialista para se evitar o aumento da pressão intra- abdominal (pesos, tosse crônica, constipação), tratamento da cardiopatia e da valvulopatia, controle do peso corporal, tratamento do tabagismo, manutenção de exercícios leves para a saúde e até o uso de cintas ou faixas para conforto são medidas adequadas nos pacientes de alto risco cirúrgico, reservando-se a cirurgia para o surgimento de sintomas preocupantes. D) \"Recomendar repouso absoluto e evitar qualquer atividade física.\" INCORRETA. A inatividade total não é aconselhável, pois pode levar a complicações como trombose venosa profunda; os pacientes devem ser incentivados a manter um nível de atividade física adequado, respeitando suas limitações."}, {"n": 37, "meta": "(2026.1) ROT.1-A: Q.29", "stem": "Paciente com história conhecida de hérnia inguinal previamente redutível procura atendimento por dor intensa e contínua na região herniária há 10 horas, associada a náuseas e distensão abdominal progressiva. Ao exame físico, apresenta massa inguinal dolorosa e irredutível, discreta hiperemia cutânea local e febre de 38,4 °C. Os exames laboratoriais mostram leucocitose de 18.200/mm³ com desvio à esquerda e lactato sérico de 3,1 mmol/L. Diante do quadro clínico apresentado, qual achado sugere de forma mais consistente progressão para estrangulamento herniário?", "opts": {"A": "Elevação do lactato sérico associada à dor contínua e sinais sistêmicos.", "B": "Hiperemia cutânea localizada sobre o saco herniário.", "C": "Distensão abdominal e náuseas decorrentes de obstrução intestinal mecânica.", "D": "Irredutibilidade da massa herniária associada à dor local persistente. COMPLICAÇÕES E CUIDADOS PÓS- COMPLICAÇÕES E CUIDADOS PÓS- COMPLICAÇÕES E CUIDADOS PÓS- OPERATÓRIOS; INFECÇÃO EM CIRURGIA - OPERATÓRIOS; INFECÇÃO EM CIRURGIA - OPERATÓRIOS; INFECÇÃO EM CIRURGIA - HEMATOMA - SEROMA - DEISCÊNCIA - HEMATOMA - SEROMA - DEISCÊNCIA - HEMATOMA - SEROMA - DEISCÊNCIA - EVISCERAÇÃO EVISCERAÇÃO EVISCERAÇÃO"}, "topic": "Hérnias de Parede Abdominal", "official": "A", "medical": "A", "comment": "A) \"Elevação do lactato sérico associada à dor contínua e sinais sistêmicos.\" CORRETA. A elevação do lactato sérico associada à dor intensa contínua e sinais sistêmicos sugere hipóxia tecidual e comprometimento vascular do conteúdo herniado, caracterizando progressão para estrangulamento herniário. O aumento do lactato é marcador de isquemia intestinal e indica necessidade de intervenção cirúrgica urgente. D) \"Irredutibilidade da massa herniária associada à dor local persistente.\" INCORRETA. A irredutibilidade caracteriza encarceramento, mas não necessariamente estrangulamento. O estrangulamento implica comprometimento vascular do conteúdo herniado, o que não é definido apenas pela impossibilidade de redução. C) \"Distensão abdominal e náuseas decorrentes de obstrução intestinal mecânica.\" INCORRETA. Obstrução intestinal pode ocorrer tanto em hérnia encarcerada quanto estrangulada. A presença de distensão e náuseas não diferencia, isoladamente, sofrimento vascular. B) \"Hiperemia cutânea localizada sobre o saco herniário.\" INCORRETA. Hiperemia local pode ocorrer em processos inflamatórios superficiais e não é critério confiável para diferenciar encarceramento de estrangulamento."}, {"n": 38, "meta": "(2025.2) ROT.1-A-12T: Q.14", "stem": "Homem, 62 anos, obeso, tabagista, é submetido a laparotomia exploradora após trauma abdominal, sendo realizada enterectomia com anastomose término-terminal. No 2º dia de pós-operatório, evolui com taquipneia (FR 26 irpm), leve dessaturação (SpO₂ 92% em ar ambiente) e ausculta com murmúrio vesicular diminuído na base pulmonar direita, sem ruídos adventícios. Não apresenta febre. Hemograma sem leucocitose. Solicitada radiografia de tórax, que evidencia aumento da trama reticular principalmente em base à direita, associada a desvio de traqueia ipsilateral e sem imagem de broncogramas aéreos. Considerando o quadro clínico e os achados radiológicos, qual é a conduta mais apropriada neste momento?", "opts": {"A": "Indicar broncoscopia diagnóstica e aspirativa para liberação de secreções e coleta de amostras para cultura.", "B": "Iniciar antibioticoterapia de amplo espectro e solicitar tomografia de tórax para afastar pneumonia nosocomial.", "C": "Estimular deambulação, otimizar fisioterapia respiratória e analgesia adequada, mantendo vigilância clínica.", "D": "Iniciar oxigenoterapia com FiO₂ elevada e realizar gasometria arterial imediata para intubação orotraqueal."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "C", "medical": "C", "comment": "O paciente apresenta quadro clássico de atelectasia basal pós-operatória, uma das complicações respiratórias mais comuns em grandes cirurgias abdominais, especialmente em pacientes obesos, tabagistas e submetidos a laparotomia. O 2º dia pós-operatório é o período de pico para atelectasias, e os achados clínicos e radiológicos corroboram esse diagnóstico: • Ausculta reduzida sem estertores ou sibilos. • RX de tórax com aumento da trama reticular e desvio de traqueia ipsilateral, sem broncograma aéreo (sugestivo de colapso alveolar e não consolidação). • Ausência de febre, leucocitose ou secreção produtiva. Conduta correta: medidas conservadoras, com deambulação precoce, incentivo respiratório e analgesia adequada. Essas intervenções restauram a expansão pulmonar e evitam progressão para pneumonia. Discussão das alternativas incorretas: A pneumonia pode surgir no pós-operatório, porém cursa com quadro infeccioso, apresentando febre, leucocitose, secreção purulenta e achado de broncograma aéreo ao RX. Não há critérios clínicos para iniciar antibiótico neste momento. A broncoscopia é reservada para falhas de desobstrução com medidas conservadoras ou suspeita de corpo estranho ou obstrução mecânica persistente — o que não se aplica aqui. A oxigenoterapia com FiO₂ elevada e gasometria imediata são indicadas em casos de hipoxemia grave ou sinais de insuficiência respiratória, o que não ocorre no caso (SpO₂ de 92% em ar ambiente é tolerável neste contexto)."}, {"n": 39, "meta": "(2025.2) ROT.1-A-12T: Q.17", "stem": "Paciente feminina, 17 anos de idade, dá entrada na emergência com queixa de dor abdominal localizada na ferida operatória. Relata que foi submetida a cirurgia de apendicectomia necrosada há cerca de 10 dias, tendo evoluído satisfatoriamente com alta no quinto dia pós-operatório. Revela que há cerca de 3 dias iniciou dor abdominal na ferida operatória, e que tem piorado. Apresenta discreta celulite local. Ao exame físico, está em bom estado geral, afebril, presença de discreto abaulamento na ferida operatória, que se mantém íntegra e com hiperemia local. O exame de US da parede abdominal revelou a presença de coleção líquida em espaço subcutâneo de aproximadamente 20 ml. Considerando o caso em questão, marque a alternativa que apresenta, respectivamente, a principal hipótese diagnóstica e a conduta a ser realizada:", "opts": {"A": "Deiscência de ferida operatória e antibioticoterapia por 10 dias.", "B": "Hérnia incisional e cirurgia reparadora.", "C": "Seroma de ferida operatória e drenagem cirúrgica.", "D": "Abscesso de ferida operatória e drenagem cirúrgica."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "D", "medical": "D", "comment": "A) \"Deiscência de ferida operatória e antibioticoterapia por 10 dias.\" INCORRETA. Não há sinais de deiscência de ferida operatória. B) \"Hérnia incisional e cirurgia reparadora.\" INCORRETA. O US de parede abdominal confirmou a presença de coleção líquida local no subcutâneo. C) \"Seroma de ferida operatória e drenagem cirúrgica.\" INCORRETA. O seroma em geral não apresenta dor ou celulite local. D) \"Abscesso de ferida operatória e drenagem cirúrgica.\" CORRETA. Trata-se de uma complicação cirúrgica com abscesso de ferida operatória, que evolui com dor, aumento de volume discreto e sinais infecciosos ou inflamatórios locais. O US confirma a presença da coleção líquida e a conduta é drenagem cirúrgica."}, {"n": 40, "meta": "(2025.2) ROT.1-A-12T: Q.19", "stem": "Uma mulher de 54 anos, obesa (IMC 34), hipertensa e diabética tipo 2, foi submetida a histerectomia abdominal total eletiva. No 5º dia pós-operatório, relata dor intensa em ferida operatória, acompanhada de leve febre (T 37,9 °C) e presença de abaulamento e rubor em região inferior da incisão. No exame físico, observa-se ferida cirúrgica com eritema local, calor, flutuação central e saída de secreção serossanguinolenta sob leve pressão. A paciente apresenta também dor à palpação do local, mas está hemodinamicamente estável e sem sinais de peritonite. Com base nesse quadro clínico, qual a conduta mais adequada em relação à antibioticoterapia e ao manejo da dor?", "opts": {"A": "Administrar analgésicos opioides fortes para controle da dor e observar a evolução clínica antes de iniciar a antibioticoterapia.", "B": "Realizar drenagem da coleção subcutânea, instituir analgesia combinada (dipirona e opioide leve) e iniciar antibiótico direcionado à cobertura de pele e partes moles.", "C": "Indicar curativos locais, prescrever analgésico simples para controle da dor e iniciar antibioticoterapia oral por período reduzido.", "D": "Utilizar anti-inflamatórios não esteroidais para controle da dor e iniciar antibioticoterapia de amplo espectro por via intravenosa."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "B", "medical": "B", "comment": "A) \"Administrar analgésicos opioides fortes para controle da dor e observar a evolução clínica antes de iniciar a antibioticoterapia.\" INCORRETA. Opioides fortes não são a primeira escolha em pacientes com dor localizada e controlável. Além disso, a presença de sinais inflamatórios locais (rubor, calor, secreção) indica infecção estabelecida, e não é adequado observar sem iniciar tratamento. B) \"Realizar drenagem da coleção subcutânea, instituir analgesia combinada (dipirona e opioide leve) e iniciar antibiótico direcionado à cobertura de pele e partes moles.\" CORRETA. A paciente provavelmente apresenta infecção do sítio cirúrgico (ISC) superficial associada a seroma ou pequeno abscesso. O manejo adequado inclui drenagem da coleção, analgesia multimodal e antibioticoterapia com cobertura para cocos Gram-positivos da pele (ex.: cefalexina ou cefazolina, dependendo da via). A drenagem é fundamental para a resolução do quadro. C) \"Indicar curativos locais, prescrever analgésico simples para controle da dor e iniciar antibioticoterapia oral por período reduzido.\" INCORRETA. Não aborda de forma completa a infecção nem garante analgesia efetiva, podendo levar à piora do quadro. O tratamento deve ser terapêutico e direcionado. D) \"Utilizar anti-inflamatórios não esteroidais para controle da dor e iniciar antibioticoterapia de amplo espectro por via intravenosa.\" INCORRETA. AINEs isoladamente são geralmente insuficientes no pós- operatório imediato de cirurgia abdominal, especialmente com sinais de infecção local. A antibioticoterapia deve ser iniciada, mas o amplo espectro sem drenagem do conteúdo infectado e sem direcionamento pode ser inadequado, além do fato de que a infecção é superficial e sem sinais sistêmicos."}, {"n": 41, "meta": "(2025.2) ROT.2-A-14T: Q.5", "stem": "Paciente do sexo feminino, 58 anos, submetida a hernioplastia inguinal com colocação de tela há 5 dias, retorna ao ambulatório com queixa de dor leve na região operada, associada a abaulamento de consistência amolecida, sem sinais flogísticos evidentes. Não há febre nem secreção na ferida operatória. Considerando as possíveis complicações pós-operatórias, qual a hipótese diagnóstica mais provável e a conduta inicial recomendada?", "opts": {"A": "Seroma; observação clínica com possíveis punções se sintomático.", "B": "Recidiva herniária; solicitar tomografia e reabordar cirurgicamente.", "C": "Infecção de ferida operatória; iniciar antibiótico empírico imediatamente.", "D": "Hematoma; indicação imediata de drenagem cirúrgica."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "A", "medical": "A", "comment": "A) \"Seroma; observação clínica com possíveis punções se sintomático.\" CORRETA. Seromas são acúmulos de líquido claro no espaço morto criado pela dissecção cirúrgica, especialmente comuns em cirurgias com uso de tela. A maioria regride espontaneamente, sendo indicada apenas observação clínica. Em casos sintomáticos ou volumosos, pode-se realizar punção. B) \"Recidiva herniária; solicitar tomografia e reabordar cirurgicamente.\" INCORRETA. Recidiva herniária é um diagnóstico tardio, não compatível com 5º dia de pós-operatório e ausência de outros sinais, como aumento de volume irreversível ou sintomas compressivos. C) \"Infecção de ferida operatória; iniciar antibiótico empírico imediatamente.\" INCORRETA. Infecção de ferida operatória cursa com sinais flogísticos (rubor, calor, dor, secreção purulenta) e febre, ausentes no caso clínico apresentado. D) \"Hematoma; indicação imediata de drenagem cirúrgica.\" INCORRETA. Hematomas geralmente ocorrem nas primeiras 24-48h e apresentam coloração violácea e dor intensa. A drenagem só é indicada se houver risco de compressão ou infecção."}, {"n": 42, "meta": "(2025.2) ROT.2-A-14T: Q.25", "stem": "Paciente do sexo masculino, 66 anos, hipertenso e diabético tipo 2, foi submetido a colecistectomia por via aberta. No 8º dia de pós-operatório, refere dor abdominal, febre (38,5 °C), taquicardia (FC 110 bpm) e nota saída de secreção sero-purulenta por deiscência de parte da ferida cirúrgica. Ao exame, observam-se bordas evertidas com tecido desvitalizado e sinais de celulite perilesional. Com base nesse quadro clínico, qual a conduta inicial mais apropriada?", "opts": {"A": "Encaminhar o paciente para revisão com o cirurgião apenas se persistirem sinais infecciosos após 48 horas.", "B": "Reabrir parcialmente a ferida para drenagem, iniciar antibiótico empírico e realizar curativos locais.", "C": "Iniciar antibiótico empírico para gram-negativos e anaeróbios, mantendo a ferida fechada com curativo compressivo.", "D": "Reabrir completamente a ferida, realizar evisceração eletiva e fechamento por segunda intenção."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "B", "medical": "B", "comment": "B) \"Reabrir parcialmente a ferida para drenagem, iniciar antibiótico empírico e realizar curativos locais.\" CORRETA. O quadro descrito é compatível com infecção de ferida operatória profunda, com deiscência parcial da ferida. A conduta imediata deve incluir abertura da ferida para permitir drenagem, coleta de secreção para cultura, início de antibioticoterapia empírica direcionada para germes hospitalares (gram-positivos, gram-negativos e anaeróbios) e realização de curativos diários. Reflete o manejo ideal frente à deiscência infeccionada: drenagem, antibiótico e curativos. A) \"Encaminhar o paciente para revisão com o cirurgião apenas se persistirem sinais infecciosos após 48 horas.\" INCORRETA. Há sinais claros de infecção e deiscência, exigindo intervenção imediata. C) \"Iniciar antibiótico empírico para gram-negativos e anaeróbios, mantendo a ferida fechada com curativo compressivo.\" INCORRETA. Manter a ferida fechada na presença de secreção purulenta aumenta o risco de abscesso profundo. D) \"Reabrir completamente a ferida, realizar evisceração eletiva e fechamento por segunda intenção.\" C) \"Compatível com seroma pós-operatório, caracterizado por acúmulo de líquido seroso no subcutâneo.\" INCORRETA. Evisceração é uma complicação distinta, não indicada nesse momento."}, {"n": 43, "meta": "(2025.2) ROT.3-A-14T: Q.17", "stem": "Durante um acompanhamento no pós-operatório de uma laparotomia por ressecção intestinal, realizada há dez dias, um paciente de 55 anos, obeso, apresenta febre, taquicardia e saída de secreção purulenta pela ferida operatória. O exame físico revela dor local, hiperemia e sinais de deiscência parcial da sutura da pele, sem sinais de peritonite e sem sinais de saída de secreção intestinal. Considerando o quadro clínico e os cuidados cirúrgicos pós-operatórios, qual deve ser a conduta inicial mais apropriada para este paciente?", "opts": {"A": "Realizar abertura parcial da ferida para drenagem local e considerar coleta de cultura.", "B": "Iniciar antibioticoterapia por via oral e manter reavaliação clínica após 72 horas.", "C": "Indicar reabordagem cirúrgica com nova laparotomia devido ao risco de complicações.", "D": "Solicitar tomografia de abdome e administrar sintomáticos enquanto aguarda o resultado."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "A", "medical": "A", "comment": "O uso exclusivo de antibioticoterapia oral associado à observação não é adequado em presença de sinais claros de infecção de ferida operatória, pois retarda a resolução e não trata o foco local. A conduta recomendada em infecções superficiais ou deiscência parcial com secreção é a abertura parcial da ferida para drenagem, limpeza local e possível coleta de material para cultura, associando antibioticoterapia conforme a gravidade. Solicitar tomografia de abdome como primeira medida não é indicado, pois o diagnóstico de infecção superficial é clínico, e a prioridade é controlar o foco infeccioso. A indicação de reabordagem cirúrgica imediata com nova laparotomia fica restrita a casos graves, como evisceração ou sinais evidentes de infecção intra-abdominal com instabilidade hemodinâmica, o que não está presente neste cenário."}, {"n": 44, "meta": "(2025.2) ROT.3-A-14T: Q.19", "stem": "Um paciente de 52 anos, obeso (IMC 31 kg/m²), foi submetido há 10 dias a uma hernioplastia ventral com colocação de tela de polipropileno. Encontra-se em bom estado geral, afebril e sem dor significativa. Refere aumento progressivo de volume na parede abdominal anterior, sem saída de secreção pela ferida. Ao exame físico, observa-se abaulamento flutuante e indolor, de cerca de 8 cm de diâmetro, localizado abaixo da cicatriz cirúrgica, sem hiperemia, calor local ou deiscência. A ferida encontra-se bem coaptada. Diante desse achado clínico, qual é a conduta mais adequada neste momento?", "opts": {"A": "Observar clinicamente, sem qualquer intervenção, pois todo seroma regride espontaneamente.", "B": "Iniciar antibioticoterapia empírica e reabrir parcialmente a ferida para drenagem espontânea.", "C": "Indicar drenagem cirúrgica e antibioticoterapia profilática para evitar infecção da tela.", "D": "Realizar punção aspirativa sob técnica asséptica, solicitar cultura do líquido e repetir se houver recidiva."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "D", "medical": "D", "comment": "CORRETA. Realizar punção aspirativa sob técnica asséptica, solicitar cultura do líquido e repetir se houver recidiva. Seromas são comuns após cirurgias com ampla dissecção ou uso de tela, especialmente em pacientes obesos. A conduta depende de volume, sintomas e tempo de evolução: • Seroma pequeno, assintomático → observação expectante e curativos compressivos • Seroma volumoso (>5–8 cm) ou sintomático → punção aspirativa sob técnica estéril, podendo repetir se houver recidiva • Seroma com sinais inflamatórios (dor, rubor, calor, febre) → investigar infecção secundária → cultura e antibioticoterapia direcionada • Seroma persistente ou com encapsulamento → considerar drenagem cirúrgica ou colocação de dreno aspirativo No caso apresentado, o seroma é volumoso (8 cm), mas sem sinais de infecção, o que justifica a punção estéril com envio para cultura, sem antibiótico empírico inicial. Explicação das incorretas: Drenagem cirúrgica é uma intervenção excessiva e pode aumentar o risco de contaminação da tela de polipropileno, criando porta de entrada para infecção. O antibiótico profilático tardio (após o ato cirúrgico) não tem papel na prevenção de infecção de seroma. O seroma é uma coleção estéril de líquido seroso, resultante da linforreia e da resposta inflamatória local. A recomendação atual é evitar abrir a ferida cirúrgica e não usar antibiótico se não há sinais infecciosos. Seromas pequenos e assintomáticos podem ser apenas observados, pois se reabsorvem espontaneamente em poucos dias. No entanto, o caso descreve um seroma volumoso (8 cm) e progressivo, o que aumenta o risco de infecção ou deiscência se não for aspirado. Assim, a conduta expectante isolada é insuficiente neste contexto clínico. O caso apresentado não tem sinais infecciosos, portanto não há indicação de antibiótico empírico. A reabertura parcial da ferida rompe a barreira estéril, aumentando o risco de contaminação secundária, especialmente perigosa em presença de tela cirúrgica."}, {"n": 45, "meta": "(2026.1) ROT.1-A: Q.11", "stem": "Homem de 52 anos, submetido a hernioplastia inguinal aberta há 6 dias, retorna ao ambulatório cirúrgico relatando aumento de volume progressivo na região operada, associado a sensação de peso local. Refere discreto desconforto, sem piora importante com a movimentação. Nega febre ou mal-estar geral. No exame físico, observa-se abaulamento subcutâneo na topografia da incisão cirúrgica, com consistência flutuante à palpação. A ferida apresenta-se íntegra, sem secreção visível. Os sinais vitais encontram-se estáveis. Com base no quadro clínico apresentado, qual é o diagnóstico mais provável da complicação pós-operatória?", "opts": {"A": "Correspondente à recidiva da hérnia inguinal, relacionada à falha da correção cirúrgica prévia.", "B": "Indicativo de infecção de ferida operatória, associada a processo inflamatório local em evolução.", "C": "Compatível com seroma pós-operatório, caracterizado por acúmulo de líquido seroso no subcutâneo.", "D": "Sugestivo de hematoma de ferida operatória, decorrente de sangramento local no pós-operatório recente."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "C", "medical": "C", "comment": "CORRETA. O quadro é compatível com seroma pós-operatório, caracterizado por acúmulo de líquido seroso no subcutâneo. O seroma é uma complicação comum após hernioplastias abertas, resultante do acúmulo de líquido seroso no espaço subcutâneo. Manifesta-se tipicamente como abaulamento flutuante, sensação de peso local e ausência de sinais sistêmicos exuberantes, compatível com o quadro clínico descrito. D) \"Sugestivo de hematoma de ferida operatória, decorrente de sangramento local no pós-operatório recente.\" INCORRETA. O hematoma geralmente ocorre mais precocemente e costuma associar-se a dor mais intensa, tensão local e, frequentemente, sinais de sangramento, podendo haver coloração arroxeada. Esses achados não predominam no cenário apresentado. B) \"Indicativo de infecção de ferida operatória, associada a processo inflamatório local em evolução.\" INCORRETA. A infecção de ferida operatória caracteriza-se por dor progressiva, hiperemia, calor local, secreção purulenta e possível repercussão sistêmica, como febre ou taquicardia. A ausência desses elementos torna esse diagnóstico menos provável. A) \"Correspondente à recidiva da hérnia inguinal, relacionada à falha da correção cirúrgica prévia.\" INCORRETA. A recidiva da hérnia inguinal costuma manifestar-se como abaulamento com impulso à tosse, geralmente não flutuante, podendo causar desconforto aos esforços. O padrão descrito é mais compatível com complicação de ferida do que com falha da correção herniária."}, {"n": 46, "meta": "(2026.1) ROT.1-A: Q.28", "stem": "Mulher de 60 anos encontra-se no segundo dia de pós-operatório após colecistectomia por laparotomia. Evolui hemodinamicamente estável, afebril, com ferida operatória limpa e curativo íntegro. Refere dor abdominal avaliada como 6/10 na escala numérica, pior aos movimentos e à tosse, com repercussão na deambulação. Não apresenta náuseas, vômitos, distensão abdominal ou sinais clínicos de complicações cirúrgicas no momento. Considerando a intensidade da dor apresentada, qual é a estratégia analgésica mais adequada neste momento?", "opts": {"A": "Instituir analgesia multimodal, combinando analgésico não opioide com anti-inflamatório e opioide leve, conforme avaliação clínica.", "B": "Utilizar opioide isolado em dose fixa, mantendo analgesia contínua sem associação com outras classes analgésicas.", "C": "Indicar opioide potente em esquema contínuo, visando controle completo da dor independentemente da mobilização.", "D": "Priorizar anti-inflamatório não esteroidal em monoterapia, reservando opioides apenas se houver piora da dor."}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "A", "medical": "A", "comment": "A) \"Instituir analgesia multimodal, combinando analgésico não opioide com anti-inflamatório e opioide leve, conforme avaliação clínica.\" CORRETA. Dor 6/10 caracteriza dor moderada, com impacto funcional. As diretrizes recomendam analgesia multimodal, associando fármacos de diferentes mecanismos (não opioides, AINEs e opioides leves), o que melhora o controle da dor, reduz efeitos adversos e favorece recuperação funcional e mobilização precoce. B) \"Utilizar opioide isolado em dose fixa, mantendo analgesia contínua sem associação com outras classes analgésicas.\" INCORRETA. O uso de opioide isolado, sem associação com outras classes, não é a estratégia preferencial para dor moderada, pois aumenta o risco de efeitos adversos (náuseas, constipação, sedação) e não explora o benefício da analgesia multimodal. D) \"Priorizar anti-inflamatório não esteroidal em monoterapia, reservando opioides apenas se houver piora da dor.\" INCORRETA. A monoterapia com anti-inflamatório pode ser insuficiente para dor moderada com repercussão funcional no pós-operatório, retardando mobilização e recuperação, além de não atender plenamente às recomendações atuais de manejo da dor. C) \"Indicar opioide potente em esquema contínuo, visando controle completo da dor independentemente da mobilização.\" INCORRETA. Opioides potentes em esquema contínuo são reservados para dor intensa ou refratária. Seu uso em dor moderada expõe o paciente a riscos desnecessários, sem benefício proporcional."}, {"n": 47, "meta": "(2026.1) ROT.1-A: Q.30", "stem": "Homem de 63 anos, portador de diabetes mellitus tipo 2 e obesidade, retorna ao serviço cirúrgico no 10º dia após colectomia eletiva por neoplasia de cólon. Evoluiu nos últimos três dias com dor progressiva na ferida operatória, sensação de tensão local e febre baixa intermitente. Ao exame, observa-se hiperemia peri-incisional discreta, edema local e dor à palpação em planos mais profundos. Não há exteriorização espontânea de secreção pela incisão; entretanto, à compressão da ferida, ocorre drenagem de secreção seropurulenta proveniente abaixo do tecido subcutâneo. As bordas da incisão permanecem coaptadas. Exames laboratoriais mostram leucocitose com desvio à esquerda. Os sinais vitais estão estáveis. Com base na interpretação clínica do caso, qual é a classificação mais adequada desta complicação pós-operatória?", "opts": {"A": "Infecção limitada à pele e ao tecido subcutâneo da incisão, sem envolvimento de estruturas mais profundas.", "B": "Infecção envolvendo planos profundos, restrita à parede abdominal, sem evidência de acometimento cavitário.", "C": "Resposta inflamatória tardia do pós-operatório, sem critérios clínicos de infecção estabelecida.", "D": "Infecção relacionada à cavidade abdominal operada, com comprometimento de estruturas internas manipuladas. RESPOSTA ENDÓCRINO METABÓLICA AO RESPOSTA ENDÓCRINO METABÓLICA AO RESPOSTA ENDÓCRINO METABÓLICA AO TRAUMA TRAUMA TRAUMA"}, "topic": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "official": "B", "medical": "B", "comment": "B) \"Infecção envolvendo planos profundos, restrita à parede abdominal, sem evidência de acometimento cavitário.\" CORRETA. O quadro clínico apresenta dor localizada em planos profundos, secreção seropurulenta proveniente de camadas abaixo do subcutâneo, febre e leucocitose, sem sinais de acometimento intra-abdominal. Esses achados caracterizam infecção que envolve fáscia e musculatura da parede abdominal, compatível com infecção de sítio cirúrgico incisional profunda, conforme a classificação do CDC. A) \"Infecção limitada à pele e ao tecido subcutâneo da incisão, sem envolvimento de estruturas mais profundas.\" INCORRETA. Infecções restritas à pele e ao tecido subcutâneo geralmente cursam com secreção superficial, menor intensidade de dor e ausência de sinais inflamatórios relacionados a planos mais profundos. A presença de secreção originada abaixo do subcutâneo e dor à palpação profunda afasta essa classificação. D) \"Infecção relacionada à cavidade abdominal operada, com comprometimento de estruturas internas manipuladas.\" INCORRETA. Infecções de órgão ou espaço envolvem estruturas internas manipuladas durante o procedimento cirúrgico e costumam manifestar-se com dor abdominal difusa, sinais sistêmicos mais exuberantes ou achados sugestivos de coleção intra-abdominal, elementos não descritos no caso apresentado. C) \"Resposta inflamatória tardia do pós-operatório, sem critérios clínicos de infecção estabelecida.\" INCORRETA. Embora reações inflamatórias possam ocorrer no pós- operatório, a associação de secreção purulenta, febre e leucocitose atende a critérios diagnósticos de infecção de sítio cirúrgico, não sendo compatível com resposta inflamatória fisiológica tardia."}, {"n": 48, "meta": "(2025.2) ROT.1-A-12T: Q.24", "stem": "Durante a avaliação de um paciente politraumatizado nas primeiras horas após o evento, observam-se as seguintes alterações laboratoriais: hiperglicemia, leucocitose com neutrofilia, hipocalemia leve e elevação do cortisol plasmático. Qual dessas opções melhor explica a presença dessas alterações neste paciente?", "opts": {"A": "Representam alterações relacionadas à restrição hídrica e ao jejum prolongado, comuns em pacientes pós-trauma.", "B": "Indicam ativação do eixo hipotálamo-hipófise-adrenal e resposta simpática, características da resposta endócrino-metabólica ao trauma.", "C": "Essas alterações são compatíveis com infecção secundária, muito comum em pacientes politraumatizados.", "D": "Sugerem falência orgânica iminente e indicam mau prognóstico imediato, independente do tipo ou extensão do trauma."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "B", "medical": "B", "comment": "A) \"Representam alterações relacionadas à restrição hídrica e ao jejum prolongado, comuns em pacientes pós-trauma.\" INCORRETA. O perfil apresentado (hiperglicemia e elevação de cortisol) é típico da resposta ao estresse agudo, e não de jejum prolongado. A leucocitose com neutrofilia e hipocalemia leve também não são alterações esperadas apenas pela restrição alimentar. B) \"Indicam ativação do eixo hipotálamo-hipófise-adrenal e resposta simpática, características da resposta endócrino-metabólica ao trauma.\" CORRETA. Após um trauma, ocorre liberação de catecolaminas e ativação do eixo HHA, levando à hiperglicemia (por aumento de gliconeogênese e resistência à insulina), elevação do cortisol, leucocitose com neutrofilia (via ação da adrenalina e cortisol) e hipocalemia (por redistribuição de potássio e ação da aldosterona). Esses achados são compatíveis com resposta adaptativa ao trauma, e sua intensidade pode refletir a gravidade clínica. C) \"Essas alterações são compatíveis com infecção secundária, muito comum em pacientes politraumatizados.\" INCORRETA. Embora leucocitose com neutrofilia possa ocorrer em infecções, no contexto agudo do trauma essas alterações refletem primariamente a ativação da resposta inflamatória e neuroendócrina — não necessariamente uma infecção. D) \"Sugerem falência orgânica iminente e indicam mau prognóstico imediato, independente do tipo ou extensão do trauma.\" INCORRETA. Alterações hormonais intensas podem estar presentes em quadros graves, mas isoladamente não indicam falência orgânica iminente. O prognóstico deve ser avaliado de forma integrada com dados clínicos, laboratoriais e hemodinâmicos."}, {"n": 49, "meta": "(2025.2) ROT.1-A-12T: Q.27", "stem": "Durante a fase inicial da resposta endócrino-metabólica ao trauma, o eixo hipotálamo-hipófise-adrenal aumenta a secreção de cortisol. Qual dos efeitos abaixo, atribuído a esse hormônio, ajuda a explicar a hiperglicemia que frequentemente se instala nesses pacientes?", "opts": {"A": "Estimulação da gliconeogênese hepática e redução da captação periférica de glicose.", "B": "Inibição da proteólise muscular, preservando a massa magra e reduzindo a disponibilidade de aminoácidos.", "C": "Aumento da secreção de insulina e estimulação da captação de glicose pelos tecidos periféricos.", "D": "Supressão da ação do glucagon sobre o fígado, reduzindo a glicogenólise."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "A", "medical": "A", "comment": "A) \"Estimulação da gliconeogênese hepática e redução da captação periférica de glicose.\" CORRETA. O cortisol, liberado em resposta ao estresse traumático, difunde- se nas células hepáticas, modula a transcrição de centenas de genes e intensifica a produção de glicose a partir de aminoácidos, ao mesmo tempo que diminui a utilização periférica desse substrato. Essa combinação leva à hiperglicemia de estresse, enquanto suas ações catabólicas e imunomoduladoras contribuem para a proteólise muscular e supressão de citocinas pró-inflamatórias. B) \"Inibição da proteólise muscular, preservando a massa magra e reduzindo a disponibilidade de aminoácidos.\" INCORRETA. O cortisol estimula a proteólise, liberando aminoácidos para a gliconeogênese. C) \"Aumento da secreção de insulina e estimulação da captação de glicose pelos tecidos periféricos.\" INCORRETA. O cortisol induz resistência periférica à insulina, reduzindo a captação de glicose, não o contrário. D) \"Supressão da ação do glucagon sobre o fígado, reduzindo a glicogenólise.\" INCORRETA. O cortisol não inibe glucagon; atua de forma sinérgica, favorecendo gliconeogênese e glicogenólise."}, {"n": 50, "meta": "(2025.2) ROT.2-A-14T: Q.7", "stem": "Um paciente de 47 anos, há 48 horas em unidade de terapia intensiva após esplenectomia por trauma abdominal fechado, encontra-se hemodinamicamente estável, porém evolui com hiperglicemia de difícil controle, balanço nitrogenado negativo e aumento da excreção urinária de ureia, mesmo com adequada hidratação. Ao exame físico, não há sinais de sepse ou foco infeccioso. Analise o caso clínico a seguir e assinale a alternativa que indica a conduta mais apropriada, considerando a fisiopatologia e as fases da resposta endócrino-metabólica ao trauma:", "opts": {"A": "Reconhecer fase hipermetabólica com catabolismo intenso e resistência à insulina, indicando suporte nutricional precoce ajustado.", "B": "Identificar fase neuroendócrina aguda da resposta ao estresse com liberação hormonal, prescrevendo corticoterapia de suporte.", "C": "Supor fase inicial de sepse incipiente com possível disfunção orgânica, indicando antibioticoterapia empírica de amplo espectro.", "D": "Considerar fase de adaptação metabólica após o trauma, mantendo apenas hidratação venosa e postergando o início da nutrição enteral até completa estabilidade clínica."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "A", "medical": "A", "comment": "A apresentação clínica é compatível com a fase hipermetabólica do REMIT, que sucede a fase de ebb e caracteriza-se por hiperglicemia, resistência à insulina, aumento da proteólise e balanço nitrogenado negativo. A conduta correta é iniciar suporte nutricional precoce e ajustado, visando suprir a demanda calórica e proteica elevada, prevenindo piora do catabolismo. De acordo com as diretrizes atuais (ESPEN, ASPEN e Sabiston), pacientes críticos ou no pós-operatório de trauma devem receber nutrição enteral precoce, idealmente nas primeiras 24–48 horas, desde que não haja contraindicações. O atraso da nutrição intensifica o catabolismo, piora o balanço nitrogenado negativo e aumenta o risco de complicações infecciosas. A fase neuroendócrina aguda se refere às primeiras horas pós-trauma, com liberação de catecolaminas e cortisol, não sendo indicada corticoterapia de rotina, exceto em casos específicos, como insuficiência adrenal. Supor sepse e iniciar antibióticos empiricamente não se justifica na ausência de sinais clínicos ou laboratoriais de infecção."}, {"n": 51, "meta": "(2025.2) ROT.2-A-14T: Q.23", "stem": "R.S.L., 42 anos, sexo masculino, foi vítima de acidente automobilístico com trauma abdominal fechado e fratura de fêmur há cerca de 30 minutos. Na admissão hospitalar, está consciente, com sinais vitais estáveis. Após 24 horas, apresenta exames laboratoriais com glicemia de 168 mg/dL, sódio 150 mEq/L, potássio 3,3 mEq/L, leucócitos 17.500/mm³ e cortisol sérico elevado. Com base na resposta endócrino-metabólica ao trauma esperada no caso, analise os achados laboratoriais e assinale a interpretação correta dos dados:", "opts": {"A": "A hiperglicemia e a hipocalemia indicam ingestão excessiva de fluidos hipotônicos e devem ser corrigidas com solução salina hipertônica.", "B": "Os níveis elevados de sódio e cortisol, junto com hipocalemia e hiperglicemia, indicam provável insuficiência adrenal aguda, devendo-se iniciar reposição imediata de corticoide.", "C": "A hiperglicemia, leucocitose e hipocalemia são achados esperados da resposta ao trauma mediada por catecolaminas e cortisol, sem necessidade de intervenção específica neste momento.", "D": "A leucocitose e o cortisol elevado indicam sepse precoce, sendo necessária antibioticoterapia empírica e internação em unidade de terapia intensiva."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "C", "medical": "C", "comment": "C) \"A hiperglicemia, leucocitose e hipocalemia são achados esperados da resposta ao trauma mediada por catecolaminas e cortisol, sem necessidade de intervenção específica neste momento.\" CORRETA. O trauma desencadeia liberação de catecolaminas, cortisol e glucagon, levando à hiperglicemia, leucocitose por desvio à direita e hipocalemia (pela ação da aldosterona). Esses são achados fisiológicos comuns nas primeiras 24 a 48 horas pós-trauma. A) \"A hiperglicemia e a hipocalemia indicam ingestão excessiva de fluidos hipotônicos e devem ser corrigidas com solução salina hipertônica.\" INCORRETA. A hiperglicemia e hipocalemia não indicam excesso de fluidos hipotônicos. A hipernatremia é leve e pode ocorrer pela perda de água livre e efeito do cortisol e aldosterona, sem necessidade de solução hipertônica. B) \"Os níveis elevados de sódio e cortisol, junto com hipocalemia e hiperglicemia, indicam provável insuficiência adrenal aguda, devendo-se iniciar reposição imediata de corticoide.\" INCORRETA. A insuficiência adrenal cursa com hiponatremia, hipercalemia e hipoglicemia, não com os achados apresentados. Neste caso, os níveis elevados de cortisol são esperados na resposta ao estresse agudo. D) \"A leucocitose e o cortisol elevado indicam sepse precoce, sendo necessária antibioticoterapia empírica e internação em unidade de terapia intensiva.\" INCORRETA. Embora leucocitose possa ocorrer em sepse, neste caso ela é esperada como resposta inflamatória ao trauma. A ausência de febre, instabilidade hemodinâmica ou foco infeccioso afasta a necessidade de antibióticos neste momento."}, {"n": 52, "meta": "(2025.2) ROT.3-A-14T: Q.5", "stem": "Um paciente de 68 anos, com antecedente de diabetes tipo 2 e hipertensão, é internado em enfermaria cirúrgica após laparotomia de urgência por perfuração intestinal. No 2º dia de pós-operatório, apresenta glicemia capilar persistente em torno de 230 mg/dL, sem febre ou sinais de sepse. Está em dieta enteral com boa aceitação e se queixa de dor abdominal controlada parcialmente com dipirona. A equipe de enfermagem relata que o paciente está hipoativo e sonolento. Com base nos princípios da modulação da resposta endócrino-metabólica ao trauma, qual a conduta mais adequada neste momento?", "opts": {"A": "Suspender dieta enteral e iniciar nutrição parenteral, visto que a sonolência pode indicar intolerância à dieta.", "B": "Transferir o paciente para a UTI para sedação e controle glicêmico rigoroso com bomba de infusão, independentemente do quadro hemodinâmico.", "C": "Intensificar o controle glicêmico com insulina intravenosa, buscando metas glicêmicas entre 80-110 mg/dL, conforme protocolos de controle intensivo.", "D": "Otimizar o manejo da dor, reavaliar o controle glicêmico com o objetivo de manter a glicemia entre 140–180 mg/dL e evitar hiperalimentação."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "D", "medical": "D", "comment": "A resposta ao trauma envolve hiperglicemia induzida por resistência insulínica e hipercortisolismo. O controle glicêmico visa reduzir complicações, mas metas entre 140–180 mg/dL são hoje consideradas seguras e eficazes em ambiente hospitalar (evitando hipoglicemias associadas ao controle intensivo). Nutrição enteral deve ser mantida se bem tolerada — sua interrupção precoce piora o estado catabólico e aumenta o risco de infecção. CORRETA. \"Otimizar o manejo da dor e reavaliar o controle glicêmico com o objetivo de manter glicemia entre 140–180 mg/dL e evitar hiperalimentação.\" Analgesia inadequada aumenta a resposta neuroendócrina e contribui para hiperglicemia, imobilidade e pior desfecho. A hiperalimentação aumenta o risco de complicações infecciosas e hiperglicemia grave. O paciente está hemodinamicamente estável, sem sinais de choque ou sepse. Transferência para UTI e sedação não têm justificativa."}, {"n": 53, "meta": "(2025.2) ROT.3-A-14T: Q.30", "stem": "Um paciente masculino, 25 anos, previamente saudável, sofre acidente automobilístico grave, resultando em fratura de fêmur e trauma abdominal com necessidade de laparotomia exploradora. Algumas horas após o evento, apresenta pressão arterial limítrofe, taquicardia, palidez cutânea e glicemia de 175 mg/dL. Seu estado geral é estável após estabilização volêmica, porém encontra-se em jejum absoluto, com cateter venoso central e monitorização intensiva. Com base no quadro acima e considerando a resposta endócrino-metabólica aguda ao trauma, assinale a alternativa correta:", "opts": {"A": "A produção de hormônio antidiurético (ADH) está reduzida, resultando em maior eliminação urinária e tendência a hipovolemia.", "B": "O aumento dos níveis de cortisol, glucagon e catecolaminas contribui para hiperglicemia e mobilização de substratos energéticos.", "C": "Os hormônios tireoidianos T3 e T4 aumentam acentuadamente na fase inicial do trauma, elevando o consumo de oxigênio tecidual.", "D": "A secreção de insulina está aumentada nesse momento, favorecendo o anabolismo proteico e o armazenamento de glicose nos músculos."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "B", "medical": "B", "comment": "A) \"A produção de hormônio antidiurético (ADH) está reduzida, resultando em maior eliminação urinária e tendência a hipovolemia.\" INCORRETA. ADH se eleva para preservar água e manter o volume circulante. B) \"O aumento dos níveis de cortisol, glucagon e catecolaminas contribui para hiperglicemia e mobilização de substratos energéticos.\" CORRETA. Cortisol, glucagon e catecolaminas aumentam, promovendo resposta hiperglicemiante e catabólica, essenciais na fase aguda do trauma. C) \"Os hormônios tireoidianos T3 e T4 aumentam acentuadamente na fase inicial do trauma, elevando o consumo de oxigênio tecidual.\" INCORRETA. Não há elevação abrupta de T3 e T4; frequentemente ocorre redução transitória (\"síndrome do eutireóideo doente\"). D) \"A secreção de insulina está aumentada nesse momento, favorecendo o anabolismo proteico e o armazenamento de glicose nos músculos.\" INCORRETA. Há resistência periférica à insulina e diminuição relativa de sua ação/nível; predomina estado catabólico."}, {"n": 54, "meta": "(2026.1) ROT.1-A: Q.22", "stem": "Paciente de 48 anos encontra-se internado em UTI após cirurgia de grande porte por trauma abdominal complexo. Nas primeiras 72 horas pós-operatórias, apresenta hiperglicemia persistente (glicemias entre 250-320 mg/dL), balanço nitrogenado negativo, aumento da mobilização de ácidos graxos livres e elevação do gasto energético basal estimado por calorimetria indireta. Não há sinais de infecção ativa ou novo sangramento. Com base nos achados clínicos apresentados e na resposta endócrino- metabólica ao trauma pós-trauma, qual conjunto hormonal explica de forma mais adequada essas alterações metabólicas?", "opts": {"A": "Liberação aumentada de tiroxina e insulina, favorecendo armazenamento energético e redução do metabolismo basal.", "B": "Aumento de catecolaminas, cortisol e glucagon, estimulando gliconeogênese, proteólise muscular e lipólise.", "C": "Predomínio de insulina e hormônio do crescimento, promovendo síntese proteica e redução da mobilização lipídica.", "D": "Elevação predominante de aldosterona e vasopressina, responsáveis pelo aumento do gasto energético e do catabolismo proteico."}, "topic": "Resposta endócrino metabólica ao trauma", "official": "B", "medical": "B", "comment": "B) \"Aumento de catecolaminas, cortisol e glucagon, estimulando gliconeogênese, proteólise muscular e lipólise.\" CORRETA. A fase hipercatabólica (\"flow\") da resposta ao trauma é caracterizada por ativação do sistema nervoso simpático e do eixo hipotálamo-hipófise-adrenal, com aumento de catecolaminas, cortisol e glucagon. Esses hormônios promovem gliconeogênese hepática, resistência insulínica, proteólise muscular e lipólise, explicando a hiperglicemia persistente, o balanço nitrogenado negativo e o aumento da mobilização de ácidos graxos livres descritos no caso. C) \"Predomínio de insulina e hormônio do crescimento, promovendo síntese proteica e redução da mobilização lipídica.\" INCORRETA. Embora o hormônio do crescimento possa estar elevado na resposta ao trauma, há resistência periférica à insulina e predomínio de estado catabólico, não anabólico. Os achados de balanço nitrogenado negativo e mobilização de ácidos graxos livres são incompatíveis com síntese proteica predominante ou redução da lipólise. D) \"Elevação predominante de aldosterona e vasopressina, responsáveis pelo aumento do gasto energético e do catabolismo proteico.\" INCORRETA. Aldosterona e vasopressina participam da resposta ao estresse principalmente por meio da regulação hidroeletrolítica e manutenção da pressão arterial. Não são os principais mediadores do aumento do gasto energético nem do estado hipercatabólico observado na fase tardia pós- trauma. A) \"Liberação aumentada de tiroxina e insulina, favorecendo armazenamento energético e redução do metabolismo basal.\" INCORRETA. A resposta ao trauma não favorece armazenamento energético nem redução do metabolismo basal. Ao contrário, ocorre aumento do gasto energético e mobilização de substratos. A insulina não predomina funcionalmente, havendo resistência insulínica significativa."}, {"n": 55, "meta": "(2026.1) ROT.1-A: Q.23", "stem": "Durante laparotomia exploradora por trauma abdominal fechado de alta energia, um paciente previamente hígido evolui, nas primeiras horas pós- operatórias, com frequência cardíaca de 122 bpm, pressão arterial média de 70 mmHg sob suporte volêmico adequado, glicemia de 298 mg/dL, aumento do consumo de oxigênio estimado por monitorização metabólica indireta e balanço nitrogenado negativo nas primeiras 48 horas. Não há evidências de infecção ou novo sangramento ativo. A equipe considera que essas alterações refletem a resposta endócrino- metabólica sistêmica ao trauma. Com base nos dados clínicos apresentados e na fisiopatologia da resposta ao trauma grave, qual mecanismo explica de forma mais adequada as alterações observadas nesse paciente?", "opts": {"A": "Redução da atividade simpática com supressão do eixo hipotálamo- hipófise-adrenal, resultando em hipometabolismo e menor mobilização de substratos energéticos.", "B": "Ativação do sistema nervoso simpático e do eixo hipotálamo-hipófise- adrenal, promovendo hiperglicemia, aumento do catabolismo proteico e elevação do gasto energético proporcional à gravidade da injúria.", "C": "Resposta metabólica modulada principalmente por variabilidade individual, apresentando correlação limitada com a extensão da injúria.", "D": "Aumento da secreção de glucagon com predominância de anabolismo proteico e preservação da massa muscular como resposta metabólica adaptativa. CUIDADOS PRÉ-OPERATÓRIOS; RISCO CUIDADOS PRÉ-OPERATÓRIOS; RISCO CUIDADOS PRÉ-OPERATÓRIOS; RISCO CIRÚRGICO (ASA - GOLDMAN) CIRÚRGICO (ASA - GOLDMAN) CIRÚRGICO (ASA - GOLDMAN)"}, "topic": "Resposta endócrino metabólica ao trauma", "official": "B", "medical": "B", "comment": "B) \"Ativação do sistema nervoso simpático e do eixo hipotálamo-hipófise- adrenal, promovendo hiperglicemia, aumento do catabolismo proteico e elevação do gasto energético proporcional à gravidade da injúria.\" CORRETA. A combinação de taquicardia, hiperglicemia, aumento do gasto energético e balanço nitrogenado negativo caracteriza a fase hipercatabólica (\"flow\") da resposta ao trauma. Essa resposta é mediada por ativação do sistema nervoso simpático e do eixo hipotálamo-hipófise-adrenal, com aumento de catecolaminas, cortisol e glucagon. Esses hormônios promovem gliconeogênese, resistência insulínica, proteólise muscular e elevação do metabolismo basal. A intensidade dessas alterações é proporcional à magnitude da injúria. A) \"Redução da atividade simpática com supressão do eixo hipotálamo- hipófise-adrenal, resultando em hipometabolismo e menor mobilização de substratos energéticos.\" INCORRETA. O paciente apresenta taquicardia, hiperglicemia, aumento do consumo de oxigênio e balanço nitrogenado negativo, achados compatíveis com ativação neuroendócrina e estado hipercatabólico. A resposta ao trauma envolve aumento da atividade simpática e do eixo hipotálamo-hipófise- adrenal, e não supressão. Portanto, não ocorre hipometabolismo, mas sim aumento do metabolismo basal e mobilização energética. D) \"Aumento da secreção de glucagon com predominância de anabolismo proteico e preservação da massa muscular como resposta metabólica adaptativa.\" INCORRETA. Embora haja aumento de glucagon na resposta ao trauma, o estado metabólico resultante é predominantemente catabólico, com aumento da proteólise muscular e balanço nitrogenado negativo. Não ocorre predominância de anabolismo proteico nem preservação da massa muscular, especialmente em traumas de grande porte. C) \"Resposta metabólica modulada principalmente por variabilidade individual, apresentando correlação limitada com a extensão da injúria.\" INCORRETA. Embora fatores individuais possam modular a resposta metabólica, há correlação direta entre a magnitude da injúria tecidual e a intensidade da resposta endócrino-metabólica. Traumas mais extensos desencadeiam maior liberação hormonal e resposta inflamatória sistêmica mais intensa."}, {"n": 56, "meta": "(2025.2) ROT.1-A-12T: Q.9", "stem": "Um homem de 68 anos, ex-tabagista (40 anos-maço), com diagnóstico de DPOC moderado e hipertensão arterial controlada, é avaliado em consulta pré- operatória ambulatorial para colecistectomia videolaparoscópica eletiva. Refere dispneia aos esforços habituais, mas sem ortopneia, dor torácica ou síncope. Está em uso regular de tiotrópio e losartana. Ao exame físico: • FC: 84 bpm | PA: 128/82 mmHg | SpO₂: 91% em ar ambiente • MV diminuído difusamente, sem ruídos adventícios. • ECG: ritmo sinusal, sem alterações isquêmicas ou de sobrecarga. • RX de tórax: hiperinsuflação pulmonar, sem sinais de congestão. Com base na avaliação clínica e nos achados complementares, qual das condutas abaixo é a mais adequada para garantir a segurança perioperatória?", "opts": {"A": "Encaminhar para avaliação cardiológica com teste ergométrico, devido à idade e ao histórico de hipertensão.", "B": "Adiar o procedimento e solicitar avaliação pneumológica, devido à dispneia e saturação borderline.", "C": "Indicar ecocardiograma e avaliação cardiológica, pois o paciente possui idade avançada e ECG normal não exclui isquemia.", "D": "Liberar o paciente para cirurgia, pois sua condição clínica é estável e a cirurgia é de baixo risco."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "B", "medical": "B", "comment": "A) \"Encaminhar para avaliação cardiológica com teste ergométrico, devido à idade e ao histórico de hipertensão.\" INCORRETA. A avaliação cardiológica pode ser necessária em outros contextos, mas não é prioritária aqui, pois o paciente não apresenta sintomas cardíacos ativos, nem risco cardiovascular elevado. A principal limitação está no sistema respiratório. B) \"Adiar o procedimento e solicitar avaliação pneumológica, devido à dispneia e saturação borderline.\" CORRETA. O paciente apresenta doença pulmonar com potencial risco perioperatório, manifestada por dispneia aos esforços habituais e saturação limítrofe, mesmo sem exacerbação aguda. A avaliação pneumológica especializada pode indicar ajustes terapêuticos, reabilitação pré-operatória ou até adiamento do procedimento, aumentando a segurança da intervenção. C) \"Indicar ecocardiograma e avaliação cardiológica, pois o paciente possui idade avançada e ECG normal não exclui isquemia.\" INCORRETA. Embora o ecocardiograma possa ser útil em outras situações, não há sinais clínicos ou laboratoriais que apontem para disfunção cardíaca neste caso. O foco deve ser a função pulmonar. D) \"Liberar o paciente para cirurgia, pois sua condição clínica é estável e a cirurgia é de baixo risco.\" INCORRETA. Apesar de a cirurgia ser de baixo risco cardiovascular, o paciente apresenta sinais de possível instabilidade clínica respiratória (dispneia habitual e saturação de 91%). Isso exige investigação adicional, especialmente em um ex-tabagista com DPOC."}, {"n": 57, "meta": "(2025.2) ROT.1-A-12T: Q.20", "stem": "Mulher, 52 anos, com obesidade grau III (IMC 42 kg/m²) e diabetes mellitus tipo 2, comparece à consulta pré-operatória para realização de gastroplastia videolaparoscópica. Refere uso regular de metformina 850 mg duas vezes ao dia. Exames laboratoriais e avaliação clínica pré-operatória não apresentam alterações, função renal preservada. A cirurgia está agendada para o dia seguinte. Considerando as recomendações para o preparo pré-operatório, qual das condutas abaixo é indicada?", "opts": {"A": "Substituir a metformina por insulina de ação rápida na véspera da cirurgia, mesmo sem descontrole glicêmico.", "B": "Suspender a metformina apenas se houver uso de contraste iodado durante o ato anestésico-cirúrgico.", "C": "Manter a metformina no dia da cirurgia para evitar hiperglicemia perioperatória e complicações cirúrgicas.", "D": "Suspender a metformina 24 horas antes da cirurgia devido ao risco de acidose lática em contexto de jejum e estresse metabólico."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "D", "medical": "D", "comment": "Em pacientes diabéticos submetidos a procedimentos de médio ou grande porte, como a gastroplastia, a metformina deve ser suspensa no dia da cirurgia. Essa medida tem como objetivo reduzir o risco, embora raro, de acidose lática, especialmente em cenários de jejum prolongado, desidratação, hipoperfusão tecidual e alterações transitórias da função renal, que são comuns no intra e no pós-operatório imediato. A manutenção da metformina nesse contexto pode comprometer a segurança metabólica do paciente, mesmo que a função renal esteja normal. Por isso, a suspensão da metformina 24 horas antes do dia do procedimento é uma conduta amplamente recomendada em protocolos de segurança perioperatória. Discussão das alternativas incorretas: • Apesar de ajudar no controle glicêmico, a metformina não deve ser mantida no dia de cirurgias maiores por risco metabólico em jejum prolongado. • A suspensão da metformina não depende exclusivamente do uso de contraste, mas sim do contexto clínico cirúrgico (estresse, jejum, risco de hipoperfusão renal). O raciocínio aqui está ultrapassado. • A troca por insulina de ação rápida não é necessária nem segura de forma rotineira, especialmente em pacientes compensados. Essa decisão deve ser individualizada e feita preferencialmente com suporte endocrinológico."}, {"n": 58, "meta": "(2025.2) ROT.2-A-14T: Q.3", "stem": "Mulher de 60 anos, diabética tipo 2, fará histerectomia eletiva. Está em uso de metformina e glibenclamida, com glicemia de jejum de 128 mg/dL. Qual a conduta correta quanto ao uso das medicações na véspera da cirurgia?", "opts": {"A": "Manter glibenclamida e suspender metformina.", "B": "Manter metformina e suspender glibenclamida.", "C": "Manter ambos e ajustar a dose de insulina no intraoperatório.", "D": "Suspender metformina e glibenclamida antes da cirurgia."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "D", "medical": "D", "comment": "Metformina deve ser suspensa 48 horas antes do procedimento, devido ao risco de acidose láctica. Glibenclamida, por ser uma sulfonilureia de longa duração, aumenta o risco de hipoglicemia prolongada, especialmente em períodos de jejum pré- operatório. Deve, portanto, ser suspensa na véspera da cirurgia. Manter ambas as medicações, como proposto em algumas alternativas, pode resultar em hipoglicemia grave ou distúrbios metabólicos durante o jejum e o estresse cirúrgico."}, {"n": 59, "meta": "(2025.2) ROT.2-A-14T: Q.18", "stem": "Durante a avaliação pré-operatória de um paciente de 72 anos, previamente hipertenso e diabético controlado com metformina, você é chamado para realizar a estratificação do risco cirúrgico antes de uma hernioplastia inguinal eletiva. O paciente refere episódios de dispneia aos esforços moderados (subir escadas) e dor torácica esporádica em situações de estresse emocional, sem histórico prévio de infarto. Ao exame, apresenta FC 88 bpm, PA 130 × 80 mmHg e crepitações finas em bases pulmonares. ECG mostra sobrecarga ventricular esquerda; ecocardiograma recente revela fração de ejeção de 55%, sem alterações valvares. Com base na avaliação clínica e nos sistemas de estratificação de risco ASA e Goldman, qual a conduta mais apropriada a ser adotada neste momento?", "opts": {"A": "Liberar o paciente para cirurgia com risco ASA III e sem necessidade de avaliação adicional, pois não há sintomas ativos graves.", "B": "Classificar o paciente como ASA III, por apresentar comorbidades controladas, e solicitar avaliação cardiológica, pois a dor torácica e a dispneia sugerem possível angina estável.", "C": "Classificar o paciente como ASA II e liberá-lo para cirurgia sem avaliação complementar, pois a fração de ejeção está preservada.", "D": "Adiar a cirurgia e solicitar cineangiocoronariografia, pois a dispneia indica insuficiência cardíaca grave."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "B", "medical": "B", "comment": "B) \"Classificar o paciente como ASA III, por apresentar comorbidades controladas, e solicitar avaliação cardiológica, pois a dor torácica e a dispneia sugerem possível angina estável.\" CORRETA. A presença de comorbidades controladas (HAS e DM), associada a sintomas sugestivos de doença cardiovascular (dispneia aos esforços e dor torácica), justifica a classificação ASA III. De acordo com o índice de Goldman, sintomas de angina e história cardiovascular aumentam o escore de risco, sendo prudente a avaliação cardiológica antes da cirurgia eletiva. A) \"Liberar o paciente para cirurgia com risco ASA III e sem necessidade de avaliação adicional, pois não há sintomas ativos graves.\" INCORRETA. O paciente tem sintomas sugestivos de angina estável (dispneia aos esforços + dor torácica episódica). Isso são sintomas ativos de doença cardíaca, mesmo que não instáveis. Logo, não se pode “liberar sem avaliação cardiológica”. D) \"Adiar a cirurgia e solicitar cineangiocoronariografia, pois a dispneia indica insuficiência cardíaca grave.\" INCORRETA. Não há indícios clínicos ou ecocardiográficos de insuficiência cardíaca grave. A cineangiocoronariografia só é indicada se houver critérios para coronariopatia significativa após avaliação funcional ou pelo cardiologista. C) \"Classificar o paciente como ASA II e liberá-lo para cirurgia sem avaliação complementar, pois a fração de ejeção está preservada.\" INCORRETA. ASA II é reservado para comorbidades leves e assintomáticas. A presença de sintomas como dispneia e dor torácica eleva a classificação para ASA III."}, {"n": 60, "meta": "(2025.2) ROT.3-A-14T: Q.12", "stem": "Durante avaliação pré-operatória de um paciente de 67 anos, agendada para hernioplastia inguinal direita eletiva, a equipe identifica história de diabetes mellitus tipo 2 mal controlado (HbA1c: 9,1%) e doença pulmonar obstrutiva crônica (DPOC) moderada, em uso irregular de broncodilatadores. O paciente refere dispneia aos pequenos esforços, mas sem exacerbações nos últimos meses. Está hemodinamicamente estável e refere ter tido episódios anteriores de dor na região inguinal direita. Considerando a necessidade de otimização pré-operatória e a estratificação de risco cirúrgico, qual a conduta mais apropriada neste momento?", "opts": {"A": "Realizar apenas o escore de risco cardíaco Goldman e, se estiver abaixo de 7 pontos, autorizar a cirurgia com monitoramento no intraoperatório.", "B": "Suspender temporariamente o procedimento, fazer controle glicêmico e otimização da função pulmonar, reavaliando o paciente em poucas semanas.", "C": "Prosseguir com a cirurgia agendada, pois se trata de procedimento de baixo risco e a idade avançada não é contraindicação absoluta.", "D": "Contraindicar a cirurgia por tempo indeterminado, encaminhando o paciente para pneumologista e endocrinologista."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "B", "medical": "B", "comment": "A presença de comorbidades descompensadas, como DPOC e DM não controlado, aumenta significativamente o risco de complicações, mesmo em cirurgias de baixo porte. Encaminhamento para especialistas é importante, mas não deve contraindicar a cirurgia. A otimização pode ser conduzida inicialmente pela equipe clínica e depois encaminhada para a equipe clínica. A conduta mais segura é adiar temporariamente a cirurgia, otimizar a condição clínica (controle glicêmico e função pulmonar) e reavaliar em curto prazo, já que foi sintomático e apresenta riscos de complicações futuras. O escore de Goldman avalia risco cardíaco, mas não substitui a avaliação global e otimização clínica prévia, especialmente em casos de DPOC e diabetes descompensado."}, {"n": 61, "meta": "(2025.2) ROT.3-A-14T: Q.24", "stem": "Homem, 74 anos, hipertenso, diabético tipo 2, com infarto agudo do miocárdio há 2 anos e disfunção renal crônica estágio 3 (TFG: 48 mL/min/1,73m²), comparece para avaliação ambulatorial pré-operatória, pois será submetido a colectomia eletiva por neoplasia de cólon. Encontra-se assintomático, ativo fisicamente e sem queixas cardiovasculares. ECG atual com ritmo sinusal, sem alterações e ecocardiograma (6 meses) com fração de ejeção de 58%. Está em uso regular de losartana, metformina e sinvastatina. Com base nas diretrizes atuais do ACC/AHA e nos protocolos de risco perioperatório, avalie e identifique qual é a conduta mais apropriada neste caso:", "opts": {"A": "Requisitar cintilografia de perfusão miocárdica com estresse farmacológico, pois todo paciente com infarto prévio deve ser avaliado com teste funcional antes de cirurgia abdominal.", "B": "Aplicar o índice de risco cardíaco revisado (RCRI) e, em caso de baixa capacidade funcional ou escore ≥ 2, considerar avaliação cardiológica complementar individualizada.", "C": "Solicitar teste de esforço com avaliação de escore de Duke, independentemente da presença de sintomas, visando quantificar a reserva funcional antes do ato operatório.", "D": "Adiar o procedimento eletivo e encaminhar o paciente para cineangiocoronariografia com o objetivo de excluir lesões coronarianas residuais prévias à cirurgia."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "B", "medical": "B", "comment": "Resposta correta: A colectomia é considerada uma cirurgia de risco cardiovascular intermediário. O paciente apresenta fatores de risco (IAM prévio, DM, DRC), mas está assintomático, com boa capacidade funcional estimada (≥ 4 METs). Segundo as diretrizes ACC/AHA, em pacientes estáveis e assintomáticos, a estratificação com o RCRI é recomendada: se o escore for baixo (0–1), o procedimento pode prosseguir com monitorização padrão. Se ≥ 2 e/ou baixa capacidade funcional (< 4 METs), considerar avaliação cardiológica direcionada. Não há benefício comprovado em solicitar testes funcionais ou invasivos de rotina em pacientes assintomáticos com capacidade funcional preservada. Respostas incorretas: Cineangiocoronariografia não é indicada de forma rotineira para pacientes assintomáticos. Procedimento invasivo, com riscos e sem impacto comprovado em desfechos cirúrgic
