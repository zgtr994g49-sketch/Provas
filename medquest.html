os neste contexto. Teste ergométrico sem sintomas e com capacidade funcional preservada não altera conduta. Além disso, o escore de Duke é usado para estratificação de coronariopatia estável, e não para pré-operatório de cirurgia não cardíaca em pacientes assintomáticos. A cintilografia com estresse farmacológico é indicada apenas se o paciente for sintomático ou incapaz de realizar atividade ≥ 4 METs, o que não se aplica aqui. Infarto prévio isolado, em paciente estável, não exige novo teste funcional se clínica estiver compensada."}, {"n": 62, "meta": "(2025.1) ROT.2-B-14T: Q.27", "stem": "Um paciente de 72 anos, com insuficiência renal crônica (clearance de creatinina de 25 mL/min), hipertensão arterial sistêmica em uso de anlodipino e diabetes mellitus tipo 2 em uso regular de metformina, será submetido a colecistectomia videolaparoscópica eletiva. Em relação ao manejo medicamentoso perioperatório, qual das condutas abaixo está mais adequada?", "opts": {"A": "Suspender o anlodipino e a metformina 24 horas antes do procedimento e administrar antibiótico de amplo espectro apenas se houver sinais de infecção ativa.", "B": "Substituir a metformina por insulina NPH na véspera da cirurgia, manter o anlodipino e administrar a metade da dose do antibiótico profilático por causa da insuficiência renal.", "C": "Manter todos os medicamentos até o dia da cirurgia e administrar antibiótico profilático imediatamente após a indução anestésica, ajustando a dose pela idade.", "D": "Manter o anlodipino, suspender a metformina 24 a 48 horas antes da cirurgia e administrar a dose padrão do antibiótico até 60 minutos antes da incisão."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "D", "medical": "D", "comment": "Correta: Manter o anlodipino, suspender a metformina 24 a 48 horas antes da cirurgia e administrar a dose padrão do antibiótico até 60 minutos antes da incisão. A Anlodipino deve ser mantido. A Metformina deve ser suspensa 24–48h antes devido ao risco de acidose láctica em pacientes com insuficiência renal. Antibiótico profilático (ex: cefazolina) deve ser administrado na dose padrão até 60 minutos antes da incisão. Incorretas: Manter todos os medicamentos até o dia da cirurgia e administrar antibiótico profilático imediatamente após a indução anestésica, ajustando a dose pela idade. Metformina não pode ser mantida; risco de acidose lática. Antibiótico não deve ser administrado após a indução, mas antes da incisão. Ajuste de dose pela idade isoladamente é inadequado. Suspender o anlodipino e a metformina 24 horas antes do procedimento e administrar antibiótico de amplo espectro apenas se houver sinais de infecção ativa. Anlodipino não deve ser suspenso; é seguro no perioperatório. Antibiótico profilático é obrigatório, mesmo sem infecção ativa. Substituir a metformina por insulina NPH na véspera da cirurgia, manter o anlodipino e administrar a metade da dose do antibiótico profilático por causa da insuficiência renal. Substituir metformina por insulina não é conduta padrão de rotina. Reduzir a dose do antibiótico compromete a eficácia; a profilaxia é feita com dose plena, mesmo em IR moderada."}, {"n": 63, "meta": "(2026.1) ROT.1-A: Q.7", "stem": "Uma mulher de 71 anos será submetida a cirurgia abdominal eletiva por obstrução intestinal parcial secundária a aderências. Possui histórico de infarto há 10 meses e refere episódios recentes de dispneia aos esforços leves. No exame físico, apresenta terceira bulha audível e estertores bibasais discretos. Frequência cardíaca 104 bpm e pressão arterial 128/76 mmHg. Qual achado clínico representa maior impacto na elevação do risco cardiovascular segundo critérios clássicos como os de Goldman?", "opts": {"A": "História de infarto remoto sem repercussão atual no exame físico.", "B": "Presença de quadro abdominal obstrutivo como fator determinante cardíaco.", "C": "Sinais clínicos sugestivos de insuficiência cardíaca congestiva.", "D": "Taquicardia isolada como único marcador de risco cirúrgico."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "C", "medical": "C", "comment": "Alternativa correta: Critérios como Goldman atribuem grande peso à presença de sinais de insuficiência cardíaca, pois representam risco aumentado de complicações cardiovasculares no perioperatório, especialmente em cirurgias de maior porte. Alternativa incorreta: A taquicardia isolada não é considerada, nos critérios clássicos de Goldman, como fator de maior impacto para risco cardiovascular perioperatório. Justificativa: Embora a frequência cardíaca elevada possa indicar estresse ou descompensação, ela não tem o mesmo peso prognóstico que achados como insuficiência cardíaca clínica ou infarto recente. Alternativa incorreta: O quadro abdominal obstrutivo é o motivo da cirurgia, mas não é um fator de risco cardiovascular direto. Justificativa: Os critérios de Goldman avaliam risco cardíaco com base em achados clínicos e antecedentes cardiovasculares, não na doença abdominal em si. O obstrutivo pode aumentar o risco cirúrgico geral, mas não é marcador específico de risco cardíaco. Alternativa incorreta: O paciente teve infarto há 10 meses, o que já é relevante, mas a questão destaca que há sinais clínicos atuais de insuficiência cardíaca (dispneia aos esforços leves, terceira bulha, estertores bibasais). Justificativa: O infarto remoto sem repercussão atual teria menor impacto isolado. O que realmente eleva o risco cardiovascular é a insuficiência cardíaca clínica ativa, que nos critérios de Goldman é um dos fatores mais importantes."}, {"n": 64, "meta": "(2026.1) ROT.1-A: Q.10", "stem": "Homem de 68 anos, ex-tabagista (40 maços/ano), com diagnóstico prévio de DPOC moderada e diabetes mellitus tipo 2, será submetido a colectomia eletiva por adenocarcinoma de cólon. Nas últimas 3 semanas, refere aumento progressivo da dispneia aos esforços habituais e aumento do volume de escarro, sem febre. Utiliza apenas broncodilatador de curta ação sob demanda. Saturação em repouso 92% em ar ambiente. Ausculta com sibilos difusos. Hemoglobina glicada 9,4%, com glicemias capilares frequentemente acima de 250 mg/dL. A cirurgia está programada para 10 dias. Considerando as diretrizes atuais para otimização pré-operatória, qual é a conduta mais apropriada neste momento?", "opts": {"A": "Iniciar antibioticoterapia empírica para exacerbação infecciosa presumida e manter data cirúrgica, associando insulinoterapia apenas no intraoperatório.", "B": "Manter cronograma cirúrgico, introduzir broncodilatador de longa ação e intensificar controle glicêmico apenas no período perioperatório imediato.", "C": "Postergar temporariamente o procedimento para otimização clínica, com início de terapia inalatória de manutenção adequada, reabilitação respiratória e ajuste do controle glicêmico antes da cirurgia.", "D": "Solicitar teste cardiopulmonar de exercício e gasometria arterial como critério decisório primário antes de qualquer ajuste terapêutico."}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "C", "medical": "C", "comment": "Alternativa correta: Postergar cirurgia eletiva para otimização clínica reduz complicações pulmonares e infecciosas. O paciente apresenta DPOC sintomática sem terapia de manutenção adequada e diabetes descompensado (HbA1c 9,4%). Diretrizes nacionais e internacionais recomendam otimização antes de procedimento eletivo. Alternativas incorretas: Introduzir tratamento é adequado, porém manter cronograma cirúrgico sem tempo para estabilização clínica aumenta risco. Controle glicêmico apenas perioperatório não corrige descompensação crônica. Antibioticoterapia empírica não está indicada na ausência de critérios clínicos de exacerbação infecciosa (como escarro purulento). Além disso, insulinoterapia apenas intraoperatória é insuficiente para controle metabólico adequado. Exames avançados não substituem otimização clínica básica. A prioridade é ajustar o tratamento da DPOC e do diabetes antes da investigação complementar."}, {"n": 65, "meta": "(2026.1) ROT.1-A: Q.19", "stem": "Uma mulher de 68 anos será submetida a colectomia direita eletiva por adenocarcinoma de cólon. É portadora de hipertensão arterial, diabetes mellitus tipo 2 e doença renal crônica estágio 3b. Encontra-se clinicamente estável, sem dor torácica ou dispneia. Durante a avaliação pré-operatória, apresenta os seguintes resultados: • Potássio sérico: 6,0 mEq/L. • Creatinina: 2,4 mg/dL (basal 2,2 mg/dL). • Bicarbonato: 18 mEq/L. • Hemoglobina: 10,2 g/dL. O eletrocardiograma mostra redução da amplitude da onda P, ondas T altas e simétricas em múltiplas derivações e discreto alargamento do QRS. Considerando a segurança anestésica e a priorização de condutas no preparo cirúrgico, qual achado exige correção imediata antes da realização do procedimento cirúrgico?", "opts": {"A": "Anemia moderada relacionada à doença crônica e neoplasia.", "B": "Hipercalemia com alterações no eletrocardiograma.", "C": "Acidose metabólica compensada no contexto de doença renal crônica.", "D": "Progressão discreta da disfunção renal em relação ao valor basal. AFECÇÕES HEPÁTICAS: AFECÇÕES HEPÁTICAS: AFECÇÕES HEPÁTICAS: DIAGNÓSTICO/TRATAMENTO/COMPLICAÇÕES DIAGNÓSTICO/TRATAMENTO/COMPLICAÇÕES DIAGNÓSTICO/TRATAMENTO/COMPLICAÇÕES (HIPERTENSÃO PORTAL; NÓDULOS E (HIPERTENSÃO PORTAL; NÓDULOS E (HIPERTENSÃO PORTAL; NÓDULOS E ABSCESSOS HEPÁTICOS) ABSCESSOS HEPÁTICOS) ABSCESSOS HEPÁTICOS)"}, "topic": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "official": "B", "medical": "B", "comment": "Alternativa correta: Quando o distúrbio do potássio se manifesta com alterações na condução e repolarização cardíaca, o risco de arritmias malignas aumenta de forma significativa, especialmente durante anestesia e manipulação cirúrgica. Mesmo na ausência de sintomas, essa condição exige correção imediata antes da realização do procedimento. Alternativas incorretas: Embora a paciente apresente hemoglobina de 10,2 g/dL, a anemia moderada não é o achado de maior impacto imediato para segurança anestésica. A anemia pode aumentar o risco perioperatório, mas não representa urgência clínica comparável à hipercalemia grave com alterações eletrocardiográficas, que pode levar a arritmias fatais. O bicarbonato de 18 mEq/L indica acidose metabólica leve a moderada, mas em paciente com doença renal crônica isso é esperado e não configura urgência absoluta. A acidose deve ser corrigida e otimizada antes da cirurgia, mas não é o achado que exige intervenção imediata. O risco maior está na instabilidade elétrica cardíaca causada pelo potássio elevado. A creatinina de 2,4 mg/dL em relação ao basal de 2,2 mg/dL mostra apenas discreta piora da função renal. Essa alteração não representa risco imediato para o procedimento. O achado mais crítico é a hipercalemia com repercussão eletrocardiográfica, que pode precipitar arritmias graves."}, {"n": 66, "meta": "(2025.2) ROT.1-A-12T: Q.2", "stem": "Um homem de 54 anos, com histórico de cirrose alcoólica, chega ao pronto- socorro com hematêmese volumosa iniciada há 2 horas. A suspeita é de hemorragia varicosa. Está taquicárdico e apresenta pressão arterial limítrofe. Foi iniciado suporte com cristaloides e coletadas amostras para exames laboratoriais. Após estabilização hemodinâmica inicial, a equipe médica discute as próximas condutas terapêuticas. Qual ação mais adequada deve ser considerada nesse momento, visando reduzir o risco de ressangramento e melhorar a sobrevida hospitalar?", "opts": {"A": "Uso precoce de agentes vasoativos específicos e indicação de endoscopia digestiva alta nas primeiras 12 horas.", "B": "Administração de vasodilatadores esplâncnicos e transfusão liberal visando hemoglobina ≥ 13 g/dL.", "C": "Início de inibidores de bomba de prótons em altas doses como medida prioritária, associado a endoscopia em 48 horas.", "D": "Lavagem gástrica seguida de cirurgia eletiva para derivação portossistêmica."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "A", "medical": "A", "comment": "Alternativa correta: Em pacientes com suspeita de sangramento por varizes esofágicas, o uso precoce de agentes vasoativos — como terlipressina ou octreotida — é essencial para reduzir o fluxo portal e controlar o sangramento. A endoscopia digestiva alta deve ser realizada o quanto antes, idealmente nas primeiras 12 horas, após estabilização inicial, para diagnóstico e tratamento endoscópico das varizes. Esta abordagem reduz o ressangramento e melhora a sobrevida. Já o uso isolado de IBP, transfusão liberal ou adiamento da endoscopia não são estratégias adequadas neste contexto. Comentários sobre as incorretas: IBPs em altas doses são indicados para sangramentos não varicosos (ex.: úlceras pépticas). O intervalo de 48h para endoscopia é muito longo e contraindicado em sangramento agudo. Lavagem gástrica perdeu papel atual e cirurgia de derivação portossistêmica (como TIPS) não é de primeira linha — só indicada se falha do tratamento clínico/endoscópico. Transfusão liberal (alvo Hb ≥ 13 g/dL) está contraindicada — pode aumentar a pressão portal e piorar o sangramento. O alvo em sangramento varicoso é Hb entre 7-8 g/dL. Vasodilatadores esplâncnicos (como nitratos) não são indicados nesse contexto."}, {"n": 67, "meta": "(2025.2) ROT.1-A-12T: Q.21", "stem": "Durante check-up de rotina, uma mulher de 38 anos, sem comorbidades, realiza uma ultrassonografia abdominal que identifica uma lesão hepática única, bem delimitada, com ecogenicidade homogênea e presença de uma cicatriz central. A paciente é assintomática e os exames laboratoriais hepáticos são normais. A tomografia computadorizada trifásica mostra captação arterial intensa com lavagem centrípeta e cicatriz central hipodensa. Com base nos achados de imagem, qual é o diagnóstico mais provável?", "opts": {"A": "Hemangioma hepático.", "B": "Carcinoma hepatocelular (CHC).", "C": "Adenoma hepático.", "D": "Hiperplasia nodular focal (HNF)."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "D", "medical": "D", "comment": "Hiperplasia nodular focal (HNF). A HNF é uma lesão benigna hepática geralmente assintomática, mais comum em mulheres jovens, que apresenta realce arterial intenso com cicatriz central hipodensa na tomografia e hipointensa na ressonância magnética. A cicatriz central é o achado mais característico. Análise das alternativas incorretas: Hemangioma hepático: embora também seja uma lesão benigna comum, o hemangioma apresenta captação periférica nodular na fase arterial com preenchimento progressivo (centrípeto) nas fases subsequentes — não costuma ter cicatriz central. Adenoma hepático: ocorre mais em mulheres jovens, especialmente em uso de anticoncepcionais, mas não apresenta cicatriz central. Na imagem, pode mostrar realce arterial precoce, porém com padrão mais heterogêneo. Tem risco de sangramento e transformação maligna. Carcinoma hepatocelular (CHC): geralmente ocorre em fígado com doença de base (cirrose, hepatite B/C). Na imagem, apresenta realce arterial precoce com washout rápido na fase portal ou tardia, e não apresenta cicatriz central típica. Está ausente neste caso qualquer sinal clínico ou laboratorial de doença hepática crônica."}, {"n": 68, "meta": "(2025.2) ROT.1-A-12T: Q.29", "stem": "Paciente do sexo feminino, 34 anos, sem comorbidades conhecidas, não tabagista, apresenta um achado incidental em ultrassonografia abdominal: nódulo hepático solitário de 4 cm, bem delimitado, localizado no lobo direito, com ecogenicidade homogênea. Não refere sintomas clínicos significativos. Na avaliação complementar com ressonância magnética (RM), observa-se lesão com características hipervascularizadas na fase arterial e preenchimento completo na fase portal, sem invasão de estruturas vizinhas. Durante a consulta, ela relata o uso de anticoncepcional oral há mais de 7 anos. Considerando as características clínicas, radiológicas e epidemiológicas relatadas, avalie o diagnóstico mais provável para esse nódulo hepático:", "opts": {"A": "Metástase hepática.", "B": "Hemangioma hepático.", "C": "Carcinoma hepatocelular.", "D": "Adenoma hepático."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "D", "medical": "D", "comment": "A) \"Metástase hepática.\" INCORRETA. As metástases hepáticas geralmente se apresentam como múltiplas lesões, e não como um nódulo solitário. Além disso, a hipervascularização na fase arterial não é típica das metástases, que costumam ser hipovasculares nas fases iniciais. B) \"Hemangioma hepático.\" INCORRETA. O hemangioma é o tumor hepático benigno mais comum, mas geralmente apresenta hipervascularização com preenchimento progressivo nas fases mais tardias (fase portal), e não na fase arterial como descrito. C) \"Carcinoma hepatocelular.\" INCORRETA. O carcinoma hepatocelular costuma ocorrer em fígado com doença de base (hepatite viral ou cirrose) e apresenta invasão de estruturas vizinhas ou padrão de washout, ausentes no caso. D) \"Adenoma hepático.\" CORRETA. O diagnóstico mais provável é o de adenoma hepático, neoplasia benigna frequentemente associada ao uso de anticoncepcionais orais. É caracterizado por nódulo solitário bem delimitado e, na RM, hipervascularização na fase arterial com preenchimento completo na fase portal, sem invasão de estruturas vizinhas."}, {"n": 69, "meta": "(2025.2) ROT.2-A-14T: Q.11", "stem": "Um homem de 58 anos com história de etilismo crônico e relatos de episódios prévios de hematêmese apresenta ascite e esplenomegalia. Durante a avaliação clínica, observa-se importante dilatação de veias colaterais abdominais. Qual das condutas abaixo é mais adequada na abordagem inicial deste paciente?", "opts": {"A": "Realizar esplenectomia imediata.", "B": "Encaminhar para transplante hepático urgente.", "C": "Iniciar propranolol e realizar endoscopia digestiva alta.", "D": "Iniciar furosemida e espironolactona."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "C", "medical": "C", "comment": "A) \"Realizar esplenectomia imediata.\" INCORRETA. A esplenectomia não é a conduta inicial para hipertensão portal e risco de sangramento varicoso. Seu uso é restrito a situações específicas, como hiperesplenismo grave refratário a tratamento clínico, e não é indicado na fase inicial, especialmente em pacientes com doença hepática avançada, pois não previne o sangramento de varizes esofagogástricas. C) \"Iniciar propranolol e realizar endoscopia digestiva alta.\" CORRETA. O propranolol (ou nadolol) é um betabloqueador não seletivo indicado para profilaxia primária em pacientes com varizes de risco ou profilaxia secundária em pacientes que já tiveram sangramento. A endoscopia digestiva alta é fundamental para confirmar a presença e o grau das varizes, além de permitir a realização de ligadura elástica, se necessário. Essa associação é a conduta inicial mais recomendada em casos de hipertensão portal com risco de sangramento. D) \"Iniciar furosemida e espironolactona.\" INCORRETA. Esses diuréticos são usados no manejo da ascite associada à hipertensão portal, mas não previnem ou tratam diretamente o sangramento de varizes. Portanto, são importantes no controle de complicações, mas não substituem o betabloqueio e a endoscopia. B) \"Encaminhar para transplante hepático urgente.\" INCORRETA. O transplante hepático pode ser indicado em doença hepática terminal, mas não é a primeira conduta frente ao risco imediato de sangramento varicoso. O paciente deve ser tratado clinicamente e estabilizado antes de uma avaliação definitiva para transplante, se houver indicação."}, {"n": 70, "meta": "(2025.2) ROT.2-A-14T: Q.13", "stem": "Homem, 45 anos, previamente hígido, apresenta quadro de febre alta (39 °C), calafrios, dor no hipocôndrio direito e sudorese noturna há 10 dias. Refere perda de peso (5 kg em duas semanas) e astenia. Ao exame físico, está ictérico, com hepatomegalia dolorosa e sem sinais de peritonismo. Laboratorialmente, apresenta: leucocitose com desvio à esquerda; elevação moderada de transaminases (AST: 115 U/L; ALT: 97 U/L); fosfatase alcalina (FA: 840 U/L); gama GT: 900 U/L; bilirrubina total 3,9 mg/dL; fração direta 2,7 mg/dL; sorologia para HIV negativa; hemoculturas repetidamente negativas; pesquisa de ovos e parasitas nas fezes negativa. Tomografia de abdome identifica lesão única, cavitada, de 7 cm no segmento VIII hepático, com conteúdo líquido espesso. Considerando os achados clínicos e nos exames complementares, qual o diagnóstico mais provável?", "opts": {"A": "Abscesso hepático fúngico.", "B": "Abscesso hepático amebiano.", "C": "Neoplasia hepática com necrose central infectada.", "D": "Abscesso hepático piógeno de origem biliar."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "D", "medical": "D", "comment": "Embora abscesso amebiano possa se apresentar como lesão única e grande, costuma ter icterícia discreta e menor elevação de fosfatase alcalina. Também é mais comum em regiões endêmicas e em indivíduos com fatores epidemiológicos específicos, ausentes no caso. Leucocitose importante com muita colestase e ausência de amebíase intestinal ativa apontam para outra etiologia. O abscesso piógeno é o diagnóstico mais provável frente à icterícia marcada, importante elevação de fosfatase alcalina e bilirrubina direta, leucocitose e desvio à esquerda. A lesão única e cavitada reforça, e a origem biliar é clássica nesses casos (mesmo sem colangite manifesta, pequenas litíases ou disfunções biliares podem ocorrer). Muito mais frequente em pacientes imunossuprimidos, especialmente neutropênicos, transplantados ou sob uso intenso de antibióticos. O paciente não tem imunodeficiência nem história compatível. Embora lesões neoplásicas hepáticas possam sofrer infecção secundária, o quadro agudo com febre alta, intensa reação inflamatória e ausência de sintomas prévios ou fatores de risco para tumor favorecem abscesso piógeno."}, {"n": 71, "meta": "(2025.2) ROT.3-A-14T: Q.16", "stem": "Paciente de 42 anos, previamente hígido, apresenta febre alta há 7 dias, dor em hipocôndrio direito (HD) e calafrios. Ao exame, encontra-se ictérico, febril (39 °C), com dor à palpação do HD e sinal de Murphy negativo. Leucocograma: 18.700/mm³ com desvio à esquerda. USG mostra imagem hipoecoica em lobo hepático direito medindo 6,8 cm. Tomografia computadorizada (TC) de abdome confirma coleção sugestiva de abscesso hepático piógeno. Cultura de sangue: Klebsiella pneumoniae. Qual é a melhor conduta inicial?", "opts": {"A": "Antibioticoterapia intravenosa associada à drenagem percutânea guiada por imagem.", "B": "Ressecção hepática segmentar com margem de segurança.", "C": "Antibiótico intravenoso por 14 dias e reavaliação com nova imagem.", "D": "Drenagem cirúrgica aberta imediata do abscesso."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "A", "medical": "A", "comment": "Resposta correta: O tratamento padrão é a antibioticoterapia intravenosa associada à drenagem percutânea guiada por imagem (USG ou TC). INCORRETA. Tratamento exclusivo com antibiótico é reservado para abscessos menores (<5 cm). Neste caso, o abscesso é volumoso (6,8 cm), geralmente não dispensa drenagem. INCORRETA. Drenagem cirúrgica aberta só deve ser considerada se a drenagem percutânea falhar ou for inviável. INCORRETA. Ressecção hepática é uma medida extrema, raramente indicada para abscesso hepático."}, {"n": 72, "meta": "(2025.2) ROT.3-A-12T: Q.1", "stem": "Um paciente com cirrose hepática apresenta varizes esofágicas identificadas em endoscopia digestiva alta de rotina, com estigmas hemorrágicos. Ele nunca apresentou episódios de sangramento digestivo. Qual das estratégias abaixo representa corretamente uma conduta de prevenção primária do sangramento por hipertensão portal?", "opts": {"A": "Uso de antibióticos profiláticos para evitar infecção associada a sangramento.", "B": "Esplenectomia eletiva para prevenir ruptura varicosa.", "C": "Inserção de TIPS (shunt portossistêmico intra-hepático transjugular) como primeira linha de prevenção.", "D": "Ligadura elástica das varizes esofágicas em pacientes com alto risco de sangramento."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "D", "medical": "D", "comment": "A ligadura elástica é uma estratégia comprovada de prevenção primária em pacientes com varizes de alto risco, especialmente aqueles que não podem utilizar beta-bloqueadores ou apresentam contraindicações. Resposta correta. A esplenectomia não é indicada para prevenção primária. Ela é usada para tratamento em pacientes com histórico de sangramentos prévios. Antibióticos profiláticos têm papel importante na prevenção secundária, ou seja, em pacientes que já apresentaram sangramento agudo, para evitar complicações infecciosas (como peritonite bacteriana espontânea) e novos episódios. Porém, seu uso não é indicado como estratégia preventiva primária, pois não interfere diretamente na ruptura inicial das varizes. O TIPS é uma intervenção eficaz para prevenção secundária ou em casos refratários a tratamento clínico/endoscópico. No entanto, por seu perfil invasivo e riscos associados (como encefalopatia hepática), não é indicado como conduta inicial em pacientes que nunca tiveram sangramento."}, {"n": 73, "meta": "(2026.1) ROT.1-A: Q.3", "stem": "Um paciente de 65 anos, portador de diabetes mellitus tipo 2 mal controlado, apresenta-se ao pronto-atendimento com febre intermitente (39°C), calafrios, prostração e dor persistente no hipocôndrio direito há uma semana. Ao exame físico, apresenta-se febril, com dor à palpação profunda do fígado, sendo que este está discretamente aumentado. Os exames laboratoriais revelam leucocitose (16.000 mm³) com desvio à esquerda e fosfatase alcalina elevada. Uma Tomografia Computadorizada (TC) de abdome mostra uma coleção líquida única, hipodensa, medindo 6,5 cm no segmento VIII do fígado, com realce periférico após o contraste. A conduta inicial mais adequada para este paciente é:", "opts": {"A": "Indicar drenagem cirúrgica imediata por laparotomia, dado que o tamanho da lesão é 5 cm e a presença de diabetes são preditores de falha da via percutânea.", "B": "Iniciar metronidazol empírico e solicitar sorologia para Entamoeba histolytica, postergando a drenagem devido ao risco de disseminação peritoneal.", "C": "Prescrever antibioticoterapia isolada e observar a resposta clínica por 48 a 72 horas, reservando a drenagem apenas para casos de falha terapêutica.", "D": "Iniciar antibioticoterapia de amplo espectro (ex: Ceftriaxona e Metronidazol) e realizar drenagem percutânea por cateter guiada por imagem."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "D", "medical": "D", "comment": "O tratamento do abscesso hepático piogênico baseia-se no binômio: antibioticoterapia sistêmica e controle da fonte (drenagem). Segundo o Maingot, a drenagem percutânea por cateter (DPC) é o procedimento de escolha, sendo superior à aspiração simples por agulha, especialmente em coleções maiores que 5 cm. O esquema antibiótico deve cobrir patógenos entéricos comuns (Gram-negativos e anaeróbios), sendo a associação de uma cefalosporina de 3ª geração com metronidazol uma opção padrão. Embora abscessos muito pequenos (3 cm) possam ser tratados apenas com antibióticos em pacientes selecionados, uma coleção de 6,5 cm em um paciente diabético apresenta alto risco de complicações e sepse. O Sabiston enfatiza que o atraso na drenagem de coleções significativas aumenta a morbimortalidade, não sendo recomendada a conduta expectante inicial neste caso. Esta conduta seria apropriada para um abscesso amebiano (onde o metronidazol isolado tem sucesso em 90% dos casos e a drenagem é raramente necessária). No entanto, o perfil do paciente (idoso, diabético, apresentação aguda) é muito mais sugestivo de abscesso piogênico (biliar ou criptogênico). No abscesso piogênico, a drenagem é parte fundamental da conduta inicial para reduzir a carga bacteriana e obter culturas. A cirurgia (laparotomia ou laparoscopia) não é mais a conduta de primeira linha para abscessos hepáticos. Ela é reservada para situações específicas: falha da drenagem percutânea, abscessos com conteúdo muito espesso (não drenável por cateter), rotura para a cavidade peritoneal ou necessidade de tratar uma causa primária intra-abdominal (como uma apendicite perfurada). O tamanho de 6,5 cm não contraindica a abordagem percutânea inicial."}, {"n": 74, "meta": "(2026.1) ROT.1-A: Q.5", "stem": "Uma paciente de 32 anos, usuária de anticoncepcional oral há 10 anos, realiza uma ultrassonografia de abdome de rotina que identifica um nódulo hepático de 4 cm no lobo direito. Ela é assintomática e não possui histórico de hepatopatias. Uma Ressonância Magnética (RM) com contraste hepatoespecífico (gadoxetato dissódico) é solicitada para melhor caracterização. O laudo descreve uma lesão com as seguintes características: isointensa em T1, levemente hiperintensa em T2, com realce arterial intenso e homogêneo (\"flash filling\"), presença de uma cicatriz central e retenção do contraste na fase hepatobiliar (hiperintensidade em relação ao parênquima adjacente). Com base nos achados de imagem, o diagnóstico mais provável e a característica radiológica que melhor diferencia esta lesão de um adenoma hepático é:", "opts": {"A": "Hepatocarcinoma (CHC); a presença de cicatriz central e o comportamento isointenso em T1 confirmam a malignidade.", "B": "Hiperplasia Nodular Focal (HNF); a retenção do contraste hepatoespecífico na fase hepatobiliar pela presença de hepatócitos funcionantes.", "C": "Adenoma hepático; o realce arterial intenso é o principal fator de diferenciação.", "D": "Hemangioma cavernoso; a retenção de contraste na fase hepatobiliar é patognomônica."}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "B", "medical": "B", "comment": "A Hiperplasia Nodular Focal (HNF) é uma lesão hepática benigna, comum em mulheres jovens, formada por hepatócitos funcionantes e frequentemente associada a cicatriz central e realce arterial intenso e homogêneo na RM. O ponto que melhor a diferencia do adenoma hepático quando se usa contraste hepatoespecífico (gadoxetato) é o comportamento na fase hepatobiliar: a HNF tende a ficar iso/hiperintensa, pois capta e retém o contraste por ter hepatócitos funcionais (captação preservada). Já o adenoma, em geral, não retém o contraste hepatobiliar e costuma ficar hipointenso nessa fase. Portanto, o diagnóstico mais provável é HNF, e a característica diferencial é a retenção do contraste na fase hepatobiliar. O hemangioma cavernoso apresenta um padrão de realce tipicamente periférico e descontínuo (\"em gotas\" ou globular) na fase arterial, com preenchimento centrípeto progressivo em fases tardias. Ele não retém contraste hepatoespecífico na fase hepatobiliar, pois é uma lesão de origem vascular e não hepatocitária. Embora tanto o adenoma quanto a HNF possam apresentar realce arterial intenso, o adenoma hepático geralmente não retém contraste hepatoespecífico na fase hepatobiliar (apresenta-se hipointenso nessa fase), pois carece de ductos biliares funcionais ou apresenta transportadores de membrana (OATP) reduzidos. Além disso, a cicatriz central é clássica da HNF, não do adenoma. O Hepatocarcinoma (CHC) tipicamente apresenta o padrão de \"washout\" (lavagem rápida do contraste na fase portal/tardia) e realce em anel ou cápsula, o que é oposto à retenção observada na HNF. Embora o CHC fibrolamelar possa apresentar uma cicatriz central, esta costuma ser hipointensa em T2 (ao contrário da HNF) e o perfil epidemiológico de uma paciente jovem sem cirrose e com lesão que retém contraste hepatoespecífico aponta fortemente para HNF."}, {"n": 75, "meta": "(2026.1) ROT.1-A: Q.21", "stem": "Paciente masculino, 62 anos, portador de diabetes mellitus tipo 2, procura atendimento por febre diária há 12 dias, associada a calafrios, anorexia, perda ponderal e dor em hipocôndrio direito. Refere episódio recente de diverticulite tratado clinicamente há cerca de 1 mês. Nega viagens recentes ou história de diarreia nos últimos meses. No exame físico, encontra-se febril (38,5 °C), taquicárdico, com dor à palpação profunda do hipocôndrio direito e hepatomegalia discreta. Exames laboratoriais: • Leucócitos: 20.800/mm³ (desvio à esquerda). • Proteína C reativa: 280 mg/L. • Fosfatase alcalina: aumentada. • GGT: aumentada. • AST e ALT: discretamente elevadas. • Bilirrubina total: 2,1 mg/dL. Tomografia computadorizada contrastada de abdome demonstra: Lesão única no lobo hepático direito, medindo 6,5 cm, com centro hipodenso heterogêneo, debris internos, realce periférico espesso e irregular após contraste, discreto edema perilesional e pequenas bolhas gasosas no interior da lesão. Não há dilatação significativa das vias biliares. Com base nos achados clínicos, laboratoriais e radiológicos, o diagnóstico mais provável é:", "opts": {"A": "Colangite aguda secundária a obstrução biliar.", "B": "Abscesso hepático amebiano.", "C": "Neoplasia hepática primária com necrose central.", "D": "Abscesso hepático piogênico. AFECÇÕES DA ÁRVORE BILIAR: AFECÇÕES DA ÁRVORE BILIAR: AFECÇÕES DA ÁRVORE BILIAR: COLECISTOLITÍASE, COLEDOCOLITÍASE, ÍLEO COLECISTOLITÍASE, COLEDOCOLITÍASE, ÍLEO COLECISTOLITÍASE, COLEDOCOLITÍASE, ÍLEO BILIAR, COLANGIOCARCINOMA BILIAR, COLANGIOCARCINOMA BILIAR, COLANGIOCARCINOMA"}, "topic": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "official": "D", "medical": "D", "comment": "O quadro é compatível com abscesso hepático piogênico. O paciente apresenta febre prolongada, dor em hipocôndrio direito, leucocitose importante, PCR muito elevada e antecedente de foco abdominal infeccioso (diverticulite), que é causa clássica de disseminação portal. A tomografia demonstra lesão com realce periférico espesso e irregular, conteúdo heterogêneo e presença de bolhas gasosas — achado fortemente sugestivo de infecção bacteriana, especialmente em diabéticos. O abscesso amebiano geralmente ocorre em pacientes mais jovens, com história epidemiológica compatível. Costuma ser lesão única, homogênea, sem debris internos significativos e raramente apresenta gás intralesional. Além disso, não há antecedente sugestivo de amebíase intestinal no caso descrito. A colangite aguda cursa com febre, dor e icterícia (tríade de Charcot) e está associada à dilatação de vias biliares por obstrução. No caso apresentado, não há dilatação biliar significativa nem padrão clínico típico de colangite. Neoplasias hepáticas podem apresentar necrose central, porém geralmente não cursam com febre elevada, marcadores inflamatórios tão elevados ou bolhas gasosas intralesionais. O contexto clínico infeccioso e o antecedente abdominal favorecem etiologia infecciosa."}, {"n": 76, "meta": "(2025.2) ROT.1-A-12T: Q.4", "stem": "Um paciente de 58 anos, previamente hígido, apresenta icterícia progressiva, colúria e fezes hipocólicas há 5 dias. Ultrassonografia demonstra colecistolitíase e dilatação das vias biliares intra e extra-hepáticas, e a tomografia confirma um cálculo de aproximadamente 8 mm impactado na porção distal do colédoco. Os exames laboratoriais mostram bilirrubina total de 8 mg/dL (direta 6,5 mg/dL) e leve elevação de transaminases. Ele está afebril e sem sinais de instabilidade hemodinâmica ou peritonite. Considerando as opções de abordagem diagnóstica e terapêutica das vias biliares, qual é a conduta mais adequada nesse caso?", "opts": {"A": "Indicar colangiografia cirúrgica peroperatória, pois permite maior segurança diagnóstica em pacientes com icterícia obstrutiva grave.", "B": "Adiar qualquer colangiografia e indicar colecistectomia eletiva, pois o quadro sugere icterícia que se resolve espontaneamente.", "C": "Indicar colangiografia transhepática percutânea, pois tem menor risco de complicações em cálculos distais do colédoco.", "D": "Indicar colangiografia por colangiopancreatografia retrógrada endoscópica (CPRE), pois é simultaneamente diagnóstica e terapêutica para cálculos distais em paciente estável."}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "D", "medical": "D", "comment": "A CPRE (ou ERCP, do inglês Endoscopic Retrograde Cholangiopancreatography) é o método de escolha em pacientes com colédocolitíase confirmada e em boas condições clínicas, como neste caso. A principal vantagem da CPRE é que ela permite diagnóstico e tratamento simultâneo, ou seja, é possível identificar o cálculo e realizar a papilotomia com extração do cálculo, muitas vezes na mesma sessão. Embora a colangiografia intraoperatória seja útil, não é o exame de escolha inicial em um paciente estável com diagnóstico já estabelecido por imagem. Além disso, não se trata de icterícia obstrutiva grave com instabilidade, nem há indicação emergencial de cirurgia. A colangiografia cirúrgica está reservada para situações intraoperatórias em que se detecta colédocolitíase durante colecistectomia, o que não é o caso. A colangiografia transhepática percutânea não é a primeira escolha para cálculos no colédoco distal. É um procedimento mais invasivo, com risco de hemorragia, fístulas biliares e infecção. Costuma ser reservado para casos em que a CPRE não é possível (por exemplo, após gastrectomia em Y de Roux ou anatomia alterada). A presença de colédocolitíase impactada com icterícia obstrutiva progressiva exige abordagem das vias biliares antes da colecistectomia. Adiar a abordagem pode resultar em complicações como colangite ou pancreatite biliar."}, {"n": 77, "meta": "(2025.2) ROT.1-A-12T: Q.6", "stem": "Um homem de 55 anos, com histórico de hipertensão arterial sistêmica controlada e sobrepeso, comparece à unidade de emergência relatando dor abdominal intensa no quadrante superior direito, com irradiação para o dorso, de início há 8 horas. Ele descreve episódios prévios de dor semelhante, porém menos intensos e de menor duração, desencadeados após refeições gordurosas. Refere febre (38,5ºC) e náuseas, sem vômitos. Ao exame físico, apresenta-se taquicárdico (112 bpm), com icterícia conjuntival, dor à palpação no hipocôndrio direito. O hemograma revela leucocitose com desvio à esquerda e as enzimas hepáticas mostram elevação de ALT (145U/L), AST (132U/L), FA (400U/L) e bilirrubinas (bilirrubina total: 4 mg/dL, sendo 2,9 mg/dL de bilirrubina direta). A ultrassonografia abdominal evidenciou vesícula biliar distendida, com parede com 4 mm de espessura e presença de cálculos no interior da vesícula e colédoco dilatado (11 mm). Baseando-se no quadro clínico e nos exames complementares apresentados, assinale a alternativa que representa o diagnóstico mais provável:", "opts": {"A": "Colecistite aguda.", "B": "Pancreatite aguda.", "C": "Coledocolitíase sem colangite.", "D": "Colangite aguda."}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "D", "medical": "D", "comment": "A) \"Colecistite aguda.\" INCORRETA. Embora o quadro de dor abdominal no hipocôndrio direito e a ultrassonografia evidenciem cálculos na vesícula biliar, a presença de febre alta, icterícia e aumento das enzimas hepáticas com colédoco dilatado sugere uma complicação, que é a colangite, e não a colecistite isolada. B) \"Pancreatite aguda.\" INCORRETA. A pancreatite aguda pode ser uma causa de dor abdominal e aumento das enzimas hepáticas, mas a dor geralmente é mais difusa e a ultrassonografia não mostra cálculos biliares ou dilatação do colédoco, o que exclui essa possibilidade. C) \"Coledocolitíase sem colangite.\" INCORRETA. Presença de cálculos no colédoco com colestase, mas sem infecção associada. No caso, febre e leucocitose indicam processo infeccioso, configurando colangite aguda e afastando o diagnóstico isolado de coledocolitíase. D) \"Colangite aguda.\" CORRETA. A colangite aguda é uma infecção bacteriana do sistema biliar, geralmente associada à obstrução do ducto biliar, frequentemente causada por cálculos (como observado na ultrassonografia), estase biliar ou alterações anatômicas. Os principais sinais clínicos incluem dor abdominal no quadrante superior direito, febre, icterícia, taquicardia e sinais de inflamação sistêmica, como leucocitose com desvio à esquerda. O quadro descrito no enunciado, com dor abdominal irradiada para o dorso, febre, icterícia e aumento das enzimas hepáticas (ALT, AST, FA e bilirrubinas), associado à presença de cálculos no colédoco dilatado, é característico de colangite aguda."}, {"n": 78, "meta": "(2025.2) ROT.2-A-14T: Q.9", "stem": "Paciente de 62 anos, sexo masculino, apresenta icterícia progressiva, colúria e acolia fecal há 3 semanas, associados a prurido cutâneo e perda de peso de 4 kg no período. Relata história de dor abdominal leve em hipocôndrio direito. Nega febre ou sintomas sistêmicos. Exames laboratoriais revelam bilirrubina total de 12 mg/dL (predominantemente direta), fosfatase alcalina elevada 5x o valor normal e elevação discreta de TGO/TGP. Marcadores tumorais: CA 19-9 elevado (600 U/mL). Ultrassonografia abdominal demonstra dilatação das vias biliares intra e extra-hepáticas, sem evidência de litíase. A RNM de vias biliares (colangiorressonância) identifica lesão sólida irregular no colédoco distal, intrapancreático, com 2 cm, sem invasão vascular ou metástases ao estadiamento. Qual a melhor conduta diagnóstica e propedêutica inicial?", "opts": {"A": "Biópsia percutânea guiada por imagem seguida de quimioterapia neoadjuvante.", "B": "CPRE com biópsia e colocação de prótese plástica temporária, seguida de pancreatoduodenectomia (Whipple).", "C": "Laparotomia exploradora com ressecção segmentar do colédoco e anastomose biliodigestiva.", "D": "Colangiopancreatografia retrógrada endoscópica (CPRE) com biópsia e colocação de prótese metálica não coberta."}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "B", "medical": "B", "comment": "D) \"Colangiopancreatografia retrógrada endoscópica (CPRE) com biópsia e colocação de prótese metálica não coberta.\" INCORRETA. A CPRE com prótese metálica não coberta é contraindicada em casos potencialmente ressecáveis, pois pode dificultar a cirurgia definitiva. Próteses metálicas são reservadas para paliação em doença irressecável (SABISTON, 2022). A) \"Biópsia percutânea guiada por imagem seguida de quimioterapia neoadjuvante.\" INCORRETA. A biópsia percutânea é desnecessária neste contexto, pois a lesão é acessível por CPRE. Quimioterapia neoadjuvante não é padrão para colangiocarcinoma ressecável (SCHWARTZ, 2019). C) \"Laparotomia exploradora com ressecção segmentar do colédoco e anastomose biliodigestiva.\" INCORRETA. A laparotomia exploradora sem confirmação histológica prévia e planejamento cirúrgico adequado (como avaliação de margens) é inadequada. A abordagem deve ser multimodal (SCHWARTZ, 2019). B) \"CPRE com biópsia e colocação de prótese plástica temporária, seguida de pancreatoduodenectomia (Whipple).\" CORRETA. A CPRE permite diagnóstico histológico (biópsia) e descompressão biliar pré-operatória com prótese plástica (evitando complicações como colangite). A pancreatoduodenectomia (Whipple) é o tratamento padrão para colangiocarcinoma distal ressecável (SABISTON, 2022; SCHWARTZ, 2019). Justificativa adicional: O colangiocarcinoma distal intrapancreático sem metástases tem melhor prognóstico com abordagem cirúrgica radical (Whipple). A CPRE pré-operatória é essencial para confirmação diagnóstica e preparo do paciente, conforme diretrizes atuais (BLUMGART, 2021)."}, {"n": 79, "meta": "(2025.2) ROT.3-A-14T: Q.10", "stem": "Homem de 72 anos, diabético, é internado com quadro de distensão abdominal, vômitos e parada de eliminação de fezes e flatos há 48 horas. Está desidratado, febril e com dor abdominal difusa. Ao exame físico, notam-se ruídos hidroaéreos metálicos e timpanismo difuso. Radiografia de abdome revela níveis hidroaéreos e presença de ar nas vias biliares. USG mostra cálculo na vesícula e ar biliar. Tomografia computadorizada (TC) confirma cálculo impactado em íleo distal. Qual é o diagnóstico mais provável?", "opts": {"A": "Coledocolitíase.", "B": "Íleo biliar.", "C": "Colecistite enfisematosa.", "D": "Íleo paralítico."}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "B", "medical": "B", "comment": "A) \"Coledocolitíase.\" INCORRETA. Não justifica os sintomas de obstrução intestinal nem a presença de cálculo no íleo distal. B) \"Íleo biliar.\" CORRETA. Quadro clássico: paciente idoso, ar em vias biliares, obstrução intestinal e presença de fístula colecistoentérica com cálculo impactado no íleo distal. C) \"Colecistite enfisematosa.\" INCORRETA. Apresenta ar na parede da vesícula biliar, mas não cursa com obstrução intestinal. D) \"Íleo paralítico.\" INCORRETA. Ocorre geralmente por causas metabólicas ou inflamatórias, sem obstrução mecânica nem cálculo visível."}, {"n": 80, "meta": "(2025.2) ROT.3-A-14T: Q.13", "stem": "Um homem de 48 anos procura o pronto-socorro por dor abdominal que começou no epigástrio e evoluiu para o hipocôndrio direito há 12 horas. Relata febre e que a urina escureceu no mesmo período. Ao exame: • Temperatura 38,8 °C • Icterícia discreta • Frequência cardíaca 110 bpm • Sinal de Murphy negativo Laboratório: • Leucócitos 15.000/mm³ • Bilirrubina total 6,2 mg/dL (direta 4,8 mg/dL) • Fosfatase alcalina 480 U/L • Aminotransferases moderadamente elevadas Ultrassonografia mostra vesícula com microlitíase e colédoco de 11 mm, sem coleções pericolecísticas. Qual diagnóstico se ajusta melhor a esse conjunto de achados clínicos e laboratoriais?", "opts": {"A": "Colangite ascendente.", "B": "Colecistite aguda calculosa.", "C": "Pancreatite aguda de origem biliar.", "D": "Coledocolitíase sem colangite."}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "A", "medical": "A", "comment": "A) \"Colangite ascendente.\" CORRETA. O paciente apresenta tríade de Charcot — febre, dor abdominal e icterícia — associada a leucocitose, aumento de bilirrubina direta, fosfatase alcalina elevada e dilatação de colédoco na ultrassonografia — conjunto que aponta para processo infeccioso na via biliar obstruída. Esses elementos diferenciam-se das apresentações mais típicas de colecistite (Murphy geralmente positivo e sem icterícia marcada) e de pancreatite biliar (predomínio de dor em barra irradiada para dorso com elevação importante de amilase/lipase). B) \"Colecistite aguda calculosa.\" INCORRETA. Geralmente há sinal de Murphy positivo e a dor tende a se localizar mais nitidamente no hipocôndrio direito desde o início. Menos comum ter icterícia significativa e colestase laboratorial importante. C) \"Pancreatite aguda de origem biliar.\" INCORRETA. Esperariam-se níveis muito elevados de amilase/lipase (não descritas), dor epigástrica irradiando para dorso, geralmente sem icterícia tão acentuada e sem colédoco dilatado. D) \"Coledocolitíase sem colangite.\" INCORRETA. Refere-se à presença de cálculo no ducto colédoco, causando obstrução biliar, com icterícia e exames de colestase, mas sem sinais de infecção sistêmica. No caso apresentado, a presença de febre, leucocitose e dor abdominal caracteriza a tríade de Charcot, definindo colangite aguda e afastando a hipótese de coledocolitíase isolada."}, {"n": 81, "meta": "(2025.2) ROT.3-A-14T: Q.21", "stem": "Um homem de 64 anos, hipertenso e diabético, é admitido no pronto-socorro com dor abdominal em hipocôndrio direito, febre (38,9 °C), icterícia e calafrios. Refere início do quadro há dois dias, com piora progressiva. Ao exame físico, encontra-se taquicárdico (FC: 112 bpm), com dor à palpação profunda do quadrante superior direito e sinal de Murphy negativo. Os exames laboratoriais revelam leucocitose com desvio à esquerda, bilirrubina total de 6,5 mg/dL (direta 5,2 mg/dL), TGO/TGP discretamente elevadas e fosfatase alcalina aumentada. A ultrassonografia mostra dilatação das vias biliares intra- hepáticas e cálculo em colédoco. Com base no quadro clínico e nos critérios diagnósticos de gravidade das afecções biliares, aponte abaixo a alternativa que contenha a conduta prioritária para este paciente:", "opts": {"A": "Solicitar biópsia por colangiopancreatografia retrógrada endoscópica (CPRE).", "B": "Iniciar antibioticoterapia e realizar descompressão biliar por via endoscópica.", "C": "Observar e planejar colecistectomia eletiva.", "D": "Indicar colecistectomia videolaparoscópica de urgência."}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "B", "medical": "B", "comment": "A) \"Solicitar biópsia por colangiopancreatografia retrógrada endoscópica (CPRE).\" INCORRETA. A CPRE tem finalidade diagnóstica e terapêutica no sentido de visualizar e desobstruir as vias biliares, não para biópsia neste contexto. A biópsia é reservada para suspeita de neoplasia biliar (colangiocarcinoma) ou estenose maligna — o que não é o caso. Aqui, há cálculo obstrutivo confirmado → não há indicação de biópsia. B) \"Iniciar antibioticoterapia e realizar descompressão biliar por via endoscópica.\" CORRETA. Essa é a conduta prioritária e padronizada internacionalmente pelas Tokyo Guidelines 2018 (TG18). A tríade de Charcot (febre, icterícia e dor) caracteriza colangite aguda, cujo tratamento baseia-se em dois pilares: • Antibioticoterapia empírica imediata, cobrindo germes entéricos Gram- negativos e anaeróbios (ex.: ceftriaxona + metronidazol, piperacilina- tazobactam ou carbapenêmicos em casos graves) • Descompressão biliar, preferencialmente por CPRE (colangiopancreatografia retrógrada endoscópica), que é simultaneamente diagnóstica e terapêutica, permitindo drenagem e retirada do cálculo C) \"Observar e planejar colecistectomia eletiva.\" INCORRETA. \"Observar\" não é aceitável em um quadro de infecção biliar sistêmica. O paciente apresenta febre, icterícia e leucocitose — sinais de infecção ativa e risco de sepse. A conduta expectante (sem antibióticos ou drenagem) poderia levar a choque séptico e falência múltipla de órgãos. D) \"Indicar colecistectomia videolaparoscópica de urgência.\" INCORRETA. O problema principal não está na vesícula biliar, e sim no colédoco, onde há cálculo obstrutivo com infecção. A colecistectomia (retirada da vesícula) não trata a obstrução biliar nem resolve a colangite. Operar um paciente com infecção ativa das vias biliares aumenta o risco de sepse e complicações graves."}, {"n": 82, "meta": "(2026.1) ROT.1-A: Q.13", "stem": "Mulher de 42 anos, obesa, dá entrada no pronto-socorro hospitalar com dor em hipocôndrio direito há 8 horas, em cólica, iniciada após refeição gordurosa, associada a náuseas e vômitos. Ao exame: afebril, sem hipotensão, dor à palpação em hipocôndrio direito, sem sinal de irritação peritoneal. Ela refere urina escura nas últimas 24 horas e o familiar percebeu \"olhos amarelados\". Nega diarreia. Qual achado clínico adicional é mais sugestivo de coledocolitíase (cálculo em colédoco), em vez de colelitíase não complicada?", "opts": {"A": "Dor episódica pós-prandial em hipocôndrio direito com náuseas, sem febre.", "B": "Icterícia progressiva com prurido e fezes (claras).", "C": "Sinal de Murphy positivo durante palpação subcostal direita.", "D": "Dor em hipocôndrio direito aliviada após uso de antiácido. AFECÇÕES DO PÂNCREAS (PANCREATITE AFECÇÕES DO PÂNCREAS (PANCREATITE AFECÇÕES DO PÂNCREAS (PANCREATITE AGUDA E CRÔNICA, PSEUDOCISTO, AGUDA E CRÔNICA, PSEUDOCISTO, AGUDA E CRÔNICA, PSEUDOCISTO, NEOPLASIAS CÍSTICAS, ADENOCARCINOMA): NEOPLASIAS CÍSTICAS, ADENOCARCINOMA): NEOPLASIAS CÍSTICAS, ADENOCARCINOMA): DIAGNÓSTICO/TRATAMENTO/COMPLICAÇÕES DIAGNÓSTICO/TRATAMENTO/COMPLICAÇÕES DIAGNÓSTICO/TRATAMENTO/COMPLICAÇÕES"}, "topic": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "official": "B", "medical": "B", "comment": "B) \"Icterícia progressiva com prurido e fezes (claras).\" CORRETA. Esse conjunto é típico de colestase por obstrução biliar extra- hepática, cenário compatível com coledocolitíase: icterícia + colúria (urina escura) + acolia/hipocolia fecal e prurido sugerem retenção de bilirrubina conjugada e sais biliares. No contexto de dor biliar, esses sinais apontam que o cálculo provavelmente migrou para o colédoco, exigindo investigação hospitalar com exames laboratoriais (padrão colestático) e imagem, frequentemente com necessidade de CPRE conforme estratificação de risco. A) \"Dor episódica pós-prandial em hipocôndrio direito com náuseas, sem febre.\" INCORRETA. Isso descreve cólica biliar típica de colelitíase não complicada (cálculo na vesícula sem inflamação/infeção). Não sugere obstrução do colédoco por si só. C) \"Sinal de Murphy positivo durante palpação subcostal direita.\" INCORRETA. Murphy positivo é mais sugestivo de colecistite aguda (inflamação da vesícula). Pode coexistir com coledocolitíase, mas não é o achado mais direcionador para cálculo em colédoco. O \"marcador clínico\" mais forte para colédoco é o padrão de colestase com icterícia/colúria/acolia. D) \"Dor em hipocôndrio direito aliviada após uso de antiácido.\" INCORRETA. Alívio com antiácido sugere mais dispepsia/DRGE/úlcera péptica do que doença biliar. Não aponta para colelitíase ou coledocolitíase. Pérola prática (nível hospitalar): • Colelitíase (cólica biliar): dor pós-gordura, episódica, sem febre, sem icterícia. • Colecistite aguda: dor persistente + febre/leucocitose, Murphy positivo. • Coledocolitíase: dor biliar + icterícia/colúria/acolia ± prurido (padrão colestático). • Colangite (complicação): Tríade de Charcot (febre + dor em QSD + icterícia) -> urgência."}, {"n": 83, "meta": "(2025.2) ROT.1-A-12T: Q.11", "stem": "Um paciente de 56 anos, etilista crônico, com diagnóstico prévio de pancreatite aguda há 6 semanas, evolui com dor abdominal persistente, febre intermitente e perda ponderal. A tomografia de abdome mostra coleção encapsulada de 9 cm na região pancreática, com conteúdo líquido e áreas sugestivas de necrose. A função renal está preservada e os exames laboratoriais mostram leucocitose com elevação de proteína C reativa. Considerando o quadro clínico e os achados de imagem, a conduta mais apropriada neste momento é:", "opts": {"A": "iniciar antibioticoterapia intravenosa e aguardar melhora clínica, postergando qualquer procedimento invasivo por pelo menos mais 4 semanas.", "B": "manter conduta expectante, uma vez que a maioria das coleções pancreáticas se resolve espontaneamente após 8 semanas.", "C": "programar drenagem da coleção por via endoscópica guiada por imagem, pois há sintomas persistentes e sinais de infecção associados à coleção encapsulada.", "D": "indicar cirurgia de Whipple, pois o tamanho da lesão e a febre sugerem neoplasia de cabeça de pâncreas com infecção secundária."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "C", "medical": "C", "comment": "Coleções encapsuladas com sinais de infecção e sintomas persistentes após mais de 4 semanas de pancreatite indicam drenagem, preferencialmente por via endoscópica transgástrica guiada por imagem, devido ao menor risco e boa eficácia. A conduta expectante só é válida na ausência de sintomas e sinais infecciosos. Neste caso, a dor e a febre sugerem complicação. O uso isolado de antibióticos sem drenagem, na presença de coleção infectada, é insuficiente e pode levar à deterioração clínica. A cirurgia de Whipple é indicada para tumores ressecáveis de cabeça de pâncreas, e não deve ser indicada com base apenas em imagem sugestiva de coleção."}, {"n": 84, "meta": "(2025.2) ROT.1-A-12T: Q.16", "stem": "Paciente do sexo feminino, 62 anos, previamente hígida, procura atendimento por dor abdominal leve em hipocôndrio esquerdo e perda de 5 kg nos últimos 3 meses. Nega consumo de álcool. Sem histórico de pancreatite. Exames laboratoriais mostram amilase e lipase normais, CA 19-9 dentro dos limites da normalidade. A tomografia computadorizada (TC) contrastada de abdome mostra lesão cística de 5,5 cm na cauda do pâncreas, com conteúdo homogêneo hipodenso, sem calcificações, mas com espessamento discreto da parede e septações finas internas, sem nódulos murais visíveis. Diante desse caso, indique o diagnóstico mais provável e a conduta apropriada:", "opts": {"A": "Pseudocisto pancreático – acompanhar com exames de imagem seriados, uma vez que a paciente está assintomática e sem histórico de pancreatite.", "B": "IPMN (Intraductal Papillary Mucinous Neoplasm) de ducto secundário – acompanhamento clínico-radiológico, pois a ausência de nódulos murais permite conduta conservadora.", "C": "Cistoadenoma seroso – conduta expectante, por ser lesão benigna com baixo risco de complicações.", "D": "Neoplasia mucinosa cística – indicação cirúrgica devido ao potencial maligno, especialmente em mulheres e lesões > 4 cm."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "D", "medical": "D", "comment": "A ausência de história de pancreatite e a presença de comunicação com o ducto pancreático secundário, mesmo sem nódulos murais, afastam o diagnóstico de pseudocisto. A neoplasia mucinosa cística (NMC) geralmente ocorre em mulheres de meia-idade, mas raramente se comunica com o ducto pancreático, e costuma localizar-se na cauda — o que pode confundir o diagnóstico. O diagnóstico é de IPMN (intraductal papillary mucinous neoplasm) de ducto secundário. Nesse tipo, a conduta depende da presença de fatores de alto risco ou critérios de preocupação, como: • Nódulos murais realçados. • Ducto pancreático principal > 10 mm. • Sintomas relacionados à lesão (dor e perda ponderal). Neste caso, os sintomas e a localização da lesão nos sugerem a indicação cirúrgica."}, {"n": 85, "meta": "(2025.2) ROT.1-A-12T: Q.25", "stem": "Homem de 56 anos, etilista crônico, comparece ao ambulatório com queixas de dor abdominal epigástrica recorrente, em queimação, irradiada para dorso, associada à esteatorreia progressiva e perda ponderal de 8 kg nos últimos 4 meses. Refere melhora parcial da dor com flexão do tronco. Nega vômitos ou icterícia. Exames complementares: • Amilase e lipase: normais. • Glicemia de jejum: 142 mg/dL. • Elastase fecal: 85 mcg/g (valores normais > 200). • TC de abdome: pâncreas atrófico, com calcificações e dilatação do ducto pancreático principal. Sem massas sólidas visíveis. Com base nesse quadro clínico e nos exames apresentados, qual é a conduta inicial mais apropriada, considerando também os critérios para encaminhamento?", "opts": {"A": "Iniciar enzimas pancreáticas e controle glicêmico, além de encaminhar para avaliação especializada devido à dor e risco de complicações.", "B": "Repor hormônios como a insulina e manter seguimento ambulatorial com dosagem de enzimas pancreáticas séricas a cada 3 meses.", "C": "Encaminhar para cirurgia de cabeça de pâncreas devido à suspeita de neoplasia cística de alto risco.", "D": "Solicitar ecoendoscopia para biópsia, iniciar antibiótico e suspender enzimas até confirmar malignidade."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "A", "medical": "A", "comment": "A) \"Iniciar enzimas pancreáticas e controle glicêmico, além de encaminhar para avaliação especializada devido à dor e risco de complicações.\" CORRETA. O paciente apresenta quadro compatível com pancreatite crônica avançada, com disfunção exócrina (esteatorreia, elastase fecal baixa), alterações estruturais (calcificações, dilatação ductal) e dor crônica significativa. A conduta inicial inclui enzimas pancreáticas, controle da glicemia e avaliação com especialista, especialmente se a dor for limitante ou houver necessidade de procedimentos como descompressão ductal, bloqueio neural ou cirurgia. B) \"Repor hormônios como a insulina e manter seguimento ambulatorial com dosagem de enzimas pancreáticas séricas a cada 3 meses.\" INCORRETA. Embora haja necessidade de controle glicêmico, essa conduta ignora a insuficiência pancreática exócrina grave evidenciada pela elastase fecal muito baixa. Amilase e lipase normais não excluem disfunção exócrina, e o tratamento adequado exige reposição enzimática oral imediata. Além disso, dosar enzimas séricas periodicamente não é útil para o acompanhamento da pancreatite crônica avançada. C) \"Encaminhar para cirurgia de cabeça de pâncreas devido à suspeita de neoplasia cística de alto risco.\" INCORRETA. Neoplasia cística de alto risco não está descrita no laudo (não há lesão cística com septos, nódulos ou comunicação ductal). Também não há indicação cirúrgica imediata. D) \"Solicitar ecoendoscopia para biópsia, iniciar antibiótico e suspender enzimas até confirmar malignidade.\" INCORRETA. Não há sinais clínico-radiológicos sugestivos de infecção ou tumor evidente. Além disso, ecoendoscopia com biópsia é indicada se houver massa sólida ou cisto suspeito, o que não é o caso aqui."}, {"n": 86, "meta": "(2025.2) ROT.2-A-14T: Q.1", "stem": "No ambulatório de cirurgia, um paciente masculino de 60 anos é atendido com exame de ultrassonografia de abdômen total revelando a presença de nódulo pancreático, realizado para avaliar uma suposta hérnia umbilical. Durante a anamnese, o paciente relata comportamentos bizarros, lapsos de memória ou perda de consciência, além de episódios de palpitações, sudorese e tremores. Considerando o caso em questão, marque a alternativa que apresenta a principal hipótese diagnóstica:", "opts": {"A": "Somatostatinoma.", "B": "Glucagonoma.", "C": "Carcinoma da cabeça do pâncreas.", "D": "Insulinoma."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "D", "medical": "D", "comment": "D) \"Insulinoma.\" CORRETA. É o tumor neuroendócrino pancreático mais comum, originado de células β, produtor de insulina. Os insulinomas apresentam sintomas (relacionados à privação cerebral de glicose), que são comportamentos bizarros, lapsos de memória ou perda de consciência. Os pacientes podem ser erroneamente tratados como doentes psiquiátricos. É possível haver descarga simpática profusa com palpitações, sudorese e tremores. A) \"Somatostatinoma.\" INCORRETA. Também é um tumor neuroendócrino pancreático, mas sua síndrome clínica típica é: diabetes mellitus, esteatorreia e litíase biliar. Não cursa com hipoglicemias, por isso não explica o quadro apresentado. B) \"Glucagonoma.\" INCORRETA. Pois a síndrome do glucagonoma é caracterizada por dermatite necrolítica migratória (geralmente envolvendo membros inferiores e períneo), perda de peso, estomatite, hipoaminoacidemia, anemia e diabetes melito leve a moderado. Tumor raro das células α pancreáticas. C) \"Carcinoma da cabeça do pâncreas.\" INCORRETA. Pois se apresenta com perda de peso, icterícia obstrutiva e dor abdominal profundamente localizada. Metade dos pacientes apresenta hepatomegalia, que não necessariamente indica disseminação ao fígado. Não explica os episódios de hipoglicemia e sintomas adrenérgicos relatados no caso."}, {"n": 87, "meta": "(2025.2) ROT.2-A-14T: Q.27", "stem": "Você está atendendo um paciente de 42 anos, do sexo masculino, etilista crônico e tabagista, que comparece ao ambulatório com dor abdominal epigástrica intensa, em faixa, irradiada para o dorso, associada a náuseas e vômitos há dois dias. Ao exame físico, apresenta dor à palpação profunda no epigástrio e sinais de desidratação, sem febre ou icterícia. Considerando o quadro clínico, qual é a principal hipótese diagnóstica e a conduta inicial mais adequada?", "opts": {"A": "Úlcera péptica perfurada; solicitar radiografia de tórax e iniciar antibiótico e cirurgia.", "B": "Colecistite aguda calculosa; solicitar ultrassonografia abdominal e iniciar antibiótico.", "C": "Apendicite aguda; solicitar tomografia abdominal e encaminhar para cirurgia.", "D": "Pancreatite aguda; solicitar amilase/lipase e iniciar hidratação e analgesia."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "D", "medical": "D", "comment": "D) \"Pancreatite aguda; solicitar amilase/lipase e iniciar hidratação e analgesia.\" CORRETA. A apresentação clínica é clássica de pancreatite aguda: dor epigástrica irradiada para o dorso, associada a náuseas, vômitos e fatores de risco como etilismo. A confirmação se dá por aumento de amilase/lipase e imagem complementar, se necessário. A conduta inicial inclui jejum, hidratação venosa vigorosa e analgesia. B) \"Colecistite aguda calculosa; solicitar ultrassonografia abdominal e iniciar antibiótico.\" INCORRETA. Embora compartilhe sintomas abdominais, a colecistite normalmente se manifesta com dor em hipocôndrio direito, febre, náuseas e sinal de Murphy positivo. A dor típica não irradia para o dorso e os fatores de risco associados diferem dos da pancreatite. A) \"Úlcera péptica perfurada; solicitar radiografia de tórax e iniciar antibiótico e cirurgia.\" INCORRETA. A úlcera perfurada se apresenta com dor súbita e intensa, com sinais de peritonite e rigidez abdominal. O diagnóstico é feito com radiografia de tórax (pneumoperitônio), mas o quadro clínico é geralmente agudo e com instabilidade clínica, diferente do caso apresentado. C) \"Apendicite aguda; solicitar tomografia abdominal e encaminhar para cirurgia.\" INCORRETA. O quadro clínico da apendicite caracteriza-se por dor periumbilical migrando para fossa ilíaca direita, febre e sinais de irritação peritoneal, o que não corresponde à dor epigástrica irradiada para dorso presente neste caso."}, {"n": 88, "meta": "(2025.2) ROT.3-A-14T: Q.1", "stem": "Homem de 65 anos, previamente hígido, comparece ao ambulatório com queixa de emagrecimento de 8 kg em 2 meses, icterícia progressiva, fezes hipocólicas e urina escura. Nega dor abdominal. Ao exame físico, apresenta icterícia de escleróticas e vesícula palpável. Ultrassonografia evidenciou dilatação das vias biliares intra e extra-hepáticas. Tomografia de abdome revela massa hipoatenuante na cabeça do pâncreas com 3,0 cm, sem sinais de invasão vascular ou metástases. Ele foi classificado como ASA II. Considerando o quadro clínico e os achados de imagem, qual deve ser a conduta mais adequada?", "opts": {"A": "Encaminhamento para duodenopancreatectomia com intenção curativa.", "B": "Biópsia guiada por ultrassonografia endoscópica e início de quimioterapia neoadjuvante.", "C": "Início de quimiorradioterapia neoadjuvante para reduzir tumoral antes da cirurgia.", "D": "Implante de prótese biliar endoscópica e seguimento clínico ambulatorial."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "A", "medical": "A", "comment": "Em tumores ressecáveis com critérios clínico-radiológicos típicos, biópsia pré-operatória não é necessária. Quimioterapia paliativa não se aplica sem metástases ou invasão vascular. Prótese biliar é uma medida paliativa ou pré-operatória em casos de obstrução grave ou icterícia colestática com tempo de espera cirúrgica, mas não substitui a cirurgia em paciente ressecável. O tumor é ressecável (sem invasão vascular ou metástase), e o paciente está em condições clínicas favoráveis → indicação de cirurgia curativa (duodenopancreatectomia – cirurgia de Whipple). A quimiorradioterapia neoadjuvante é indicada em casos borderline ou localmente avançados, o que não se aplica ao caso descrito."}, {"n": 89, "meta": "(2025.2) ROT.3-A-14T: Q.3", "stem": "Paciente masculino, 52 anos, etilista crônico há 25 anos, procura atendimento ambulatorial com quadro de dor abdominal epigástrica contínua e irradiada para dorso, de moderada intensidade, associada à perda ponderal progressiva e evacuações volumosas, oleosas e de odor fétido nos últimos meses. Refere piora progressiva da dor após refeições e relata que já teve episódios similares anteriormente, embora menos intensos. Exames laboratoriais revelam glicemia de jejum de 142 mg/dL e discreta elevação de enzimas pancreáticas. Com base nesse quadro clínico, assinale a alternativa que corresponde à hipótese diagnóstica mais provável e à explicação fisiopatológica mais coerente:", "opts": {"A": "Pancreatite crônica – inflamação progressiva com fibrose, atrofia acinar, obstrução ductal e insuficiência exócrina e endócrina.", "B": "Colelitíase associada a disfunção biliar – dor pós-prandial associada a esteatorreia por má absorção de ácidos biliares.", "C": "Neoplasia de cabeça de pâncreas – compressão do colédoco e infiltração neural explicam a dor abdominal e a icterícia.", "D": "Pancreatite aguda recorrente – inflamação limitada do parênquima pancreático, sem alterações anatômicas duradouras."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "A", "medical": "A", "comment": "Resposta correta: A pancreatite crônica caracteriza-se por uma inflamação persistente do parênquima pancreático, levando à fibrose, destruição das células acinares e ilhotas de Langerhans, calcificações parenquimatosas e dilatação ductal. A dor abdominal em faixa, irradiada para o dorso, é típica, relacionada ao aumento da pressão ductal e à infiltração neural. A insuficiência exócrina se manifesta por esteatorreia e perda ponderal, enquanto a endócrina leva a intolerância à glicose ou diabetes tipo pancreatogênico (tipo 3c). A história de etilismo crônico reforça a etiologia alcoólica. Respostas incorretas: Icterícia e perda ponderal são comuns no câncer de pâncreas, mas a dor é menos recorrente e as calcificações são incomuns. Pancreatite aguda recorrente pode ocorrer, mas não cursa com calcificações nem insuficiência pancreática progressiva. Colelitíase pode causar dor pós-prandial, mas sem esteatorreia acentuada nem alterações pancreáticas."}, {"n": 90, "meta": "(2025.2) ROT.3-A-14T: Q.6", "stem": "Homem, 68 anos, retorna à UBS acompanhado da esposa para avaliação de exames. Refere desconforto abdominal em andar superior há cerca de 6 meses, associado à perda ponderal não intencional de 15 kg. Endoscopia digestiva alta prévia sem alterações. Apresenta tomografia de abdome com os seguintes achados: • Lesão expansiva na cabeça pancreática, medindo 4,0 cm • Dilatação de vias biliares e do ducto pancreático principal, com atrofia do parênquima pancreático • Envolvimento da veia mesentérica superior em mais de 180°, sem acometimento arterial Com base nesse quadro clínico e radiológico, qual a conduta mais adequada?", "opts": {"A": "Encaminhamento imediato à urgência hospitalar para avaliação por equipe de cirurgia geral.", "B": "Orientação ao paciente e encaminhamento a serviço oncológico para avaliar quimioterapia neoadjuvante.", "C": "Solicitação de biópsia pancreática pela UBS e orientação quanto à provável benignidade da lesão.", "D": "Encaminhamento ao serviço de oncologia cirúrgica para possível cirurgia com ressecção total de lesão."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "B", "medical": "B", "comment": "O paciente apresenta sintomas clássicos de doença pancreática maligna — dor epigástrica insidiosa, perda ponderal importante e exames de imagem com achados sugestivos de neoplasia da cabeça do pâncreas. A tomografia evidencia uma lesão sólida de 4 cm, associada à dilatação de vias biliares e ducto pancreático principal, além de atrofia pancreática — conjunto altamente sugestivo de adenocarcinoma de pâncreas. Um ponto fundamental para a definição terapêutica é o comprometimento vascular. Neste caso, o tumor envolve a veia mesentérica superior em mais de 180°, mas sem acometimento arterial, caracterizando tumor localmente avançado (borderline ressecável) de acordo com os critérios da NCCN. Dessa forma, a conduta mais indicada é o encaminhamento para centro de referência oncológica, onde o paciente será avaliado para quimioterapia neoadjuvante com objetivo de controle tumoral, possível conversão para ressecabilidade e melhor seleção dos pacientes que se beneficiarão de cirurgia. A) \"Encaminhamento imediato à urgência hospitalar para avaliação por equipe de cirurgia geral.\" INCORRETA. Apesar da presença de tumor pancreático, não se trata de urgência cirúrgica. A cirurgia em um contexto não planejado pode ser prejudicial, especialmente em casos de envolvimento vascular. B) \"Orientação ao paciente e encaminhamento a serviço oncológico para avaliar quimioterapia neoadjuvante.\" CORRETA. Conduta alinhada às diretrizes atuais para tumores borderline ressecáveis. O tratamento inicial deve ser sistêmico, e a cirurgia é considerada somente após reavaliação com exames de imagem e resposta ao tratamento. C) \"Solicitação de biópsia pancreática pela UBS e orientação quanto à provável benignidade da lesão.\" INCORRETA. O quadro clínico e radiológico é sugestivo de malignidade, e a UBS não dispõe de recursos técnicos nem é o local adequado para biópsia pancreática. Além disso, tranquilizar o paciente com base em suposição de benignidade é conduta inadequada. D) \"Encaminhamento ao serviço de oncologia cirúrgica para possível cirurgia com ressecção total de lesão.\" INCORRETA. Apesar de ser um centro de referência, o tratamento cirúrgico não é a primeira opção nesse estágio da doença. É necessário tratamento neoadjuvante antes de qualquer tentativa de ressecção."}, {"n": 91, "meta": "(2026.1) ROT.1-A: Q.12", "stem": "Paciente masculino, 58 anos, previamente hígido, procura atendimento por quadro de icterícia progressiva indolor há cerca de 3 semanas, associada a colúria, acolia fecal, perda ponderal de 8 kg em 2 meses e astenia. Nega etilismo e tabagismo. Não refere episódios prévios de dor abdominal intensa. Ao exame físico, apresenta icterícia ++/4+, sem dor à palpação abdominal. Exames laboratoriais mostram: • Bilirrubina total de 9,2 mg/dL (direta 7,4 mg/dL) • Fosfatase alcalina e GGT acentuadamente elevadas • Transaminases discretamente aumentadas • CA 19-9 encontra-se em 110 U/mL • Dosagem de IgG4 sérica está elevada (2,5 vezes o limite superior da normalidade) Tomografia computadorizada contrastada evidencia aumento difuso do pâncreas, com aspecto em \"salsicha\", halo hipodenso periférico, estreitamento longo e regular do colédoco distal e ausência de massa focal definida. Ressonância magnética com CPRM demonstra estreitamento difuso do ducto pancreático principal, sem dilatação significativa a montante. Considerando os diagnósticos diferenciais possíveis e as evidências atuais, a hipótese diagnóstica mais provável e a melhor conduta inicial são:", "opts": {"A": "Adenocarcinoma de pâncreas com apresentação atípica; indicação imediata de duodenopancreatectomia cefálica, sem necessidade de confirmação histológica adicional.", "B": "Pancreatite autoimune tipo 1 (doença relacionada ao IgG4); indicação de teste terapêutico com corticoide sistêmico após exclusão razoável de neoplasia.", "C": "Colangiocarcinoma distal associado a pancreatite secundária; indicação de CPRE com escovado biliar e posterior quimioterapia paliativa.", "D": "Pancreatite crônica alcoólica em fase inicial; tratamento conservador com analgesia e acompanhamento ambulatorial, uma vez que os achados de imagem são inespecíficos."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "B", "medical": "B", "comment": "O quadro clínico, laboratorial e radiológico é altamente sugestivo de pancreatite autoimune tipo 1, uma manifestação da doença relacionada ao IgG4, caracterizada por: • Icterícia indolor (frequentemente confundida com câncer de pâncreas). • Aumento difuso do pâncreas com aspecto em \"salsicha\". • Halo hipodenso periférico (\"capsule-like rim\"). • Estreitamento longo e regular do ducto pancreático principal. • Elevação sérica de IgG4. • Possível elevação de CA 19-9 (não específica). Segundo diretrizes internacionais, na presença de forte suspeita clínica e radiológica, após exclusão razoável de neoplasia, é aceitável um teste terapêutico com corticoide, que costuma resultar em resposta clínica e radiológica dramática, confirmando o diagnóstico. Alternativas incorretas: O colangiocarcinoma distal pode causar icterícia, porém: • Não explica o aumento difuso do pâncreas. • Não justifica a elevação de IgG4 isoladamente. • O padrão de estreitamento ductal longo e regular favorece etiologia inflamatória, não neoplásica. • Além disso, a conduta proposta ignora a forte evidência de doença imunomediada. A pancreatite crônica alcoólica geralmente cursa com: • História prolongada de etilismo. • Dor abdominal recorrente. • Calcificações pancreáticas. • Dilatação irregular do ducto pancreático. • Nada disso está presente no caso, tornando esse diagnóstico improvável. Apesar de o adenocarcinoma pancreático ser um importante diagnóstico diferencial, este caso não apresenta achados típicos, como: • Massa focal hipodensa. • Dilatação abrupta do ducto pancreático (\"double duct sign\" clássico). • Atrofia pancreática a montante. • Além disso, a cirurgia sem confirmação diagnóstica pode levar a pancreatectomias desnecessárias, erro historicamente frequente antes do reconhecimento da pancreatite autoimune."}, {"n": 92, "meta": "(2026.1) ROT.1-A: Q.16", "stem": "Paciente masculino, 62 anos, com histórico de etilismo crônico e dislipidemia, foi internado há 6 semanas por pancreatite aguda grave, evoluindo inicialmente com falência respiratória e renal transitórias, tratadas em UTI. Após melhora clínica parcial, passou a apresentar novamente febre diária, dor abdominal progressiva, perda do apetite e elevação sustentada de marcadores inflamatórios (PCR >250 mg/L). Tomografia computadorizada contrastada de abdome realizada na 6ª semana demonstra volumosa coleção encapsulada de aproximadamente 11 cm, com conteúdo heterogêneo (líquido + debris sólidos), localizada posteriormente ao estômago, com presença de bolhas gasosas no interior da coleção. Não há sinais de perfuração de víscera oca. O paciente encontra-se hemodinamicamente estável, sem necessidade de drogas vasoativas. Considerando a Classificação de Atlanta revisada, o diagnóstico mais provável e a estratégia terapêutica inicial mais adequada, segundo as evidências atuais, são:", "opts": {"A": "Trata-se de um pseudocisto pancreático infectado, cuja presença de gás indica necessidade de necrosectomia cirúrgica aberta imediata, independentemente da estabilidade clínica, devido ao alto risco de sepse abdominal.", "B": "O achado corresponde a uma necrose pancreática organizada infectada (walled-off necrosis infectada), sendo indicada abordagem pelo step-up approach, iniciando-se preferencialmente com dren
