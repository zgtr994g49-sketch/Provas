<style>
:root{
 --bg:#f4f6f8;--card:#fff;--text:#16202a;--muted:#687583;--line:#dde4ea;--dark:#17212b;
 --green:#167a48;--greenbg:#eaf7ef;--red:#bf3434;--redbg:#fdeeee;--amber:#9b6700;--amberbg:#fff5d9;
 --blue:#285f91;--bluebg:#eaf3fb
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:850;letter-spacing:-.025em}.brand small{font-weight:500;color:var(--muted);margin-left:8px}
.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{max-width:1160px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 2px 9px rgba(0,0,0,.035)}
.grid{display:grid;gap:15px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:840px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}main{padding:14px}.top{align-items:flex-start}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.brand small{display:none}}
h1,h2,h3{margin-top:0}h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:10px;font-weight:700}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.amber{background:var(--amberbg);color:var(--amber);border-color:#e4cb7d}.btn.green{background:var(--green);border-color:var(--green);color:white}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2f5;color:#46515c;font-size:12px;font-weight:800}
.badge.green{background:var(--greenbg);color:var(--green)}.badge.amber{background:var(--amberbg);color:var(--amber)}.badge.red{background:var(--redbg);color:var(--red)}
.exam{transition:.15s}.exam:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.055)}
.stat{border:1px solid var(--line);background:#fafbfc;border-radius:12px;padding:13px}.stat b{display:block;font-size:21px;margin-top:3px}
.progress{height:9px;border-radius:99px;background:#e8edf1;overflow:hidden}.progress>div{height:100%;background:var(--dark)}
.notice{border:1px solid #bed7eb;background:var(--bluebg);color:#234d73;border-radius:11px;padding:12px 14px}
.issue{border:1px solid #e4c971;background:var(--amberbg);color:#684600;border-radius:12px;padding:14px;margin-top:13px}
.options{display:grid;gap:10px;margin-top:18px}.option{text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;line-height:1.45}
.option:hover:not(:disabled){border-color:#98a5af}.option.correct{background:var(--greenbg);border-color:#85c5a1;color:#0d6439}.option.wrong{background:var(--redbg);border-color:#e29a9a;color:#922a2a}
.answer{margin-top:17px;border:1px solid var(--line);border-radius:12px;padding:15px;background:#fafbfc}.answer p{line-height:1.55}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.qdot{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:750}
.qdot.ok{background:var(--greenbg);color:var(--green);border-color:#9bd0b1}.qdot.err{background:var(--redbg);color:var(--red);border-color:#ebb0b0}.qdot.current{border:2px solid var(--dark)}
.qdot.marked{outline:2px solid #d5a525}.qdot.warn{box-shadow:inset 0 -4px 0 #d5a525}
.examhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.timer{font-variant-numeric:tabular-nums;font-weight:750}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,24,32,.48);display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}
.modalbox{width:min(660px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:21px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:10px}
.choice{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);padding:10px;border-radius:11px;margin:7px 0}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow:auto}.topic-list{display:grid;gap:7px;margin-top:12px}.topic-row{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:12px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}.footer{margin:25px 0 5px;color:var(--muted);font-size:12px}
</style>

<script>
const DATA={"version": 2, "official_topics": {"A": [{"name": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "count": 19}, {"name": "Hérnias de Parede Abdominal", "count": 18}, {"name": "Complicações e cuidados pós-operatórias; Infecção em cirurgia - Hematoma - Seroma - Deiscência - Evisceração.", "count": 10}, {"name": "Resposta endócrino metabólica ao trauma", "count": 8}, {"name": "Cuidados pré-operatórios; Risco cirúrgico (ASA - Goldman)", "count": 10}, {"name": "Afecções hepáticas: diagnósgtico/tratamento/complicações (Hipertensão portal; nódulos e abcessos hepáticos;)", "count": 10}, {"name": "Afecções da árvore biliar: colecistolitíase, coledocolitíase, íleo biliar, colangiocarcinoma", "count": 7}, {"name": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "count": 12}, {"name": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "count": 10}, {"name": "Condutas intervencionistas em derrame pleural Toracocentese", "count": 9}, {"name": "Tipos de fios, suturas e feridas.", "count": 9}, {"name": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "count": 9}], "B": [{"name": "ATLS- Aspectos históricos, exame primário e secundário, fase de cada um dos exames, aspectos intervencionistas no exameprimário e secundário", "count": 12}, {"name": "Cicatrização", "count": 14}, {"name": "Via áerea cirurgica", "count": 12}, {"name": "Trauma torácico (Pneumotórax aberto, fechado e hipertensivo, hemotórax, contusão pulmonar, tórax instável e tamponamento cardíaco)", "count": 13}, {"name": "Trauma abdominal e pélvico", "count": 15}, {"name": "Acesso venoso central", "count": 12}, {"name": "Queimaduras / síndrome compartimental", "count": 14}, {"name": "DAOP + Obstrução arterial aguda; Aneurisma de aorta", "count": 13}, {"name": "Insuficiência venosa crônica; Trombose Venosa Profunda - TVP", "count": 14}, {"name": "Noções de anestesia periférica", "count": 13}, {"name": "Urgências urológicas: Torção testicular, priapismo, urolitíase e orquiedpidimite", "count": 15}, {"name": "Abdome agudo em pediatria: intussuscepção, vólvulo, má rotação intestinal", "count": 13}]}, "exams": [{"id": "cirurgia-a", "title": "CC — Cirurgia A", "subtitle": "Tópicos A", "group": "A", "questions": [{"n": 1, "meta": "(2024.2) ROT.1-B-14T: Q.4", "stem": "Na emergência, um estudante de medicina é chamado para avaliar um paciente de 55 anos com dor abdominal intensa, vômitos e rigidez abdominal. A radiografia de abdome revela presença de ar sob o diafragma bilateralmente. Qual é o diagnóstico mais provável e a intervenção inicial recomendada?", "opts": {"A": "Pancreatite aguda; hidratação agressiva", "B": "Perfuração de víscera oca; laparotomia exploratória", "C": "Peritonite bacteriana espontânea; antibioticoterapia", "D": "Obstrução intestinal; dieta líquida e observação"}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "B", "comment": "A) \"Pancreatite aguda; hidratação agressiva\" INCORRETA. Pancreatite não causa pneumoperitônio. B) \"Perfuração de víscera oca; laparotomia exploratória\" CORRETA. Ar sob o diafragma sugere perfuração, necessitando cirurgia exploratória urgente. C) \"Peritonite bacteriana espontânea; antibioticoterapia\" INCORRETA. Peritonite espontânea não apresenta pneumoperitônio. D) \"Obstrução intestinal; dieta líquida e observação\" INCORRETA. Obstrução intestinal sem sinais de perfuração é manejada de forma conservadora inicialmente."}, {"n": 2, "meta": "(2024.2) ROT.1-B-14T: Q.26", "stem": "Na emergência, uma estudante de medicina atende um paciente de 22 anos, sabidamente portador de obesidade grau 2, com dor abdominal no quadrante inferior direito, anorexia e febre baixa há cerca de 02 dias. O exame físico mostra sinal de Blumberg positivo. Qual é o exame diagnóstico mais apropriado para confirmar a suspeita de apendicite aguda neste paciente?", "opts": {"A": "Ultrassonografia de abdome", "B": "Radiografia de abdome", "C": "Tomografia computadorizada de abdome", "D": "Ressonância magnética de abdome"}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "C", "medical": "C", "comment": "A) \"Ultrassonografia de abdome\" INCORRETA. Ultrassonografia é útil, mas pode ser limitada em pacientes obesos ou com distensão gasosa. B) \"Radiografia de abdome\" INCORRETA. A radiografia não é adequada para diagnóstico de apendicite. C) \"Tomografia computadorizada de abdome\" CORRETA. A TC de abdome é o exame mais sensível e específico para diagnóstico de apendicite aguda. D) \"Ressonância magnética de abdome\" INCORRETA. RM não é usada de rotina para diagnóstico de apendicite aguda."}, {"n": 3, "meta": "(2024.2) ROT.1-B-14T: Q.29", "stem": "Um paciente de 65 anos, hipertenso e diabético, é admitido no hospital com diagnóstico de colecistite aguda. Ele apresenta febre, dor intensa no quadrante superior direito do abdômen e leucocitose. Após avaliação inicial e estabilização clínica, qual seria o plano de tratamento mais adequado?", "opts": {"A": "Implementar drenagem percutânea da vesícula biliar como primeira linha de tratamento, com adiamento da cirurgia até a resolução completa do quadro inflamatório.", "B": "Administrar antibióticos de amplo espectro e planejar colecistectomia laparoscópica precoce nas próximas 24 à 72 horas, considerando o estado clínico e os riscos cirúrgicos.", "C": "Iniciar antibióticos de amplo espectro e aguardar 48 horas para observar a resposta antes de considerar intervenção cirúrgica.", "D": "Optar por colecistectomia laparoscópica imediata, independentemente do estado clínico do paciente, como padrão de tratamento definitivo."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "B", "comment": "A) \"Implementar drenagem percutânea da vesícula biliar como primeira linha de tratamento, com adiamento da cirurgia até a resolução completa do quadro inflamatório.\" INCORRETA. A drenagem percutânea é indicada principalmente em pacientes de alto risco para cirurgia imediata ou com complicações graves. Não é a primeira linha para todos os casos de colecistite aguda. B) \"Administrar antibióticos de amplo espectro e planejar colecistectomia laparoscópica precoce nas próximas 24 à 72 horas, considerando o estado clínico e os riscos cirúrgicos.\" CORRETA. Representa o equilíbrio ideal entre intervenção precoce e avaliação do risco cirúrgico. A colecistectomia laparoscópica dentro de 24 a 72 horas é recomendada para pacientes com colecistite aguda, especialmente quando estabilizados clinicamente, como mencionado no Current Medical Diagnosis and Treatment. C) \"Iniciar antibióticos de amplo espectro e aguardar 48 horas para observar a resposta antes de considerar intervenção cirúrgica.\" INCORRETA. Embora os antibióticos sejam essenciais no manejo inicial da colecistite aguda, a espera prolongada sem considerar intervenção cirúrgica pode levar a complicações, especialmente em pacientes com comorbidades. D) \"Optar por colecistectomia laparoscópica imediata, independentemente do estado clínico do paciente, como padrão de tratamento definitivo.\" INCORRETA. A colecistectomia laparoscópica imediata sem avaliação cuidadosa do estado clínico pode não ser segura para todos os pacientes, especialmente aqueles com comorbidades como diabetes e hipertensão. Comentário adicional: A gestão da colecistite aguda deve considerar tanto as melhores práticas baseadas em evidências quanto as características individuais dos pacientes, como comorbidades e estabilidade clínica. A abordagem que combina a administração precoce de antibióticos com uma avaliação cuidadosa para intervenção cirúrgica precoce é fundamental para otimizar os resultados e minimizar as complicações. O tratamento deve ser personalizado, com base nas diretrizes, mas sempre adaptado ao estado clínico do paciente."}, {"n": 4, "meta": "(2025.2) ROT.1-A-12T: Q.5", "stem": "Um paciente masculino, 62 anos, previamente saudável, dá entrada no pronto atendimento com dor em hipogástrio há 48 horas, febre de 38,5°C, náuseas e diarreia. Ao exame físico, apresenta dor à palpação profunda no quadrante inferior esquerdo, sem sinais de irritação peritoneal. Tomografia de abdome com contraste revela espessamento da parede do cólon sigmoide e bolhas de gás pericólicas. Qual das condutas antibióticas iniciais é mais adequada para este paciente?", "opts": {"A": "Ciprofloxacino como monoterapia, pois cobre a maioria das bactérias entéricas.", "B": "Metronidazol como monoterapia, considerando o padrão entérico anaeróbico.", "C": "Amoxicilina + clavulanato via oral, pois é eficaz contra germes gram- negativos e anaeróbios e pode ser usada ambulatorialmente.", "D": "Ceftriaxona IV associada a metronidazol IV, como cobertura empírica para gram-negativos entéricos e anaeróbios."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "D", "medical": "D", "comment": "A) \"Ciprofloxacino como monoterapia, pois cobre a maioria das bactérias entéricas.\" INCORRETA. Ciprofloxacino não cobre anaeróbios e não é indicado isoladamente. B) \"Metronidazol como monoterapia, considerando o padrão entérico anaeróbico.\" INCORRETA. A monoterapia com metronidazol é inadequada, pois cobre apenas anaeróbios. C) \"Amoxicilina + clavulanato via oral, pois é eficaz contra germes gram- negativos e anaeróbios e pode ser usada ambulatorialmente.\" INCORRETA. Amoxicilina + clavulanato pode ser usada ambulatorialmente em quadros leves, mas neste caso o paciente apresenta febre e achado tomográfico com gás pericólico, sugerindo indicação de internação e tratamento IV. D) \"Ceftriaxona IV associada a metronidazol IV, como cobertura empírica para gram-negativos entéricos e anaeróbios.\" CORRETA. O quadro clínico é compatível com diverticulite aguda não complicada. Segundo diretrizes atuais, a antibioticoterapia empírica deve cobrir bactérias anaeróbias (ex: Bacteroides fragilis) e gram-negativos entéricos (ex: E. coli). Assim, a associação ceftriaxona + metronidazol é uma das combinações padrão em contexto hospitalar.", "issue": {"confidence": "Alta", "title": "Comentário do material merece correção de terminologia", "text": "O comentário do PDF descreve o quadro como diverticulite não complicada. Porém, bolhas de gás pericólicas/extraluminais indicam extensão além do cólon e são classificadas pela WSES como diverticulite complicada, estágio 1A. O gabarito D pode continuar defensável; o alerta é para não memorizar a classificação como 'não complicada'.", "source": "WSES/GAIS/SIS-E/WSIS/AAST global clinical pathways (2021): estágio 1A = bolhas de ar pericólicas ou pequeno líquido pericólico sem abscesso."}}, {"n": 5, "meta": "(2025.2) ROT.1-A-12T: Q.15", "stem": "Um homem de 64 anos, hipertenso e diabético, dá entrada no pronto-socorro com dor abdominal difusa de início há 48 horas, inicialmente em fossa ilíaca esquerda, acompanhada de febre (38,5 °C), náuseas e parada da eliminação de fezes e flatos há 24h. Ao exame físico, está taquicárdico (FC 112 bpm), hipotenso (PA 80/50 mmHg), com abdome distendido, doloroso difusamente. A tomografia computadorizada mostra espessamento de sigmoide com presença de ar extraluminal pericolônico e líquido livre. Com base nos dados clínicos, qual deve ser a conduta imediata?", "opts": {"A": "Alta hospitalar com prescrição de antibiótico oral, analgesia e retorno ambulatorial em 48 horas para reavaliação clínica.", "B": "Laparotomia exploradora de urgência, devido à presença de sinais de peritonite e instabilidade hemodinâmica.", "C": "Internação para antibioticoterapia venosa, hidratação e observação clínica, com possível drenagem percutânea se houver piora do quadro.", "D": "Colonoscopia com sedação e preparo intestinal para confirmação diagnóstica antes de definir abordagem cirúrgica."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "B", "comment": "A) \"Alta hospitalar com prescrição de antibiótico oral, analgesia e retorno ambulatorial em 48 horas para reavaliação clínica.\" INCORRETA. Essa conduta é indicada em casos muito leves de diverticulite sem sinais sistêmicos. Neste caso, há sinais clínicos e tomográficos de complicação grave, além de instabilidade hemodinâmica, o que contraindica o manejo ambulatorial. B) \"Laparotomia exploradora de urgência, devido à presença de sinais de peritonite e instabilidade hemodinâmica.\" CORRETA. Segundo o Sabiston, pacientes com sinais de peritonite difusa ou instabilidade hemodinâmica devem ser encaminhados para cirurgia imediata, uma vez que há alto risco de perfuração ou necrose intestinal. C) \"Internação para antibioticoterapia venosa, hidratação e observação clínica, com possível drenagem percutânea se houver piora do quadro.\" INCORRETA. Essa conduta é aceitável em casos de diverticulite com abscesso bem localizado e paciente estável. Neste caso, há instabilidade hemodinâmica e sinais de peritonite generalizada, o que contraindica tratamento conservador. D) \"Colonoscopia com sedação e preparo intestinal para confirmação diagnóstica antes de definir abordagem cirúrgica.\" INCORRETA. A colonoscopia está contraindicada na fase aguda da diverticulite complicada devido ao risco de perfuração, além de atrasar o tratamento cirúrgico em um paciente instável."}, {"n": 6, "meta": "(2025.2) ROT.1-A-12T: Q.18", "stem": "Paciente masculino, 12 anos, procura a UPA com a mãe por dor abdominal há 2 dias. Relata início com cólica difusa, posteriormente localizada em fossa ilíaca direita. Refere inapetência, náuseas, vômitos e febre (38,5 °C durante a madrugada). Sinais vitais: FC 98 bpm, PA 110×70 mmHg, Temp 38 °C. Ao exame: corado, levemente desidratado, lúcido. Abdômen plano, doloroso em fossa ilíaca direita, com plastrão palpável e sinal de descompressão brusca positivo. Com base no quadro clínico, qual é a principal hipótese diagnóstica?", "opts": {"A": "Adenite mesesentérica.", "B": "Apendicite aguda.", "C": "Intuscepção intestinal.", "D": "Gastroenterocolite aguda."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "B", "comment": "O caso descreve um paciente de 12 anos com dor abdominal inicialmente difusa, que migrou para a fossa ilíaca direita, associada a febre, náuseas, vômitos, inapetência e presença de plastrão palpável no exame físico, além de sinal de descompressão brusca positivo. Esse conjunto de achados é altamente sugestivo de apendicite aguda, especialmente em idade pediátrica. Para reforçar o raciocínio clínico, aplicamos o Escore de Alvarado, ferramenta útil na estratificação de risco para apendicite. O paciente pontua em: • Migração da dor para FID – 1 ponto. • Anorexia – 1 ponto. • Náuseas e vômitos – 1 ponto. • Dor à descompressão brusca (sinal de Blumberg) – 1 ponto. • Temperatura > 37,5 °C – 1 ponto. Total: 5 pontos, o que corresponde a risco moderado, justificando a avaliação cirúrgica imediata e exames complementares (como hemograma, imagem abdominal, etc.). Discussão das alternativas: A adenite mesentérica é uma causa comum de dor abdominal em crianças e pode mimetizar apendicite. No entanto, geralmente está associada a um quadro viral prévio, como infecções de vias aéreas superiores — o que não foi relatado no caso. Além disso, não costuma gerar plastrão ou sinais de peritonite. A intussuscepção intestinal ocorre mais frequentemente em crianças menores (3 meses a 3 anos). O quadro típico inclui dor abdominal intermitente, fezes em “geleia de morango” e sinais de obstrução. A faixa etária e o padrão clínico do caso não são compatíveis. A gastroenterocolite aguda pode causar sintomas inespecíficos como febre, vômitos e dor abdominal em cólica. No entanto, não apresenta dor migratória, plastrão palpável nem sinais de irritação peritoneal, o que afasta essa hipótese. Conclusão: a questão exige que o aluno reconheça um quadro clínico típico de apendicite aguda, integre os achados ao escore de Alvarado e exclua os principais diagnósticos diferenciais com base nos dados da história e exame físico."}, {"n": 7, "meta": "(2025.2) ROT.2-A-14T: Q.16", "stem": "Um paciente de 45 anos, previamente hígido, procura o pronto-socorro relatando dor súbita em hipocôndrio direito há cerca de 6 horas. A dor é contínua, de intensidade progressiva, associada a náuseas e um episódio de febre aferida em domicílio (38,3 °C). Nega icterícia ou colúria. Ao exame físico, apresenta sensibilidade importante em hipocôndrio direito, defesa local e sinal de Murphy positivo. Exames laboratoriais revelam leucocitose de 14.000 células/mm³, sem alterações significativas de bilirrubinas ou enzimas pancreáticas. Com base nos dados clínicos, no exame físico e nos achados laboratoriais, qual o diagnóstico mais provável?", "opts": {"A": "Colecistite aguda.", "B": "Coledocolitíase.", "C": "Pancreatite aguda biliar.", "D": "Colecistite crônica."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "A", "medical": "A", "comment": "A) \"Colecistite aguda.\" CORRETA. O paciente apresenta os elementos clássicos da tríade diagnóstica de colecistite aguda: dor em hipocôndrio direito, febre e leucocitose, associada a sinal de Murphy positivo (interrupção da inspiração profunda durante palpação do hipocôndrio direito). A história de dor contínua há mais de 6 horas também reforça a suspeita. D) \"Colecistite crônica.\" INCORRETA. A colecistite crônica resulta de episódios repetidos de inflamação, levando à fibrose e espessamento da parede vesicular. Seu quadro clínico é mais arrastado, com dor leve e recorrente, frequentemente associada a refeições gordurosas, sem febre nem alterações laboratoriais. Enquanto a forma aguda requer tratamento de urgência com colecistectomia, a crônica é abordada de forma eletiva, visando eliminar os sintomas e prevenir complicações. B) \"Coledocolitíase.\" INCORRETA. A coledocolitíase é a presença de cálculos no colédoco, frequentemente associada a icterícia e alteração das enzimas canaliculares (fosfatase alcalina, GGT, bilirrubina direta), além de poder evoluir para colangite. No caso descrito, não há icterícia nem alteração laboratorial sugestiva de obstrução biliar alta. C) \"Pancreatite aguda biliar.\" INCORRETA. A pancreatite aguda biliar ocorre quando cálculos impactam a papila de Vater, provocando inflamação pancreática. O quadro típico é de dor epigástrica em faixa irradiada para dorso, associada à elevação de amilase e/ou lipase. No caso descrito, a dor é localizada no hipocôndrio direito e não há dados laboratoriais de lesão pancreática."}, {"n": 8, "meta": "(2025.2) ROT.2-A-14T: Q.17", "stem": "Paciente masculino sofre acidente motociclístico com fratura de tíbia. Foi submetido à correção cirúrgica e recebeu alta no segundo dia de pós- operatório, com prescrição de antibiótico e anti-inflamatório não hormonal por 10 dias para uso domiciliar. Retorna ao pronto-socorro 7 dias após a alta com dor abdominal de início súbito e importante após se alimentar, distensão abdominal, parada da eliminação de fezes e flatos, vômitos, febre de 38,5 °C, taquicardia (FC 120 bpm), taquipneia (25 irpm), hipotensão (PA 100 × 50 mmHg), abdome distendido, doloroso à percussão, com perda da macicez na área hepática, hipertimpanismo difuso e ruídos hidroaéreos abolidos. O principal diagnóstico sindrômico é abdome agudo:", "opts": {"A": "perfurativo.", "B": "vascular.", "C": "hemorrágico.", "D": "inflamatório."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "A", "medical": "A", "comment": "A) \"perfurativo.\" CORRETA. O paciente apresenta um abdome agudo perfurativo devido a provável perfuração de úlcera péptica induzida pelo uso de anti-inflamatórios não esteroidais (AINEs). O abdome perfurativo ocorre por perfuração de víscera oca (ex.: úlcera péptica, diverticulite perfurada, perfuração traumática). Os achados clássicos são: dor súbita e intensa; sinais de irritação peritoneal; perda da macicez hepática (ar livre subdiafragmático → pneumoperitônio); instabilidade hemodinâmica. Esse é exatamente o quadro do paciente. C) \"hemorrágico.\" INCORRETA. O abdome agudo hemorrágico ocorre por sangramento intraperitoneal (ex.: ruptura de aneurisma de aorta, trauma com lesão de víscera sólida, gravidez ectópica rota). O quadro típico é de hipotensão e choque hipovolêmico, mas sem pneumoperitônio. No caso descrito, a perda da macicez hepática indica ar livre subdiafragmático, não sangue livre. B) \"vascular.\" INCORRETA. O abdome vascular decorre geralmente de isquemia ou trombose mesentérica. O achado clássico é a dor intensa desproporcional aos achados do exame físico, em pacientes idosos ou com fatores de risco cardiovasculares. Aqui há dor súbita acompanhada de sinais de peritonite e pneumoperitônio, o que não corresponde ao quadro vascular. D) \"inflamatório.\" A) \"Cefazolina associada à metronidazol, para cobertura adequada de gram- positivos e anaeróbios.\" INCORRETA. O abdome inflamatório inclui condições como apendicite, colecistite ou diverticulite. O quadro costuma ser de dor progressiva, febre e sinais localizados de irritação peritoneal. Embora o paciente tenha febre e dor, a súbita perda da macicez hepática e o pneumoperitônio não são compatíveis com essa etiologia."}, {"n": 9, "meta": "(2025.2) ROT.2-A-14T: Q.21", "stem": "Paciente do sexo masculino, 22 anos, previamente saudável, procura o pronto- socorro com dor abdominal iniciada há 18 horas, inicialmente em região periumbilical, que migrou para fossa ilíaca direita, associada a náuseas, vômitos e piora progressiva da dor. Ao exame, encontra-se pálido, sudoreico, com PA 94 × 58 mmHg, FC 124 bpm, dor intensa à palpação abdominal difusa, mais pronunciada em fossa ilíaca direita, defesa involuntária e dor à descompressão brusca. Qual a conduta mais adequada neste momento?", "opts": {"A": "Realizar analgesia potente e liberar o paciente para casa, recomendando retorno se houver piora dos sintomas.", "B": "Iniciar antibioticoterapia e hidratação venosa, mantendo o paciente em observação por 24 horas para reavaliação.", "C": "Solicitar tomografia computadorizada abdominal antes de qualquer intervenção, para confirmação diagnóstica.", "D": "Encaminhar o paciente imediatamente para cirurgia, com suporte hemodinâmico e antibioticoterapia de amplo espectro."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "D", "medical": "D", "comment": "CORRETA. O quadro clínico com sinais de irritação peritoneal difusa (como defesa involuntária e dor à descompressão brusca) e instabilidade hemodinâmica exige intervenção cirúrgica de urgência, não apenas observação. Embora a TC possa ajudar no diagnóstico em casos duvidosos, aqui os sinais clínicos são clássicos e indicam urgência cirúrgica absoluta. A realização do exame pode atrasar desnecessariamente a conduta. O paciente apresenta quadro de abdome agudo com complicação (provável perfuração ou apendicite complicada), com sinais de irritação peritoneal e instabilidade hemodinâmica, exigindo cirurgia de emergência após estabilização inicial. Alta hospitalar com esse quadro é contraindicada e pode trazer risco de vida iminente para o paciente. No caso: Alvarado = 6 → provável apendicite, mas o paciente já apresenta sinais de peritonite difusa e instabilidade hemodinâmica, o que indica cirurgia imediata, independentemente do escore."}, {"n": 10, "meta": "(2025.2) ROT.2-A-14T: Q.26", "stem": "Homem de 65 anos procura atendimento médico com queixa de dor no quadrante inferior esquerdo do abdome há 3 dias, associada a febre e episódios de diarreia. Ao exame físico, apresenta-se afebril no momento, com abdome doloroso à palpação profunda em fossa ilíaca esquerda, porém sem sinais de irritação peritoneal difusa. A tomografia computadorizada de abdome revela espessamento parietal do cólon sigmoide, alterações inflamatórias na gordura pericólica e coleção líquida com cerca de 5 cm de diâmetro, sugestiva de abscesso peridiverticular. Qual é a melhor conduta inicial frente ao achado radiológico?", "opts": {"A": "Internação, antibiótico venoso e drenagem percutânea do abscesso.", "B": "Cirurgia de urgência com colectomia segmentar e colostomia.", "C": "Colonoscopia urgente para afastar carcinoma oculto.", "D": "Antibioticoterapia oral ambulatorial, com reavaliação em 48 h."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "A", "medical": "A", "comment": "CORRETA. O quadro descrito é de diverticulite aguda complicada por abscesso pericólico ≥ 4 cm, evidenciado por tomografia. De acordo com diretrizes atualizadas, a conduta inicial preconizada nesses casos é a drenagem percutânea guiada por imagem associada à antibioticoterapia intravenosa. Abscessos ≥ 4 cm possuem alta taxa de falha com tratamento apenas medicamentoso, sendo recomendada a drenagem para controle da infecção e prevenção de complicações. INCORRETA. Cirurgia de urgência (ex.: colectomia com colostomia) é indicada somente em casos de peritonite generalizada, perfuração livre ou falha do tratamento conservador. INCORRETA. Tratamento ambulatorial com antibiótico oral está reservado a casos não complicados, ou seja, sem abscesso, fístula, obstrução ou peritonite. INCORRETA. Colonoscopia está contraindicada na fase aguda, devido ao risco de perfuração. A investigação endoscópica deve ser realizada após 4 a 6 semanas, quando o processo inflamatório estiver resolvido."}, {"n": 11, "meta": "(2025.2) ROT.3-A-14T: Q.7", "stem": "Um homem de 28 anos procura o pronto-atendimento com dor abdominal de início há 24 horas, localizada inicialmente em região epigástrica, que migrou para o quadrante inferior direito. Relata anorexia, náuseas e febre de 38,2 °C. Ao exame físico, apresenta dor à palpação profunda em fossa ilíaca direita. Os exames laboratoriais revelam leucocitose com desvio à esquerda. Com base na fisiopatologia do abdome agudo inflamatório, o achado clínico apresentado é mais compatível com:", "opts": {"A": "apendicite aguda, cuja inflamação inicia na mucosa e evolui com dor visceral seguida de irritação peritoneal localizada.", "B": "diverticulite aguda à direita, por ser mais comum em pacientes jovens e apresentar dor irradiada para epigástrio.", "C": "pancreatite aguda, pois o processo inflamatório costuma iniciar na epigástrio e irradiar para o flanco direito.", "D": "colecistite aguda, em que a dor epigástrica migra para o quadrante inferior direito por irritação do nervo frênico."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "A", "medical": "A", "comment": "A pancreatite aguda costuma causar dor epigástrica irradiada para o dorso, não com migração para fossa ilíaca direita. Na apendicite aguda, a dor inicialmente é visceral (epigástrio ou mesogástrio), migrando para fossa ilíaca direita quando ocorre irritação peritoneal somática. A colecistite aguda cursa com dor no hipocôndrio direito, podendo irradiar para escápula ou dorso, mas não para fossa ilíaca direita. A diverticulite à direita é rara, mesmo em jovens, e apresenta quadro mais insidioso, não com padrão clássico de migração da dor."}, {"n": 12, "meta": "(2025.1) ROT.1-B-14T: Q.16", "stem": "Paciente masculino, 45 anos, previamente saudável, apresenta dor abdominal difusa há 24 horas que evoluiu para dor localizada no quadrante inferior direito. Refere febre (38,5°C), anorexia e náuseas. Ao exame físico, o paciente apresenta sinal de Blumberg positivo e defesa à palpação profunda em fossa ilíaca direita. O hemograma mostra leucocitose com desvio à esquerda. Foi feito o diagnóstico clínico de apendicite aguda complicada com abscesso localizado confirmado por tomografia computadorizada. A equipe médica decide iniciar manejo medicamentoso antes de programar abordagem cirúrgica. Com base no caso apresentado, qual a melhor escolha terapêutica inicial, considerando o uso de antimicrobianos, e qual seria a justificativa para essa escolha?", "opts": {"A": "Cefazolina associada à metronidazol, para cobertura adequada de gram- positivos e anaeróbios.", "B": "Clindamicina isolada, devido à cobertura de anaeróbios, comum em abscessos e outras doenças abdominais.", "C": "Ceftriaxona associada a Metronidazol, devido à cobertura para organismos gram-negativos e anaeróbios.", "D": "Ciprofloxacino isolado, devido à eficácia contra gram-negativos no trato gastrointestinal com baixa toxicidade."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "C", "medical": "C", "comment": "INCORRETA. Embora o esquema com cefazolina e metronidazol forneça boa cobertura para gram-positivos e anaeróbios, ele não oferece cobertura adequada contra gram-negativos entéricos, frequentemente presentes em infecções intra-abdominais. B) \"Clindamicina isolada, devido à cobertura de anaeróbios, comum em abscessos e outras doenças abdominais.\" INCORRETA. Apesar de clindamicina ser eficaz contra anaeróbios, ela não cobre gram-negativos, que são uma parte crucial do espectro em abscessos intra-abdominais associados à apendicite complicada. C) \"Ceftriaxona associada a Metronidazol, devido à cobertura para organismos gram-negativos e anaeróbios.\" CORRETA. Ceftriaxona + Metronidazol é uma escolha terapêutica amplamente indicada para infecções intra-abdominais complicadas, como apendicite complicada com abscesso. Sua eficácia cobre gram-negativos entéricos, anaeróbios (como Bacteroides fragilis) e gram-positivos (como Enterococcus spp.), sendo essencial em infecções polimicrobianas. D) \"Ciprofloxacino isolado, devido à eficácia contra gram-negativos no trato gastrointestinal com baixa toxicidade.\" INCORRETA. Ciprofloxacino possui boa cobertura para gram-negativos, mas é insuficiente para cobrir os anaeróbios, que desempenham papel importante em abscessos intra-abdominais."}, {"n": 13, "meta": "(2025.1) ROT.1-B-14T: Q.21", "stem": "Um paciente de 28 anos, sexo masculino, chega à emergência com queixa de dor abdominal no quadrante inferior direito, associada a náuseas, febre e perda de apetite. Ele também relata que a dor começou de forma difusa, mas se localizou progressivamente na região direita do abdômen. Ao exame físico, observa-se sensibilidade à palpação na fossa ilíaca direita, com defesa de parede abdominal e sinal de Blumberg positivo. Não há histórico de outras alterações no hábito intestinal ou icterícia. A conduta mais adequada seria:", "opts": {"A": "Solicitar exames laboratoriais (como hemograma e amilase) e aguardar 48 horas para observar a evolução da dor antes de determinar o diagnóstico definitivo.", "B": "Deve se iniciar antibiótico e considerar cirurgia, sem a necessidade de demais exames complementares, visto que pelo escore de Alvarado, o caso é altamente sugestivo de apendicite.", "C": "Realizar uma ultrassonografia abdominal para excluir apendicite e diverticulite, e só indicar tomografia abdominal se houver dúvida diagnóstica quanto à colecistite.", "D": "Realizar uma tomografia abdominal para confirmar o diagnóstico de apendicite e excluir outras condições, como colecistite e diverticulite."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "D", "comment": "A) \"Solicitar exames laboratoriais (como hemograma e amilase) e aguardar 48 horas para observar a evolução da dor antes de determinar o diagnóstico definitivo.\" INCORRETA. A conduta de aguardar 48 horas e apenas solicitar exames laboratoriais é inadequada, pois o paciente apresenta um quadro clínico que sugere apendicite aguda. A espera pode levar a complicações, como perfuração do apêndice, que pode ser evitada com a intervenção cirúrgica precoce. B) \"Deve se iniciar antibiótico e considerar cirurgia, sem a necessidade de demais exames complementares, visto que pelo escore de Alvarado, o caso é altamente sugestivo de apendicite.\" CORRETA. Essa abordagem é indicada, pois, em casos clássicos de apendicite aguda, o tratamento inicial muitas vezes envolve a administração de antibióticos e a realização de apendicectomia, sem a necessidade de exames adicionais, especialmente se a apresentação clínica é clara. No caso em questão, escore de Alvarado = 7; risco alto de apendicite aguda. Existe a necessidade de internação hospitalar e avaliação de um cirurgião para observação e acompanhamento da evolução do quadro. C) \"Realizar uma ultrassonografia abdominal para excluir apendicite e diverticulite, e só indicar tomografia abdominal se houver dúvida diagnóstica quanto à colecistite.\" INCORRETA. Embora a ultrassonografia possa ser útil em algumas situações para avaliar condições abdominais, o quadro clínico é bastante sugestivo de apendicite. A realização de ultrassonografia como primeiro passo pode atrasar o tratamento, e a tomografia não deve ser a primeira escolha se a apendicite é altamente suspeita. D) \"Realizar uma tomografia abdominal para confirmar o diagnóstico de apendicite e excluir outras condições, como colecistite e diverticulite.\" INCORRETA. Embora a tomografia seja um exame diagnóstico eficaz, o caso é clássico para apendicite e muitas vezes não é necessário confirmar o diagnóstico por imagem antes de iniciar o tratamento. O atraso na cirurgia pode aumentar o risco de complicações, e a abordagem inicial deve ser mais direta.", "issue": {"confidence": "Moderada", "title": "Possível questão passível de recurso / gabarito discutível", "text": "O gabarito oficial é B e usa Alvarado = 7 como justificativa para iniciar antibiótico e considerar cirurgia sem exames adicionais. Diretrizes atuais recomendam combinar estratificação clínica e imagem para aumentar a acurácia; o Alvarado isolado não deve ser tratado como confirmação positiva em adultos. Entre as alternativas fornecidas, D é mais defensável para um adulto não gestante com suspeita de apendicite, embora a decisão real de imagem dependa do contexto clínico e do protocolo local.", "source": "WSES Jerusalem Guidelines 2025: escores clínicos e imagem melhoram a acurácia diagnóstica; IDSA 2024 aborda imagem na suspeita de apendicite em adultos."}}, {"n": 14, "meta": "(2025.1) ROT.1-B-14T: Q.22", "stem": "Um paciente do sexo masculino, 65 anos, chega ao pronto-socorro apresentando dor abdominal intensa no quadrante inferior esquerdo, febre de 38,5°C, e sinais de desidratação. Durante o exame físico, o abdômen está distendido e sensível à palpação, com defesa muscular, mas sem irritação peritoneal franca. Exames laboratoriais revelam 20.000 leucócitos, com neutrofilia. A tomografia computadorizada revela um abscesso pericólico de 6 cm na fossa ilíaca esquerda, sem sinais de perfuração livre. É seu primeiro episódio de diverticulite na vida. Considerando a condição clínica do paciente, qual das alternativas abaixo representa o tratamento mais apropriado nesta fase?", "opts": {"A": "Drenagem percutânea do abscesso e tratamento clínico com antibióticos.", "B": "Colostomia em alça, no hipocôndrio direito, imediatamente.", "C": "Tratamento conservador com antibióticos, anti-inflamatórios e repouso.", "D": "Cirurgia laparoscópica de ressecção do segmento afetado."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "A", "medical": "A", "comment": "O tratamento padrão para diverticulite que envolve a presença de abscesso maior que 3 cm é a drenagem percutânea do abscesso, seguida de tratamento clínico conservador com antibióticos e suporte geral. Essa abordagem permite controlar a infecção e estabilizar o paciente antes de qualquer intervenção cirúrgica mais invasiva. As demais alternativas são erradas pelas seguintes razões: • O tratamento conservador com antibióticos e repouso não é suficiente para um caso de diverticulite com presença de abscesso que requer drenagem. • A cirurgia laparoscópica de ressecção pode ser necessária em casos mais avançados ou se houver falha no tratamento conservador, mas não é a primeira linha de tratamento quando existe um abscesso controlável por drenagem. • A colostomia é uma medida extrema e não é a abordagem inicial recomendada para casos como esse, sendo geralmente considerada em situações mais complexas ou quando há complicações irreversíveis."}, {"n": 15, "meta": "(2025.1) ROT.2-B-14T: Q.2", "stem": "Paciente de 24 anos de idade, masculino, inicia com dor abdominal epigástrica há 24 horas associada a náusea severa. Nas últimas 12 horas, a referida dor abdominal evoluiu com localização no quadrante inferior direito. No exame físico, atualmente, o paciente apresenta sinais de Bloomberg e Rovsing presentes e, após exames complementares, pode ser afirmado que na escala de Alvarado há uma pontuação de 8. Vislumbrando o provável diagnóstico, deve ser iniciado tratamento antibioticoterápico visando combater mais comumente o seguinte patógeno:", "opts": {"A": "Staphylococcus aureus.", "B": "Streptococcus pyogenes.", "C": "Staphylococcus epidermidis.", "D": "Escherichia coli."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "D", "medical": "D", "comment": "D) \"Escherichia coli.\" CORRETA. Diagnóstico de apendicite aguda. A bactéria desta alternativa é gram-negativa, normalmente encontrada no intestino grosso e o patógeno mais comum causador da apendicite aguda. A) \"Staphylococcus aureus.\" INCORRETA. A bactéria desta alternativa é gram-positiva, normalmente encontrada em infecções de pele. C) \"Staphylococcus epidermidis.\" INCORRETA. Diagnóstico de apendicite aguda. A bactéria desta alternativa é gram-positiva, oportunista, que normalmente causa infecções hospitalares. B) \"Streptococcus pyogenes.\" INCORRETA. Diagnóstico de apendicite aguda. A bactéria desta alternativa é gram-positiva, causadora normalmente de faringite."}, {"n": 16, "meta": "(2025.1) ROT.3-B-14T: Q.8", "stem": "Um paciente de 45 anos dá entrada na emergência com dor abdominal localizada no quadrante inferior esquerdo, febre e leucocitose. A tomografia computadorizada de abdome com contraste mostra espessamento da parede do cólon sigmoide, infiltração da gordura pericólica e presença de bolhas de gás extraluminal sem líquido livre abundante. Considerando o quadro clínico e os achados radiológicos, qual das alternativas corresponde corretamente ao diagnóstico mais provável e aos principais achados de imagem associados às demais condições inflamatórias abdominais agudas?", "opts": {"A": "O diagnóstico é de obstrução intestinal secundária à má rotação.", "B": "Trata-se de diverticulite aguda.", "C": "O quadro é compatível com apendicite aguda.", "D": "Trata-se de colecistite aguda."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "B", "comment": "A) \"O diagnóstico é de obstrução intestinal secundária à má rotação.\" INCORRETA. Esta condição é típica da infância, e os achados descritos no enunciado são mais compatíveis com inflamação colônica segmentar. B) \"Trata-se de diverticulite aguda.\" CORRETA. A diverticulite aguda do sigmoide é comum após os 40 anos, e os achados descritos na TC são clássicos, principalmente quando complicações como perfuração localizada estão presentes. C) \"O quadro é compatível com apendicite aguda.\" INCORRETA. Apendicite aguda se manifesta por espessamento e dilatação do apêndice (>6 mm), realce da parede e inflamação da gordura periapendicular, não necessariamente com dilatação do ceco ou gás livre. D) \"Trata-se de colecistite aguda.\" INCORRETA. A colecistite aguda cursa com espessamento da parede da vesícula, líquido perivesicular e sinal de Murphy ultrassonográfico positivo, sem relação com espessamento colônico."}, {"n": 17, "meta": "(2025.1) ROT.3-B-14T: Q.22", "stem": "Um paciente de 68 anos, com histórico de hipertensão arterial sistêmica (HAS) e diabetes mellitus (DM) insulinodependente de difícil controle, deu entrada em uma unidade de pronto atendimento relatando dor intensa no hipocôndrio direito, com início há aproximadamente 48 horas. O quadro clínico é acompanhado de náusea, um episódio de vômito e febre (38 ºC). O uso de analgésicos proporcionou alívio mínimo dos sintomas. Foram solicitados exames laboratoriais e uma tomografia computadorizada (TC) de abdome como parte da investigação inicial, que revelou quadro sugestivo de colecistite aguda enfisematosa. Considerando o quadro clínico descrito, qual é o principal agente etiológico associado a essa condição?", "opts": {"A": "Escherichia coli", "B": "Clostridium perfringens", "C": "Klebsiella pneumoniae", "D": "Proteus mirabilis"}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "B", "medical": "B", "comment": "Resposta correta: Clostridium welchii. O paciente apresenta um quadro clínico sugestivo de colecistite aguda enfisematosa, uma forma grave de colecistite aguda caracterizada pela presença de gás na parede da vesícula biliar, identificado na tomografia de abdome. Esse tipo de infecção ocorre com maior frequência em pacientes diabéticos e idosos, como o caso descrito. A colecistite enfisematosa é causada por bactérias anaeróbias formadoras de gás, sendo o Clostridium welchii (sinônimo de Clostridium perfringens) o agente etiológico mais comum. Esse microrganismo consegue produzir toxinas e gás, explicando a presença de ar na parede da vesícula observada na TC. Demais alternativas: A) \"Escherichia coli\" INCORRETA. A E. coli é uma bactéria Gram-negativa frequentemente envolvida em infecções do trato urinário e em casos de colecistite aguda não enfisematosa. Embora possa estar presente em até 15% dos casos de colecistite enfisematosa, não é o agente mais prevalente. Apesar de ser comum em infecções abdominais, não é a principal causadora da forma enfisematosa da doença. C) \"Klebsiella pneumoniae\" INCORRETA. A Klebsiella pneumoniae pode ser isolada em alguns casos de infecções biliares, incluindo colecistite aguda, especialmente em pacientes imunossuprimidos e diabéticos. Apesar de estar associada a infecções graves, não é o microrganismo mais comum na colecistite enfisematosa. Embora possa estar presente, sua prevalência é menor em comparação com o Clostridium welchii. D) \"Proteus mirabilis\" INCORRETA. O Proteus mirabilis é uma bactéria Gram-negativa, associada principalmente a infecções do trato urinário e à formação de cálculos renais devido à sua capacidade de produzir urease. Raramente está envolvido em infecções da vesícula biliar, especialmente na forma enfisematosa. Não é um patógeno comum em colecistite enfisematosa."}, {"n": 18, "meta": "(2026.1) ROT.1-A: Q.14", "stem": "Um homem de 32 anos chega ao pronto atendimento com dor abdominal há 36 horas. Relata início em região periumbilical, com piora progressiva e migração para quadrante inferior direito; nas últimas 8 horas, a dor tornou-se difusa, intensa, associada a febre alta e prostração. Ao exame: • PA 92/58 mmHg • FC 122 bpm • T 39,1 °C • Pele fria • Dor abdominal difusa com rigidez, descompressão brusca positiva e distensão abdominal Hemograma: • Leucócitos 19.800/mm³ com desvio à esquerda Diante do quadro descrito, selecione a conduta imediata mais adequada para reduzir o risco de complicações e mortalidade.", "opts": {"A": "Solicitar tomografia e manter analgesia, aguardando confirmação por imagem antes de qualquer decisão terapêutica.", "B": "Programar drenagem percutânea e apendicectomia eletiva em 6 semanas, independentemente do exame físico atual.", "C": "Iniciar ressuscitação volêmica e antibiótico intravenoso de amplo espectro, e indicar encaminhamento imediato para abordagem cirúrgica.", "D": "Prescrever antibiótico venoso e encaminhar para o Centro de Terapia Intensiva (CTI) para monitorização contínua e vigilância clínica."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "C", "medical": "C", "comment": "C) \"Iniciar ressuscitação volêmica e antibiótico intravenoso de amplo espectro, e indicar encaminhamento imediato para abordagem cirúrgica.\" CORRETA. O texto-base descreve instabilidade hemodinâmica, febre alta/toxemia e sinais de peritonite generalizada (rigidez, descompressão positiva, distensão/íleo), compatíveis com apendicite complicada por perfuração e peritonite, situação em que a prioridade é estabilizar e encaminhar imediatamente para cirurgia, associando antibiótico intravenoso. A) \"Solicitar tomografia e manter analgesia, aguardando confirmação por imagem antes de qualquer decisão terapêutica.\" INCORRETA. Está incorreta porque, diante de peritonite e instabilidade, a conduta deve ser imediata (estabilização e cirurgia), e a espera por imagem pode atrasar tratamento definitivo e piorar desfechos. D) \"Prescrever antibiótico venoso e encaminhar para o Centro de Terapia Intensiva (CTI) para monitorização contínua e vigilância clínica.\" INCORRETA. Está incorreta porque o quadro é de gravidade, com provável perfuração/peritonite; antibiótico venoso e encaminhamento para o CTI são condutas parcialmente adequadas. O tratamento cirúrgico deve ser imediato, além das condutas clínicas listadas na alternativa. B) \"Programar drenagem percutânea e apendicectomia eletiva em 6 semanas, independentemente do exame físico atual.\" INCORRETA. Está incorreta porque drenagem percutânea/intervalo é opção para abscesso localizado e paciente estável; aqui há sinais de peritonite generalizada e instabilidade, exigindo abordagem urgente."}, {"n": 19, "meta": "(2026.1) ROT.1-A: Q.15", "stem": "Um homem de 47 anos procura o pronto atendimento por dor abdominal há 18 horas. Relata início em hipogástrio e fossa ilíaca esquerda, com piora progressiva e febre baixa. Refere alteração do hábito intestinal nos últimos dias. Ao exame, apresenta dor localizada em quadrante inferior esquerdo, com defesa voluntária e sensibilidade aumentada à palpação profunda nessa região. Nega dor em hipocôndrio direito e não apresenta piora da dor à inspiração profunda durante palpação subcostal direita. Identifique o diagnóstico mais provável para o quadro descrito no caso acima.", "opts": {"A": "Diverticulite aguda.", "B": "Apendicite aguda.", "C": "Colecistite aguda.", "D": "Pancreatite aguda."}, "topic": "Abdome agudo inflamatório e suas complicações (apendicite, colicistite, diverticulite)", "official": "A", "medical": "A", "comment": "A) \"Diverticulite aguda.\" CORRETA. Dor predominante em quadrante inferior esquerdo associada a febre baixa e alteração do hábito intestinal sugere processo inflamatório colônico, compatível com diverticulite. A ausência de sinais típicos de colecistite (dor em hipocôndrio direito com sinal de Murphy) e o padrão de dor não compatível com apendicite (mais comum em quadrante inferior direito) sustentam a escolha. B) \"Apendicite aguda.\" INCORRETA. O padrão típico envolve dor que tende a localizar-se em quadrante inferior direito, e não em fossa ilíaca esquerda, como no caso. C) \"Colecistite aguda.\" INCORRETA. A colecistite costuma cursar com dor em hipocôndrio direito e pode apresentar sinal de Murphy, ausentes no texto-base. D) \"Pancreatite aguda.\" INCORRETA. O quadro clássico inclui dor em epigástrio com irradiação para dorso e costuma exigir correlação com achados laboratoriais, o que não corresponde ao padrão localizado em quadrante inferior esquerdo descrito."}, {"n": 20, "meta": "(2024.2) ROT.1-B-14T: Q.3", "stem": "Um engenheiro de software de 40 anos procura atendimento médico com queixas de uma massa palpável e dolorosa na região da virilha direita, notada especialmente após longos períodos sentado. Ele relata que a protuberância se torna mais proeminente ao se levantar ou tossir e menciona um histórico de levantamento ocasional de objetos pesados em sua garagem. Durante o exame físico, o médico realiza a manobra de Landivar para avaliar a massa. Qual é a finalidade da manobra realizada pelo médico neste caso?", "opts": {"A": "Diferenciar se a protuberância é uma hérnia inguinal ou femoral.", "B": "Determinar se a protuberância é uma hérnia inguinal direta ou indireta.", "C": "Medir o tamanho da protuberância inguinal e determinar se é redutível.", "D": "Avaliar a sensibilidade e a dor associadas à protuberância inguinal."}, "topic": "Hérnias de Parede Abdominal", "official": "B", "medical": "B", "comment": "A) \"Diferenciar se a protuberância é uma hérnia inguinal ou femoral.\" INCORRETA. A diferenciação entre hérnia inguinal e femoral não é o propósito principal da manobra de Landivar, mas sim de outras manobras, como a de Silk. B) \"Determinar se a protuberância é uma hérnia inguinal direta ou indireta.\" CORRETA. A manobra de Landivar é especificamente utilizada para diferenciar hérnias inguinais diretas de indiretas. O examinador oclui o anel inguinal superficial e observa se há protrusão durante a tosse do paciente. A protrusão através do anel sugere uma hérnia indireta, enquanto a ausência de protrusão sugere uma hérnia direta. Este método ajuda a planejar o manejo cirúrgico apropriado. C) \"Medir o tamanho da protuberância inguinal e determinar se é redutível.\" INCORRETA. Esta manobra não é utilizada para medir o tamanho da protuberância, mas sim para determinar a sua natureza. D) \"Avaliar a sensibilidade e a dor associadas à protuberância inguinal.\" INCORRETA. A manobra de Landivar não é usada para avaliar dor ou sensibilidade; seu foco é identificar o tipo de hérnia."}, {"n": 21, "meta": "(2024.2) ROT.1-B-14T: Q.17", "stem": "Um paciente do sexo masculino, com 50 anos de idade, comparece ao ambulatório apresentando uma massa palpável e dolorosa na região inguinal direita. Ele relata que a massa tem aumentado progressivamente de tamanho ao longo dos últimos meses. Além disso, o paciente menciona desconforto durante esforços físicos e ao tossir. Após a avaliação inicial, suspeita-se de uma hérnia inguinal. Onde está o defeito anatômico mais provável e relacionado aos sinais e sintomas do paciente?", "opts": {"A": "Na parede posterior do canal inguinal, causando hérnia direta.", "B": "No ligamento púbico.", "C": "Na parede anterior do canal inguinal, causando hérnia femoral.", "D": "Na linha alba, por fragilidade da fáscia transversalis."}, "topic": "Hérnias de Parede Abdominal", "official": "A", "medical": "A", "comment": "Justificativa da alternativa correta (baseada no Tratado de Cirurgia do Sabiston, 20ª edição): A hérnia inguinal é caracterizada pelo protrusão de conteúdo intra-abdominal através do canal inguinal ou por defeito da parede posterior do abdome, podendo ser classificada como direta, indireta, femoral ou mista. O conteúdo protruso geralmente inclui alças intestinais ou gordura visceral. Os sinais e sintomas apresentados pelo paciente, como a presença de uma massa palpável e dolorosa na região inguinal, são consistentes com um defeito na parede anterior do canal inguinal. A dor associada ao esforço físico e tosse também é comum em casos de hérnia inguinal."}, {"n": 22, "meta": "(2025.2) ROT.1-A-12T: Q.12", "stem": "Um homem de 54 anos, pedreiro, com histórico de tabagismo e DPOC leve, procura atendimento ambulatorial relatando abaulamento intermitente na região inguinal direita há 8 meses, que aumenta ao realizar esforço físico e reduz espontaneamente em repouso. Nega dor intensa, náuseas, vômitos ou febre. No exame físico, é possível reduzir manualmente o conteúdo herniário, sem sinais inflamatórios locais ou encarceramento. O cirurgião assistente indica hernioplastia eletiva. Considerando os dados clínicos e as recomendações atuais, qual é a conduta cirúrgica mais adequada quanto ao uso de tela (prótese) nesse caso?", "opts": {"A": "Postergar a cirurgia e indicar tratamento clínico, pois hérnias redutíveis e assintomáticas não exigem abordagem cirúrgica em pacientes com comorbidades.", "B": "Indicar correção cirúrgica com tela, pois se trata de hérnia inguinal primária em paciente adulto com boa resposta imunológica e baixo risco de contaminação.", "C": "Realizar herniorrafia convencional sem tela, uma vez que se trata de hérnia redutível e não complicada, com risco mínimo de recidiva.", "D": "Evitar o uso de tela, pois o tabagismo e a DPOC aumentam o risco de infecção e complicações relacionadas ao implante protético."}, "topic": "Hérnias de Parede Abdominal", "official": "B", "medical": "B", "comment": "O uso de tela em hérnias inguinais primárias em adultos é o padrão ouro, inclusive em pacientes com comorbidades controladas, pois reduz drasticamente a taxa de recidiva. A ausência de sinais de infecção e a possibilidade de cirurgia eletiva favorecem essa abordagem. Embora tabagismo e DPOC aumentem o risco de complicações, não contraindicam o uso de tela quando não há infecção ativa ou contaminação. A herniorrafia sem tela apresenta taxas significativamente maiores de recidiva, especialmente em adultos. Hérnias inguinais em adultos sintomáticos e com restrições funcionais devem ser operadas eletivamente, mesmo se redutíveis, para evitar complicações futuras."}, {"n": 23, "meta": "(2025.2) ROT.1-A-12T: Q.22", "stem": "Homem de 59 anos, com antecedente de laparotomia mediana há 2 anos para colectomia direita por neoplasia de cólon, comparece ao ambulatório com queixa de abaulamento em região periumbilical que aumenta com esforço físico. Refere desconforto local, mas sem dor intensa ou sinais de complicação. O exame físico revela tumoração redutível em linha média, sem sinais flogísticos. Com base no caso apresentado e nos conceitos anatômicos e clínicos das hérnias da parede abdominal, qual é a classificação correta da hérnia descrita e qual exame complementa o raciocínio clínico na suspeita de complicações?", "opts": {"A": "Hérnia periumbilical direta; a ecografia é o método padrão-ouro para diagnóstico e planejamento cirúrgico.", "B": "Hérnia epigástrica; o exame clínico é suficiente para avaliar risco de encarceramento.", "C": "Hérnia umbilical; a classificação deve ser feita com base apenas em achado físico e medida do anel herniário.", "D": "Hérnia incisional; a tomografia é útil para avaliação do conteúdo herniado e riscos de estrangulamento."}, "topic": "Hérnias de Parede Abdominal", "official": "D", "medical": "D", "comment": "A descrição do caso é compatível com hérnia incisional, que ocorre no sítio de cicatriz cirúrgica prévia. A tomografia de abdome é o exame de imagem mais útil para identificar conteúdo herniado, presença de alças, grau de compressão e sinais de estrangulamento (espessamento parietal, realce, líquido livre ou pneumoperitônio). Além disso, auxilia no planejamento operatório, principalmente em hérnias volumosas ou múltiplas. Distrator que propõe hérnia epigástrica: ocorre na linha média entre o apêndice xifoide e a cicatriz umbilical, não em áreas de cicatriz cirúrgica. Não envolve geralmente alças intestinais e seu risco de complicação é baixo, mas a tomografia é mais precisa que o exame físico em casos duvidosos. Distrator que aponta hérnia inguinal direta: não há referência a abaulamento em região inguinal. Além disso, o caso descreve abaulamento periumbilical em cicatriz mediana, típico de hérnia incisional. A ecografia é útil, mas não é padrão ouro para avaliação de complicações em hérnias incisionais. Distrator que menciona hérnia umbilical: ocorre na linha média em pacientes sem cirurgia prévia, enquanto hérnias em cicatrizes cirúrgicas são consideradas incisionais, mesmo que próximas ao umbigo. A classificação exige imagem para avaliar o tamanho do defeito e o conteúdo herniado."}, {"n": 24, "meta": "(2025.2) ROT.2-A-14T: Q.6", "stem": "Homem de 48 anos, obeso (IMC 34), com antecedente de apendicectomia há 8 anos, é avaliado no ambulatório de cirurgia devido à queixa de abaulamento em região inferior direita do abdome, que aumenta com esforço e reduz em repouso. No exame físico, constata-se hérnia incisional não complicada. Considerando as opções de tratamento cirúrgico, qual das alternativas abaixo apresenta a melhor conduta neste caso, com base nas diretrizes atuais?", "opts": {"A": "Optar por cirurgia aberta sem uso de tela, pois reduz risco de infecção.", "B": "Indicar abordagem laparoscópica, preferencialmente em pacientes com IMC elevado.", "C": "Indicar abordagem aberta com anestesia local, independentemente do IMC.", "D": "Evitar qualquer tipo de correção cirúrgica em pacientes com IMC acima de 30."}, "topic": "Hérnias de Parede Abdominal", "official": "B", "medical": "B", "comment": "B) \"Indicar abordagem laparoscópica, preferencialmente em pacientes com IMC elevado.\" CORRETA. A abordagem laparoscópica é recomendada para hérnias incisionais, especialmente em pacientes com obesidade, pois permite menor taxa de infecção da ferida operatória, recuperação mais rápida e menor dor no pós-operatório. Além disso, favorece melhor visualização do defeito e posicionamento da tela intraperitoneal com menor agressão à parede abdominal. C) \"Indicar abordagem aberta com anestesia local, independentemente do IMC.\" INCORRETA. A anestesia local é limitada a hérnias pequenas, geralmente inguinais, em pacientes com bom controle da musculatura e IMC adequado. D) \"Evitar qualquer tipo de correção cirúrgica em pacientes com IMC acima de 30.\" INCORRETA. A obesidade não é contraindicação absoluta; pelo contrário, a cirurgia laparoscópica pode ser até mais indicada nesses casos para reduzir complicações. A) \"Optar por cirurgia aberta sem uso de tela, pois reduz risco de infecção.\" INCORRETA. O uso de tela é padrão-ouro na correção de hérnias, inclusive em cirurgias abertas, pois reduz significativamente a taxa de recidiva."}, {"n": 25, "meta": "(2025.2) ROT.2-A-14T: Q.30", "stem": "Paciente de 68 anos, sexo masculino, com hérnia inguinal redutível conhecida há 5 anos, procura o serviço de emergência com dor intensa em região inguinal direita há 6 horas, associada a náuseas e vômitos. Refere que a hérnia aumentou de volume subitamente após esforço físico. Ao exame físico, observa-se tumoração inguinal dolorosa, endurecida, com hiperemia local e ausência de murmúrio hidroaéreo à ausculta. O paciente apresenta taquicardia (FC 110 bpm) e leucocitose (15.000/mm³). Qual a conduta mais adequada?", "opts": {"A": "Encaminhar para herniorrafia eletiva após controle dos sintomas.", "B": "Solicitar ultrassonografia de parede abdominal para confirmação diagnóstica.", "C": "Administrar analgesia e tentar redução manual vigorosa da hérnia.", "D": "Indicar cirurgia imediata para correção da hérnia e ressecção intestinal, se necessário."}, "topic": "Hérnias de Parede Abdominal", "official": "D", "medical": "D", "comment": "D) \"Indicar cirurgia imediata para correção da hérnia e ressecção intestinal, se necessário.\" CORRETA. A cirurgia imediata é a conduta adequada para hérnia estrangulada, pois permite avaliar a viabilidade do intestino e realizar ressecção intestinal, se necessário. O estrangulamento herniário é uma emergência cirúrgica devido ao risco de perfuração, peritonite e morte (SABISTON, 2022). C) \"Administrar analgesia e tentar redução manual vigorosa da hérnia.\" INCORRETA. Tentar redução manual vigorosa em hérnia potencialmente estrangulada é contraindicado, pois pode levar a redução enganosa de alça viável ou ruptura de alça necrótica. A redução manual só pode ser tentada em hérnias encarceradas sem sinais de estrangulamento (dor leve, sem sinais inflamatórios locais ou sistêmicos). B) \"Solicitar ultrassonografia de parede abdominal para confirmação diagnóstica.\" INCORRETA. Embora a ultrassonografia possa confirmar a presença de hérnia encarcerada, não deve atrasar o tratamento cirúrgico em pacientes com sinais de estrangulamento (dor intensa, sinais inflamatórios, leucocitose). A tomografia (TC) é superior para avaliar viabilidade intestinal, mas a decisão cirúrgica deve ser clínica. A) \"Encaminhar para herniorrafia eletiva após controle dos sintomas.\" INCORRETA. Hérnias com sinais de estrangulamento (dor intensa, hiperemia local, taquicardia, leucocitose) exigem intervenção cirúrgica urgente devido ao risco de necrose intestinal e sepse. O tratamento eletivo é reservado para hérnias redutíveis e assintomáticas. Diferenciação entre encarceramento e estrangulamento: Encarceramento: hérnia irreduzível, mas sem isquemia (dor moderada, sem sinais inflamatórios ou sistêmicos). Pode ser tentada redução manual. Estrangulamento: hérnia irreduzível com isquemia (dor intensa, hiperemia local, taquicardia, leucocitose). Exige cirurgia imediata. Conduta definitiva: Hérnia encarcerada sem sinais de estrangulamento: redução manual + correção cirúrgica eletiva. Hérnia estrangulada: correção cirúrgica urgente (laparotomia ou laparoscopia) + ressecção intestinal se necrose. \"Em caso de dúvida, opte pela exploração cirúrgica – o risco de necrose intestinal supera o de intervenção desnecessária.\" (Fitzgibbons, 2020)."}, {"n": 26, "meta": "(2025.2) ROT.3-A-14T: Q.15", "stem": "Homem, 65 anos, previamente hígido, procura a UPA com dor em abdome inferior à direita, associada a distensão abdominal, náuseas e ausência de evacuação e eliminação de flatos há 24 horas. Ao exame físico, encontra-se em bom estado geral, afebril, com sinais vitais estáveis. Abdome levemente distendido, timpanismo à percussão e ruídos hidroaéreos presentes. Palpa-se massa em região inguinal direita, dolorosa, irredutível, sem sinais flogísticos locais. Não há sinais de peritonite. Diante do quadro clínico descrito, qual é a conduta mais adequada?", "opts": {"A": "Antibioticoterapia e hidratação venosa por 24h e encaminhamento para avaliação ambulatorial com cirurgião eletivo.", "B": "Indicação de inguinotomia em centro cirúrgico, para avaliação da possível viabilidade do conteúdo herniado e resolução da obstrução.", "C": "Indicação de laparotomia exploradora de urgência, pelo risco de complicações, com eventual ressecção de alça e ileostomia.", "D": "Solicitação de tomografia de abdômen total, para confirmar o diagnóstico antes de definir a conduta cirúrgica."}, "topic": "Hérnias de Parede Abdominal", "official": "B", "medical": "B", "comment": "O quadro clínico descrito é compatível com hérnia inguinal encarcerada, caracterizada por massa inguinal irreduzível e dolorosa, associada a sinais de obstrução intestinal (náuseas, distensão abdominal e parada na eliminação de fezes e flatos). A ausência de febre, peritonite e instabilidade hemodinâmica indica que o quadro ainda se encontra em estágio não complicado, o que permite abordagem cirúrgica segura. Nessas situações, a inguinotomia é a via de acesso preferencial, pois permite a exposição direta do saco herniário para avaliação do conteúdo (geralmente alça intestinal), determinando sua viabilidade. Se houver sofrimento isquêmico, pode-se realizar ressecção segmentar e reconstrução conforme o caso. Em pacientes estáveis, como neste cenário, essa abordagem é segura, eficaz e indicada. O diagnóstico de hérnia encarcerada é essencialmente clínico, e os achados do exame físico são suficientes para a tomada de decisão. Exames de imagem, como a tomografia, não são necessários em casos típicos e bem definidos, como este, e seu uso pode retardar indevidamente o tratamento cirúrgico. A laparotomia exploradora é reservada para situações com sinais de complicações intra-abdominais, como perfuração, peritonite ou falha do acesso inguinal — circunstâncias que não estão presentes neste caso. Por fim, tratamento conservador é contraindicado. O atraso na correção cirúrgica de uma hérnia encarcerada aumenta significativamente o risco de estrangulamento, necrose intestinal e evolução para quadros graves."}, {"n": 27, "meta": "(2025.2) ROT.3-A-14T: Q.26", "stem": "Um homem de 52 anos procura avaliação por um abaulamento na parede abdominal que surgiu há cerca de 8 meses. Ele refere aumento progressivo do volume, que fica mais proeminente ao tossir ou fazer esforço, mas reduz espontaneamente ao deitar. O exame físico revela massa redutível de aproximadamente 2 cm, firme, localizada na linha média entre o apêndice xifoide e o umbigo, sem cicatrizes cirúrgicas prévias. Não há sinais de encarceramento ou dor intensa. Qual é o diagnóstico mais provável com base nas características clínicas e anatômicas?", "opts": {"A": "Hérnia incisional mediana.", "B": "Hérnia epigástrica.", "C": "Hérnia umbilical.", "D": "Hérnia inguinal indireta."}, "topic": "Hérnias de Parede Abdominal", "official": "B", "medical": "B", "comment": "As hérnias epigástricas ocorrem na linha alba entre o apêndice xifoide e o umbigo e consistem frequentemente de tecido gorduroso pré-peritoneal. São mais frequentes em adultos do sexo masculino, geralmente assintomáticas ou com leve desconforto. As hérnias incisionais ocorrem em locais de incisões cirúrgicas prévias. A ausência de história cirúrgica torna esse diagnóstico improvável. A hérnia umbilical ocorre no anel umbilical, sendo distinta da hérnia epigástrica, que se localiza acima do umbigo. As hérnias inguinais surgem abaixo da linha espino-umbilical, sendo a localização um critério essencial no diagnóstico diferencial com hérnias da linha média."}, {"n": 28, "meta": "(2025.2) ROT.3-A-12T: Q.14", "stem": "Um paciente adulto apresenta dor em região inguino-crural à direita e abaulamento inferior ao ligamento inguinal, mais evidente ao esforço. Considerando o diagnóstico mais provável e as opções abaixo, qual técnica cirúrgica trata adequadamente essa hérnia?", "opts": {"A": "Bassini clássico.", "B": "Reparo de Cooper (McVay).", "C": "Lichtenstein \"padrão\" para hérnia inguinal.", "D": "Shouldice."}, "topic": "Hérnias de Parede Abdominal", "official": "B", "medical": "B", "comment": "Discussão das alternativas: Reparo de Cooper (McVay) — correta. O reparo de Cooper aproxima o tendão conjunto/arcada transversalis ao ligamento de Cooper (pectíneo), fechando o anel femoral e reforçando o assoalho inguinal. É uma técnica tecidual indicada para hérnia femoral (e também para algumas inguinais diretas grandes), especialmente em situações sem tela (infecção, estrangulamento com ressecção). Fecha especificamente o canal femoral, alvo da patologia descrita. Lichtenstein \"padrão\" — incorreta. A técnica Lichtenstein clássica é uma hernioplastia com tela anterior voltada para hérnias inguinais. Na sua forma tradicional, não fecha o anel femoral; portanto, não é o procedimento de escolha para hérnia femoral. Modificações com extensão/plug pectíneo existem, mas não fazem parte do Lichtenstein padrão cobrado na questão. Bassini — incorreta. Técnica tecidual para hérnia inguinal, ao aproximar estruturas do assoalho inguinal acima do ligamento inguinal. Não aborda o anel femoral; logo, não trata adequadamente hérnia femoral. Shouldice — incorreta. Reparo tecidual multiplanar indicado para hérnias inguinais. Assim como Bassini, não fecha o anel femoral e não é indicado para hérnia femoral. Observação: abordagens pré-peritoneais com tela (Stoppa/Nyhus) e as laparoscópicas/robóticas TEP/TAPP tratam bem hérnias femorais por cobrirem todo o orifício miopectíneo, mas não foram listadas entre as alternativas desta questão. Competência avaliada (ENADE): Raciocinar anátomo-cirurgicamente sobre a localização da protrusão (abaixo do ligamento inguinal ⇒ hérnia femoral). Correlacionar diagnóstico com técnica que aborda o anel femoral (reparo de Cooper/McVay)."}, {"n": 29, "meta": "(2025.1) ROT.1-B-14T: Q.2", "stem": "Paciente masculino, 72 anos, hipertenso, diabético insulinodependente e com antecedente de infarto agudo do miocárdio há 6 meses, é admitido no pronto- socorro com dor inguinal direita intensa e progressiva há 18 horas, associada a vômitos fecaloides e anúria nas últimas 8 horas. No exame físico, encontra-se confuso. Sinais vitais: • FC: 118 bpm • PA: 88/50 mmHg • FR: 24 irpm • Temperatura: 38,5°C Há um abaulamento endurecido e indolor em região inguinal direita, com pele hiperemiada e presença de crepitação subcutânea. Ausência de ruídos hidroaéreos na topografia abdominal. Gasometria arterial evidencia acidose metabólica com pH 7,18 e lactato de 6,2 mmol/L. Diante desse quadro, qual a conduta mais apropriada?", "opts": {"A": "Realização de tomografia computadorizada com contraste para avaliação da viabilidade da alça intestinal antes da cirurgia.", "B": "Tentativa de redução manual da hérnia sob sedação e analgesia, seguida de suporte clínico em UTI.", "C": "Administração imediata de antibióticos de amplo espectro, reposição volêmica agressiva e encaminhamento para laparotomia de emergência.", "D": "Monitorização em unidade de terapia intensiva para estabilização hemodinâmica antes da cirurgia eletiva."}, "topic": "Hérnias de Parede Abdominal", "official": "C", "medical": "C", "comment": "Este paciente apresenta um quadro crítico de hérnia inguinal estrangulada complicada por perfuração intestinal e choque séptico, evidenciando dor intensa e progressiva com evolução de 18 horas, vômitos fecalóides e anúria e instabilidade hemodinâmica. Com estes sinais clínicos corroborados com os exames laboratoriais estamos diante de uma obstrução intestinal, instabilidade hemodinâmica, caracterizando choque séptico. Além disso, crepitação subcutânea na região da hérnia sugestiva de gangrena gasosa (potencial infecção por Clostridium spp.). Com indicativos de acidose metabólica grave com interpretação através da gasometria arterial e lactato. É um quadro indicativo de isquemia intestinal grave. Nas medidas iniciais deve – se iniciar antibioticoterapia de amplo espectro (Piperalicina + Tazobactam com associação ao metronidazol ou meropenem. Já em vigência de choque séptico grave a reposição volêmica deve ser de forma agressiva com critaloides juntamente com correção de distúrbios metabólicos e encaminhamento com urgência para laparotomia exploradora pela alta suspeição de necrose e perfuração intestinal. A tomografia computadorizada deve ser utilizada nos casos duvidosos. O qual não evidenciado neste caso. E por assim dizer, retardaria a abordagem cirúrgico. Nesse contexto a redução manual está totalmente contraindicada nos casos de hérnias estranguladas com sinais indicativos de necrose/ perfuração, podendo levar à um quadro de peritonite difusa com piora do choque séptico. A conduta expectante na UTI atrasaria na intervenção da abordagem cirúrgica imediata, sendo de forma importante a estabilização juntamente com o preparo para a abordagem cirúrgica."}, {"n": 30, "meta": "(2025.1) ROT.1-B-14T: Q.27", "stem": "Um paciente do sexo masculino, 72 anos, chegou ao pronto-socorro apresentando o seu abdômen distendido e dor constante no local da hérnia incisional, que havia sido corrigida há 6 anos. A palpação do abdômen mostra uma massa com sensibilidade à pressão, irredutível ao exame físico. Atualmente, o paciente está com contagem leucocitária elevada e febre. Qual deve ser a conduta imediata para este paciente?", "opts": {"A": "Cirurgia de emergência por se tratar de uma hérnia encarcerada, com possibilidade de estrangulamento intestinal.", "B": "Uso de analgésicos para manejo da dor, com objetivo de reduzir a hérnia, evitando procedimento cirúrgico de urgência.", "C": "Observação clínica, com monitoramento do paciente, início de antibiótico devido febre, aguardando estabilização para conduta cirúrgica.", "D": "Tratamento imediato com antibióticos, manter tentativa de redução manual da hérnia e encaminhamento para procedimento eletivo."}, "topic": "Hérnias de Parede Abdominal", "official": "A", "medical": "A", "comment": "A) \"Cirurgia de emergência por se tratar de uma hérnia encarcerada, com possibilidade de estrangulamento intestinal.\" CORRETA. O paciente mostra sinais de uma potencial hérnia encarcerada ou estrangulada, que é uma condição que requer cirurgia de emergência. B) \"Uso de analgésicos para manejo da dor, com objetivo de reduzir a hérnia, evitando procedimento cirúrgico de urgência.\" INCORRETA. Embora o controle da dor seja uma etapa importante, o uso exclusivo de analgésicos não abordaria a causa subjacente da dor. Além disso, reduzir esta hérnia sem saber a viabilidade da alça intestinal pode piorar as complicações, como perfurações e contaminação da cavidade abdominal. C) \"Observação clínica, com monitoramento do paciente, início de antibiótico devido febre, aguardando estabilização para conduta cirúrgica.\" INCORRETA. A observação clínica não seria apropriada neste cenário, uma vez que o paciente apresenta sinais de uma possível complicação da hérnia, necessitando de intervenção cirúrgica. D) \"Tratamento imediato com antibióticos, manter tentativa de redução manual da hérnia e encaminhamento para procedimento eletivo.\" INCORRETA. O tratamento imediato com antibióticos pode ser indicado no cenário de uma hérnia estrangulada com sinais de infecção; no entanto, apenas medicamentos não seriam suficientes para resolver a condição e a intervenção cirúrgica é necessária."}, {"n": 31, "meta": "(2025.1) ROT.2-B-14T: Q.4", "stem": "Um paciente de 45 anos procura atendimento ambulatorial devido a uma tumoração recorrente na região inguinal direita há cerca de dois anos. Ele relata que o abaulamento aparece ao realizar esforços físicos e desaparece em repouso. Nega dor, náuseas, vômitos, febre ou alterações do trânsito intestinal. No exame físico, observa-se uma massa maleável na região inguinal, redutível com facilidade, indolor, e sem sinais inflamatórios locais. Qual é a conduta mais apropriada para este paciente neste momento?", "opts": {"A": "Manter acompanhamento e
