oce da fístula anal."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "A", "medical": "A", "comment": "A) \"Tratar como fissura anal aguda, com medidas clínicas locais.\" CORRETA. Segundo o Sabiston, fissuras anais agudas são comuns, dolorosas e associadas à hipertonia do esfíncter. O tratamento inicial é clínico: banhos de assento, laxativos, analgésicos locais e pomadas com nitrato ou bloqueadores de canal de cálcio. A colonoscopia só é indicada na persistência dos sintomas ou se houver critérios de alarme. B) \"Iniciar tratamento tópico para hemorroidas e solicitar colonoscopia.\" INCORRETA. O sangramento descrito (no papel higiênico, com dor intensa à evacuação) é mais compatível com fissura anal aguda. A ausência de sintomas de alarme, como perda de peso, alteração do hábito intestinal ou história familiar, reduz a necessidade de investigação endoscópica imediata. C) \"Prescrever anti-inflamatórios para o abscesso perianal e retorno em 7 dias.\" INCORRETA. O abscesso perianal costuma causar dor intensa constante (não apenas durante a evacuação), febre e tumefação visível ou palpável. Não é o caso descrito. D) \"Indicar antibiótico oral e drenagem cirúrgica precoce da fístula anal.\" INCORRETA. A fístula anal geralmente se manifesta como drenagem crônica por orifício externo, e não com dor intensa durante evacuação. A descrição clínica e o exame físico não sustentam esse diagnóstico."}, {"n": 124, "meta": "(2025.2) ROT.1-A-12T: Q.28", "stem": "Um homem de 30 anos procura atendimento referindo dor anal intensa há dois dias, associada à febre e desconforto para sentar. Relata piora significativa da dor durante as evacuações. O exame físico evidencia área de hiperemia, calor local e flutuação dolorosa na região perianal posterior. Com base no quadro clínico apresentado, qual é o diagnóstico mais provável para esse paciente?", "opts": {"A": "Abscesso anorretal.", "B": "Fístula perianal.", "C": "Hemorroidas internas grau III.", "D": "Fissura anal."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "A", "medical": "A", "comment": "A) \"Abscesso anorretal.\" CORRETA. O abscesso anorretal se manifesta com dor intensa, febre e massa flutuante, como no caso apresentado. B) \"Fístula perianal.\" INCORRETA. A fístula perianal é uma complicação crônica, geralmente sem sinais sistêmicos agudos. C) \"Hemorroidas internas grau III.\" INCORRETA. Hemorroidas internas não causam sinais inflamatórios ou sistêmicos. D) \"Fissura anal.\" INCORRETA. A fissura anal causa dor à evacuação, mas não cursa com febre ou flutuação."}, {"n": 125, "meta": "(2025.2) ROT.1-A-12T: Q.30", "stem": "Um homem de 43 anos, transplantado renal em uso de tacrolimo e prednisona, procura o pronto-socorro com dor anal intensa e tumefação eritematosa de 3 cm na margem posterior do ânus, iniciada há 36 h. Está febril (38,3 °C) e apresenta leucopenia. Após confirmação clínica de abscesso perianal, qual conduta inicial se alinha às melhores práticas para esse paciente?", "opts": {"A": "Antibioticoterapia endovenosa isolada durante 48 h, reservando drenagem apenas se não houver melhora.", "B": "Incisão e drenagem imediata em centro cirúrgico, associada a antibioticoterapia intravenosa de amplo espectro.", "C": "Incisão e drenagem no pronto-atendimento sob anestesia local, associando antibioticoterapia oral e orientando retorno em 48 h.", "D": "Internação hospitalar para observação clínica e analgesia, indicando drenagem apenas após evidência de flutuação mais pronunciada."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "B", "medical": "B", "comment": "A) \"Antibioticoterapia endovenosa isolada durante 48 h, reservando drenagem apenas se não houver melhora.\" INCORRETA. Antibiótico não substitui a drenagem, mesmo em pacientes imunossuprimidos. Retardar a drenagem aumenta o risco de complicações sépticas. B) \"Incisão e drenagem imediata em centro cirúrgico, associada a antibioticoterapia intravenosa de amplo espectro.\" CORRETA. A imunossupressão compromete a resposta inflamatória local e favorece o crescimento de flora mista ou patógenos oportunistas; por isso, além da drenagem precoce — pilar do tratamento de qualquer abscesso anorretal — deve-se iniciar antibióticos intravenosos que cubram germes entéricos e anaeróbios, reduzindo o risco de septicemia e recorrência. C) \"Incisão e drenagem no pronto-atendimento sob anestesia local, associando antibioticoterapia oral e orientando retorno em 48 h.\" INCORRETA. O imunossuprimido com febre e leucopenia requer drenagem em centro cirúrgico e antibioticoterapia intravenosa. Manejo ambulatorial com antibiótico oral é insuficiente e arriscado. D) \"Internação hospitalar para observação clínica e analgesia, indicando drenagem apenas após evidência de flutuação mais pronunciada.\" INCORRETA. O abscesso já confirmado deve ser drenado imediatamente; aguardar flutuação adia o tratamento e aumenta o risco de complicações, especialmente no imunossuprimido."}, {"n": 126, "meta": "(2025.2) ROT.2-A-14T: Q.2", "stem": "Paciente de 35 anos, portador de doença de Crohn com manifestações perianais ativas (índice de atividade perianal elevado), apresenta fístula perianal complexa com múltiplos trajetos e sinais de infecção local persistente. Em relação ao caso, analise a melhor abordagem terapêutica:", "opts": {"A": "Drenagem de abscessos e colocação de seton em combinação com terapia imunomoduladora (como infliximabe ou azatioprina), antes de considerar ressecção ou proctectomia.", "B": "Avanço de retalho mucoso pode ser considerado em casos selecionados, mas não é indicado como primeira escolha em fístulas complexas com Crohn ativo.", "C": "Fistulotomia ampla imediata, aproveitando o canal primário, mesmo com envolvimento do esfíncter, para eliminar a fístula mais rapidamente.", "D": "Uso exclusivo de antibioticoterapia oral prolongada por 6 a 8 semanas para tentar cicatrização sem intervenção cirúrgica no contexto de Crohn."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "A", "medical": "A", "comment": "A) \"Drenagem de abscessos e colocação de seton em combinação com terapia imunomoduladora (como infliximabe ou azatioprina), antes de considerar ressecção ou proctectomia.\" CORRETA. O tratamento recomendado envolve primeiro a drenagem dos abscessos e colocação de seton para manter o canal aberto, combinada com terapia imunomoduladora (como infliximabe ou azatioprina), visando à melhora da doença antes de considerar medidas mais radicais. B) \"Avanço de retalho mucoso pode ser considerado em casos selecionados, mas não é indicado como primeira escolha em fístulas complexas com Crohn ativo.\" INCORRETA. O avanço de retalho mucoso é reservado para fístulas simples ou em pacientes com doença de Crohn controlada. Em casos com atividade inflamatória significativa, como neste caso, outras abordagens já citadas são preferidas. C) \"Fistulotomia ampla imediata, aproveitando o canal primário, mesmo com envolvimento do esfíncter, para eliminar a fístula mais rapidamente.\" INCORRETA. Realizar fistulotomia ampla pode comprometer o complexo esfincteriano e levar à incontinência fecal, especialmente em fístulas complexas associadas a Crohn ativo. Há o alerta quanto às abordagens agressivas em favor da preservação funcional. D) \"Uso exclusivo de antibioticoterapia oral prolongada por 6 a 8 semanas para tentar cicatrização sem intervenção cirúrgica no contexto de Crohn.\" INCORRETA. A antibioticoterapia isolada, embora útil como adjuvante, não é suficiente para tratar fístulas complexas em Crohn ativo. É necessária intervenção cirúrgica inicial (drenagem/seton) associada à terapia imunológica."}, {"n": 127, "meta": "(2025.2) ROT.2-A-14T: Q.24", "stem": "Um homem de 44 anos, previamente saudável, procura atendimento por dor anal intensa há 36 horas. Relata dificuldade para evacuar e percepção de “caroço doloroso” próximo ao ânus, iniciado de forma súbita após evacuação, piorando progressivamente. Ao exame físico, apresenta área endurecida e hiperemiada na borda posterior do ânus, sensível à palpação, sem exteriorização de secreção purulenta. A anuscopia não foi possível devido à intensidade da dor e não há relato de febre. Qual é o diagnóstico mais provável e a conduta inicial recomendada nesta situação?", "opts": {"A": "Fístula anal. Conduta: investigação com exames de imagem e cirurgia eletiva.", "B": "Abscesso perianal. Conduta: drenagem cirúrgica do abscesso.", "C": "Fissura anal aguda. Conduta: analgésicos tópicos e orientação evacuatória.", "D": "Hemorroida externa trombosada. Conduta: analgesia e banho de assento."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "B", "medical": "B", "comment": "Embora dor súbita e caroço sejam descritos, a história de progressão do quadro doloroso, o impedimento para anuscopia e endurecimento aumentam a suspeita de processo infeccioso. A hemorroida externa trombosada geralmente apresenta nódulo roxo- azulado, muito doloroso, mas não costuma estar acompanhada de calor e rubor intensos, como descrito. Fissura geralmente cursa com dor à evacuação e possível sangramento; não é comum nódulo endurecido e doloroso palpável. O quadro de dor anal aguda progressiva, “caroço” doloroso, endurecido e impedimento do exame sugerem bastante abscesso perianal nas fases iniciais, mesmo sem febre. O tratamento é drenagem cirúrgica. A fístula anal tende a apresentar episódio prévio de abscesso ou drenagem espontânea crônica, geralmente com menos dor aguda."}, {"n": 128, "meta": "(2025.2) ROT.3-A-14T: Q.29", "stem": "Um homem de 32 anos, previamente saudável, procura o pronto-socorro com quadro de dor intensa em região perianal há 3 dias, associada a febre e dificuldade para evacuar. Ao exame físico, apresenta área eritematosa, quente, dolorosa e com flutuação no quadrante póstero-lateral esquerdo da margem anal, sem sinais de drenagem espontânea visível. Os sinais vitais mostram temperatura de 38,5°C e frequência cardíaca de 102 bpm. Sobre a conduta mais apropriada para esse paciente, assinale a alternativa correta:", "opts": {"A": "A drenagem cirúrgica deve ser realizada precocemente, preferencialmente em centro cirúrgico sob anestesia regional, devido ao risco de disseminação da infecção.", "B": "A drenagem deve ser realizada apenas após confirmação por imagem (ultrassonografia endoanal ou ressonância magnética), pois o exame físico não é confiável.", "C": "O tratamento inicial deve ser clínico, com antibioticoterapia empírica e analgesia, reservando a drenagem apenas se houver piora clínica.", "D": "A drenagem deve ser postergada por 48 a 72 horas para permitir melhor delimitação do abscesso, com antibioticoterapia em domicílio."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "A", "medical": "A", "comment": "O abscesso anorretal é uma urgência cirúrgica e deve ser drenado imediatamente após o diagnóstico clínico. O tempo ideal para intervenção é o mais precoce possível; não se deve esperar delimitação adicional, pois o risco de disseminação é alto. A drenagem pode ser feita em ambiente ambulatorial com anestesia local em casos simples, mas em abscessos maiores, com dor intensa ou instabilidade, o centro cirúrgico sob anestesia regional ou geral é preferível. A imagem só é indicada se houver incerteza diagnóstica, o que não é o caso aqui. Antibióticos isoladamente não resolvem a infecção – são indicados apenas em casos selecionados (diabéticos, imunossuprimidos, celulite extensa)."}, {"n": 129, "meta": "(2026.1) ROT.1-A: Q.4", "stem": "Durante uma anuscopia de rotina em um paciente com queixa de \"sensação de peso\" e prurido anal, o examinador observa uma área de inflamação em uma das criptas anais na linha pectínea, com saída de pequena quantidade de secreção purulenta ao ser pressionada pelo anuscópio, porém sem abaulamentos externos ou flutuação à palpação perianal. Qual é o diagnóstico mais provável e qual a complicação aguda imediata que deve ser monitorada?", "opts": {"A": "Fístula anorretal complexa; risco de incontinência fecal por destruição esfincteriana.", "B": "Hemorroida interna grau I; progressão para prolapse e estrangulamento.", "C": "Criptite; evolução para a formação de um abscesso anorretal por obstrução glandular.", "D": "Fissura anal crônica; desenvolvimento de plicoma sentinela e papila hipertrófica."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "C", "medical": "C", "comment": "Resposta correta: A criptite é uma inflamação das criptas anais, frequentemente observada na linha pectínea, podendo cursar com secreção purulenta à compressão. Trata- se da fase inicial do processo criptoglandular, cuja principal complicação aguda é a evolução para abscesso anorretal, decorrente da obstrução e infecção das glândulas anais. Incorreta: hemorroidas internas manifestam-se como coxins vasculares proeminentes e friáveis, geralmente sem secreção purulenta ou sinais de infecção de criptas. Incorreta: a fissura anal localiza-se geralmente no eixo longitudinal (mais comum na linha média posterior) e apresenta uma úlcera linear visível, não se originando tipicamente de uma infecção purulenta na linha pectínea (cripta). Incorreta: a fístula é a fase crônica de um processo que começou como abscesso; no estágio descrito (inflamação da cripta sem trajeto definido ou orifício externo), o diagnóstico ainda é de criptite, a precursora do abscesso."}, {"n": 130, "meta": "(2026.1) ROT.1-A: Q.17", "stem": "Paciente de 38 anos, sexo masculino, com diagnóstico de fissura anal crônica, encontra-se em acompanhamento ambulatorial após tratamento clínico inicial, com uso de medidas conservadoras, apresentando melhora significativa da dor e dos sintomas evacuatórios. Durante a consulta de seguimento, refere evacuações ainda associadas a receio de dor, mas sem sangramento recente. Questiona a equipe médica sobre quais condutas devem ser mantidas a longo prazo para prevenir a recidiva da fissura anal e promover melhor qualidade de vida. Qual orientação deve ser mantida a longo prazo para prevenir recidiva?", "opts": {"A": "Incentivar hábitos intestinais saudáveis, com dieta rica em fibras, adequada ingestão hídrica e orientação para evitar esforço evacuatório.", "B": "Indicar esfincterotomia lateral interna eletiva como estratégia preventiva, mesmo na presença de boa resposta ao tratamento clínico.", "C": "Orientar uma dieta pobre em fibras, com o objetivo de reduzir o volume fecal e minimizar o trauma anal durante a evacuação.", "D": "Prescrever analgésicos opioides de uso contínuo para a prevenção da dor evacuatória e a redução do espasmo esfincteriano."}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "A", "medical": "A", "comment": "A) \"Incentivar hábitos intestinais saudáveis, com dieta rica em fibras, adequada ingestão hídrica e orientação para evitar esforço evacuatório.\" CORRETA. A base do tratamento e da prevenção da recidiva da fissura anal crônica é a manutenção de hábitos intestinais que promovam fezes macias e evacuações sem esforço. A dieta rica em fibras, associada à ingestão hídrica adequada, reduz o trauma mecânico no canal anal, diminui a hipertonia esfíncteriana reflexa e favorece a cicatrização, sendo recomendada mesmo após melhora clínica inicial. D) \"Prescrever analgésicos opioides de uso contínuo para prevenção da dor evacuatória e redução do espasmo esfincteriano.\" INCORRETA. Analgésicos opioides não são indicados para uso contínuo nesse contexto, pois aumentam o risco de constipação intestinal, o que agrava o esforço evacuatório e favorece a recorrência da fissura. C) \"Orientar dieta pobre em fibras, com o objetivo de reduzir o volume fecal e minimizar o trauma anal durante a evacuação.\" INCORRETA. Dietas pobres em fibras levam ao endurecimento das fezes e maior esforço evacuatório, aumentando o risco de trauma anal e recidiva da fissura. B) \"Indicar esfincterotomia lateral interna eletiva como estratégia preventiva, mesmo na presença de boa resposta ao tratamento clínico.\" INCORRETA. A esfincterotomia lateral interna é indicada apenas em casos refratários ao tratamento clínico adequado, não sendo recomendada como medida preventiva em pacientes com boa resposta conservadora."}, {"n": 131, "meta": "(2026.1) ROT.1-A: Q.27", "stem": "Um paciente de 52 anos, portador de Diabetes Mellitus tipo 2 e em tratamento quimioterápico para linfoma, apresenta quadro de dor perineal intensa, prostração e febre (38,8°C). No exame físico, observa-se apenas uma discreta área de hiperemia e endurecimento perianal, sem flutuação evidente, mas com dor desproporcional ao achado visual. Qual é a conduta e adequação clínica correta para este perfil de paciente?", "opts": {"A": "Internação hospitalar imediata, início de antibioticoterapia endovenosa e exploração cirúrgica sob anestesia, devido ao alto risco de Síndrome de Fournier.", "B": "Realizar punção com agulha fina no consultório para confirmar a presença de pus antes de indicar internação.", "C": "Prescrever antibióticos orais e compressas mornas, orientando retorno caso surja flutuação evidente (\"ponto amarelo\").", "D": "Classificar como abscesso simples e realizar drenagem sob anestesia local em ambiente ambulatorial para evitar infecção hospitalar. RESPOSTAS COMENTADAS"}, "topic": "Doenças orificiais: Doença hemorroidária, fissura anal, fístula anal, abscesso anorretal", "official": "A", "medical": "A", "comment": "A) \"Internação hospitalar imediata, início de antibioticoterapia endovenosa e exploração cirúrgica sob anestesia, devido ao alto risco de Síndrome de Fournier.\" CORRETA. Pacientes imunossuprimidos com dor perineal desproporcional aos achados locais devem ser manejados com alta suspeição para infecção necrosante, como a síndrome de Fournier. A conduta adequada inclui internação imediata, antibioticoterapia endovenosa de amplo espectro e exploração cirúrgica precoce, pois o atraso no tratamento está associado a elevada mortalidade. C) \"Prescrever antibióticos orais e compressas mornas, orientando retorno caso surja flutuação evidente (\"ponto amarelo\").\" INCORRETA. Em pacientes imunossuprimidos, a ausência de flutuação não descarta infecção profunda. Aguardar a \"maturação\" do abscesso pode levar a uma sepse fulminante ou necrose tecidual extensa. B) \"Realizar punção com agulha fina no consultório para confirmar a presença de pus antes de indicar internação.\" INCORRETA. A punção aspirativa é pouco sensível e perigosa em áreas infectadas de pacientes neutropênicos/imunossuprimidos, podendo introduzir novos patógenos ou falhar em diagnosticar infecções necrotizantes. D) \"Classificar como abscesso simples e realizar drenagem sob anestesia local em ambiente ambulatorial para evitar infecção hospitalar.\" INCORRETA. O manejo ambulatorial é inadequado para pacientes com sinais sistêmicos (febre e prostração) e comorbidades graves. O ambiente cirúrgico hospitalar é necessário para uma limpeza exaustiva e monitoramento."}], "source": "CC - Topicos A - Comentada Final(1).pdf"}, {"id": "cirurgia-b", "title": "CC — Cirurgia B", "subtitle": "Tópicos B", "group": "B", "questions": [{"n": 1, "meta": "(2024.2) ROT.1-B-14T: Q.11", "stem": "Um violento tornado atinge uma área densamente povoada, resultando em destruição generalizada de habitações e infraestruturas. O hospital regional de pequeno porte é notificado de que aproximadamente 200 pessoas foram afetadas, com uma variedade de ferimentos, desde leves a críticos, incluindo múltiplos casos de trauma severo e ferimentos potencialmente fatais. Diante deste cenário como descrito, qual deve ser a intervenção médica inicial da equipe de emergência ao receber os feridos?", "opts": {"A": "Fornecer atendimento imediato e detalhado a cada paciente conforme eles chegam ao hospital, com uma avaliação completa dos ferimentos.", "B": "Realizar uma triagem rápida para identificar e priorizar o tratamento dos pacientes com base na gravidade de seus ferimentos e chances de sobrevivência.", "C": "Priorizar o tratamento imediato de ferimentos leves para liberar recursos rapidamente, antes de tratar pacientes com ferimentos mais graves.", "D": "Configurar áreas separadas para pacientes com ferimentos leves, moderados e graves, começando o tratamento pelos moderados."}, "topic": "ATLS- Aspectos históricos, exame primário e secundário, fase de cada um dos exames, aspectos intervencionistas no exameprimário e secundário", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Realizar uma triagem rápida para identificar e priorizar o tratamento dos pacientes com base na gravidade de seus ferimentos e chances de sobrevivência."}, {"n": 2, "meta": "(2025.2) ROT.2-A-14T: Q.8", "stem": "Uma mulher de 22 anos é vítima de acidente de motocicleta. Exame físico: consciente, estável hemodinamicamente e com discreta dor abdominal. Ultrassonografia na sala de emergência (FAST) mostrou moderada quantidade de líquido peri-hepático e peri-esplênico. Frente a esse achado, qual é a conduta?", "opts": {"A": "Realizar lavado peritoneal.", "B": "Solicitar tomografia de abdome.", "C": "Repetir FAST em 4 horas.", "D": "Indicar laparotomia exploradora."}, "topic": "ATLS- Aspectos históricos, exame primário e secundário, fase de cada um dos exames, aspectos intervencionistas no exameprimário e secundário", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Solicitar tomografia de abdome."}, {"n": 3, "meta": "(2025.2) ROT.2-A-14T: Q.12", "stem": "Homem, 32 anos, vítima de colisão moto × caminhão em via urbana, é admitido no pronto-socorro de um hospital de pequeno porte. Chega agitado, pálido, sudoreico, com pressão arterial de 88/56 mmHg, frequência cardíaca 134 bpm, saturação 92% em ar ambiente e Glasgow 13. No exame físico, apresenta vias aéreas pérvias, murmúrio vesicular diminuído no hemitórax direito com timpanismo à percussão e turgência jugular; abdome sem sinais de peritonite. O hospital não dispõe de tomografia computadorizada, banco de sangue nem cirurgião torácico de plantão. Segundo o ATLS, qual deve ser a conduta imediata em relação ao destino do paciente?", "opts": {"A": "Realizar drenagem torácica pelo achado de hemotórax, providenciar estabilização inicial e planejar transferência após realizar exames básicos de imagem para documentar as lesões.", "B": "Realizar exames de imagem simples disponíveis na unidade (radiografia de tórax e pelve) para confirmar os diagnósticos suspeitos e, em seguida, encaminhar para hospital de maior complexidade.", "C": "Tratar o pneumotórax hipertensivo com drenagem torácica imediata e acionar transferência urgente para centro de trauma, mantendo suporte clínico contínuo durante o transporte.", "D": "Estabilizar o paciente com reposição volêmica agressiva, analgesia e monitorização, mantendo observação no setor de emergência até que haja recursos para transferência."}, "topic": "ATLS- Aspectos históricos, exame primário e secundário, fase de cada um dos exames, aspectos intervencionistas no exameprimário e secundário", "official": "C", "medical": "C", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: C) Tratar o pneumotórax hipertensivo com drenagem torácica imediata e acionar transferência urgente para centro de trauma, mantendo suporte clínico contínuo durante o transporte."}, {"n": 4, "meta": "(2025.2) ROT.3-A-14T: Q.9", ário e secundário", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Classe II; reposição volêmica com alíquotas inferiores a 2 L de cristaloides, inicialmente, ou 20 mL/kg."}, {"n": 7, "meta": "(2025.1) ROT.1-B-14T: Q.23", "stem": "Homem, 45 anos, vítima de atropelamento, é admitido no pronto-socorro apresentando rebaixamento do nível de consciência. Durante a avaliação inicial, o paciente abre os olhos ao estímulo doloroso, emite sons incompreensíveis e apresenta extensão anormal dos membros ao estímulo doloroso. Está em ventilação espontânea, com frequência respiratória de 18 irpm e saturação de 90% em ar ambiente. Com base nos protocolos do ATLS, qual deve ser a conduta imediata para este paciente?", "opts": {"A": "Realizar intubação orotraqueal para proteção de via aérea.", "B": "Monitorizar sinais vitais e reavaliar a necessidade de intervenção a cada 15 minutos.", "C": "Solicitar tomografia de crânio para avaliação da gravidade do trauma.", "D": "Administrar solução cristaloide aquecida para estabilização hemodinâmica inicial."}, "topic": "ATLS- Aspectos históricos, exame primário e secundário, fase de cada um dos exames, aspectos intervencionistas no exameprimário e secundário", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Realizar intubação orotraqueal para proteção de via aérea."}, {"n": 8, "meta": "(2025.1) ROT.2-B-14T: Q.3", "stem": "Um homem de 42 anos chega ao pronto-socorro após um acidente automobilístico em alta velocidade. Ele é o motorista e não usava o cinto de segurança. Ao chegar, ele está consciente, mas agitado e com dor intensa no abdômen. A equipe de emergência realiza a avaliação inicial seguindo os princípios do ATLS. Avaliação Inicial (ABCDE): A - Via Aérea: O paciente está consciente e fala frases completas, mas apresenta respiração rápida e superficial. Não há obstrução visível da via aérea. B - Respiração: Ausculta pulmonar revela diminuição dos sons respiratórios à esquerda. O paciente apresenta saturação de oxigênio de 94% com aporte de O2. C - Circulação: O paciente tem pulso rápido (120 bpm) e pressão arterial de 90/60 mmHg. Há sinais de hemorragia externa moderada no abdômen. D - Deficiência Neurológica: O paciente está alerta, com Glasgow 14 (responde a comandos, mas confuso). E - Exposição e Controle do Ambiente: O paciente é despido para avaliação completa, e a equipe mantém a temperatura corporal. Qual é a prioridade de intervenção para este paciente?", "opts": {"A": "Realizar uma laparotomia exploratória imediata.", "B": "Iniciar a ressuscitação volêmica com fluidos intravenosos.", "C": "Intubar o paciente para garantir a proteção da via aérea.", "D": "Realizar uma tomografia computadorizada do abdômen."}, "topic": "ATLS- Aspectos históricos, exame primário e secundário, fase de cada um dos exames, aspectos intervencionistas no exameprimário e secundário", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Iniciar a ressuscitação volêmica com fluidos intravenosos."}, {"n": 9, "meta": "(2025.1) ROT.3-B-14T: Q.1", "stem": "Durante o atendimento inicial a um paciente politraumatizado em sala de emergência, a equipe segue o protocolo do Advanced Trauma Life Support (ATLS). Após garantir a segurança da cena, inicia-se o exame primário com o objetivo de identificar e tratar imediatamente lesões que oferecem risco à vida. Com base nesse protocolo, qual das alternativas a seguir descreve corretamente uma das etapas do exame primário e sua intervenção associada?", "opts": {"A": "Verificação da amplitude respiratória e ausculta pulmonar, com intervenção imediata em caso de pneumotórax hipertensivo com toracocentese de alívio.", "B": "Lavagem gástrica precoce para todos cessação do tabagismo, associando avaliação nutricional."}, {"n": 26, "meta": "(2026.1) ROT.1-B: Q.17", "stem": "Homem de 62 anos, portador de diabetes mellitus tipo 2 há 15 anos (HbA1c 9,1%), com insuficiência venosa crônica, obesidade (IMC 33 kg/m²) e tabagista ativo, é admitido em serviço de emergência com úlcera crônica na face medial do terço distal da perna direita, com evolução de 10 semanas e piora do exsudato nas últimas duas semanas. No exame físico, observa-se ferida medindo 4,0 × 3,0 cm, com bordas irregulares; leito composto por 40% de tecido de granulação pálida, 40% de fibrina/necrose amarelada e 20% de biofilme suspeito; exsudato moderado a intenso, odor discreto e dor referida 5/10. A pele perilesional apresenta maceração de aproximadamente 1 cm, edema +/4+ e eczema asteatósico. Pulsos pediosos são palpáveis, com índice tornozelo-braquial de 0,95. Glicemias capilares variam entre 180 e 250 mg/dL. Cultura superficial prévia evidenciou crescimento polimicrobiano, sem sinais sistêmicos de infecção. O paciente realiza curativos diários com gaze e soro fisiológico, utiliza meias elásticas de forma irregular e faz uso isolado de metformina. Qual é a conduta mais adequada para o manejo dessa úlcera crônica?", "opts": {"A": "Iniciar antibiótico sistêmico empírico, manter curativo simples diário, ajustar medicação antidiabética oral e reavaliar em duas semanas.", "B": "Realizar desbridamento do tecido desvitalizado, instituir terapia compressiva estruturada, utilizar curativo para controle do exsudato e otimizar o controle glicêmico com reavaliações semanais.", "C": "Manter curativos simples diários sem desbridamento, orientar dieta para diabetes, evitar compressão regular e reavaliar após 30 dias.", "D": "Aplicar antibiótico tópico associado a corticoide, manter compressão conforme tolerado, reforçar orientações para controle glicêmico domiciliar e realizar acompanhamento semanal."}, "topic": "Cicatrização", "official": "B", "medical": "B", "comment": "O PD {"n": 28, "meta": "(2024.2) ROT.1-B-14T: Q.12", "stem": "Homem, 58 anos, dá entrada no pronto socorro trazido pelo SAMU, vítima de colisão auto x poste. À entrada apresenta-se agitado, com respiração ruidosa, sinais de esforço respiratório, taquipneia e cianose central. À inspeção imediata o plantonista identifica hematoma periorbitário bilateral além de trauma facial extenso, com fraturas bilaterais de mandíbula, além de edema e hematoma significativo na região cervical, tornando impossível a ventilação adequada por máscara. A saturação de oxigênio está em 85%. Não é possível visualizar as cordas vocais devido ao edema e ao sangramento na orofaringe. No caso acima, qual deve ser a conduta imediata para garantir via aérea neste paciente?", "opts": {"A": "Fornecer oxigênio em cateter imediatamente. Após uso de luva de procedimento o plantonista deverá realizar exploração do ferimento e tentar reduzir as fraturas da mandíbula.", "B": "Fornecer oxigênio em máscara imediatamente. Após adequado monitoramento do mesmo, proceder à cricotireoidostomia cirúrgica em leito de emergência.", "C": "Fornecer oxigênio em máscara imediatamente. Após, proceder à intubação nasotraqueal, uma vez que o trauma apresentado impede a intubação orotraqueal.", "D": "Fornecer oxigênio em cateter imediatamente. Após adequado monitoramento, solicitar avaliação da equipe de cirurgia geral que deverá encaminhar paciente ao bloco para realizar traqueostomia."}, "topic": "Via áerea cirurgica", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Fornecer oxigênio em máscara imediatamente. Após adequado monitoramento do mesmo, proceder à cricotireoidostomia cirúrgica em leito de emergência."}, {"n": 29, "meta": "(2025.2) ROT.2-B-12T: Q.24", "stem": "Paciente masculino, 34 anos, é admitido na unidade hospitalar após um acidente de moto, apresentando trauma facial significativo com múltiplas fratur  por punção.", "D": "Tubo orotraqueal."}, "topic": "Via áerea cirurgica", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Cricotireoidostomia cirúrgica."}, {"n": 31, "meta": "(2025.1) ROT.1-B-14T: Q.8", "stem": "Um paciente do sexo masculino, 35 anos, chega ao pronto-socorro após um acidente de motocicleta, apresentando trauma maxilomandibular maciço. Ele está com sangramento oral profuso, dificuldade respiratória e sinais de hipoxemia. Três tentativas de intubação orotraqueal falham devido ao sangramento que compromete a visualização das vias aéreas, inclusive pelo anestesista da equipe. Considerando esta situação de emergência, qual das alternativas abaixo representa a conduta imediata a ser realizada?", "opts": {"A": "Realizar uma traqueostomia à beira do leito.", "B": "Realizar cricotireostomia cirúrgica de urgência.", "C": "Administrar oxigênio suplementar e aguardar estabilização do quadro.", "D": "Repetir a intubação orotraqueal com um tubo mais largo."}, "topic": "Via áerea cirurgica", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Realizar cricotireostomia cirúrgica de urgência."}, {"n": 32, "meta": "(2025.1) ROT.1-B-14T: Q.19", "stem": "Um homem de 45 anos chega ao pronto-socorro após acidente automobilístico. Ele apresenta trauma facial grave com edema progressivo e estridor, mantendo saturação de 88% com oxigênio em máscara não reinalante. A equipe tenta realizar intubação orotraqueal, mas encontra grande dificuldade devido à perda anatômica. O paciente apresenta queda progressiva da saturação. Qual é a próxima conduta para o manejo da via aérea neste caso?", "opts": {"A": "Intubação nasotraqueal com fibra óptica após sedação profunda, mesmo com queda progressiva da saturação.", "B": "Ventilação com máscara laríngea até a resolução do ubação. Após a inserção do tubo endotraqueal, observaram-se ruídos pulmonares bilaterais, estridor, hipoxemia persistente e enfisema subcutâneo na região cervical e torácica. Qual é a complicação mais provável desse procedimento e seu manejo adequado?", "opts": {"A": "Intubação esofágica com ventilação inadequada, sendo necessário retirar imediatamente o tubo endotraqueal, oxigenar o paciente com máscara e realizar nova tentativa de intubação sob visualização direta, preferencialmente com videolaringoscópio.", "B": "Edema leve de vias aéreas secundário à manipulação repetitiva, devendo manter o paciente sob sedação e ventilação mecânica com fração inspirada de oxigênio adequada, além de considerar corticoterapia para reduzir o edema.", "C": "Pneumotórax hipertensivo secundário a barotrauma, sendo indicado realizar descompressão imediata com agulha no segundo espaço intercostal na linha médio-clavicular, seguida de inserção de um dreno na cavidade pleural através da parede torácica.", "D": "Ruptura traqueal, com indicação de suspender a ventilação com pressão positiva, fornecer suporte ventilatório com mínima pressão, consultar a cirurgia torácica e considerar reparo cirúrgico caso haja comprometimento significativo."}, "topic": "Via áerea cirurgica", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Ruptura traqueal, com indicação de suspender a ventilação com pressão positiva, fornecer suporte ventilatório com mínima pressão, consultar a cirurgia torácica e considerar reparo cirúrgico caso haja comprometimento significativo."}, {"n": 35, "meta": "(2025.1) ROT.3-B-14T: Q.9", "stem": "Um paciente de 55 anos, vítima de trauma facial grave, foi submetido a traqueostomia de urgência para garantir a via aérea. Após a estabilização clínica, permanece em unidade de terapia intensiva com suporte ventilatório mecânico. Considerando o manejo pós-operatório da via aérea lizar traqueostomia imediata para substituição definitiva da via aérea.", "D": "Pneumotórax hipertensivo bilateral, sendo indicada drenagem torácica de urgência antes de qualquer outra intervenção."}, "topic": "Via áerea cirurgica", "official": "B", "medical": "B", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: B) Enfisema subcutâneo por falsa via ou extravasamento de ar, exigindo remoção da cânula mal posicionada e nova abordagem com revisão da cricotireoidostomia."}, {"n": 37, "meta": "(2026.1) ROT.1-B: Q.3", "stem": "Homem de 46 anos é admitido na emergência após trauma cervical por colisão automobilística. Apresenta rebaixamento do nível de consciência, estridor intenso, cianose perioral e esforço respiratório progressivo. A oximetria de pulso mostra saturação de oxigênio de 82% apesar de oxigênio suplementar. Tentativas de ventilação com bolsa-válvula-máscara são ineficazes devido à deformidade facial e edema cervical importante. A intubação orotraqueal é tentada sem sucesso, com visualização inadequada das cordas vocais. A capnografia não demonstra curva compatível com ventilação eficaz. O paciente evolui com piora rápida do padrão respiratório. Diante do quadro apresentado, qual é a conduta terapêutica imediata mais adequada para o manejo da via aérea desse paciente?", "opts": {"A": "Realizar cricotireoidostomia de emergência como via aérea cirúrgica definitiva no contexto de falha de ventilação e intubação.", "B": "Manter ventilação com bolsa-válvula-máscara e sedação profunda para reduzir esforço respiratório, mesmo sem capnografia compatível com ventilação eficaz.", "C": "Repetir tentativas de intubação orotraqueal sucessivas até obter sucesso técnico, apesar de ventilação ineficaz e piora clínica progressiva.", "D": "Solicitar avaliação especializada e aguardar condições ideais para traqueostomia eletiva, apesar de hipóxia grave e evolução rápida do quadro respiratório."}, "topic"  de 35 anos é admitido no pronto-socorro após queda de altura de aproximadamente 5 metros. Ele está confuso e pálido, com sinais vitais alterados: PA 80/40 mmHg, FC 120 bpm, FR 24 irpm. Ao exame, apresenta dor intensa e instabilidade da pelve, além de hematoma perineal e escroto edemaciado. O exame FAST (Focused Assessment with Sonography for Trauma) mostra líquido livre na cavidade abdominal. Diante desse quadro, qual deve ser a conduta inicial mais apropriada?", "opts": {"A": "Laparotomia exploratória imediata devido à instabilidade hemodinâmica e presença de líquido livre no FAST.", "B": "Estabilização da pelve com fixador externo, reposição volêmica e avaliação angiográfica para embolização arterial.", "C": "Monitorização intensiva na UTI com ressuscitação volêmica e uso de hemoderivados para estabilização antes da cirurgia.", "D": "Solicitação de tomografia computadorizada de abdome e pelve com contraste para melhor definição das lesões."}, "topic": "Trauma abdominal e pélvico", "official": "A", "medical": "A", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: A) Laparotomia exploratória imediata devido à instabilidade hemodinâmica e presença de líquido livre no FAST."}, {"n": 61, "meta": "(2025.1) ROT.3-B-14T: Q.2", "stem": "Um paciente de 35 anos, vítima de colisão de alta energia, é admitido na sala de trauma apresentando rebaixamento do nível de consciência, hipotensão arterial (PA 80/ mmHg), taquicardia (FC 130 bpm) e respiração superficial. No exame primário do protocolo ATLS, é detectado sangramento ativo na pelve e instabilidade hemodinâmica refratária à reposição volêmica inicial com cristaloides. O FAST é positivo para líquido livre em pelve e espaço hepatorrenal, e a radiografia pélvica mostra fratura instável. Qual das condutas a seguir representa a estratégia terapêutica mais adequada e prioritária segundo o protocolo ATLS para esse paciente?", "opts": {"A": "Administração emp ssessment with Sonography for Trauma) no leito, priorizando a identificação de líquido livre intra- abdominal."}, "topic": "Trauma abdominal e pélvico", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Realizar ultrassonografia FAST (Focused Assessment with Sonography for Trauma) no leito, priorizando a identificação de líquido livre intra- abdominal."}, {"n": 63, "meta": "(2025.1) ROT.3-B-14T: Q.18", "stem": "Um paciente politraumatizado foi submetido à laparotomia de emergência por lesão hepática grau IV após acidente automobilístico. No pós-operatório imediato, encontra-se hemodinamicamente estável, com boa evolução clínica, porém refere dor abdominal intensa que interfere na ventilação e mobilização precoce. Considerando os protocolos atuais de cuidado pós-operatório em trauma abdominal, qual das estratégias a seguir representa uma conduta adequada para o manejo da dor visando à recuperação otimizada do paciente?", "opts": {"A": "Administrar analgésicos conforme demanda (PRN), evitando esquemas fixos ou controle contínuo para prevenir tolerância e dependência medicamentosa.", "B": "Prescrever apenas anti-inflamatórios não esteroidais (AINEs), evitando opioides devido ao risco de depressão respiratória em qualquer intensidade de dor.", "C": "Realizar sedação contínua com benzodiazepínicos e monitorar a dor apenas se o paciente demonstrar agitação ou hipertensão.", "D": "Utilizar analgesia multimodal combinando opioides, AINEs e, se disponível, bloqueios regionais como cateter peridural, ajustando conforme resposta clínica."}, "topic": "Trauma abdominal e pélvico", "official": "D", "medical": "D", "comment": "O PDF de Cirurgia B fornece o gabarito oficial, mas não apresenta comentário detalhado nesta versão. Gabarito: D) Utilizar analgesia multimodal combinando opioides, AINEs e, se disponível, bloqueios regionais como cateter peridural, ajustando conforme
