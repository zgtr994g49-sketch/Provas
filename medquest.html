agem endoscópica transmural guiada por ecoendoscopia.", "C": "Trata-se de coleção líquida peripancreática tardia, devendo ser tratada inicialmente com drenagem percutânea guiada por tomografia, reservando a abordagem endoscópica apenas para falha do método percutâneo.", "D": "O quadro é compatível com necrose pancreática aguda não encapsulada, devendo ser manejado com antibioticoterapia isolada até completa resolução, evitando intervenções invasivas antes de 8 semanas."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "B", "medical": "B", "comment": "O caso descreve de forma clássica uma walled-off necrosis (WON) infectada, definida pela Classificação de Atlanta revisada como uma coleção encapsulada, presente após ≥4 semanas de pancreatite necrosante, contendo material líquido e sólido, frequentemente associada à infecção quando há presença de gás intralesional ou deterioração clínica. As evidências mais recentes sustentam que a estratégia step-up é o padrão ouro para esses pacientes, priorizando abordagens minimamente invasivas, com destaque para a drenagem endoscópica transmural guiada por ecoendoscopia, especialmente quando a coleção é adjacente ao estômago ou duodeno. Estudos randomizados e revisões sistemáticas demonstram que a abordagem endoscópica: • Reduz mortalidade. • Diminui a taxa de fístulas pancreáticas. • Associa-se a menor falência orgânica e menor tempo de internação quando comparada à necrosectomia cirúrgica aberta precoce. • A necrosectomia endoscópica direta é reservada para casos refratários à drenagem simples. Alternativas incorretas: Embora a drenagem percutânea seja uma opção válida, principalmente em coleções laterais ou não acessíveis por via endoscópica, a via endoscópica é preferida quando a coleção está em íntimo contato com o trato gastrointestinal superior, como neste caso, por apresentar melhores desfechos clínicos e menor taxa de complicações. A necrose não é aguda nem não encapsulada, pois o quadro ocorre após 6 semanas e há cápsula definida. Além disso, antibioticoterapia isolada é insuficiente em necrose pancreático infectada, sendo apenas adjuvante à drenagem. O diagnóstico não é pseudocisto, pois pseudocistos são exclusivamente líquidos, ocorrem após pancreatite intersticial, não necrosante, e não contém debris sólidos. Além disso, a necrosectomia cirúrgica aberta imediata deixou de ser primeira linha há mais de uma década, devido à elevada morbimortalidade."}, {"n": 93, "meta": "(2026.1) ROT.1-A: Q.20", "stem": "Paciente feminina, 45 anos, apresenta episódios recorrentes de hipoglicemia, sudorese, confusão mental e melhora rápida após ingestão de carboidratos. Dosagem de insulina e peptídeo C estão inapropriadamente elevados durante crise hipoglicêmica. Ressonância magnética evidencia lesão sólida de 1,5 cm na cauda do pâncreas, sem metástases. Qual é a conduta mais adequada?", "opts": {"A": "Observação clínica, pois tumores pequenos são benignos.", "B": "Quimioterapia sistêmica imediata.", "C": "Tratamento clínico com análogos da somatostatina exclusivamente.", "D": "Ressecção cirúrgica da lesão pancreática."}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "D", "medical": "D", "comment": "O quadro é típico de insulinoma, tumor neuroendócrino funcional, geralmente benigno, porém com indicação cirúrgica, que é curativa na maioria dos casos. Explicação das incorretas: O tratamento exclusivo com análogos da somatostatina não é conduta definitiva para insulinoma localizado e ressecável. Esses fármacos podem ser utilizados como controle temporário da hipoglicemia ou em casos não cirúrgicos, mas não substituem o tratamento curativo, que é cirúrgico. Quimioterapia sistêmica é reservada para tumores neuroendócrinos metastáticos ou irressecáveis. Neste caso, trata-se de lesão única, pequena e localizada, sem evidência de disseminação, não havendo indicação de tratamento sistêmico. Embora muitos insulinomas sejam benignos e pequenos, eles podem causar hipoglicemias graves e recorrentes. A simples observação clínica não é adequada, pois mantém o risco de eventos neuroglucopênicos potencialmente perigosos."}, {"n": 94, "meta": "(2026.1) ROT.1-A: Q.24", "stem": "Homem de 64 anos é internado para investigação de icterícia obstrutiva progressiva há 5 semanas, associada a colúria, acolia fecal, prurido intenso e perda ponderal de 7 kg. Nega episódios de dor biliar recente. Ao exame físico, apresenta icterícia importante e vesícula biliar palpável e indolor. Os exames laboratoriais mostram padrão colestático (bilirrubina direta elevada, FA e GGT aumentadas). A colangiorressonância (MRCP) evidencia: • Dilatação das vias biliares intra e extra-hepáticas. • Interrupção distal do colédoco com estenose curta e abrupta. • Dilatação concomitante do ducto pancreático principal. Com base nos achados da colangiorressonância, qual é o diagnóstico mais provável?", "opts": {"A": "Tumor de cabeça de pâncreas, causando obstrução distal da via biliar e do ducto pancreático.", "B": "Coledocolitíase, caracterizada por defeito de enchimento intraluminal no colédoco.", "C": "Colangiocarcinoma extra-hepático distal, com estenose longa e irregular da via biliar.", "D": "Litíase vesicular não complicada, cursando com cólica biliar recorrente. CÂNCER DE CÓLON E RETO (DIAGNÓSTICO CÂNCER DE CÓLON E RETO (DIAGNÓSTICO CÂNCER DE CÓLON E RETO (DIAGNÓSTICO CLÍNICO, LABORATORIAL, RADIOLÓGICO E CLÍNICO, LABORATORIAL, RADIOLÓGICO E CLÍNICO, LABORATORIAL, RADIOLÓGICO E CONDUÇÃO CLÍNICA) CONDUÇÃO CLÍNICA) CONDUÇÃO CLÍNICA)"}, "topic": "Afecções do pâncreas (Pancreatite aguda e crônica, pseudocisto, neoplasias císticas, adenocarcinoma): diagnóstico/tratamento/complicações", "official": "A", "medical": "A", "comment": "A) \"Tumor de cabeça de pâncreas, causando obstrução distal da via biliar e do ducto pancreático.\" CORRETA. A colangiorressonância demonstra o clássico \"sinal do duplo ducto\", caracterizado por: dilatação simultânea do colédoco e do ducto pancreático principal, obstrução distal abrupta, ausência de cálculos intraluminais, associado a icterícia indolor, perda ponderal e vesícula palpável (sinal de Courvoisier). Esse padrão é altamente sugestivo de neoplasia de cabeça de pâncreas. D) \"Litíase vesicular não complicada, cursando com cólica biliar recorrente.\" INCORRETA. A colelitíase simples não provoca obstrução da via biliar principal nem dilatação ductal significativa, além de não cursar com icterícia obstrutiva persistente. B) \"Coledocolitíase, caracterizada por defeito de enchimento intraluminal no colédoco.\" INCORRETA. Embora a coledocolitíase possa causar obstrução distal da via biliar, geralmente apresenta quadro de início mais agudo, frequentemente associado a dor biliar intensa. Além disso, a evolução progressiva com perda ponderal significativa e presença do sinal do duplo ducto favorecem etiologia neoplásica, tornando a hipótese de cálculo menos provável neste contexto clínico. C) \"Colangiocarcinoma extra-hepático distal, com estenose longa e irregular da via biliar.\" INCORRETA. O colangiocarcinoma costuma apresentar: estenose longa, irregular e infiltrativa da via biliar, geralmente sem dilatação do ducto pancreático principal. A estenose curta e abrupta associada ao duplo ducto favorece etiologia pancreática."}, {"n": 95, "meta": "(2025.2) ROT.1-A-12T: Q.1", "stem": "Homem de 62 anos, previamente saudável, é diagnosticado com adenocarcinoma de cólon sigmoide. A colonoscopia mostrou lesão estenosante a 30 cm da margem anal, e a biópsia confirmou adenocarcinoma moderadamente diferenciado. A tomografia de tórax, abdome e pelve não identificou metástases. O exame anatomopatológico pós-colectomia mostrou invasão até a subserosa, com 4 linfonodos positivos em um total de 18 examinados. O marcador CEA pré-operatório era de 9,2 ng/mL. Qual das alternativas abaixo melhor expressa a avaliação prognóstica desse caso?", "opts": {"A": "O número total de linfonodos avaliados é insuficiente para estadiamento, sendo necessário novo procedimento cirúrgico.", "B": "A profundidade da invasão tumoral do paciente em questão não afeta o estadiamento nem o prognóstico.", "C": "O valor do CEA do paciente em questão é diagnóstico e suficiente para indicar metástase hepática oculta.", "D": "A presença de linfonodos positivos e o valor do CEA indicam maior risco de recorrência, sendo candidatos à quimioterapia adjuvante."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "D", "medical": "D", "comment": "A) \"O número total de linfonodos avaliados é insuficiente para estadiamento, sendo necessário novo procedimento cirúrgico.\" INCORRETA. O número mínimo recomendado de linfonodos examinados para estadiamento adequado é 12. Neste caso, 18 linfonodos foram avaliados, o que é suficiente. B) \"A profundidade da invasão tumoral do paciente em questão não afeta o estadiamento nem o prognóstico.\" INCORRETA. A profundidade da invasão (p. ex., até subserosa = T3) é um critério central no estadiamento TNM e impacta o prognóstico. Tumores T3 com linfonodos positivos são classificados como estádio IIIB. C) \"O valor do CEA do paciente em questão é diagnóstico e suficiente para indicar metástase hepática oculta.\" INCORRETA. Embora a elevação do CEA (> 5 ng/mL) esteja associada a pior prognóstico, ela não é diagnóstica de metástases. Deve ser correlacionada com achados de imagem e outros dados clínicos. D) \"A presença de linfonodos positivos e o valor do CEA indicam maior risco de recorrência, sendo candidatos à quimioterapia adjuvante.\" CORRETA. O Sabiston destaca que o envolvimento linfonodal (estágio III) e o CEA pré-operatório elevado são fatores prognósticos desfavoráveis. Esses pacientes devem ser encaminhados para quimioterapia adjuvante, mesmo na ausência de metástases."}, {"n": 96, "meta": "(2025.2) ROT.1-A-12T: Q.7", "stem": "Homem de 65 anos, com histórico de perda ponderal não intencional, fraqueza, alteração do hábito intestinal (alternância entre diarreia e constipação), e episódios de hematoquezia há cerca de dois meses, procura atendimento ambulatorial. Ao exame físico, encontra-se em bom estado geral, com discreta palidez cutaneomucosa e abdome indolor. Exames laboratoriais revelam anemia normocítica normocrômica. Foi realizada colonoscopia, que identificou lesão vegetante, infiltrativa e friável em sigmoide, com estenose luminal parcial. Tomografia computadorizada de abdome com contraste demonstrou espessamento irregular da parede do cólon sigmoide, com perda do plano gorduroso pericólico e presença de linfonodos mesentéricos aumentados. Com base no quadro clínico e nos achados de imagem, qual é a hipótese diagnóstica mais provável e a conduta adequada para confirmação diagnóstica?", "opts": {"A": "Doença inflamatória intestinal (retocolite ulcerativa atípica); indicar colonoscopia com biópsias múltiplas e iniciar tratamento conforme resultado histológico.", "B": "Colite isquêmica segmentar; indicar angiotomografia de abdome para avaliação vascular e confirmação diagnóstica.", "C": "Câncer colorretal; realizar biópsia da lesão durante a colonoscopia para confirmação histológica.", "D": "Doença diverticular complicada; solicitar colonoscopia diagnóstica com biópsia após resolução do quadro inflamatório inicial."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "C", "medical": "C", "comment": "Correta: Câncer colorretal – Perda ponderal, alteração do hábito intestinal, anemia e lesão vegetante infiltrativa com linfonodomegalia. Diretrizes NCCN/ESMO/SBCP indicam biópsia endoscópica para confirmação histológica. Comentário das alternativas incorretas: Doença diverticular complicada – Quadro não apresenta dor localizada, febre ou sinais inflamatórios agudos; achado endoscópico incompatível. Colite isquêmica segmentar – Lesão vegetante não é típica; colite isquêmica cursa com dor súbita e alterações inflamatórias difusas. Doença inflamatória intestinal (RCU atípica) – Padrão clínico e endoscópico não compatível; ausência de inflamação difusa e lesões contínuas típicas."}, {"n": 97, "meta": "(2025.2) ROT.1-A-12T: Q.8", "stem": "Homem, 61 anos, com dor abdominal, distensão e ausência de eliminação de fezes e gases há 5 dias. Refere constipação crônica e uso prolongado de laxativos, com piora nos últimos 3 meses. Ao exame: estado geral comprometido, desidratado, abdome distendido e doloroso, sem sinais de peritonite; toque retal revela lesão vegetante circunferencial a 4 cm da borda anal, sem fezes em ampola. TC abdominal mostra distensão colônica e espessamento do reto médio/distal com linfonodomegalia em mesorreto. Qual é a melhor conduta neste caso?", "opts": {"A": "Cirurgia de Hartmann, com linfadenectomia colônica e retal.", "B": "Neoadjuvância seguida de proctocolectomia parcial, com margens livres e linfadenectomia.", "C": "Proctocolectomia parcial, com linfadenectomia e sutura mecânica colorretal.", "D": "Colostomia em alça."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "D", "medical": "D", "comment": "A) \"Cirurgia de Hartmann, com linfadenectomia colônica e retal.\" INCORRETA. A cirurgia de Hartmann é opção em urgências de câncer de reto alto ou sigmoide perfurado/obstruído, quando não é possível anastomose. Problema: o tumor é reto médio/distal, em obstrução, e não há preparo nem condições clínicas para ressecção oncológica imediata segura. Além disso, a Hartmann não é a escolha para tumores baixos com intenção futura de preservação esfincteriana. B) \"Neoadjuvância seguida de proctocolectomia parcial, com margens livres e linfadenectomia.\" INCORRETA. Embora seja o tratamento definitivo ideal para câncer de reto médio/distal (quimiorradioterapia neoadjuvante + cirurgia), não pode ser iniciado agora porque o paciente está com obstrução grave e precisa primeiro de descompressão intestinal. C) \"Proctocolectomia parcial, com linfadenectomia e sutura mecânica colorretal.\" INCORRETA. Envolve ressecção com anastomose imediata, o que não é indicado neste contexto: paciente desidratado, distendido, em urgência. Anastomose nesse cenário tem alto risco de deiscência e complicações. D) \"Colostomia em alça.\" CORRETA. Em câncer de reto distal com obstrução aguda, a conduta de escolha é derivação de urgência (colostomia em alça) para descompressão do cólon. Isso estabiliza o paciente e permite que seja submetido posteriormente ao tratamento oncológico ideal (quimiorradioterapia neoadjuvante + ressecção com margens e linfadenectomia) em condições adequadas."}, {"n": 98, "meta": "(2025.2) ROT.2-A-14T: Q.15", "stem": "Paciente masculino, 60 anos, é atendido no ambulatório de coloproctologia, encaminhado para rastreamento de neoplasia colorretal. Ele informa que não tem antecedentes familiares com histórico de neoplasia colorretal, não apresenta outras doenças ou síndromes e foi orientado a realizar colonoscopia. Considerando o rastreamento da neoplasia colorretal, marque a alternativa correta:", "opts": {"A": "A conduta de rastreamento é inadequada, pois a colonoscopia deve ser realizada somente após os 65 anos para pacientes de baixo risco, devido à relação custo-benefício.", "B": "O paciente deve ser submetido à pesquisa de sangue oculto nas fezes (PSOF) anualmente e só deve realizar a colonoscopia se o resultado for positivo.", "C": "O paciente não necessita de rastreamento neste momento, pois a ausência de histórico familiar e outros fatores de risco sugere que a idade não é um fator determinante isoladamente.", "D": "A colonoscopia é o exame de escolha, e a idade do paciente é adequada para o rastreamento. Caso o exame seja normal, o próximo rastreamento com colonoscopia deve ser agendado para 10 anos."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "D", "medical": "D", "comment": "D) \"A colonoscopia é o exame de escolha, e a idade do paciente é adequada para o rastreamento. Caso o exame seja normal, o próximo rastreamento com colonoscopia deve ser agendado para 10 anos.\" CORRETA. • Idade: O rastreamento do câncer colorretal em indivíduos de risco médio (sem histórico familiar relevante, sem doenças predisponentes) deve começar aos 45 anos, segundo diretrizes recentes. O paciente tem 60 anos e está dentro da faixa etária recomendada (45–75 anos). • Método: A colonoscopia é um dos métodos de rastreamento indicados para risco médio, junto com pesquisa de sangue oculto nas fezes (PSOF) e outros testes. É considerada padrão-ouro, pois permite diagnóstico e remoção de pólipos no mesmo procedimento. • Intervalo: Para risco médio, se a colonoscopia estiver normal, repete-se a cada 10 anos. A) \"A conduta de rastreamento é inadequada, pois a colonoscopia deve ser realizada somente após os 65 anos para pacientes de baixo risco, devido à relação custo-benefício.\" INCORRETA. Não é preciso esperar até os 65 anos. O rastreamento deve começar aos 45 anos no risco médio. Atrasar o início aumenta o risco de diagnóstico tardio e pior prognóstico. B) \"O paciente deve ser submetido à pesquisa de sangue oculto nas fezes (PSOF) anualmente e só deve realizar a colonoscopia se o resultado for positivo.\" INCORRETA. A PSOF anual é uma opção válida para risco médio, mas não é a única. A colonoscopia direta é igualmente indicada e, em muitos casos, preferida por permitir detecção e tratamento de lesões no mesmo ato. C) \"O paciente não necessita de rastreamento neste momento, pois a ausência de histórico familiar e outros fatores de risco sugere que a idade não é um fator determinante isoladamente.\" INCORRETA. A idade é, sim, um fator isolado para iniciar o rastreamento em risco médio. Mesmo sem histórico familiar, o risco de câncer colorretal aumenta a partir dos 45 anos."}, {"n": 99, "meta": "(2025.2) ROT.2-A-14T: Q.28", "stem": "Paciente masculino, 57 anos, procura atendimento com anemia ferropriva, alteração do hábito intestinal há dois meses (alternância entre constipação e diarreia) e perda ponderal não intencional de 4 kg no período. Nega dor abdominal intensa, febre ou história familiar de câncer colorretal. Ao exame físico, apresenta palidez cutaneomucosa, sem massas palpáveis em abdome. Exame proctológico normal. Considerando esse quadro, qual deve ser a conduta inicial mais adequada em relação ao encaminhamento e investigação?", "opts": {"A": "Solicitar pesquisa de sangue oculto nas fezes e, se positivo, encaminhar ao especialista.", "B": "Solicitar uma colonoscopia e, desde já, encaminhar para proctologista/oncologista com prioridade.", "C": "Solicitar ultrassonografia de abdome e, após o resultado, definir necessidade de encaminhamento a um especialista.", "D": "Solicitar exames laboratoriais de controle para definir necessidade de encaminhamento a um especialista."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "B", "medical": "B", "comment": "CORRETA. O paciente apresenta sinais/sintomas de alarme para neoplasia colorretal (anemia ferropriva, alteração do hábito intestinal, perda ponderal), o que exige encaminhamento prioritário ao especialista para diagnóstico e início rápido do tratamento. A colonoscopia é o exame de escolha para investigação. INCORRETA. A investigação inicial laboratorial é importante, mas não pode retardar o encaminhamento ao especialista, pois há sinais de alarme para neoplasia colorretal. INCORRETA. Pesquisa de sangue oculto tem baixo valor diante de sintomas de alarme já presentes. O encaminhamento não deve ser retardado. INCORRETA. US abdominal possui baixa sensibilidade para tumores colônicos iniciais e não substitui a avaliação endoscópica."}, {"n": 100, "meta": "(2025.2) ROT.2-A-14T: Q.29", "stem": "Um paciente de 64 anos apresenta sangramento retal intermitente há 4 meses, perda ponderal de 6 kg no período e mudança no hábito intestinal. A colonoscopia evidencia lesão vegetante no sigmoide médio, cujo anatomopatológico confirma adenocarcinoma moderadamente diferenciado. A tomografia de tórax, abdome e pelve mostra linfonodos pericólicos aumentados, sem metástases hepáticas ou pulmonares. Considerando os achados clínicos, endoscópicos e de imagem, qual deve ser a conduta terapêutica inicial mais apropriada para este paciente?", "opts": {"A": "Solicitar biópsia hepática para confirmar ausência de metástases antes de estabelecer conduta terapêutica.", "B": "Iniciar quimioterapia adjuvante de forma imediata, considerando a confirmação histológica de malignidade.", "C": "Indicar radioterapia neoadjuvante como rotina para casos de câncer de cólon antes da cirurgia.", "D": "Realizar ressecção cirúrgica com linfadenectomia, seguida de avaliação patológica para definir necessidade de adjuvância."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "D", "medical": "D", "comment": "D) \"Realizar ressecção cirúrgica com linfadenectomia, seguida de avaliação patológica para definir necessidade de adjuvância.\" CORRETA. O tratamento inicial correto, diante de câncer de cólon localizado sem metástases à distância, é a ressecção cirúrgica com linfadenectomia, permitindo estadiamento definitivo a partir do resultado anatomopatológico da peça (T, N, margens) e avaliação da necessidade de quimioterapia adjuvante. B) \"Iniciar quimioterapia adjuvante de forma imediata, considerando a confirmação histológica de malignidade.\" INCORRETA. Iniciar quimioterapia adjuvante antes da cirurgia em tumores de cólon sem metástases é incorreto, pois a indicação depende do estadiamento patológico, geralmente restrita a estádios III e a estádios II de alto risco. C) \"Indicar radioterapia neoadjuvante como rotina para casos de câncer de cólon antes da cirurgia.\" INCORRETA. A radioterapia não é indicada de rotina para tumores de cólon, sendo reservada para neoplasias de reto médio ou baixo e casos localmente avançados na pelve. A) \"Solicitar biópsia hepática para confirmar ausência de metástases antes de estabelecer conduta terapêutica.\" INCORRETA. Solicitar biópsia hepática, quando a tomografia já excluiu lesões suspeitas, é desnecessário e não faz parte da conduta inicial preconizada."}, {"n": 101, "meta": "(2025.2) ROT.3-A-14T: Q.14", "stem": "Durante consulta em ambulatório de especialidades, um paciente de 64 anos, previamente hígido, relata fadiga progressiva há três meses, além de episódios intermitentes de dor abdominal difusa e sensação de distensão. Nega sangramento nas fezes ou perda de peso significativa. Ao exame físico, encontra-se pálido, com leve desconforto abdominal difuso e sem massas palpáveis. Os exames laboratoriais revelam anemia ferropriva. A equipe solicita colonoscopia. Considerando a apresentação clínica e os padrões anatômicos do câncer colorretal, a localização mais provável da lesão é:", "opts": {"A": "Cólon direito, onde os tumores tendem a crescer de forma exofítica e cursam com sintomas insidiosos e anemia crônica.", "B": "Cólon transverso, pois os tumores dessa região geralmente se manifestam com obstrução intestinal precoce e constipação intensa.", "C": "Cólon esquerdo, em que os tumores geralmente causam obstrução precoce com dor intensa e alteração abrupta do hábito intestinal.", "D": "Deve-se tratar de lesão de reto, devido à dor abdominal e distensão associadas à ausência de emagrecimento."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "A", "medical": "A", "comment": "Tumores retais costumam causar tenesmo, hematoquezia e alterações do hábito intestinal, o que não está presente neste caso. O câncer de cólon direito costuma ser silencioso, com crescimento exofítico e sintomas como anemia ferropriva, astenia e dor abdominal vaga, pela maior complacência dessa região. O cólon transverso possui diâmetro ainda relativamente amplo e fezes mais amolecidas, pois o conteúdo intestinal só começa a se solidificar mais distalmente (no cólon descendente e sigmoide). Por isso, tumores nessa região raramente causam obstrução precoce ou constipação intensa. Tumores do cólon esquerdo são mais propensos a provocar obstrução intestinal precoce com constipação progressiva e dor em cólica localizada."}, {"n": 102, "meta": "(2025.2) ROT.3-A-12T: Q.29", "stem": "Homem, 68 anos, procura a UPA com dor abdominal há 5 dias, iniciada em cólica e que evoluiu para dor contínua e progressivamente mais intensa. Relata também náuseas, vômitos e ausência de eliminação de gases e fezes desde o início do quadro. Encontra-se em regular estado geral, corado e desidratado. Está afebril, com FC: 110 bpm e PA: 110×60 mmHg. O abdome é globoso, distendido, hipertimpânico e doloroso à palpação difusa, porém sem sinais de peritonite. Realizada tomografia de abdome com contraste, que revela: • Lesão tumoral estenosante no cólon sigmoide, medindo 5 cm, com espessamento irregular da parede e realce heterogêneo • Linfonodomegalias peritumorais, de até 1,5 cm • Dilatação do cólon proximal (descendente e transverso, até 6 cm), sem distensão significativa de delgado Com base no caso descrito, qual a principal hipótese diagnóstica e a conduta mais adequada?", "opts": {"A": "Tumor colorretal com obstrução em alça aberta – indicação de colonoscopia.", "B": "Vôlvulo de sigmoide – indicação de retossigmoidoscopia rígida.", "C": "Diverticulite pseudotumoral – tratamento com antibioticoterapia.", "D": "Tumor colorretal com obstrução em alça fechada – indicação de laparotomia."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "D", "medical": "D", "comment": "O paciente apresenta quadro clínico de obstrução intestinal baixa, com dor abdominal progressiva, parada de flatos e fezes, além de distensão abdominal e timpanismo. A tomografia mostra lesão tumoral estenosante em cólon sigmoide, com dilatação colônica proximal importante, mas sem distensão de delgado, sugerindo obstrução em alça fechada. Na obstrução em alça fechada, um segmento do cólon fica bloqueado proximal e distalmente (frequentemente entre uma válvula ileocecal competente e a lesão estenosante). Isso leva à distensão progressiva do cólon, risco elevado de perfuração e sofrimento isquêmico — o que configura uma urgência cirúrgica absoluta. Alternativa correta: – Tumor colorretal com obstrução em alça fechada – laparotomia. Essa é a conduta preconizada para tumores obstrutivos com risco de complicação aguda. Importante discernir que a presença de distensão colônica significativa e ausência de distensão de delgado indicam válvula ileocecal competente, caracterizando a \"obstrução em alça fechada\", com elevado risco de perfuração. A laparotomia visa descompressão e ressecção oncológica, quando possível. Demais alternativas: Colonoscopia está contraindicada em obstruções completas por risco de perfuração. Além disso, o padrão tomográfico é de alça fechada, não alça aberta. A diverticulite pseudotumoral pode simular tumor, mas o quadro clínico é distinto: costuma ser subagudo, com febre, leucocitose e inflamação pericólica, geralmente sem obstrução completa e com resposta a antibiótico. A TC nesse caso descreve lesão com padrão tumoral típico e linfonodomegalia, afastando essa hipótese. O vôlvulo de sigmoide cursa com distensão importante do sigmoide (em \"grão de café\" na TC), o que não foi descrito. Além disso, a abordagem endoscópica é reservada a pacientes estáveis com diagnóstico típico, o que não se aplica aqui."}, {"n": 103, "meta": "(2026.1) ROT.1-A: Q.2", "stem": "Dois pacientes são avaliados em ambulatório de cirurgia oncológica. Paciente A, 63 anos, apresenta anemia ferropriva e colonoscopia evidenciando lesão ulceroinfiltrativa em cólon ascendente. Biópsia confirma adenocarcinoma moderadamente diferenciado. Tomografia de abdome e pelve não demonstra metástases à distância. Paciente B, 58 anos, apresenta sangramento retal e tenesmo. Colonoscopia evidencia lesão vegetante a 6 cm da borda anal. Biópsia confirma adenocarcinoma. A ressonância magnética de pelve demonstra comprometimento da parede retal com possível invasão mesorretal, sem metástases à distância. Considerando as diferenças anatômicas e terapêuticas entre câncer de cólon e câncer de reto, qual afirmação é mais adequada em relação ao manejo inicial desses pacientes?", "opts": {"A": "O câncer de cólon exige obrigatoriamente radioterapia pré-operatória para redução tumoral, enquanto o câncer de reto é tratado apenas com cirurgia.", "B": "O paciente com câncer de reto pode necessitar de estadiamento local detalhado com ressonância magnética e eventual neoadjuvância antes da cirurgia, diferentemente do câncer de cólon.", "C": "Ambos os pacientes devem ser submetidos diretamente à ressecção cirúrgica oncológica como primeira etapa terapêutica.", "D": "As diferenças anatômicas entre cólon e reto não impactam a estratégia terapêutica inicial quando não há metástases à distância."}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "B", "medical": "B", "comment": "CORRETA. O câncer de reto possui particularidades anatômicas relacionadas à pelve, ao mesorreto e à proximidade com estruturas adjacentes, exigindo estadiamento local por ressonância magnética para avaliação da margem circunferencial de ressecção. Em tumores localmente avançados (T3/T4 ou N+), está indicada terapia neoadjuvante antes da cirurgia, diferentemente do câncer de cólon não metastático, que geralmente é tratado com ressecção primária seguida de avaliação para quimioterapia adjuvante conforme estadiamento patológico. INCORRETA. O câncer de cólon localizado geralmente é tratado com ressecção cirúrgica primária. Entretanto, no câncer de reto, especialmente em tumores localizados no reto médio ou inferior com possível comprometimento mesorretal, é fundamental o estadiamento local detalhado com ressonância magnética de pelve para avaliar margem circunferencial e necessidade de terapia neoadjuvante (quimiorradioterapia). Portanto, nem todos os casos seguem diretamente para cirurgia inicial. INCORRETA. Radioterapia não é rotina no câncer de cólon devido à sua localização intraperitoneal e mobilidade intestinal. Já no câncer de reto, especialmente médio e baixo, a radioterapia associada à quimioterapia pode ser indicada como tratamento neoadjuvante em casos localmente avançados. INCORRETA. As diferenças anatômicas entre cólon (intraperitoneal na maior parte) e reto (extraperitoneal, envolvido pelo mesorreto e limitado pela pelve óssea) influenciam diretamente o estadiamento, planejamento cirúrgico e necessidade de terapia neoadjuvante, impactando significativamente a estratégia terapêutica inicial."}, {"n": 104, "meta": "(2026.1) ROT.1-A: Q.18", "stem": "Homem de 61 anos é atendido em ambulatório de clínica médica por alteração do hábito intestinal há cerca de cinco meses, caracterizada por constipação progressiva, fezes de menor calibre e episódios ocasionais de diarreia. Relata perda ponderal não intencional de 7 kg no período e fadiga aos esforços habituais. Nega dor abdominal intensa. No exame físico, encontra-se hipocorado (++/4), com abdome flácido, indolor e sem massas palpáveis. Os exames laboratoriais evidenciam hemoglobina de 9,4 g/dL, VCM reduzido, ferritina baixa e ferro sérico diminuído. A pesquisa de sangue oculto nas fezes é positiva em duas amostras. Última colonoscopia há 4 anos, sem alterações. Qual é a conduta mais apropriada neste momento para este paciente?", "opts": {"A": "Manter seguimento ambulatorial, tratando sintomas intestinais e aguardando evolução clínica antes de investigação invasiva.", "B": "Solicitar tomografia computadorizada de abdome e pelve como exame inicial para investigação da alteração intestinal descrita.", "C": "Iniciar tratamento da anemia ferropriva, orientar dieta rica em ferro e programar reavaliação clínica após resposta hematológica.", "D": "Encaminhar de forma prioritária para especialista em coloproctologia ou oncologia, com solicitação de colonoscopia diagnóstica completa. CONDUTAS INTERVENCIONISTAS EM DERRAME CONDUTAS INTERVENCIONISTAS EM DERRAME CONDUTAS INTERVENCIONISTAS EM DERRAME PLEURAL - TORACOCENTESE PLEURAL - TORACOCENTESE PLEURAL - TORACOCENTESE"}, "topic": "Câncer de cólon e reto (Diagnóstico clinico, laboratorial, radiologico e Condução clínica.", "official": "D", "medical": "D", "comment": "D) \"Encaminhar de forma prioritária para especialista em coloproctologia ou oncologia, com solicitação de colonoscopia diagnóstica completa.\" CORRETA. O conjunto de achados — homem acima de 50 anos, anemia ferropriva, perda ponderal, alteração do hábito intestinal e sangue oculto positivo — configura alto risco para câncer colorretal. A conduta correta é o encaminhamento precoce ao especialista, garantindo colonoscopia diagnóstica, que é o exame de escolha para confirmação e biópsia, permitindo acesso rápido ao tratamento oncológico. C) \"Iniciar tratamento da anemia ferropriva, orientar dieta rica em ferro e programar reavaliação clínica após resposta hematológica.\" INCORRETA. Embora a anemia ferropriva deva ser tratada, tratar a consequência sem investigar a causa atrasa o diagnóstico de neoplasia colorretal. A reposição de ferro isolada não substitui a investigação etiológica em pacientes com sinais de alarme, configurando conduta inadequada neste momento. B) \"Solicitar tomografia computadorizada de abdome e pelve como exame inicial para investigação da alteração intestinal descrita.\" INCORRETA. A tomografia computadorizada pode ter papel no estadiamento ou na avaliação de complicações, mas não substitui a colonoscopia como exame inicial diagnóstico em suspeita de câncer colorretal. Utilizá-la como primeiro passo pode retardar a confirmação histológica. A) \"Manter seguimento ambulatorial, tratando sintomas intestinais e aguardando evolução clínica antes de investigação invasiva.\" INCORRETA. A abordagem expectante, com tratamento apenas sintomático, é incompatível com a presença de múltiplos sinais de alerta. Aguardar evolução clínica posterga o diagnóstico e compromete o acesso oportuno ao tratamento oncológico."}, {"n": 105, "meta": "(2025.2) ROT.1-A-12T: Q.3", "stem": "Um homem de 54 anos é admitido com dispneia leve, mas estável, e opacificação basal direita na radiografia. A ultrassonografia confirma derrame pleural moderado livre. Apresenta INR 2,8, plaquetas 60.000/mm³ e sinais de púrpura difusa em membros inferiores. Está consciente, estável hemodinamicamente e saturando 92% em ar ambiente. Em relação à toracocentese diagnóstica neste paciente, qual conduta é mais apropriada e por quê?", "opts": {"A": "Conduta conservadora, pois derrames pleurais livres em pacientes estáveis não necessitam de amostragem para investigação diagnóstica.", "B": "Prosseguir apenas se houver ventilação mecânica, pois ela reduz o risco de sangramento durante toracocentese.", "C": "Adiar o procedimento para corrigir coagulopatia e trombocitopenia, pois sangramento descontrolado é contraindicação relativa que exige preparo prévio.", "D": "Prosseguir imediatamente com toracocentese sem ajuste algum, pois a estabilidade clínica descarta risco hemorrágico significativo."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "C", "medical": "C", "comment": "A toracocentese, embora geralmente considerada um procedimento de baixo risco, não é isenta de complicações hemorrágicas, especialmente em pacientes com distúrbios da coagulação que exigem correção antes do procedimento, principalmente quando não se trata de uma emergência. A estabilidade clínica não exclui o risco de sangramento. Um INR de 2,8 e plaquetas de 60.000 representam um estado de alto risco hemorrágico para procedimentos invasivos, mesmo que o paciente esteja normotenso e oxigenando. A ventilação mecânica não reduz o risco de sangramento; pelo contrário, ela pode até dificultar a toracocentese pela alteração na mobilidade pleural e risco de lesão pulmonar em ventilação positiva. Todo derrame pleural de etiologia incerta, especialmente moderado ou importante, deve ser investigado por toracocentese, exceto se houver contraindicação absoluta ou urgência respiratória. O fato de ser um derrame “livre” não isenta da investigação, ainda mais em um paciente com dispneia progressiva e sem causa definida."}, {"n": 106, "meta": "(2025.2) ROT.1-A-12T: Q.26", "stem": "Paciente masculino, 58 anos, apresenta dispneia progressiva e dor torácica em pontada. Exames revelam imagem em parábola com concavidade superior e opacificação do seio costofrênico direito. A ultrassonografia mostra líquido livre e não septado com espessura superior a 15 mm. Considerando os princípios anatômicos, a técnica asséptica e a interpretação diagnóstica correta, qual seria a conduta mais segura e indicada para investigação inicial deste derrame?", "opts": {"A": "Toracocentese diagnóstica no 7º-8º espaço intercostal, na linha axilar posterior ou escapular média, com punção tangenciando a borda superior da costela inferior.", "B": "Drenagem imediata por tubo torácico no 2º espaço intercostal anterior, devido ao risco iminente de colapso pulmonar.", "C": "Inserção de agulha no 5º espaço intercostal anterior sem anestesia, pois a dor indica posicionamento adequado.", "D": "Realização de punção aspirativa no espaço intercostal mais baixo possível, independentemente da imagem."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "A", "medical": "A", "comment": "A) \"Toracocentese diagnóstica no 7º-8º espaço intercostal, na linha axilar posterior ou escapular média, com punção tangenciando a borda superior da costela inferior.\" CORRETA. A toracocentese diagnóstica é indicada em casos de derrame pleural novo ou de causa não estabelecida, especialmente quando a espessura do líquido na ultrassonografia excede 10–15 mm. A punção deve ser feita com o paciente sentado, inclinando-se levemente para frente, no 7º ou 8º espaço intercostal, preferencialmente na linha axilar posterior ou escapular média, sempre na borda superior da costela inferior para evitar lesão do feixe vasculonervoso intercostal. A técnica deve seguir rigorosa assepsia e anestesia local. B) \"Drenagem imediata por tubo torácico no 2º espaço intercostal anterior, devido ao risco iminente de colapso pulmonar.\" INCORRETA. Esse local é reservado para pneumotórax hipertensivo. Um derrame pleural não septado não requer drenagem imediata, mas sim toracocentese diagnóstica inicial. C) \"Inserção de agulha no 5º espaço intercostal anterior sem anestesia, pois a dor indica posicionamento adequado.\" INCORRETA. Realizar punção sem anestesia é antiético, doloroso e perigoso. Além disso, o 5º espaço intercostal anterior não é o local ideal para derrames livres. D) \"Realização de punção aspirativa no espaço intercostal mais baixo possível, independentemente da imagem.\" INCORRETA. Punções abaixo do 9º espaço intercostal aumentam o risco de perfuração de órgãos abdominais (baço, fígado, diafragma). A escolha do espaço deve ser guiada por imagem ou anatomia, não aleatória."}, {"n": 107, "meta": "(2025.2) ROT.2-A-14T: Q.10", "stem": "Um paciente de 67 anos, masculino, tabagista, com antecedente de insuficiência cardíaca congestiva e neoplasia pulmonar em investigação, é admitido no pronto-socorro com dispneia progressiva há 10 dias. O exame físico revela macicez à percussão e diminuição do murmúrio vesicular em hemitórax direito. A radiografia de tórax mostra derrame pleural moderado à direita. É realizada toracocentese diagnóstica, com retirada de líquido amarelo- citrino, límpido, cuja análise mostrou: proteínas pleurais 3,2 g/dL; LDH pleural 250 U/L; proteína sérica 6,0 g/dL; LDH sérico 400 U/L; glicose 55 mg/dL; pH 7,28; predomínio de linfócitos; ADA 18 U/L. Considerando os dados apresentados, assinale a alternativa correta:", "opts": {"A": "O líquido pleural é um transudato pela classificação de Light, e o paciente deve ser manejado em ambiente ambulatorial com ajuste da terapia diurética.", "B": "O líquido é exsudativo; a presença de linfocitose e pH baixo sugere malignidade ou tuberculose. Avaliação especializada e investigação complementar são indicadas em ambiente hospitalar.", "C": "A toracocentese foi inadequada, pois a análise do ADA é suficiente para excluir tuberculose. O paciente deve ser liberado com retorno ambulatorial.", "D": "O padrão laboratorial é típico de um transudato por insuficiência cardíaca, sendo a toracocentese terapêutica suficiente; a análise do pH e da glicose não são úteis neste contexto."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "B", "medical": "B", "comment": "A) \"O líquido pleural é um transudato pela classificação de Light, e o paciente deve ser manejado em ambiente ambulatorial com ajuste da terapia diurética.\" INCORRETA. Pelos critérios de Light, o líquido é exsudativo, pois: Relação proteínas pleural/sérica = 3,2 ÷ 6,0 = 0,53 (>0,5 → exsudato). Relação LDH pleural/sérico = 250 ÷ 400 = 0,625 (>0,6 → exsudato). LDH pleural (250 U/L) > 2/3 do limite superior sérico (≈ 267 U/L para limite de 400). Portanto, não se trata de transudato, e o manejo ambulatorial simples com diuréticos é inadequado. B) \"O líquido é exsudativo; a presença de linfocitose e pH baixo sugere malignidade ou tuberculose. Avaliação especializada e investigação complementar são indicadas em ambiente hospitalar.\" CORRETA. O padrão é exsudativo. Linfocitose no líquido pleural geralmente está associada a tuberculose, neoplasia ou alguns casos de derrame reacional crônico. O pH baixo (<7,30) e a glicose discretamente reduzida também são achados que podem ocorrer tanto em malignidade quanto em tuberculose. O histórico de neoplasia pulmonar e ICC sugere maior probabilidade de neoplasia, mas a tuberculose deve ser investigada. A internação e investigação hospitalar são indicadas pela gravidade e etiologia suspeita. D) \"O padrão laboratorial é típico de um transudato por insuficiência cardíaca, sendo a toracocentese terapêutica suficiente; a análise do pH e da glicose não são úteis neste contexto.\" INCORRETA. O padrão é exsudativo, não transudativo, logo não é típico de derrame pleural por insuficiência cardíaca. Além disso, pH e glicose são parâmetros importantes para diferenciar causas de derrame exsudativo, incluindo neoplasia e derrames paraneumônicos complicados. C) \"A toracocentese foi inadequada, pois a análise do ADA é suficiente para excluir tuberculose. O paciente deve ser liberado com retorno ambulatorial.\" INCORRETA. O valor de ADA (18 U/L) não exclui completamente tuberculose pleural, embora valores <40 U/L tornem o diagnóstico improvável em populações de baixa prevalência. A análise do líquido pleural deve incluir outros parâmetros, e a investigação complementar (citologia, biópsia pleural) pode ser necessária."}, {"n": 108, "meta": "(2025.2) ROT.2-A-14T: Q.19", "stem": "Paciente masculino, 68 anos, tabagista e portador de DPOC, é admitido no pronto-socorro com queixa de dispneia súbita e dor torácica pleurítica à direita. Ao exame físico, observa-se diminuição do murmúrio vesicular e macicez à percussão no hemitórax direito. A radiografia de tórax revela opacificação difusa à direita, com desvio contralateral da traqueia. A toracocentese diagnóstica demonstra líquido pleural turvo, com presença de leucócitos polimorfonucleares, pH de 7,1 e glicose baixa. Com base no caso clínico apresentado, qual é a conduta mais apropriada diante do diagnóstico provável?", "opts": {"A": "Inserir dreno torácico em selo d’água, associado à antibioticoterapia empírica de amplo espectro.", "B": "Realizar toracocentese terapêutica seriada antes de considerar drenagem definitiva.", "C": "Encaminhar o paciente diretamente para decorticação cirúrgica imediata.", "D": "Administrar antibioticoterapia empírica e observar a evolução clínica antes de qualquer intervenção."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "A", "medical": "A", "comment": "A) \"Inserir dreno torácico em selo d’água, associado à antibioticoterapia empírica de amplo espectro.\" CORRETA. O caso é típico de empiema pleural, caracterizado por líquido pleural turvo, pH < 7,2 e glicose baixa, com sintomas clínicos compatíveis. A drenagem pleural com dreno em selo d’água é a conduta adequada para esvaziamento e antibioticoterapia empírica de amplo espectro para controle da infecção. D) \"Administrar antibioticoterapia empírica e observar a evolução clínica antes de qualquer intervenção.\" INCORRETA. Incorreta, pois há critérios bioquímicos e clínicos que indicam necessidade imediata de drenagem, não sendo suficiente apenas a antibioticoterapia inicial. B) \"Realizar toracocentese terapêutica seriada antes de considerar drenagem definitiva.\" INCORRETA. Incorreta, pois a toracocentese seriada pode ser utilizada em derrame parapneumônico simples (líquido claro, pH normal, glicose normal, sem pus). No entanto, no caso descrito, há critérios francos de complicação (pH 7,1 e glicose baixa) → isso já indica que o espaço pleural está infectado e precisa de drenagem contínua. C) \"Encaminhar o paciente diretamente para decorticação cirúrgica imediata.\" INCORRETA. Incorreta, pois a decorticação é reservada para casos em que a drenagem não é eficaz ou há organização fibrótica avançada. O tratamento inicial é a drenagem pleural."}, {"n": 109, "meta": "(2025.2) ROT.3-A-14T: Q.23", "stem": "Paciente do sexo masculino, 68 anos, portador de DPOC e insuficiência cardíaca, é internado com queixa de dispneia progressiva há 5 dias, ortopneia e dor torácica leve à inspiração profunda. Ao exame físico, apresenta estertores em bases, macicez à percussão em base pulmonar direita e murmúrio vesicular abolido nesse hemitórax. A gasometria revela hipoxemia moderada (PaO₂: 58 mmHg em ar ambiente) e a radiografia de tórax mostra derrame pleural à direita estimado de 900 ml e laminar à esquerda. Qual a conduta mais apropriada nesse caso?", "opts": {"A": "A toracocentese está indicada por se tratar de derrame volumoso com repercussão respiratória, mesmo sem suspeita de infecção.", "B": "A presença de derrame pleural bilateral é o principal critério para toracocentese diagnóstica imediata.", "C": "O volume do derrame pleural é pequeno e a toracocentese traria mais risco do que benefício, devendo ser evitada.", "D": "O alívio sintomático por toracocentese só deve ser considerado quando houver dor torácica intensa associada a febre persistente."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "A", "medical": "A", "comment": "Alternativa correta: A toracocentese está clinicamente indicada em pacientes com sinais de comprometimento respiratório secundários ao acúmulo de líquido pleural, como neste caso (hipoxemia, ortopneia e sinais físicos de grande derrame). O procedimento, mesmo que não haja febre ou suspeita de empiema, é útil para alívio sintomático imediato, além de permitir análise do líquido para eventual diagnóstico etiológico. Derrames com volume >500 mL (em especial >800 mL) já podem causar significativa repercussão ventilatória. O risco-benefício da toracocentese é favorável em quadros sintomáticos, especialmente em pacientes com DPOC. A toracocentese não depende de bilateralidade do derrame, e sim de critérios clínicos e radiológicos. Inclusive, derrames unilaterais com repercussão devem ser avaliados com mais atenção para diagnóstico diferencial. A toracocentese não exige dor intensa ou febre para ser indicada. Estes sinais podem indicar infecção pleural, mas o procedimento é igualmente válido em contextos puramente compressivos ou congestivos."}, {"n": 110, "meta": "(2025.2) ROT.3-A-14T: Q.27", "stem": "Homem, 62 anos, com história de hipertensão arterial e insuficiência cardíaca, procura o pronto-socorro por dispneia progressiva, dor pleurítica à direita há 7 dias. Ao exame físico, encontra-se em bom estado geral, eupneico em repouso, com frequência respiratória de 18 irpm, saturação de O₂ de 95% e tax: 37,9°C. Apresenta diminuição do murmúrio vesicular e macicez à percussão no terço inferior do hemitórax direito. Radiografia de tórax mostra derrame pleural à direita, ocupando cerca de um terço do pulmão. Qual a conduta mais adequada para este paciente?", "opts": {"A": "Realizar toracocentese de alívio imediata, independente de sintomas.", "B": "Indicar toracostomia com drenagem pleural fechada de urgência.", "C": "Prescrever diuréticos devido a possível derrame pleural por insuficiência cardíaca.", "D": "Realizar toracocentese diagnóstica para análise do líquido pleural."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "D", "medical": "D", "comment": "A toracocentese de alívio está indicada em pacientes com desconforto respiratório significativo ou instabilidade, o que não é o caso. Todo derrame pleural de etiologia não definida, especialmente volumoso, unilateral ou sintomático, deve ser submetido à toracocentese diagnóstica para classificação e determinação da causa do líquido (transudato versus exsudato). Reservada para grandes derrames com instabilidade, empiema ou pneumotórax associado, não se aplica neste cenário. Observação sem investigação é arriscada diante de derrame volumoso não confirmado como transudato."}, {"n": 111, "meta": "(2025.2) ROT.3-A-12T: Q.12", "stem": "Paciente de 45 anos, sexo masculino, com histórico de pneumonia bacteriana há 10 dias, retorna ao serviço de emergência com piora do estado geral, febre (39°C), dor torácica pleurítica à esquerda e dispneia progressiva. Ao exame físico, apresenta diminuição do murmúrio vesicular e macicez à percussão em hemitórax esquerdo. A radiografia de tórax mostra opacidade homogênea com nível hidroaéreo em hemitórax esquerdo. A tomografia computadorizada de tórax confirma a presença de derrame pleural com espessamento de pleura. Qual a conduta mais adequada para o tratamento deste paciente?", "opts": {"A": "Encaminhar imediatamente para decorticação pleural por videotoracoscopia.", "B": "Realizar toracocentese diagnóstica e iniciar antibioticoterapia específica conforme cultura.", "C": "Realizar drenagem pleural com tubo torácico associado à antibioticoterapia endovenosa.", "D": "Iniciar antibioticoterapia empírica endovenosa e reavaliar em 48 horas."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "C", "medical": "C", "comment": "Comentários das alternativas: Incorreta: Embora a antibioticoterapia seja essencial, o empiema pleural estabelecido (com loculações e espessamento pleural) requer drenagem adequada. Apenas antibióticos são insuficientes e podem levar a complicações como sepse e fibrotórax (SABISTON, 2022). Incorreta: A toracocentese diagnóstica é importante para análise bioquímica e microbiológica, mas não substitui a necessidade de drenagem efetiva no empiema organizado (SCHWARTZ, 2019). Correta: A drenagem pleural com tubo torácico de calibre adequado (28- 32Fr) associada à antibioticoterapia é o tratamento padrão para empiema parapneumônico em fase organizada. Tubos de menor calibre podem obstruir com material purulento (ATLS, 2021). Incorreta: A decorticação por videotoracoscopia está indicada em casos de falha da drenagem convencional ou empiema crônico, não sendo a primeira opção no manejo inicial (SABISTON, 2022). Justificativa adicional: O empiema pleural parapneumônico passa por três fases (exsudativa, fibrinopurulenta e organizada), sendo crucial o diagnóstico e intervenção precoces. Na fase fibrinopurulenta (como neste caso), a drenagem pleural adequada associada à antibioticoterapia é fundamental para evitar progressão para a fase organizada, que exigiria intervenção cirúrgica. A escolha do calibre do tubo torácico é crucial — tubos finos (<24Fr) têm maior taxa de obstrução em empiemas (Light, 2020). A antibioticoterapia deve cobrir os patógenos mais comuns (Streptococcus pneumoniae, Staphylococcus aureus e anaeróbios) até a disponibilidade da cultura."}, {"n": 112, "meta": "(2026.1) ROT.1-A: Q.1", "stem": "Homem de 48 anos, previamente hígido, apresenta tosse produtiva e febre há 6 dias. No exame, há macicez à percussão e redução do murmúrio vesicular na base direita. A radiografia sugere derrame pleural; a ultrassonografia evidencia coleção pleural com múltiplos septos (loculações). Diante dos achados clínicos e de imagem, assinale a alternativa que apresenta a hipótese diagnóstica mais provável e a conduta terapêutica mais adequada, considerando a necessidade de intervenção:", "opts": {"A": "Derrame parapneumônico complicado. Toracocentese para análise e avaliar drenagem.", "B": "Pneumotórax oculto; indicar punção de alívio e drenagem pleural com selo d'água.", "C": "Derrame pleural por hipoalbuminemia; solicitar albumina sérica e observar.", "D": "Derrame pleural por insuficiência cardíaca; iniciar diurético e evitar punções."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "A", "medical": "A", "comment": "Resposta correta: Derrame parapneumônico complicado; indicar toracocentese imediata para análise e planejar drenagem. Febre, sintomas respiratórios infecciosos e derrame com loculações ao ultrassom sugerem derrame parapneumônico complicado. A toracocentese diagnóstica é fundamental para estratificar gravidade (pH baixo, glicose baixa, LDH alto, pus, Gram/cultura positivos) e orientar a necessidade de drenagem pleural e antibiótico. Loculações aumentam a chance de necessidade de drenagem e, em alguns casos, fibrinolítico intrapleural ou abordagem cirúrgica. Incorreta: insuficiência cardíaca costuma ser bilateral ou associada a sinais sistêmicos (edema, BNP elevado) e derrame tipicamente livre, não loculado; o contexto é infeccioso. Incorreta: hipoalbuminemia causa transudato geralmente bilateral e sem febre/loculações; não explica o quadro agudo infeccioso. Incorreta: não há descrição compatível com pneumotórax. Drenagem sem confirmar diagnóstico e sem avaliação do líquido é conduta imprudente."}, {"n": 113, "meta": "(2026.1) ROT.1-A: Q.26", "stem": "Uma mulher de 72 anos encontra-se internada na UTI por sepse de foco pulmonar. Evoluiu nas últimas 24 horas com piora respiratória progressiva, necessitando ventilação mecânica invasiva. Encontra-se sob FiO₂ 70% e PEEP de 8 cmH₂O, mantendo relação PaO₂/FiO₂ de 140. Ao exame físico, apresenta expansibilidade reduzida do hemitórax esquerdo, murmúrio vesicular diminuído e macicez importante à percussão. Tomografia de tórax evidencia derrame pleural volumoso à esquerda, com atelectasia compressiva significativa do pulmão subjacente, sem sinais de septações ou loculações. Ultrassonografia à beira-leito estima volume aproximado de 1.200 mL. A paciente encontra-se em uso de anticoagulação plena por fibrilação atrial (INR 2,4), hemodinamicamente estável, sem uso de vasopressores. Diante do impacto fisiológico do derrame pleural neste contexto, qual a medida inicial mais apropriada?", "opts": {"A": "Realizar toracocentese terapêutica guiada por imagem para reduzir compressão pulmonar e melhorar a oxigenação.", "B": "Indicar drenagem torácica em selo d'água imediatamente, independentemente das características do líquido.", "C": "Iniciar fibrinolítico intrapleural empírico para prevenir organização do derrame parapneumônico.", "D": "Otimizar ventilação mecânica com aumento progressivo da PEEP e FiO₂ antes de qualquer intervenção pleural."}, "topic": "Condutas intervencionistas em derrame pleural Toracocentese", "official": "A", "medical": "A", "comment": "Alternativa correta: Derrame pleural volumoso com atelectasia compressiva e impacto na oxigenação constitui indicação de toracocentese terapêutica. A remoção do líquido melhora a mecânica pulmonar e pode reduzir a necessidade de suporte ventilatório. O INR de 2,4 não contraindica absolutamente o procedimento quando realizado sob guia de imagem e com técnica adequada. Alternativas incorretas: Embora ajustes ventilatórios possam melhorar temporariamente a oxigenação, o derrame volumoso causa compressão mecânica do pulmão. Aumento de PEEP não remove a compressão externa significativa e pode inclusive aumentar o risco de instabilidade hemodinâmica sem resolver a causa estrutural. Não há evidência de derrame complicado ou loculado. Fibrinolítico intrapleural é indicado em derrames parapneumônicos complicados com septações ou empiema, o que não está descrito. A drenagem torácica está indicada quando há derrame complicado, empiema ou líquido com pH baixo e glicose reduzida. Na ausência desses dados, a toracocentese terapêutica é medida inicial adequada."}, {"n": 114, "meta": "(2025.2) ROT.1-A-12T: Q.13", "stem": "Durante o fechamento da parede abdominal, após apendicectomia convencional por incisão na fossa ilíaca direita, o cirurgião identificou quatro planos anatômicos: peritônio, musculatura, aponeurose e subcutâneo. Em seguida, pediu ao auxiliar que indicasse o tipo de fio cirúrgico mais adequado para a síntese de cada uma dessas camadas, conforme sua absorção pelo organismo (absorvível ou inabsorvível). Nesse contexto, é correto afirmar que:", "opts": {"A": "para a síntese muscular, quando necessária, utiliza-se fio absorvível de curta duração, pois esse plano tecidual não apresenta tensão significativa na cicatrização.", "B": "para a síntese do peritônio, utiliza-se fio inabsorvível, pois esse material causa menor reação inflamatória cicatricial e reduz a formação de aderências.", "C": "para a síntese aponeurótica, utiliza-se fio absorvível de curta duração, pois a cicatrização desse plano tecidual ocorre de maneira rápida e segura.", "D": "para a síntese do subcutâneo, quando indicada, utiliza-se fio inabsorvível, pois esse material induz menor reação inflamatória local e possui maior resistência."}, "topic": "Tipos de fios, suturas e feridas.", "official": "A", "medical": "A", "comment": "A) \"para a síntese muscular, quando necessária, utiliza-se fio absorvível de curta duração, pois esse plano tecidual não apresenta tensão significativa na cicatrização.\" CORRETA. Os músculos, em geral, são apenas divulsionados no tempo fundamental da diérese. No entanto, quando forem seccionados e houver a necessidade de sutura, esta deve ser realizada apenas no sentido de aproximação das suas bordas, sem tensão. Por isso, utilizam-se fios absorvíveis em curto ou moderado espaço de tempo. A propriedade de contenção e resistência, nesse nível, é garantida pelas aponeuroses que envolvem a musculatura. B) \"para a síntese do peritônio, utiliza-se fio inabsorvível, pois esse material causa menor reação inflamatória cicatricial e reduz a formação de aderências.\" INCORRETA. O peritônio parietal, além de possuir a característica de rápida cicatrização, não é fundamentalmente um tecido de sustentação. Por isso, sua síntese tem a finalidade apenas de orientar o processo cicatricial, plano por plano, e deve ser realizada com fios absorvíveis em curto ou moderado espaço de tempo. Entretanto, diversos trabalhos contraindicam seu fechamento, por aumentar a incidência de aderências aos órgãos da cavidade abdominal. C) \"para a síntese aponeurótica, utiliza-se fio absorvível de curta duração, pois a cicatrização desse plano tecidual ocorre de maneira rápida e segura.\" INCORRETA. A aponeurose, geralmente, é um tecido espesso que tem por finalidade principal conter grupos musculares ou estruturas articulares, estando submetido a linhas de força importantes, o que acaba dificultando o processo cicatricial. Por isso, no fechamento aponeurótico das incisões abdominais, para manter a união das bordas por período suficiente à sua cicatrização, devem ser utilizados fios inabsorvíveis ou absorvíveis em longo espaço de tempo. D) \"para a síntese do subcutâneo, quando indicada, utiliza-se fio inabsorvível, pois esse material induz menor reação inflamatória local e possui maior resistência.\" INCORRETA. O fechamento do tecido celular subcutâneo, por vezes, é indicado apenas para evitar espaço morto, sem ter exatamente a função de contenção. Por isso, utilizam-se fios absorvíveis, preferencialmente em médio espaço de tempo. O uso de fios inabsorvíveis, ainda que de diâmetro pequeno, pode levar à formação de pequenas saliências sob a pele (nós cirúrgicos) e causar incômodos para os pacientes."}, {"n": 115, "meta": "(2025.2) ROT.1-A-12T: Q.23", "stem": "Um homem de 30 anos chega ao pronto-socorro com ferida inciso-contusa de 4 cm no dorso da mão direita causada por faca de cozinha. A ferida é linear, mas foi causada em ambiente potencialmente contaminado. Após lavagem abundante e avaliação sem lesão tendinosa, decide-se pela sutura imediata. Sobre a escolha da técnica e do fio para esse fechamento cutâneo, considerando controle de infecção, estética e biomecânica, qual conduta é mais apropriada?", "opts": {"A": "Fechar com sutura contínua superficial não absorvível grossa (ex.: nylon 2- 0).", "B": "Usar sutura contínua intradérmica com fio absorvível (ex.: monocryl 4-0).", "C": "Suturar com pontos simples interrompidos usando fio monofilamentar não absorvível fino (ex.: nylon 3-0).", "D": "Realizar pontos subdérmicos absorvíveis profundos apenas, sem sutura de pele."}, "topic": "Tipos de fios, suturas e feridas.", "official": "C", "medical": "C", "comment": "Feridas traumáticas limpas, após desbridamento e irrigação adequados, podem ser fechadas com pontos simples interrompidos utilizando fio monofilamentar não absorvível fino (ex.: nylon 3-0). Essa técnica permite boa aproximação, menor risco de infecção e melhor controle caso surjam complicações. Suturas contínuas subdérmicas devem ser evitadas em feridas com risco de contaminação, pois dificultam a drenagem e removem a possibilidade de descontinuação seletiva. Embora o fio não absorvível seja apropriado, o calibre 2-0 é excessivo para pele delicada como o dorso da mão. Além disso, sutura contínua superficial não é recomendada em feridas com risco de infecção, pois não permite retirada seletiva e aumenta o risco de inflamação e marcas cicatriciais. Pontos subdérmicos são úteis como complemento, mas não substituem a sutura cutânea em feridas abertas traumáticas. Além disso, deixar a pele sem oclusão mecânica não é adequado."}, {"n": 116, "meta": "(2025.2) ROT.2-A-14T: Q.4", "stem": "Um paciente de 45 anos deu entrada no ambulatório após sofrer um corte superficial e linear na região do antebraço durante uma queda. A ferida mede aproximadamente 4 cm, apresenta bordas regulares, sangramento discreto e ausência de sinais de infecção. O exame físico mostra boa perfusão periférica e mobilidade preservada do membro acometido. Após adequada antissepsia, o médico decide realizar o fechamento primário da lesão. Qual é a técnica de sutura mais indicada para o fechamento dessa ferida, considerando sua localização e características?", "opts": {"A": "Sutura simples interrompida com fio monofilamentar não absorvível.", "B": "Sutura em bolsa de tabaco com fio monofilamentar.", "C": "Sutura em \"U\" vertical com fio não absorvível.", "D": "Sutura intradérmica contínua com fio absorvível."}, "topic": "Tipos de fios, suturas e feridas.", "official": "A", "medical": "A", "comment": "A) \"Sutura simples interrompida com fio monofilamentar não absorvível.\" CORRETA. A sutura simples interrompida é indicada em feridas lineares, com bordas regulares e pouca tensão, como no antebraço. O uso de fio monofilamentar não absorvível (como nylon) é preferido por promover boa resistência, menor risco de infecção e fácil remoção em áreas externas, como membros. B) \"Sutura em bolsa de tabaco com fio monofilamentar.\" INCORRETA. Usada em anastomoses circulares, como em cirurgias de alças intestinais, não em feridas lineares da pele. C) \"Sutura em \"U\" vertical com fio não absorvível.\" INCORRETA. Adequada para feridas com alta tensão, como em áreas articulares, o que não se aplica ao caso descrito. D) \"Sutura intradérmica contínua com fio absorvível.\" INCORRETA. Indicada em áreas com boa coaptação natural e maior exigência estética, como face ou tronco, não sendo ideal para antebraço, onde há mais movimento e tensão."}, {"n": 117, "meta": "(2025.2) ROT.2-A-14T: Q.14", "stem": "Durante o rodízio no centro cirúrgico, um interno observa o fechamento de ferida cirúrgica após colecistectomia videolaparoscópica eletiva. O preceptor explica que se trata de uma ferida limpa-contaminada e opta por sutura intradérmica com fio absorvível. Sobre esse caso, assinale a alternativa correta:", "opts": {"A": "O fio ideal seria não absorvível para maior resistência em feridas limpas- contaminadas.", "B": "Todas as feridas cirúrgicas devem ser fechadas por segunda intenção para evitar infecção.", "C": "Feridas limpas-contaminadas podem ser fechadas primariamente com fios absorvíveis em planos profundos e não absorvíveis na pele.", "D": "A ferida é considerada infectada e deve ser deixada aberta para cicatrização por segunda intenção."}, "topic": "Tipos de fios, suturas e feridas.", "official": "C", "medical": "C", "comment": "C) \"Feridas limpas-contaminadas podem ser fechadas primariamente com fios absorvíveis em planos profundos e não absorvíveis na pele.\" CORRETA. Feridas limpas-contaminadas, como aquelas de cirurgias em que há abertura controlada do trato gastrointestinal, podem ser fechadas primariamente. Utilizam-se fios absorvíveis nos planos profundos para evitar corpo estranho duradouro e não absorvíveis na pele, garantindo resistência e facilidade de retirada em caso de complicação. D) \"A ferida é considerada infectada e deve ser deixada aberta para cicatrização por segunda intenção.\" INCORRETA. Feridas infectadas, e não limpas-contaminadas, são deixadas abertas. A colecistectomia videolaparoscópica eletiva não se enquadra como ferida infectada. A) \"O fio ideal seria não absorvível para maior resistência em feridas limpas- contaminadas.\" INCORRETA. O uso de fios não absorvíveis em planos profundos é evitado por risco de corpo estranho. Absorvíveis são preferidos nas camadas profundas. B) \"Todas as feridas cirúrgicas devem ser fechadas por segunda intenção para evitar infecção.\" INCORRETA. O fechamento por segunda intenção é reservado a feridas infectadas ou com grande risco de contaminação, não sendo indicado de rotina."}, {"n": 118, "meta": "(2025.2) ROT.2-A-14T: Q.20", "stem": "Um paciente masculino de 37 anos, previamente hígido, é admitido no pronto- socorro após queda enquanto praticava escalada, apresentando laceração profunda na coxa direita. Ao exame físico, observa-se ferida complexa, com baixa contaminação e perda de tecido cutâneo, que exige fechamento em planos profundos, além de posterior avaliação para síntese cutânea. O cirurgião opta por realizar sutura de primeira intenção dos tecidos internos, garantindo adequada aproximação das bordas, resistência à tração imposta pela musculatura local e suporte durante várias semanas do processo cicatricial. Com base no caso descrito, qual tipo de fio é mais adequado para o manejo desta ferida?", "opts": {"A": "Fio de náilon (Nylon).", "B": "Fio de polipropileno (Prolene).", "C": "Fio derivado do tecido conectivo (catgut simples).", "D": "Fio de poliglactina (Vicryl)."}, "topic": "Tipos de fios, suturas e feridas.", "official": "D", "medical": "D", "comment": "D) \"Fio de poliglactina (Vicryl).\" CORRETA. O Vicryl (poliglactina) é um fio de sutura absorvível que é frequentemente utilizado em feridas de tecidos moles, como as cutâneas, devido às suas características ideais para o contexto descrito. Ele tem a capacidade de proporcionar adequada resistência à tensão, o que é importante para feridas com grande perda de tecido, como a do caso descrito. Além disso, o Vicryl é absorvível ao longo de várias semanas (cerca de 60 a 90 dias), o que o torna adequado para situações em que a cicatrização da ferida é esperada dentro de um período determinado, sem a necessidade de remoção do fio. Seu baixo grau de reatividade tecidual também contribui para uma cicatrização eficiente e sem complicações. B) \"Fio de polipropileno (Prolene).\" INCORRETA. O Prolene é um fio de sutura não absorvível, amplamente utilizado para feridas em que a sutura precisa permanecer por um tempo prolongado, como em áreas sujeitas a grande movimentação. No entanto, o Prolene não é absorvível e poderia necessitar de remoção após a cicatrização, o que o torna menos adequado para feridas complexas que requerem cicatrização por primeira intenção. A) \"Fio de náilon (Nylon).\" INCORRETA. O náilon é outro fio não absorvível e é mais indicado para suturas em áreas de alta tensão ou que exigem maior resistência, como em feridas em que a exposição ao ambiente externo é constante (como em feridas ortopédicas). Porém, ele não se dissolve no organismo e precisaria ser removido, o que pode ser um problema para o paciente, além de ser mais reativo em tecidos mais sensíveis. C) \"Fio derivado do tecido conectivo (catgut simples).\" INCORRETA. Embora o catgut seja um fio absorvível, ele apresenta uma reação tecidual forte e sua resistência inicial não é considerada boa, especialmente o catgut simples, que tem um tempo de absorção muito curto."}, {"n": 119, "meta": "(2025.2) ROT.3-A-14T: Q.2", "stem": "Paciente de 42 anos, sexo feminino, com IMC 19, será submetida a colecistectomia videolaparoscópica eletiva por colelitíase sintomática sem complicações. A instrumentadora pergunta qual fio deve pedir à circulante para o fechamento da aponeurose no orifício umbilical de 10mm. Qual a opção ideal dentre as alternativas, considerando as características dos fios e a técnica de sutura para esta paciente?", "opts": {"A": "Fio monofilamentar reabsorvível (PDS* 2-0) em padrão contínuo.", "B": "Fio monofilamentar não reabsorvível (Prolene* 0) em padrão contínuo.", "C": "Fio multifilamentar não reabsorvível (Nylon 2-0) em pontos separados.", "D": "Fio multifilamentar reabsorvível (Vicryl* 0) em pontos em \"X\"."}, "topic": "Tipos de fios, suturas e feridas.", "official": "A", "medical": "A", "comment": "(*Marcas registradas mencionadas apenas para fins didáticos) Resposta correta: Fio monofilamentar reabsorvível (PDS 2-0) em padrão contínuo. Comentários das alternativas: CORRETA. O PDS (polidioxanona) é um fio monofilamentar reabsorvível de longa duração (mantém 50% da força tensil por 6 semanas), ideal para fechamento aponeurótico. O calibre 2-0 oferece resistência adequada para aponeurose em pacientes com IMC normal. A técnica contínua proporciona distribuição uniforme da tensão e menor risco de deiscência. Recomendado pelo SABISTON (22.ª ed., 2022) para fechamento de aponeurose em cirurgias limpas. INCORRETA. O Nylon, apesar de sua resistência, é não reabsorvível, podendo causar reação de corpo estranho a longo prazo. Pontos separados são mais demorados e oferecem menor uniformidade na distribuição de tensão. Não é a primeira escolha para aponeurose em procedimentos eletivos (SCHWARTZ, 11.ª ed., 2019). INCORRETA. O Vicryl 0, apesar de reabsorvível, é multifilamentar, aumentando o risco de infecção. Perde força tênsil muito rapidamente (50% em 3 semanas) para aponeurose abdominal. Pontos em \"X\" não são padrão- ouro para fechamento aponeurótico (SABISTON, 2022). INCORRETA. O Prolene mantém excelente força tensil, mas, sendo não reabsorvível, pode causar sinéquias a longo prazo, tipo granuloma de fio. Não é a primeira escolha para aponeurose em cirurgias limpas eletivas (SCHWARTZ, 2019). INCORRETA. O Monocryl tem reabsorção muito rápida (50% da força em 1 semana), inadequado para aponeurose. O calibre 3-0 é fino demais para aponeurose abdominal. Pontos simples não distribuem adequadamente a tensão (SABISTON, 2022). Justificativa adicional: O fechamento aponeurótico requer fios que mantenham força tensil por pelo menos 4 semanas (tempo de cicatrização da aponeurose). Fios monofilamentares reduzem risco de infecção comparados a multifilamentares. A técnica contínua é mais rápida e apresenta menor taxa de deiscência quando realizada adequadamente. Em pacientes com IMC >30, poderia ser considerado um fio de maior calibre (0 ou 1), mas mantendo as mesmas características (Towfigh, 2021)."}, {"n": 120, "meta": "(2025.2) ROT.3-A-14T: Q.11", "stem": "Durante uma cirurgia eletiva para correção de hérnia umbilical em um paciente jovem e saudável, o cirurgião opta por realizar a síntese do peritônio e da camada muscular com um fio de sutura absorvível, para reduzir reações inflamatórias prolongadas. Considerando a conduta descrita, assinale a alternativa que apresenta um fio absorvível adequado para esse tipo de sutura:", "opts": {"A": "Seda", "B": "Poliglactina", "C": "Poliéster", "D": "Nylon"}, "topic": "Tipos de fios, suturas e feridas.", "official": "B", "medical": "B", "comment": "A) \"Seda\" INCORRETA. Fio natural inabsorvível, porém sofre degradação lenta — seu uso tem caído por maior risco de reação tecidual. B) \"Poliglactina\" CORRETA. A poliglactina 910 (Vicryl) é um fio absorvível sintético, indicado para suturas de tecidos internos como musculatura e peritônio. Sua absorção ocorre por hidrólise e é completada em torno de 60 a 90 dias, sendo ideal para tecidos com bom suprimento sanguíneo e cicatrização rápida. C) \"Poliéster\" INCORRETA. Fio sintético inabsorvível, utilizado em cirurgias que exigem permanência prolongada da sutura (ex.: cardiovasculares). D) \"Nylon\" INCORRETA. Fio sintético inabsorvível, usado em planos superficiais como pele."}, {"n": 121, "meta": "(2026.1) ROT.1-A: Q.6", "stem": "Homem de 42 anos é submetido à excisão de lesão cutânea benigna em região anterior do ombro direito. A incisão elíptica resultante mede 5 cm. Após fechamento adequado do plano subcutâneo, permanece tensão moderada nas bordas da pele, devido à espessura cutânea e à movimentação frequente da região. O paciente manifesta preocupação com o resultado estético final. O cirurgião deseja empregar técnica que proporcione eversão adequada das bordas, melhor distribuição da tensão superficial e redução do risco de cicatriz alargada ou deprimida. Considerando as características da ferida e os princípios de cicatrização cutânea, qual padrão de sutura é mais apropriado para o fechamento da pele nesse caso?", "opts": {"A": "Sutura simples interrompida com fio monofilamentar não absorvível.", "B": "Sutura em U vertical (Donatti) com fio não absorvível.", "C": "Sutura contínua intradérmica com fio absorvível.", "D": "Sutura contínua transdérmica com fio não absorvível."}, "topic": "Tipos de fios, suturas e feridas.", "official": "B", "medical": "B", "comment": "A sutura em U vertical (Donatti) promove eversão eficaz das bordas e distribui a tensão em planos mais profundos, reduzindo o risco de cicatriz deprimida ou alargada. É particularmente indicada em áreas sob tensão moderada ou pele espessa, proporcionando melhor controle mecânico da coaptação tecidual e favorecendo resultado estético mais previsível. A sutura simples interrompida permite bom controle individual da tensão, porém não promove eversão consistente quando há tensão moderada residual, podendo resultar em inversão discreta das bordas e cicatriz alargada. Embora versátil, não é a técnica mais eficiente para otimizar resultado estético sob tensão. A sutura intradérmica contínua é indicada para incisões lineares com mínima tensão e excelente aproximação subcutânea, proporcionando melhor resultado cosmético superficial. Entretanto, na presença de tensão moderada, há maior risco de inversão das bordas e alargamento cicatricial, tornando-a inadequada neste cenário. A sutura contínua transdérmica distribui tensão ao longo da incisão, mas não promove eversão adequada e pode resultar em marca linear superficial. Em áreas sob tensão moderada, é inferior à técnica em U vertical quanto ao controle da inversão tecidual."}, {"n": 122, "meta": "(2026.1) ROT.1-A: Q.25", "stem": "Um homem de 62 anos, tabagista e com diabetes mellitus, é submetido a laparotomia mediana por obstrução intestinal. No 3º dia pós-operatório, evolui com dor e hiperemia discretas na incisão, sem febre. Ao exame, há edema e tensão na ferida, com pontos “marcando” a pele e bordas pouco perfundidas. A equipe revisa que falhas de cicatrização estão frequentemente associadas a erros técnicos. Analise o caso e selecione a medida intraoperatória que melhor reduz o risco de deiscência e melhora a qualidade da cicatrização.", "opts": {"A": "Aproximar a fáscia com poucos pontos distantes e apertados, para reduzir o tempo cirúrgico e aumentar a firmeza do fechamento.", "B": "Aumentar a tensão dos pontos para aproximar firmemente as bordas, reduzindo o espaço morto e impedindo seroma.", "C": "Preferir sutura absorvível de forma rotineira, pois reduz infecção e melhora a resistência no longo prazo.", "D": "Realizar fechamento fascial com sutura contínua, mantendo proporção fio/ferida adequada e evitando pontos excessivamente apertados. DOENÇAS ORIFICIAIS: DOENÇA DOENÇAS ORIFICIAIS: DOENÇA DOENÇAS ORIFICIAIS: DOENÇA HEMORROIDÁRIA, FISSURA ANAL, FÍSTULA HEMORROIDÁRIA, FISSURA ANAL, FÍSTULA HEMORROIDÁRIA, FISSURA ANAL, FÍSTULA ANAL, ABSCESSO ANORRETAL ANAL, ABSCESSO ANORRETAL ANAL, ABSCESSO ANORRETAL"}, "topic": "Tipos de fios, suturas e feridas.", "official": "D", "medical": "D", "comment": "D) \"Realizar fechamento fascial com sutura contínua, mantendo proporção fio/ferida adequada e evitando pontos excessivamente apertados.\" CORRETA. O texto-base destaca que suturas muito justas podem comprometer perfusão e oxigenação, favorecendo infecção e deiscência. A técnica de fechamento mais segura da laparotomia privilegia sutura contínua com proporção adequada entre comprimento do fio e comprimento da ferida (ex.: 4:1) e sem estrangulamento tecidual, preservando a integridade mecânica e a perfusão local. B) \"Aumentar a tensão dos pontos para aproximar firmemente as bordas, reduzindo o espaço morto e impedindo seroma.\" INCORRETA. O excesso de tensão pode estrangular o tecido, piorar a perfusão e a oxigenação, aumentando o risco de infecção e deiscência, o oposto do objetivo do fechamento fascial seguro. C) \"Preferir sutura absorvível de forma rotineira, pois reduz infecção e melhora a resistência no longo prazo.\" INCORRETA. A escolha do fio depende do tecido e do tempo necessário de sustentação. Além disso, a qualidade da cicatrização no caso está mais ligada à técnica e à tensão/perfusão do que a uma preferência universal por absorvível. A) \"Aproximar a fáscia com poucos pontos distantes e apertados, para reduzir o tempo cirúrgico e aumentar a firmeza do fechamento.\" INCORRETA. Pontos poucos, distantes e apertados tendem a concentrar tensão e comprometer perfusão nas bordas, favorecendo falha de cicatrização e deiscência."}, {"n": 123, "meta": "(2025.2) ROT.1-A-12T: Q.10", "stem": "Um homem de 46 anos procura atendimento médico por apresentar sangramento anal intermitente há dois meses, sempre visível no papel higiênico, associado à dor intensa durante e após a evacuação. Relata também sensação de \"corte\" e prurido anal. Nega perda de peso, alterações no hábito intestinal ou história familiar de câncer colorretal. No exame físico, observa-se hipertonia esfincteriana e uma lesão linear dolorosa na linha média posterior do canal anal. Qual é a conduta mais adequada frente a esse quadro?", "opts": {"A": "Tratar como fissura anal aguda, com medidas clínicas locais.", "B": "Iniciar tratamento tópico para hemorroidas e solicitar colonoscopia.", "C": "Prescrever anti-inflamatórios para o abscesso perianal e retorno em 7 dias.", "D": "Indicar antibiótico oral e drenagem cirúrgica prec
